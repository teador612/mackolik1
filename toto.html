<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spor Toto Tahmin ve Analiz Ekranı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Üst Başlık -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="bg-emerald-500 text-slate-950 font-bold p-2 rounded-lg text-xl">⚽</span>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Spor Toto Tahmin Paneli</h1>
                    <p class="text-xs text-slate-400">Veri Tabanlı Maç Analiz ve Tahmin Aracı</p>
                </div>
            </div>
            <!-- İstatistik / Özet Kutuları -->
            <div class="flex gap-4 text-sm">
                <div class="bg-slate-700/50 px-3 py-1.5 rounded-lg border border-slate-600">
                    <span class="text-slate-400 block text-xs">Toplam Maç</span>
                    <span id="total-matches" class="font-bold text-emerald-400">0</span>
                </div>
                <div class="bg-slate-700/50 px-3 py-1.5 rounded-lg border border-slate-600">
                    <span class="text-slate-400 block text-xs">Seçilen Tahmin</span>
                    <span id="selected-predictions" class="font-bold text-blue-400">0 / 15</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Filtreleme ve Arama Alanı -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <input type="text" id="search-input" placeholder="Takım veya maç ara..." class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 w-full sm:w-80 text-sm focus:outline-none focus:border-emerald-500">
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="filterMatches('all')" class="flex-1 sm:flex-none px-4 py-2 text-sm bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition">Tümü</button>
                <button onclick="filterMatches('predicted')" class="flex-1 sm:flex-none px-4 py-2 text-sm bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition">İşaretlenenler</button>
                <button onclick="resetPredictions()" class="px-4 py-2 text-sm bg-rose-600/20 text-rose-400 hover:bg-rose-600/30 rounded-lg font-medium transition border border-rose-500/30">Sıfırla</button>
            </div>
        </div>

        <!-- Maç Listesi Tablosu / Kartları -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="p-4 w-16 text-center">#</th>
                            <th class="p-4">Ev Sahibi</th>
                            <th class="p-4 text-center">İstatistik / Oranlar</th>
                            <th class="p-4">Deplasman</th>
                            <th class="p-4 text-center w-48">Tahmin (1 - 0 - 2)</th>
                        </tr>
                    </thead>
                    <tbody id="match-list" class="divide-y divide-slate-700/60 text-sm">
                        <!-- Javascript ile doldurulacak -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Alt İşlem Butonları -->
        <div class="mt-6 flex justify-end gap-3">
            <button onclick="exportPredictions()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold px-6 py-2.5 rounded-xl transition text-sm shadow-lg shadow-emerald-900/20">
                Tahminleri Dışa Aktar (JSON)
            </button>
        </div>
    </main>

    <!-- Veri ve Mantık Bağlantısı -->
    <script type="module">
        // .mjs dosyanızdaki veriyi buraya import edebilirsiniz:
        // Örnek: import { sporTotoData } from './data/spor-toto-data.js';

        // Şimdilik örnek veri seti (kendi .mjs dosyanızdaki yapıya göre burayı güncelleyebiliriz):
        const sampleData = [
            { id: 1, home: "Galatasaray", away: "Fenerbahçe", stats: "MS: %45 | %30 | %25" },
            { id: 2, home: "Beşiktaş", away: "Trabzonspor", stats: "MS: %40 | %35 | %25" },
            { id: 3, home: "Başakşehir", away: "Antalyaspor", stats: "MS: %50 | %30 | %20" },
        ];

        let userPredictions = {};

        function renderMatches(dataToRender) {
            const container = document.getElementById('match-list');
            container.innerHTML = '';

            if (dataToRender.length === 0) {
                container.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Maç bulunamadı.</td></tr>`;
                return;
            }

            dataToRender.forEach(match => {
                const currentPick = userPredictions[match.id] || '';
                
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-700/30 transition';
                row.innerHTML = `
                    <td class="p-4 text-center font-mono text-slate-400">${match.id}</td>
                    <td class="p-4 font-semibold text-right sm:text-left">${match.home}</td>
                    <td class="p-4 text-center text-xs text-slate-400 font-mono">${match.stats || '-'}</td>
                    <td class="p-4 font-semibold">${match.away}</td>
                    <td class="p-4 text-center">
                        <div class="inline-flex rounded-lg p-1 bg-slate-900 border border-slate-700 gap-1">
                            <button onclick="setPrediction(${match.id}, '1')" class="w-9 h-8 rounded font-bold text-xs transition ${currentPick === '1' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:bg-slate-800'}">1</button>
                            <button onclick="setPrediction(${match.id}, '0')" class="w-9 h-8 rounded font-bold text-xs transition ${currentPick === '0' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:bg-slate-800'}">0</button>
                            <button onclick="setPrediction(${match.id}, '2')" class="w-9 h-8 rounded font-bold text-xs transition ${currentPick === '2' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:bg-slate-800'}">2</button>
                        </div>
                    </td>
                `;
                container.appendChild(row);
            });

            document.getElementById('total-matches').innerText = dataToRender.length;
            updateStats();
        }

        window.setPrediction = function(matchId, pick) {
            if (userPredictions[matchId] === pick) {
                delete userPredictions[matchId]; // Tıklanan seçimi kaldır (toggle)
            } else {
                userPredictions[matchId] = pick;
            }
            renderMatches(sampleData);
        }

        window.updateStats = function() {
            const count = Object.keys(userPredictions).length;
            document.getElementById('selected-predictions').innerText = `${count} / ${sampleData.length}`;
        }

        window.resetPredictions = function() {
            userPredictions = {};
            renderMatches(sampleData);
        }

        window.exportPredictions = function() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(userPredictions, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "spor-toto-tahminlerim.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // İlk yükleme
        renderMatches(sampleData);
    </script>
</body>
</html>
