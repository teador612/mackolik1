<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Bugünün Maçları</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    select,
    input {
      font: inherit;
    }

    .bm-container {
      width: min(1100px, 100%);
      margin: auto;
      padding: 15px;
    }

    .bm-header {
      background: #111827;
      color: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .bm-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 6px;
    }

    .bm-subtitle {
      opacity: .75;
      font-size: 13px;
    }

    .bm-controls {
      background: white;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .bm-control-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .bm-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .bm-field label {
      font-size: 12px;
      font-weight: 700;
      color: #4b5563;
    }

    .bm-field input,
    .bm-field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 8px 10px;
      background: white;
      outline: none;
    }

    .bm-field input:focus,
    .bm-field select:focus {
      border-color: #2563eb;
    }

    .bm-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .bm-check {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .bm-check input {
      width: 17px;
      height: 17px;
    }

    .bm-datebar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }

    .bm-datebar button {
      border: 0;
      background: #111827;
      color: white;
      border-radius: 9px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .bm-datebar button:hover {
      opacity: .9;
    }

    .bm-date {
      flex: 1;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
    }

    .bm-summary {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      background: white;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .bm-count {
      font-size: 14px;
      font-weight: 800;
    }

    .bm-loading {
      text-align: center;
      padding: 40px 15px;
      color: #6b7280;
    }

    .bm-error {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 12px;
      padding: 15px;
      font-weight: 700;
    }

    .bm-empty {
      background: white;
      border-radius: 14px;
      padding: 35px 15px;
      text-align: center;
      color: #6b7280;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .bm-match {
      background: white;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .bm-match-head {
      padding: 13px 14px 9px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .bm-time {
      font-size: 18px;
      font-weight: 900;
    }

    .bm-league {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .bm-teams {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .bm-team {
      font-size: 15px;
      font-weight: 800;
    }

    .bm-team.away {
      text-align: right;
    }

    .bm-score {
      min-width: 58px;
      text-align: center;
      font-size: 17px;
      font-weight: 900;
    }

    .bm-predictions {
      padding: 0 14px 14px;
      display: grid;
      gap: 8px;
    }

    .bm-prediction {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 11px;
      background: #fafafa;
    }

    .bm-prediction-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .bm-market {
      font-weight: 900;
      font-size: 14px;
    }

    .bm-odd {
      background: #111827;
      color: white;
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 12px;
      font-weight: 800;
    }

    .bm-result {
      margin-top: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .bm-rate {
      margin-top: 7px;
      height: 8px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .bm-rate-bar {
      height: 100%;
      background: #16a34a;
      border-radius: 20px;
    }

    .bm-detail {
      margin-top: 6px;
      color: #6b7280;
      font-size: 11px;
    }

    .bm-good {
      color: #15803d;
    }

    .bm-medium {
      color: #ca8a04;
    }

    .bm-bad {
      color: #dc2626;
    }

    .bm-no-prediction {
      padding: 0 14px 14px;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .bm-container {
        padding: 9px;
      }

      .bm-control-grid {
        grid-template-columns: 1fr;
      }

      .bm-title {
        font-size: 21px;
      }

      .bm-teams {
        gap: 6px;
      }

      .bm-team {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="bm-container">

    <header class="bm-header">
      <div class="bm-title">Bugünün Maçları</div>
      <div class="bm-subtitle">
        Açılış oranlarına göre geçmiş sonuç analizi
      </div>
    </header>

    <section class="bm-controls">

      <div class="bm-control-grid">

        <div class="bm-field">
          <label for="bmDate">Tarih</label>
          <input type="date" id="bmDate">
        </div>

        <div class="bm-field">
          <label for="bmBasis">Analiz yöntemi</label>
          <select id="bmBasis">
            <option value="each">
              Her oran türü tek tek
            </option>
            <option value="ms1">
              Sadece MS1 oranı aynı
            </option>
            <option value="ms1,ms2">
              MS1 + MS2 aynı
            </option>
            <option value="ms1,ms0,ms2">
              MS1 + MS X + MS2 aynı
            </option>
            <option value="league">
              Aynı lig
            </option>
            <option value="team">
              Aynı takımlar
            </option>
            <option value="all">
              Tüm geçmiş maçlar
            </option>
          </select>
        </div>

        <div class="bm-field">
          <label for="bmThreshold">
            Minimum başarı %
          </label>

          <input
            type="number"
            id="bmThreshold"
            min="1"
            max="100"
            value="70"
          >
        </div>

        <div class="bm-field">
          <label for="bmMinSample">
            Minimum geçmiş maç
          </label>

          <input
            type="number"
            id="bmMinSample"
            min="1"
            value="5"
          >
        </div>

        <div class="bm-field">
          <label for="bmMinOdd">
            Minimum oran
          </label>

          <input
            type="number"
            id="bmMinOdd"
            min="1"
            step="0.01"
            value="1.40"
          >
        </div>

      </div>

      <div class="bm-checks">

        <label class="bm-check">
          <input type="checkbox" id="bmOnlyIdeal" checked>
          Sadece başarılı tahminleri göster
        </label>

        <label class="bm-check">
          <input type="checkbox" id="bmShowAll">
          Tüm sonuçları göster
        </label>

      </div>

      <div class="bm-datebar">
        <button id="bmPrev">‹</button>

        <div class="bm-date" id="bmDateText">
          -
        </div>

        <button id="bmNext">›</button>
      </div>

    </section>

    <section id="bmContent">

      <div class="bm-loading">
        Maçlar yükleniyor...
      </div>

    </section>

  </main>

  <script src="./bugunun-maclari.js"></script>

</body>
</html>
