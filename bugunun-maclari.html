<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Bugünün Maçları</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .sub {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: #374151;
    }

    select,
    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      font-size: 14px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #2563eb;
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f3f4f6;
      font-size: 13px;
    }

    .check input {
      width: auto;
      min-height: auto;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      font-weight: 700;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .status {
      font-size: 13px;
      color: #6b7280;
      margin: 12px 0;
    }

    .match {
      background: #fff;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 9px rgba(0,0,0,.06);
      overflow: hidden;
    }

    .match-head {
      padding: 10px 12px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .league {
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
    }

    .time {
      font-size: 14px;
      font-weight: 800;
    }

    .match-body {
      padding: 12px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .team {
      font-weight: 800;
      font-size: 15px;
    }

    .team.away {
      text-align: right;
    }

    .vs {
      color: #9ca3af;
      font-size: 12px;
      font-weight: 700;
    }

    .score {
      margin-top: 7px;
      text-align: center;
      font-weight: 800;
      color: #111827;
    }

    .predictions {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .prediction {
      border: 1px solid #e5e7eb;
      border-radius: 9px;
      padding: 9px;
      background: #fff;
    }

    .prediction-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .prediction-name {
      font-weight: 800;
      font-size: 13px;
    }

    .rate {
      font-weight: 900;
      font-size: 14px;
    }

    .bar {
      height: 7px;
      border-radius: 20px;
      background: #e5e7eb;
      margin-top: 7px;
      overflow: hidden;
    }

    .bar > div {
      height: 100%;
      border-radius: 20px;
      background: #16a34a;
    }

    .detail {
      margin-top: 6px;
      color: #6b7280;
      font-size: 11px;
    }

    .empty {
      background: #fff;
      padding: 25px 15px;
      border-radius: 12px;
      text-align: center;
      color: #6b7280;
    }

    .loading {
      background: #fff;
      padding: 25px;
      text-align: center;
      border-radius: 12px;
    }

    .odd {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }

    @media (max-width: 650px) {
      body {
        padding: 9px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 21px;
      }

      .teams {
        gap: 6px;
      }

      .team {
        font-size: 13px;
      }

      .match-head {
        padding: 9px;
      }

      .match-body {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>Bugünün Maçları</h1>
  <div class="sub">
    Açılış oranlarına göre geçmiş maçlardan otomatik analiz
  </div>

  <div class="panel">

    <div class="grid">

      <div class="field">
        <label for="tdDate">Tarih</label>
        <select id="tdDate"></select>
      </div>

      <div class="field">
        <label for="tdBasis">Analiz türü</label>
        <select id="tdBasis">
          <option value="each">Her oran türü tek tek (Önerilen)</option>
          <option value="ms1">Sadece MS1 oranı aynı olanlar</option>
          <option value="ms1,ms2">MS1 + MS2 oranı aynı olanlar</option>
          <option value="ms1,ms0,ms2">MS1 + MS0 + MS2 aynı olanlar</option>
          <option value="league">Oransız: Aynı ligdeki maçlar</option>
          <option value="team">Oransız: İki takımın tüm maçları</option>
          <option value="all">Oransız: Tüm maçlar</option>
        </select>
      </div>

      <div class="field">
        <label for="tdThr">Minimum başarı (%)</label>
        <input id="tdThr" type="number" min="0" max="100" value="70">
      </div>

      <div class="field">
        <label for="tdMin">Minimum geçmiş maç</label>
        <input id="tdMin" type="number" min="1" value="5">
      </div>

      <div class="field">
        <label for="tdOdd">Minimum oran</label>
        <input id="tdOdd" type="number" min="1" step="0.01" value="1.40">
      </div>

    </div>

    <div class="checks">

      <label class="check">
        <input type="checkbox" id="tdOnly">
        Sadece ideal sonucu olan maçlar
      </label>

      <label class="check">
        <input type="checkbox" id="tdAll">
        Tüm sonuçları göster
      </label>

    </div>

    <div class="buttons">
      <button id="tdAnalyze">Analiz et</button>
      <button id="tdRefresh" class="secondary">Yenile</button>
    </div>

  </div>

  <div id="tdStatus" class="status">
    Veriler hazırlanıyor...
  </div>

  <div id="tdResults">
    <div class="loading">Maçlar yükleniyor...</div>
  </div>

</div>

<script src="./bugunun-maclari.js"></script>

</body>
</html>
