<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İddaa Bülteni</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #17202a;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: #111827;
    color: white;
    padding: 18px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 7px 0 0;
    color: #cbd5e1;
    font-size: 13px;
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 15px;
}

.status {
    background: white;
    border-radius: 10px;
    padding: 12px 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    font-size: 14px;
}

.status.ok {
    border-left: 4px solid #16a34a;
}

.status.error {
    border-left: 4px solid #dc2626;
    color: #991b1b;
}

.filters {
    background: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);

    display: grid;
    grid-template-columns:
        minmax(180px, 2fr)
        minmax(140px, 1fr)
        minmax(140px, 1fr)
        minmax(120px, 1fr)
        auto;
    gap: 10px;
}

input,
select,
button {
    width: 100%;
    min-height: 40px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 14px;
    background: white;
}

button {
    cursor: pointer;
    background: #111827;
    color: white;
    border: none;
}

button:hover {
    opacity: .9;
}

.table-wrap {
    background: white;
    border-radius: 10px;
    overflow-x: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1150px;
}

thead {
    background: #111827;
    color: white;
}

th,
td {
    padding: 9px 8px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
    white-space: nowrap;
    font-size: 13px;
}

th {
    font-weight: 600;
}

tbody tr:hover {
    background: #f8fafc;
}

.home {
    text-align: right;
    font-weight: 600;
}

.away {
    text-align: left;
    font-weight: 600;
}

.score {
    font-weight: bold;
}

.ht {
    color: #64748b;
}

.odd {
    font-weight: 600;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

.loading {
    text-align: center;
    padding: 30px;
}

.badge {
    display: inline-block;
    padding: 3px 7px;
    border-radius: 5px;
    font-size: 11px;
    background: #e5e7eb;
}

.badge.played {
    background: #dcfce7;
    color: #166534;
}

.badge.unplayed {
    background: #fef3c7;
    color: #92400e;
}

@media (max-width: 800px) {
    .filters {
        grid-template-columns: 1fr 1fr;
    }

    .filters .search {
        grid-column: 1 / -1;
    }
}

@media (max-width: 500px) {
    .container {
        padding: 8px;
    }

    .filters {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <h1>İddaa Bülteni</h1>
    <p>Geçmiş maç sonuçları ve açılış oranları</p>
</header>

<div class="container">

    <div id="status" class="status">
        Veriler yükleniyor...
    </div>

    <div class="filters">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Takım veya maç kodu ara..."
        >

        <select id="dateFilter">
            <option value="">Tüm tarihler</option>
        </select>

        <select id="leagueFilter">
            <option value="">Tüm ligler</option>
        </select>

        <select id="playedFilter">
            <option value="all">Tümü</option>
            <option value="played">Oynananlar</option>
            <option value="unplayed">Oynanmamışlar</option>
        </select>

        <button id="refresh">
            Yenile
        </button>

    </div>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Tarih</th>
                    <th>Saat</th>
                    <th>Lig</th>
                    <th>Kod</th>
                    <th>Ev Sahibi</th>
                    <th>Misafir</th>
                    <th>İY</th>
                    <th>Skor</th>
                    <th>MS 1</th>
                    <th>MS X</th>
                    <th>MS 2</th>
                    <th>KG Var</th>
                    <th>KG Yok</th>
                    <th>Alt 2,5</th>
                    <th>Üst 2,5</th>
                </tr>
            </thead>

            <tbody id="tbody">
                <tr>
                    <td colspan="15" class="loading">
                        Veri yükleniyor...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<script>

"use strict";

/* =========================================================
   AYARLAR
========================================================= */

const DATA_URL = "./data/matches.json";


/* =========================================================
   DURUM
========================================================= */

let allMatches = [];


/* =========================================================
   ELEMENTLER
========================================================= */

const $ = id => document.getElementById(id);

const statusEl = $("status");
const tbody = $("tbody");
const searchEl = $("search");
const dateEl = $("dateFilter");
const leagueEl = $("leagueFilter");
const playedEl = $("playedFilter");
const refreshBtn = $("refresh");


/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function text(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value);
}


function esc(value) {

    return text(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function number(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return "";
    }

    return text(value);
}


/* =========================================================
   SKOR
========================================================= */

function getScore(match) {

    const score = match && match.score;

    if (!score) {
        return "";
    }

    const home = score.home;
    const away = score.away;

    if (
        home === null ||
        home === undefined ||
        away === null ||
        away === undefined ||
        home === "" ||
        away === ""
    ) {
        return "";
    }

    return `${home}-${away}`;
}


function getHalfTimeScore(match) {

    const score = match && match.halfTimeScore;

    if (!score) {
        return "";
    }

    const home = score.home;
    const away = score.away;

    if (
        home === null ||
        home === undefined ||
        away === null ||
        away === undefined ||
        home === "" ||
        away === ""
    ) {
        return "";
    }

    return `${home}-${away}`;
}


/* =========================================================
   MAÇ OYNANDI MI?
========================================================= */

function isPlayed(match) {

    const score = getScore(match);

    return score !== "";
}


/* =========================================================
   ORAN
========================================================= */

function odd(value) {

    if (
        value === null ||
        value === undefined ||
        value === "" ||
        value === "-" ||
        value === "0"
    ) {
        return "";
    }

    return esc(value);
}


/* =========================================================
   TARİH LİSTESİ
========================================================= */

function createDateList() {

    const dates = [
        ...new Set(
            allMatches
                .map(m => text(m.date).trim())
                .filter(Boolean)
        )
    ];

    dates.sort((a, b) => {

        function convert(value) {

            const parts = value.split(".");

            if (parts.length !== 3) {
                return value;
            }

            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        return convert(a).localeCompare(convert(b));

    });

    dateEl.innerHTML =
        `<option value="">Tüm tarihler</option>` +
        dates
            .map(date =>
                `<option value="${esc(date)}">${esc(date)}</option>`
            )
            .join("");
}


/* =========================================================
   LİG LİSTESİ
========================================================= */

function createLeagueList() {

    const leagues = [
        ...new Set(
            allMatches
                .map(m => text(m.league).trim())
                .filter(Boolean)
        )
    ];

    leagues.sort((a, b) =>
        a.localeCompare(b, "tr")
    );

    leagueEl.innerHTML =
        `<option value="">Tüm ligler</option>` +
        leagues
            .map(league =>
                `<option value="${esc(league)}">${esc(league)}</option>`
            )
            .join("");
}


/* =========================================================
   TABLO
========================================================= */

function render() {

    const search =
        searchEl.value
            .trim()
            .toLocaleLowerCase("tr");

    const date =
        dateEl.value;

    const league =
        leagueEl.value;

    const played =
        playedEl.value;


    const filtered = allMatches.filter(match => {

        const home =
            text(match.home)
                .toLocaleLowerCase("tr");

        const away =
            text(match.away)
                .toLocaleLowerCase("tr");

        const code =
            text(match.code)
                .toLocaleLowerCase("tr");

        const matchLeague =
            text(match.league);

        const matchDate =
            text(match.date);

        const playedState =
            isPlayed(match);


        if (search) {

            const found =
                home.includes(search) ||
                away.includes(search) ||
                code.includes(search);

            if (!found) {
                return false;
            }
        }


        if (
            date &&
            matchDate !== date
        ) {
            return false;
        }


        if (
            league &&
            matchLeague !== league
        ) {
            return false;
        }


        if (
            played === "played" &&
            !playedState
        ) {
            return false;
        }


        if (
            played === "unplayed" &&
            playedState
        ) {
            return false;
        }


        return true;

    });


    if (!filtered.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="15" class="empty">
                    Filtrelere uygun maç bulunamadı.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML = filtered.map(match => {

        const score =
            getScore(match);

        const halfScore =
            getHalfTimeScore(match);

        const playedState =
            score !== "";


        return `
            <tr>

                <td>
                    ${esc(match.date)}
                </td>

                <td>
                    ${esc(match.time)}
                </td>

                <td>
                    ${esc(match.league)}
                </td>

                <td>
                    ${esc(match.code)}
                </td>

                <td class="home">
                    ${esc(match.home)}
                </td>

                <td class="away">
                    ${esc(match.away)}
                </td>

                <td class="ht">
                    ${esc(halfScore || "-")}
                </td>

                <td class="score">

                    ${
                        playedState
                        ? esc(score)
                        : `<span class="badge unplayed">Oynanmadı</span>`
                    }

                </td>

                <td class="odd">
                    ${odd(match.ms1)}
                </td>

                <td class="odd">
                    ${odd(match.msX)}
                </td>

                <td class="odd">
                    ${odd(match.ms2)}
                </td>

                <td class="odd">
                    ${odd(match.kgVar)}
                </td>

                <td class="odd">
                    ${odd(match.kgYok)}
                </td>

                <td class="odd">
                    ${odd(match.au25Alt)}
                </td>

                <td class="odd">
                    ${odd(match.au25Ust)}
                </td>

            </tr>
        `;

    }).join("");

}


/* =========================================================
   VERİYİ YÜKLE
========================================================= */

async function loadData() {

    statusEl.className = "status";
    statusEl.textContent =
        "Veriler yükleniyor...";

    tbody.innerHTML = `
        <tr>
            <td colspan="15" class="loading">
                Veri yükleniyor...
            </td>
        </tr>
    `;


    try {

        const url =
            `${DATA_URL}?v=${Date.now()}`;


        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status} - ${response.statusText}`
            );

        }


        const data =
            await response.json();


        /* ---------------------------------------------
           JSON FORMATINI KONTROL ET
        --------------------------------------------- */

        if (Array.isArray(data)) {

            allMatches = data;

        }
        else if (
            data &&
            Array.isArray(data.matches)
        ) {

            allMatches = data.matches;

        }
        else {

            throw new Error(
                "JSON içinde 'matches' dizisi bulunamadı."
            );

        }


        if (!allMatches.length) {

            throw new Error(
                "matches dizisi boş."
            );

        }


        /* ---------------------------------------------
           LİSTELER
        --------------------------------------------- */

        createDateList();
        createLeagueList();


        /* ---------------------------------------------
           TABLOYU ÇİZ
        --------------------------------------------- */

        render();


        /* ---------------------------------------------
           DURUM
        --------------------------------------------- */

        statusEl.className =
            "status ok";

        statusEl.textContent =
            `${allMatches.length.toLocaleString("tr-TR")} maç yüklendi.`;


    }
    catch (error) {

        console.error(
            "Mackolik veri yükleme hatası:",
            error
        );


        statusEl.className =
            "status error";


        statusEl.innerHTML =
            `
            <strong>Veri yüklenemedi.</strong><br>
            ${esc(error.message)}
            <br><br>
            <small>
                Kaynak:
                ${esc(DATA_URL)}
            </small>
            `;


        tbody.innerHTML =
            `
            <tr>
                <td colspan="15" class="empty">
                    Veri yüklenemedi.<br><br>
                    <strong>
                        ${esc(error.message)}
                    </strong>
                </td>
            </tr>
            `;

    }

}


/* =========================================================
   FİLTRELER
========================================================= */

searchEl.addEventListener(
    "input",
    render
);

dateEl.addEventListener(
    "change",
    render
);

leagueEl.addEventListener(
    "change",
    render
);

playedEl.addEventListener(
    "change",
    render
);

refreshBtn.addEventListener(
    "click",
    loadData
);


/* =========================================================
   BAŞLAT
========================================================= */

loadData();

</script>

</body>
</html>
