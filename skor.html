<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İddaa Bülteni</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f3f4f6;
    color:#111827;
    font-family:Arial,Helvetica,sans-serif
}

header{
    background:#111827;
    color:#fff;
    padding:18px 14px;
    text-align:center
}

header h1{
    margin:0;
    font-size:22px
}

header p{
    margin:6px 0 0;
    color:#cbd5e1;
    font-size:13px
}

.container{
    max-width:1600px;
    margin:auto;
    padding:14px
}

.status{
    background:#fff;
    border-radius:10px;
    padding:12px 15px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    font-size:14px
}

.status.ok{
    border-left:4px solid #16a34a
}

.status.error{
    border-left:4px solid #dc2626;
    color:#991b1b
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto;
    gap:9px;
    background:#fff;
    padding:12px;
    border-radius:10px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.06)
}

input,
select,
button{
    width:100%;
    height:40px;
    border:1px solid #d1d5db;
    border-radius:7px;
    padding:0 10px;
    font-size:14px;
    background:#fff
}

button{
    background:#111827;
    color:#fff;
    border:0;
    cursor:pointer;
    padding:0 18px
}

.table-wrap{
    background:#fff;
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.06)
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse
}

thead{
    background:#111827;
    color:#fff
}

th,
td{
    padding:9px 7px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
    white-space:nowrap;
    font-size:13px
}

th{
    font-weight:600
}

tbody tr:hover{
    background:#f8fafc
}

.home{
    text-align:right;
    font-weight:600
}

.away{
    text-align:left;
    font-weight:600
}

.score{
    font-weight:700
}

.ht{
    color:#64748b;
    font-weight:600
}

.odd{
    font-weight:600
}

.no-data{
    padding:35px!important;
    color:#64748b
}

.badge{
    display:inline-block;
    padding:4px 7px;
    border-radius:5px;
    font-size:11px;
    font-weight:600
}

.played{
    background:#dcfce7;
    color:#166534
}

.unplayed{
    background:#fef3c7;
    color:#92400e
}

@media(max-width:800px){

    .filters{
        grid-template-columns:1fr 1fr
    }

    .search{
        grid-column:1/-1
    }
}

@media(max-width:500px){

    .container{
        padding:8px
    }

    .filters{
        grid-template-columns:1fr
    }

    .search{
        grid-column:auto
    }

    header h1{
        font-size:19px
    }
}
</style>
</head>

<body>

<header>
    <h1>İddaa Bülteni</h1>
    <p>Geçmiş maç sonuçları ve açılış oranları</p>
</header>

<div class="container">

    <div id="status" class="status">
        Veriler yükleniyor...
    </div>

    <div class="filters">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Takım veya maç kodu ara..."
        >

        <select id="dateFilter">
            <option value="">Tüm tarihler</option>
        </select>

        <select id="leagueFilter">
            <option value="">Tüm ligler</option>
        </select>

        <select id="playedFilter">
            <option value="all">Tüm maçlar</option>
            <option value="played">Oynananlar</option>
            <option value="unplayed">Oynanmamışlar</option>
        </select>

        <button id="refresh">
            Yenile
        </button>

    </div>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Tarih</th>
                    <th>Saat</th>
                    <th>Lig</th>
                    <th>Kod</th>
                    <th>Ev Sahibi</th>
                    <th>Misafir</th>
                    <th>İY</th>
                    <th>MS</th>
                    <th>MS 1</th>
                    <th>MS X</th>
                    <th>MS 2</th>
                    <th>KG Var</th>
                    <th>KG Yok</th>
                    <th>Alt 2,5</th>
                    <th>Üst 2,5</th>
                </tr>
            </thead>

            <tbody id="tbody">
                <tr>
                    <td colspan="15" class="no-data">
                        Veri yükleniyor...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<script>

"use strict";

/* =========================================================
   VERİ
========================================================= */

const DATA_URL = "./data/matches.json";

let matches = [];


/* =========================================================
   ELEMENTLER
========================================================= */

const statusEl = document.getElementById("status");
const tbody = document.getElementById("tbody");

const searchEl = document.getElementById("search");
const dateEl = document.getElementById("dateFilter");
const leagueEl = document.getElementById("leagueFilter");
const playedEl = document.getElementById("playedFilter");

const refreshBtn = document.getElementById("refresh");


/* =========================================================
   GÜVENLİ METİN
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   ORANLAR
   ÖNEMLİ:
   oranlar match.openingOdds İÇİNDE
========================================================= */

function odds(match){

    return match && match.openingOdds
        ? match.openingOdds
        : {};
}


function odd(value){

    if(
        value === null ||
        value === undefined ||
        value === "" ||
        Number(value) === 0
    ){
        return "-";
    }

    return esc(value);
}


/* =========================================================
   SKOR
========================================================= */

function getScore(match){

    const s = match && match.score;

    if(!s){
        return "";
    }

    if(
        s.home === null ||
        s.home === undefined ||
        s.away === null ||
        s.away === undefined ||
        s.home === "" ||
        s.away === ""
    ){
        return "";
    }

    return `${s.home}-${s.away}`;
}


function getHalfScore(match){

    const s = match && match.halfTimeScore;

    if(!s){
        return "";
    }

    if(
        s.home === null ||
        s.home === undefined ||
        s.away === null ||
        s.away === undefined ||
        s.home === "" ||
        s.away === ""
    ){
        return "";
    }

    return `${s.home}-${s.away}`;
}


/* =========================================================
   OYNANDI MI?
========================================================= */

function isPlayed(match){

    return getScore(match) !== "";
}


/* =========================================================
   TARİHLER
========================================================= */

function loadDates(){

    const dates = [
        ...new Set(
            matches
                .map(m => String(m.date || "").trim())
                .filter(Boolean)
        )
    ];

    dates.sort((a,b)=>{

        const pa = a.split(".");
        const pb = b.split(".");

        if(pa.length !== 3 || pb.length !== 3){
            return a.localeCompare(b);
        }

        return `${pa[2]}-${pa[1]}-${pa[0]}`
            .localeCompare(
                `${pb[2]}-${pb[1]}-${pb[0]}`
            );
    });

    dateEl.innerHTML =
        `<option value="">Tüm tarihler</option>` +
        dates.map(date =>
            `<option value="${esc(date)}">${esc(date)}</option>`
        ).join("");
}


/* =========================================================
   LİGLER
========================================================= */

function loadLeagues(){

    const leagues = [
        ...new Set(
            matches
                .map(m => String(m.league || "").trim())
                .filter(Boolean)
        )
    ];

    leagues.sort((a,b)=>
        a.localeCompare(b,"tr")
    );

    leagueEl.innerHTML =
        `<option value="">Tüm ligler</option>` +
        leagues.map(league =>
            `<option value="${esc(league)}">${esc(league)}</option>`
        ).join("");
}


/* =========================================================
   TABLO
========================================================= */

function render(){

    const search =
        searchEl.value
            .trim()
            .toLocaleLowerCase("tr-TR");

    const selectedDate =
        dateEl.value;

    const selectedLeague =
        leagueEl.value;

    const playedFilter =
        playedEl.value;


    const filtered =
        matches.filter(match => {

            const home =
                String(match.home || "")
                    .toLocaleLowerCase("tr-TR");

            const away =
                String(match.away || "")
                    .toLocaleLowerCase("tr-TR");

            const code =
                String(match.code || "")
                    .toLocaleLowerCase("tr-TR");

            const date =
                String(match.date || "");

            const league =
                String(match.league || "");

            const played =
                isPlayed(match);


            if(search){

                if(
                    !home.includes(search) &&
                    !away.includes(search) &&
                    !code.includes(search)
                ){
                    return false;
                }
            }


            if(
                selectedDate &&
                date !== selectedDate
            ){
                return false;
            }


            if(
                selectedLeague &&
                league !== selectedLeague
            ){
                return false;
            }


            if(
                playedFilter === "played" &&
                !played
            ){
                return false;
            }


            if(
                playedFilter === "unplayed" &&
                played
            ){
                return false;
            }


            return true;

        });


    if(!filtered.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="15" class="no-data">
                    Filtrelere uygun maç bulunamadı.
                </td>
            </tr>
        `;

        return;
    }


    tbody.innerHTML =
        filtered.map(match => {

            const o = odds(match);

            const score =
                getScore(match);

            const ht =
                getHalfScore(match);

            const played =
                isPlayed(match);


            return `
                <tr>

                    <td>
                        ${esc(match.date)}
                    </td>

                    <td>
                        ${esc(match.time)}
                    </td>

                    <td>
                        ${esc(match.league)}
                    </td>

                    <td>
                        ${esc(match.code)}
                    </td>

                    <td class="home">
                        ${esc(match.home)}
                    </td>

                    <td class="away">
                        ${esc(match.away)}
                    </td>

                    <td class="ht">
                        ${ht ? esc(ht) : "-"}
                    </td>

                    <td class="score">

                        ${
                            played
                            ? esc(score)
                            : `<span class="badge unplayed">-</span>`
                        }

                    </td>

                    <td class="odd">
                        ${odd(o.ms1)}
                    </td>

                    <td class="odd">
                        ${odd(o.msX)}
                    </td>

                    <td class="odd">
                        ${odd(o.ms2)}
                    </td>

                    <td class="odd">
                        ${odd(o.kgVar)}
                    </td>

                    <td class="odd">
                        ${odd(o.kgYok)}
                    </td>

                    <td class="odd">
                        ${odd(o.au25Alt)}
                    </td>

                    <td class="odd">
                        ${odd(o.au25Ust)}
                    </td>

                </tr>
            `;

        }).join("");
}


/* =========================================================
   VERİYİ ÇEK
========================================================= */

async function loadData(){

    statusEl.className = "status";
    statusEl.textContent =
        "Veriler yükleniyor...";


    tbody.innerHTML = `
        <tr>
            <td colspan="15" class="no-data">
                Veri yükleniyor...
            </td>
        </tr>
    `;


    try{

        const response =
            await fetch(
                `${DATA_URL}?v=${Date.now()}`,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const data =
            await response.json();


        /* ---------------------------------------------
           JSON YAPISI
        --------------------------------------------- */

        if(
            !data ||
            !Array.isArray(data.matches)
        ){

            throw new Error(
                "JSON içinde matches dizisi bulunamadı."
            );
        }


        matches =
            data.matches;


        if(!matches.length){

            throw new Error(
                "Maç listesi boş."
            );
        }


        /* ---------------------------------------------
           FİLTRELER
        --------------------------------------------- */

        loadDates();
        loadLeagues();


        /* ---------------------------------------------
           TABLO
        --------------------------------------------- */

        render();


        /* ---------------------------------------------
           DURUM
        --------------------------------------------- */

        statusEl.className =
            "status ok";

        statusEl.innerHTML =
            `
            <strong>
                ${matches.length.toLocaleString("tr-TR")}
                maç yüklendi.
            </strong>
            <br>
            Hafta:
            ${esc(data.week)}
            &nbsp; | &nbsp;
            Güncelleme:
            ${esc(data.updatedAt)}
            `;


    }
    catch(error){

        console.error(
            "Veri yükleme hatası:",
            error
        );


        statusEl.className =
            "status error";

        statusEl.innerHTML =
            `
            <strong>Veri yüklenemedi.</strong>
            <br><br>
            ${esc(error.message)}
            `;


        tbody.innerHTML = `
            <tr>
                <td colspan="15" class="no-data">
                    <strong>Veri yüklenemedi.</strong>
                    <br><br>
                    ${esc(error.message)}
                </td>
            </tr>
        `;
    }
}


/* =========================================================
   FİLTRELER
========================================================= */

searchEl.addEventListener(
    "input",
    render
);

dateEl.addEventListener(
    "change",
    render
);

leagueEl.addEventListener(
    "change",
    render
);

playedEl.addEventListener(
    "change",
    render
);

refreshBtn.addEventListener(
    "click",
    loadData
);


/* =========================================================
   BAŞLAT
========================================================= */

loadData();

</script>

</body>
</html>
