<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>İddaa Bülteni</title>

  <link rel="stylesheet"
        href="./style.css">
</head>

<body>

<main class="container">

  <header>

    <div>

      <p class="eyebrow">
        MACKOLİK ARŞİV VERİSİ
      </p>

      <h1>
        İddaa Bülteni
      </h1>

      <p class="muted">
        Geçmiş maç sonuçları ve açılış oranları
      </p>

    </div>

    <div id="updatedAt"
         class="updated">

      Veri yükleniyor…

    </div>

  </header>


  <!-- FİLTRELER -->

  <section class="controls">

    <input
      id="search"
      type="search"
      placeholder="Takım veya maç kodu ara">


    <select id="dateFilter">

      <option value="">
        Tüm tarihler
      </option>

    </select>


    <select id="leagueFilter">

      <option value="">
        Tüm ligler
      </option>

    </select>


    <label class="checkbox">

      <input
        id="unplayedOnly"
        type="checkbox">

      Oynanmamışlar

    </label>

  </section>


  <!-- DURUM -->

  <div id="message"
       class="message">

    Veri yükleniyor…

  </div>


  <!-- MAÇ TABLOSU -->

  <div class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>Tarih</th>

          <th>Saat</th>

          <th>Lig</th>

          <th>Kod</th>

          <th>Ev Sahibi</th>

          <th>Misafir</th>

          <th>İY</th>

          <th>Skor</th>

          <th>MS 1</th>

          <th>MS X</th>

          <th>MS 2</th>

          <th>KG Var</th>

          <th>KG Yok</th>

          <th>Alt 2,5</th>

          <th>Üst 2,5</th>

        </tr>

      </thead>


      <tbody id="matches">

      </tbody>

    </table>

  </div>

</main>


<!-- ÖNEMLİ -->

<script
  src="./app.js"
  type="module">
</script>


</body>

</html>
