<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İddaa Bülteni</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#17202a;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:#111827;
    color:white;
    padding:18px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:22px;
}

header p{
    margin:7px 0 0;
    color:#cbd5e1;
    font-size:13px;
}

.container{
    max-width:1600px;
    margin:auto;
    padding:15px;
}

.status{
    background:white;
    border-radius:10px;
    padding:12px 15px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    font-size:14px;
}

.status.ok{
    border-left:4px solid #16a34a;
}

.status.error{
    border-left:4px solid #dc2626;
    color:#991b1b;
}

.filters{
    background:white;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);

    display:grid;

    grid-template-columns:
        minmax(180px,2fr)
        minmax(140px,1fr)
        minmax(140px,1fr)
        minmax(130px,1fr)
        auto;

    gap:10px;
}

input,
select,
button{
    width:100%;
    min-height:42px;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:8px 10px;
    font-size:14px;
    background:white;
}

button{
    cursor:pointer;
    background:#111827;
    color:white;
    border:none;
    font-weight:600;
}

button:hover{
    opacity:.9;
}

.table-wrap{
    background:white;
    border-radius:10px;
    overflow-x:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1250px;
}

thead{
    background:#111827;
    color:white;
}

th,
td{
    padding:9px 8px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
    white-space:nowrap;
    font-size:13px;
}

th{
    font-weight:600;
}

tbody tr:hover{
    background:#f8fafc;
}

.home{
    text-align:right;
    font-weight:600;
}

.away{
    text-align:left;
    font-weight:600;
}

.score{
    font-weight:bold;
}

.ht{
    color:#64748b;
}

.odd{
    font-weight:600;
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.loading{
    text-align:center;
    padding:30px;
}

.badge{
    display:inline-block;
    padding:3px 7px;
    border-radius:5px;
    font-size:11px;
}

.badge.played{
    background:#dcfce7;
    color:#166534;
}

.badge.unplayed{
    background:#fef3c7;
    color:#92400e;
}

.badge.live{
    background:#fee2e2;
    color:#991b1b;
}

.count{
    color:#64748b;
    font-size:12px;
    margin-top:4px;
}

.code-old{
    color:#64748b;
    font-size:11px;
}

@media(max-width:800px){

    .filters{
        grid-template-columns:1fr 1fr;
    }

    .filters .search{
        grid-column:1/-1;
    }
}

@media(max-width:500px){

    .container{
        padding:8px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:19px;
    }
}
</style>
</head>

<body>

<header>
    <h1>İddaa Bülteni</h1>
    <p>Geçmiş maç sonuçları ve açılış oranları</p>
</header>

<div class="container">

    <div id="status" class="status">
        Veriler yükleniyor...
    </div>

    <div class="filters">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Takım veya maç kodu ara..."
        >

        <select id="dateFilter">
            <option value="">Tüm tarihler</option>
        </select>

        <select id="leagueFilter">
            <option value="">Tüm ligler</option>
        </select>

        <select id="playedFilter">

            <option value="all">
                Tümü
            </option>

            <option value="played">
                Oynananlar
            </option>

            <option value="unplayed">
                Oynanmamışlar
            </option>

        </select>

        <button id="refresh">
            Yenile
        </button>

    </div>

    <div class="table-wrap">

        <table>

            <thead>

                <tr>
                    <th>Tarih</th>
                    <th>Saat</th>
                    <th>Lig</th>
                    <th>Kod</th>
                    <th>Ev Sahibi</th>
                    <th>Misafir</th>
                    <th>İY</th>
                    <th>MS</th>
                    <th>MS 1</th>
                    <th>MS X</th>
                    <th>MS 2</th>
                    <th>KG Var</th>
                    <th>KG Yok</th>
                    <th>Alt 2,5</th>
                    <th>Üst 2,5</th>
                </tr>

            </thead>

            <tbody id="tbody">

                <tr>
                    <td
                        colspan="15"
                        class="loading">
                        Veri yükleniyor...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   AYARLAR
========================================================= */

const DATA_URL = "./data/matches.json";


/* =========================================================
   VERİ
========================================================= */

let allMatches = [];


/* =========================================================
   ELEMENTLER
========================================================= */

const $ = id =>
    document.getElementById(id);

const statusEl =
    $("status");

const tbody =
    $("tbody");

const searchEl =
    $("search");

const dateEl =
    $("dateFilter");

const leagueEl =
    $("leagueFilter");

const playedEl =
    $("playedFilter");

const refreshBtn =
    $("refresh");


/* =========================================================
   METİN
========================================================= */

function text(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value);
}


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function esc(value){

    return text(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   ORAN
========================================================= */

function odd(value){

    if(
        value === null ||
        value === undefined ||
        value === "" ||
        Number(value) === 0
    ){
        return "";
    }

    return esc(value);
}


/* =========================================================
   ORANLAR
========================================================= */

function getOdds(match){

    if(
        match &&
        match.openingOdds &&
        typeof match.openingOdds === "object"
    ){

        return match.openingOdds;

    }

    return {};
}


/* =========================================================
   SKOR NORMALİZASYONU
========================================================= */

function getScoreObject(match){

    if(
        !match ||
        !match.score ||
        typeof match.score !== "object"
    ){
        return null;
    }

    const home =
        text(match.score.home).trim();

    const away =
        text(match.score.away).trim();

    /*
       0-0 dahil olmak üzere gerçek skorları
       kabul ediyoruz.
    */

    if(
        home === "" ||
        away === ""
    ){
        return null;
    }

    /*
       Skor sadece rakamlardan oluşmalı.
       Böylece "-" veya "null" gibi değerler
       oynanmış kabul edilmez.
    */

    if(
        !/^\d+$/.test(home) ||
        !/^\d+$/.test(away)
    ){
        return null;
    }

    return {
        home,
        away
    };
}


/* =========================================================
   SKOR
========================================================= */

function getScore(match){

    const score =
        getScoreObject(match);

    if(!score){
        return "";
    }

    return `${score.home}-${score.away}`;
}


/* =========================================================
   İLK YARI SKORU
========================================================= */

function getHalfTimeScore(match){

    if(
        !match ||
        !match.halfTimeScore ||
        typeof match.halfTimeScore !== "object"
    ){
        return "";
    }

    const home =
        text(match.halfTimeScore.home).trim();

    const away =
        text(match.halfTimeScore.away).trim();

    if(
        home === "" ||
        away === ""
    ){
        return "";
    }

    if(
        !/^\d+$/.test(home) ||
        !/^\d+$/.test(away)
    ){
        return "";
    }

    return `${home}-${away}`;
}


/* =========================================================
   OYNANDI MI?
========================================================= */

function isPlayed(match){

    /*
       EN ÖNEMLİ KONTROL:

       Skor varsa maç oynanmıştır.

       0-0 da geçerli skordur.
    */

    return getScoreObject(match) !== null;
}


/* =========================================================
   OLD ID KONTROLÜ
========================================================= */

function isOldId(code){

    return /^OLD-/i.test(
        text(code).trim()
    );
}


/* =========================================================
   MAÇ ANAHTARI
========================================================= */

function matchKey(match){

    const date =
        text(match?.date)
            .trim()
            .toLowerCase();

    const time =
        text(match?.time)
            .trim()
            .toLowerCase();

    const home =
        text(match?.home)
            .trim()
            .toLocaleLowerCase("tr");

    const away =
        text(match?.away)
            .trim()
            .toLocaleLowerCase("tr");

    /*
       Aynı maçın OLD ve gerçek code kayıtlarını
       aynı maç olarak kabul ediyoruz.
    */

    return [
        date,
        time,
        home,
        away
    ].join("|");
}


/* =========================================================
   KAYIT KALİTESİ
========================================================= */

function recordScore(match){

    let score = 0;

    const code =
        text(match?.code).trim();

    /*
       Gerçek Mackolik kodu OLD kayıttan daha değerli.
    */

    if(
        code &&
        !isOldId(code)
    ){
        score += 100;
    }

    /*
       Skor varsa kayıt günceldir.
    */

    if(
        isPlayed(match)
    ){
        score += 50;
    }

    /*
       Açılış oranları varsa veri daha değerlidir.
    */

    if(
        match?.openingOdds &&
        typeof match.openingOdds === "object"
    ){
        score += 20;
    }

    /*
       Takım bilgileri
    */

    if(
        text(match?.home).trim() &&
        text(match?.away).trim()
    ){
        score += 10;
    }

    return score;
}


/* =========================================================
   DUPLICATE TEMİZLE
========================================================= */

function deduplicateMatches(matches){

    const map =
        new Map();

    for(
        const match of matches
    ){

        if(!match){
            continue;
        }

        const key =
            matchKey(match);

        /*
           Anahtar oluşmuyorsa kaydı kaybetme.
        */

        if(
            !key ||
            key === "|||"
        ){

            const fallback =
                text(match.code).trim();

            if(fallback){

                const old =
                    map.get(fallback);

                if(
                    !old ||
                    recordScore(match) >
                    recordScore(old)
                ){

                    map.set(
                        fallback,
                        match
                    );
                }

            }

            continue;
        }


        const existing =
            map.get(key);


        if(!existing){

            map.set(
                key,
                match
            );

            continue;
        }


        /*
           Daha kaliteli kaydı seç.
        */

        if(
            recordScore(match) >
            recordScore(existing)
        ){

            map.set(
                key,
                match
            );

        }
        else{

            /*
               Eski kayıtta oran olup yeni kayıtta
               oran yoksa oranları koru.
            */

            if(
                !existing.openingOdds &&
                match.openingOdds
            ){

                existing.openingOdds =
                    match.openingOdds;
            }


            /*
               Yeni kayıtta skor varsa skoru koru.
            */

            if(
                !isPlayed(existing) &&
                isPlayed(match)
            ){

                existing.score =
                    match.score;

                existing.halfTimeScore =
                    match.halfTimeScore;

                existing.status =
                    match.status;
            }

        }

    }

    return [
        ...map.values()
    ];
}


/* =========================================================
   TARİH KEY
========================================================= */

function dateKey(value){

    const parts =
        text(value).split(".");

    if(parts.length !== 3){
        return text(value);
    }

    return (
        parts[2] +
        "-" +
        parts[1].padStart(2,"0") +
        "-" +
        parts[0].padStart(2,"0")
    );
}


/* =========================================================
   TARİH LİSTESİ
========================================================= */

function createDateList(){

    const dates = [
        ...new Set(
            allMatches
                .map(
                    match =>
                        text(match.date).trim()
                )
                .filter(Boolean)
        )
    ];


    dates.sort(
        (a,b) =>
            dateKey(a)
            .localeCompare(
                dateKey(b)
            )
    );


    dateEl.innerHTML =
        `<option value="">
            Tüm tarihler
        </option>` +

        dates
            .map(
                date => `
                    <option value="${esc(date)}">
                        ${esc(date)}
                    </option>
                `
            )
            .join("");
}


/* =========================================================
   BUGÜNÜ SEÇ
========================================================= */

function selectToday(){

    const now =
        new Date();


    const today =
        [
            String(
                now.getDate()
            ).padStart(2,"0"),

            String(
                now.getMonth()+1
            ).padStart(2,"0"),

            now.getFullYear()

        ].join(".");


    const exists =
        [...dateEl.options]
            .some(
                option =>
                    option.value === today
            );


    if(exists){

        dateEl.value =
            today;

        return;
    }


    /*
       Bugün yoksa en yeni tarihi seç.
    */

    const options =
        [...dateEl.options]
            .filter(
                option =>
                    option.value
            );


    if(options.length){

        options.sort(
            (a,b) =>
                dateKey(b.value)
                .localeCompare(
                    dateKey(a.value)
                )
        );


        dateEl.value =
            options[0].value;
    }
}


/* =========================================================
   LİG LİSTESİ
========================================================= */

function createLeagueList(){

    const leagues = [
        ...new Set(
            allMatches
                .map(
                    match =>
                        text(match.league).trim()
                )
                .filter(Boolean)
        )
    ];


    leagues.sort(
        (a,b) =>
            a.localeCompare(
                b,
                "tr"
            )
    );


    leagueEl.innerHTML =
        `<option value="">
            Tüm ligler
        </option>` +

        leagues
            .map(
                league => `
                    <option value="${esc(league)}">
                        ${esc(league)}
                    </option>
                `
            )
            .join("");
}


/* =========================================================
   GÖSTERİLECEK KOD
========================================================= */

function displayCode(match){

    const code =
        text(match?.code).trim();

    /*
       OLD kodlarını kullanıcıya göstermiyoruz.
    */

    if(
        isOldId(code)
    ){

        /*
           Eğer başka yerde gerçek kod tutulmuşsa
           onu kullan.
        */

        const realCode =
            text(
                match?.originalCode ??
                match?.matchCode ??
                match?.mackolikCode
            ).trim();

        if(realCode){
            return realCode;
        }

        return "-";
    }

    return code || "-";
}


/* =========================================================
   TABLOYU ÇİZ
========================================================= */

function render(){

    const search =
        searchEl.value
            .trim()
            .toLocaleLowerCase("tr");


    const date =
        dateEl.value;


    const league =
        leagueEl.value;


    const played =
        playedEl.value;


    const filtered =
        allMatches.filter(
            match => {

                const home =
                    text(match.home)
                    .toLocaleLowerCase("tr");


                const away =
                    text(match.away)
                    .toLocaleLowerCase("tr");


                const code =
                    displayCode(match)
                    .toLocaleLowerCase("tr");


                const rawCode =
                    text(match.code)
                    .toLocaleLowerCase("tr");


                const matchLeague =
                    text(match.league);


                const matchDate =
                    text(match.date);


                const playedState =
                    isPlayed(match);


                /*
                   ARAMA
                */

                if(search){

                    const found =
                        home.includes(search) ||
                        away.includes(search) ||
                        code.includes(search) ||
                        rawCode.includes(search);


                    if(!found){
                        return false;
                    }
                }


                /*
                   TARİH
                */

                if(
                    date &&
                    matchDate !== date
                ){
                    return false;
                }


                /*
                   LİG
                */

                if(
                    league &&
                    matchLeague !== league
                ){
                    return false;
                }


                /*
                   OYNANDI
                */

                if(
                    played === "played" &&
                    !playedState
                ){
                    return false;
                }


                /*
                   OYNANMADI
                */

                if(
                    played === "unplayed" &&
                    playedState
                ){
                    return false;
                }


                return true;

            }
        );


    /*
       Sonuç yok
    */

    if(!filtered.length){

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="15"
                    class="empty">

                    Filtrelere uygun maç bulunamadı.

                </td>
            </tr>
        `;

        return;
    }


    /*
       Tablo
    */

    tbody.innerHTML =
        filtered
            .map(
                match => {

                    const odds =
                        getOdds(match);


                    const score =
                        getScore(match);


                    const half =
                        getHalfTimeScore(match);


                    const playedState =
                        isPlayed(match);


                    const code =
                        displayCode(match);


                    return `

                        <tr>

                            <td>
                                ${esc(match.date)}
                            </td>

                            <td>
                                ${esc(match.time)}
                            </td>

                            <td>
                                ${esc(match.league)}
                            </td>

                            <td>
                                ${
                                    isOldId(match.code)
                                    ? `<span class="code-old">${esc(code)}</span>`
                                    : esc(code)
                                }
                            </td>

                            <td class="home">
                                ${esc(match.home)}
                            </td>

                            <td class="away">
                                ${esc(match.away)}
                            </td>

                            <td class="ht">
                                ${
                                    half
                                    ? esc(half)
                                    : "-"
                                }
                            </td>

                            <td class="score">

                                ${
                                    playedState

                                    ? `
                                        <span class="badge played">
                                            ${esc(score)}
                                        </span>
                                      `

                                    : `
                                        <span class="badge unplayed">
                                            Oynanmadı
                                        </span>
                                      `
                                }

                            </td>

                            <td class="odd">
                                ${odd(odds.ms1)}
                            </td>

                            <td class="odd">
                                ${odd(odds.msX)}
                            </td>

                            <td class="odd">
                                ${odd(odds.ms2)}
                            </td>

                            <td class="odd">
                                ${odd(odds.kgVar)}
                            </td>

                            <td class="odd">
                                ${odd(odds.kgYok)}
                            </td>

                            <td class="odd">
                                ${odd(odds.au25Alt)}
                            </td>

                            <td class="odd">
                                ${odd(odds.au25Ust)}
                            </td>

                        </tr>

                    `;

                }
            )
            .join("");


    /*
       Durum
    */

    const playedCount =
        filtered.filter(
            match =>
                isPlayed(match)
        ).length;


    const unplayedCount =
        filtered.length -
        playedCount;


    statusEl.className =
        "status ok";


    statusEl.innerHTML = `

        <strong>
            ${filtered.length.toLocaleString("tr-TR")}
            maç gösteriliyor.
        </strong>

        <div class="count">

            Oynanan:
            ${playedCount.toLocaleString("tr-TR")}

            &nbsp; | &nbsp;

            Oynanmayan:
            ${unplayedCount.toLocaleString("tr-TR")}

            &nbsp; | &nbsp;

            Toplam arşiv:
            ${allMatches.length.toLocaleString("tr-TR")}

        </div>

    `;
}


/* =========================================================
   VERİYİ YÜKLE
========================================================= */

async function loadData(){

    statusEl.className =
        "status";


    statusEl.textContent =
        "Veriler yükleniyor...";


    tbody.innerHTML = `
        <tr>
            <td
                colspan="15"
                class="loading">

                Veri yükleniyor...

            </td>
        </tr>
    `;


    try{

        const response =
            await fetch(
                DATA_URL +
                "?v=" +
                Date.now(),

                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " - " +
                response.statusText
            );
        }


        const data =
            await response.json();


        if(
            !data ||
            !Array.isArray(data.matches)
        ){

            throw new Error(
                "matches.json içinde matches dizisi bulunamadı."
            );
        }


        /*
           Ham veriyi al.
        */

        const rawMatches =
            data.matches;


        if(!rawMatches.length){

            throw new Error(
                "matches.json boş."
            );
        }


        /*
           OLD + gerçek kayıtları temizle.
        */

        allMatches =
            deduplicateMatches(
                rawMatches
            );


        /*
           Tarih ve lig filtreleri.
        */

        createDateList();

        createLeagueList();


        /*
           Bugünü seç.
        */

        selectToday();


        /*
           Tabloyu oluştur.
        */

        render();


    }
    catch(error){

        console.error(
            "Veri yükleme hatası:",
            error
        );


        statusEl.className =
            "status error";


        statusEl.innerHTML = `

            <strong>
                Veri yüklenemedi.
            </strong>

            <br><br>

            ${esc(error.message)}

            <br><br>

            <small>
                Kaynak:
                ${esc(DATA_URL)}
            </small>

        `;


        tbody.innerHTML = `

            <tr>

                <td
                    colspan="15"
                    class="empty">

                    Veri yüklenemedi.

                    <br><br>

                    <strong>
                        ${esc(error.message)}
                    </strong>

                </td>

            </tr>

        `;
    }
}
