
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Oran V1 - Sonuçtan Oran Analizi</title>

<style>
:root {
    color-scheme: dark;
    --bg: #080e19;
    --panel: #111b2b;
    --panel2: #172337;
    --line: #26364d;
    --text: #e8eef8;
    --muted: #91a1b8;
    --green: #35d39a;
    --yellow: #f4c96b;
    --red: #ff7c87;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: radial-gradient(ellipse at top,#14243b 0,#080e19 48%);
    color: var(--text);
    font: 14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

.wrap {
    max-width: 1100px;
    margin: auto;
    padding: 22px 15px 50px;
}

.top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

h1 {
    font-size: 25px;
    line-height: 1.2;
    margin: 0 0 7px;
}

.sub {
    color: var(--muted);
    font-size: 13px;
}

button, .search {
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 13px;
    font: inherit;
}

button { cursor: pointer; }

.stats {
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    gap: 10px;
    margin: 18px 0;
}

.stat {
    background: linear-gradient(145deg,#15243a,#101a29);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 13px;
}

.stat b {
    display: block;
    font-size: 22px;
}

.stat span {
    font-size: 12px;
    color: var(--muted);
}

.toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin: 17px 0;
}

.search {
    flex: 1;
    min-width: 180px;
    outline: none;
}

.tabs {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.tab {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 20px;
}

.tab.active {
    background: #23416a;
    border-color: #4777b5;
}

.section { margin: 23px 0; }

.section h2 {
    font-size: 17px;
    margin: 0 0 10px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 11px;
}

.card {
    background: linear-gradient(145deg,#121e30,#0f1827);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
}

.cardhead {
    padding: 14px 15px 11px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
}

.market {
    font-weight: 750;
    font-size: 15px;
}

.source {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
}

.percent {
    color: var(--green);
    font-weight: 800;
    font-size: 19px;
    white-space: nowrap;
}

.meta {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    padding: 0 15px 12px;
}

.pill {
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 4px 8px;
    font-size: 11px;
    color: #b9c7da;
    background: #172438;
}

.pill.good {
    color: var(--green);
    border-color: #24664f;
}

.pill.odds {
    color: var(--yellow);
    border-color: #6b572b;
}

details { border-top: 1px solid var(--line); }

summary {
    padding: 11px 15px;
    cursor: pointer;
    color: #c5d4e8;
    font-size: 12px;
    list-style: none;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

summary::-webkit-details-marker { display: none; }

.fixtures { padding: 0 12px 12px; }

.fixture {
    display: grid;
    grid-template-columns: 88px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 3px;
    border-top: 1px solid #1e2c40;
}

.fixture:first-child { border-top: 0; }

.date {
    font-size: 11px;
    color: var(--muted);
}

.teams {
    font-weight: 650;
    font-size: 13px;
}

.league {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
}

.price {
    font-size: 12px;
    font-weight: 750;
    color: var(--yellow);
    white-space: nowrap;
    text-align: right;
}

.empty {
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 28px;
    text-align: center;
    color: var(--muted);
    background: #101a29;
}

.status {
    margin: 10px 0;
    color: var(--muted);
    font-size: 12px;
}

.error { color: var(--red); }

.foot {
    margin-top: 25px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
}

@media(max-width:700px) {
    .wrap { padding: 17px 11px 35px; }
    h1 { font-size: 22px; }
    .stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .stat { padding: 11px; }
    .stat b { font-size: 20px; }
    .cards { grid-template-columns: 1fr; }
    .fixture {
        grid-template-columns: 72px 1fr auto;
        gap: 7px;
    }
    .teams { font-size: 12px; }
    .price { font-size: 11px; }
}
</style>
</head>

<body>

<div class="wrap">

<header class="top">
    <div>
        <h1>Oran V1</h1>
        <div class="sub">
            Sonuçtan Oran Analizi · Aynı market + aynı açılış oranı
        </div>
    </div>

    <button id="refresh">↻ Yenile</button>
</header>

<div class="stats">
    <div class="stat">
        <b id="historyCount">—</b>
        <span>Analize giren maç</span>
    </div>

    <div class="stat">
        <b>39</b>
        <span>Kaynak market</span>
    </div>

    <div class="stat">
        <b id="signalCount">—</b>
        <span>Başarılı tahmin</span>
    </div>

    <div class="stat">
        <b id="futureCount">—</b>
        <span>Gelecek eşleşme</span>
    </div>
</div>

<div class="toolbar">
    <input
        class="search"
        id="search"
        placeholder="Takım, lig veya market ara..."
    >
    <button id="clear">Temizle</button>
</div>

<div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">Tümü</button>
    <button class="tab" data-tab="result">Maç Sonucu</button>
    <button class="tab" data-tab="total">2.5 Alt / Üst</button>
    <button class="tab" data-tab="bands">Gol Aralıkları</button>
    <button class="tab" data-tab="btts">Karşılıklı Gol</button>
</div>

<div id="status" class="status">Veriler yükleniyor...</div>
<div id="content"></div>

<div class="foot">
    Kaynak: ./data/v2-data.json · Son 14 gün · Minimum 4 maç · Başarı eşiği %80
</div>

</div>

<script>
"use strict";

const DATA_URL = "./data/v2-data.json";
const MIN_SAMPLE = 4;
const MIN_SUCCESS = 80;
const DAYS = 14;

const marketNames = {
    ms1:"MS1",
    msX:"MSX",
    ms2:"MS2",
    h12:"1-2",
    h0:"Beraberlik",
    h23:"2-3",
    i14:"İlk yarı 1-4",
    olmaz:"Olmaz",
    i25:"İY 2.5",
    ms1Alt:"MS1 Alt",
    msXAlt:"MSX Alt",
    ms2Alt:"MS2 Alt",
    ms1Ust:"MS1 Üst",
    msXUst:"MSX Üst",
    ms2Ust:"MS2 Üst",
    au25Alt:"2.5 Alt",
    au25Ust:"2.5 Üst",
    au35Alt:"3.5 Alt",
    au35Ust:"3.5 Üst",
    kgVar:"KG Var",
    kgYok:"KG Yok",
    gol01:"Gol 0-1",
    gol23:"Gol 2-3",
    gol45:"Gol 4-5",
    gol6plus:"Gol 6+",
    iy1:"İY 1",
    iyX:"İY X",
    iy2:"İY 2",
    iy15Alt:"İY 1.5 Alt",
    iy15Ust:"İY 1.5 Üst",
    iyms11:"İY/MS 1/1",
    iyms10:"İY/MS 1/X",
    iyms12:"İY/MS 1/2",
    iyms01:"İY/MS X/1",
    iyms00:"İY/MS X/X",
    iyms02:"İY/MS X/2",
    iyms21:"İY/MS 2/1",
    iyms20:"İY/MS 2/X",
    iyms22:"İY/MS 2/2"
};

const groups = [
    {
        id:"result",
        title:"Maç Sonucu",
        outcomes:[
            {key:"MS1",label:"MS1",odds:"ms1"},
            {key:"MSX",label:"MSX",odds:"msX"},
            {key:"MS2",label:"MS2",odds:"ms2"}
        ]
    },
    {
        id:"total",
        title:"2.5 Alt / Üst",
        outcomes:[
            {key:"2.5 Alt",label:"2.5 Alt",odds:"au25Alt"},
            {key:"2.5 Üst",label:"2.5 Üst",odds:"au25Ust"}
        ]
    },
    {
        id:"bands",
        title:"Gol Aralıkları",
        outcomes:[
            {key:"Gol 0-1",label:"Gol 0-1",odds:"gol01"},
            {key:"Gol 2-3",label:"Gol 2-3",odds:"gol23"},
            {key:"Gol 4-5",label:"Gol 4-5",odds:"gol45"},
            {key:"Gol 6+",label:"Gol 6+",odds:"gol6plus"}
        ]
    },
    {
        id:"btts",
        title:"Karşılıklı Gol",
        outcomes:[
            {key:"KG Var",label:"KG Var",odds:"kgVar"},
            {key:"KG Yok",label:"KG Yok",odds:"kgYok"}
        ]
    }
];

let allCards = [];
let activeTab = "all";
let matches = [];

const $ = id => document.getElementById(id);

function parseDate(value) {
    if (!value) return null;

    const parts = String(value).split(".");
    if (parts.length !== 3) return null;

    const date = new Date(
        Number(parts[2]),
        Number(parts[1]) - 1,
        Number(parts[0])
    );

    return Number.isNaN(date.getTime()) ? null : date;
}

function matchDateTime(match) {
    const date = parseDate(match.date);
    if (!date) return null;

    const time = String(match.time || "00:00").split(":");

    date.setHours(
        Number(time[0] || 0),
        Number(time[1] || 0),
        0,
        0
    );

    return date;
}

function scoreParts(score) {
    if (typeof score !== "string") return null;

    const result = score.trim().match(/^(\d+)\s*[-:]\s*(\d+)$/);

    return result
        ? [Number(result[1]), Number(result[2])]
        : null;
}

function oddsOf(match, key) {
    const value =
        match?.odds?.[key] ??
        match?.marketOdds?.[key] ??
        match?.[key];

    if (value === null || value === undefined || value === "") {
        return null;
    }

    const number = Number(value);

    return Number.isFinite(number) && number > 0
        ? number
        : null;
}

function oddsKey(value) {
    return value.toFixed(2);
}

function actualOutcomes(match) {
    const score = scoreParts(match.score);

    if (!score) return [];

    const [home, away] = score;
    const total = home + away;

    const outcomes = [];

    if (home > away) outcomes.push("MS1");
    else if (home === away) outcomes.push("MSX");
    else outcomes.push("MS2");

    outcomes.push(
        total <= 2 ? "2.5 Alt" : "2.5 Üst"
    );

    if (total <= 1) outcomes.push("Gol 0-1");
    else if (total <= 3) outcomes.push("Gol 2-3");
    else if (total <= 5) outcomes.push("Gol 4-5");
    else outcomes.push("Gol 6+");

    outcomes.push(
        home > 0 && away > 0 ? "KG Var" : "KG Yok"
    );

    return outcomes;
}

function formatDate(date) {
    return date.toLocaleDateString("tr-TR", {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
    });
}

function formatOdds(value) {
    return value === null
        ? "Oran yok"
        : "Oran " + value.toFixed(2);
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    }[char]));
}

function buildAnalysis() {

    const now = new Date();

    const cutoff = new Date(now);
    cutoff.setDate(cutoff.getDate() - (DAYS - 1));
    cutoff.setHours(0, 0, 0, 0);

    // Son 14 gündeki bitmiş maçlar
    const historical = matches.filter(match => {
        const dateTime = matchDateTime(match);

        return (
            dateTime &&
            dateTime >= cutoff &&
            dateTime <= now &&
            scoreParts(match.score)
        );
    });

    // Oynanmamış gelecek maçlar
    const future = matches.filter(match => {
        const dateTime = matchDateTime(match);

        return (
            dateTime &&
            dateTime >= now &&
            !scoreParts(match.score)
        );
    });

    $("historyCount").textContent =
        historical.length.toLocaleString("tr-TR");

    const buckets = new Map();

    // Kaynak market + birebir 2 ondalık oran eşleştirmesi
    for (const match of historical) {

        for (const [key, label] of Object.entries(marketNames)) {

            const price = oddsOf(match, key);

            if (price === null) continue;

            const id = key + "|" + oddsKey(price);

            if (!buckets.has(id)) {
                buckets.set(id, {
                    source:key,
                    sourceLabel:label,
                    price:price,
                    items:[]
                });
            }

            buckets.get(id).items.push({
                match:match,
                outcomes:actualOutcomes(match)
            });
        }
    }

    const cards = [];

    for (const bucket of buckets.values()) {

        if (bucket.items.length < MIN_SAMPLE) continue;

        const outcomes = groups
            .flatMap(group => group.outcomes)
            .map(outcome => {

                const wins = bucket.items.filter(item =>
                    item.outcomes.includes(outcome.key)
                ).length;

                return {
                    ...outcome,
                    wins:wins,
                    total:bucket.items.length,
                    pct:(wins / bucket.items.length) * 100
                };
            })
            .filter(outcome => outcome.pct >= MIN_SUCCESS);

        if (!outcomes.length) continue;

        // Aynı kaynak market + aynı kaynak oranına sahip gelecek maçlar
        const upcoming = future.filter(match => {
            const price = oddsOf(match, bucket.source);

            return (
                price !== null &&
                oddsKey(price) === oddsKey(bucket.price)
            );
        });

        // Gelecek eşleşmesi olmayan sinyali gösterme
        if (!upcoming.length) continue;

        for (const outcome of outcomes) {

            const group = groups.find(g =>
                g.outcomes.some(o => o.key === outcome.key)
            );

            cards.push({
                source:bucket.source,
                sourceLabel:bucket.sourceLabel,
                sourcePrice:bucket.price,
                outcome:outcome,
                group:group.id,
                groupTitle:group.title,
                upcoming:upcoming
            });
        }
    }

    cards.sort((a,b) =>
        b.outcome.pct - a.outcome.pct ||
        b.upcoming.length - a.upcoming.length
    );

    allCards = cards;

    $("signalCount").textContent =
        cards.length.toLocaleString("tr-TR");

    $("futureCount").textContent =
        cards.reduce((total, card) =>
            total + card.upcoming.length, 0
        ).toLocaleString("tr-TR");

    render();
}

function render() {

    const query = $("search").value
        .trim()
        .toLocaleLowerCase("tr-TR");

    const filtered = allCards.filter(card => {

        const tabMatch =
            activeTab === "all" ||
            card.group === activeTab;

        const searchText = [
            card.sourceLabel,
            card.outcome.label,
            card.groupTitle,
            ...card.upcoming.flatMap(match => [
                match.home,
                match.away,
                match.league
            ])
        ].join(" ").toLocaleLowerCase("tr-TR");

        return tabMatch && (!query || searchText.includes(query));
    });

    const content = $("content");
    content.innerHTML = "";

    if (!filtered.length) {
        content.innerHTML = `
            <div class="empty">
                Bu filtrede gelecek maç eşleşmesi olan tahmin bulunamadı.
            </div>
        `;
        return;
    }

    const visibleGroups = activeTab === "all"
        ? groups
        : groups.filter(group => group.id === activeTab);

    for (const group of visibleGroups) {

        const list = filtered.filter(card =>
            card.group === group.id
        );

        if (!list.length) continue;

        const section = document.createElement("section");
        section.className = "section";

        section.innerHTML = `
            <h2>
                ${group.title}
                <span style="color:var(--muted);font-size:12px;font-weight:500">
                    (${list.length})
                </span>
            </h2>
            <div class="cards"></div>
        `;

        const grid = section.querySelector(".cards");

        for (const cardData of list) {

            const card = document.createElement("article");
            card.className = "card";

            // Tahmin edilen marketin kendi oranını al
            const fixtureRows = cardData.upcoming.map(match => {

                const dateTime = matchDateTime(match);

                // ÖNEMLİ:
                // MS1 tahmini -> ms1 oranı
                // MSX tahmini -> msX oranı
                // MS2 tahmini -> ms2 oranı
                // 2.5 Alt -> au25Alt oranı
                // 2.5 Üst -> au25Ust oranı
                // KG Var -> kgVar oranı
                // KG Yok -> kgYok oranı
                // Gol tahminleri -> ilgili gol marketinin oranı

                const predictionPrice = oddsOf(
                    match,
                    cardData.outcome.odds
                );

                return `
                    <div class="fixture">

                        <div class="date">
                            ${
                                dateTime
                                    ? escapeHTML(formatDate(dateTime))
                                    : "—"
                            }
                            <br>
                            ${escapeHTML(match.time || "—")}
                        </div>

                        <div>
                            <div class="teams">
                                ${escapeHTML(match.home)}
                                –
                                ${escapeHTML(match.away)}
                            </div>

                            <div class="league">
                                ${escapeHTML(match.league || "Lig bilgisi yok")}
                            </div>
                        </div>

                        <div class="price">
                            ${escapeHTML(formatOdds(predictionPrice))}
                        </div>

                    </div>
                `;
            }).join("");

            card.innerHTML = `
                <div class="cardhead">

                    <div>
                        <div class="market">
                            ${escapeHTML(cardData.outcome.label)} tahmini
                        </div>

                        <div class="source">
                            Kaynak: ${escapeHTML(cardData.sourceLabel)}
                            · Kaynak oranı ${cardData.sourcePrice.toFixed(2)}
                        </div>
                    </div>

                    <div class="percent">
                        %${cardData.outcome.pct.toFixed(0)}
                    </div>

                </div>

                <div class="meta">

                    <span class="pill good">
                        ${cardData.outcome.wins}/${cardData.outcome.total} başarılı
                    </span>

                    <span class="pill">
                        ${cardData.outcome.total} maçlık örneklem
                    </span>

                    <span class="pill odds">
                        Tahmin marketi: ${escapeHTML(cardData.outcome.odds)}
                    </span>

                    <span class="pill">
                        ${cardData.upcoming.length} gelecek maç
                    </span>

                </div>

                <details>
                    <summary>
                        <span>Gelecek eşleşmeler ve tahmin oranları</span>
                        <span>⌄</span>
                    </summary>

                    <div class="fixtures">
                        ${fixtureRows}
                    </div>
                </details>
            `;

            grid.appendChild(card);
        }

        content.appendChild(section);
    }
}

async function loadData() {

    $("status").textContent = "Veriler yükleniyor...";
    $("status").classList.remove("error");

    try {

        const response = await fetch(
            DATA_URL + "?v=" + Date.now(),
            {cache:"no-store"}
        );

        if (!response.ok) {
            throw new Error(
                "Veri dosyası yüklenemedi. HTTP " + response.status
            );
        }

        const data = await response.json();

        matches = Array.isArray(data.matches)
            ? data.matches
            : [];

        if (!matches.length) {
            throw new Error("JSON içinde matches listesi bulunamadı.");
        }

        buildAnalysis();

        const updated = data.updatedAt
            ? new Date(data.updatedAt).toLocaleString("tr-TR")
            : "Bilinmiyor";

        $("status").textContent =
            matches.length.toLocaleString("tr-TR") +
            " maç yüklendi · Veri güncellemesi: " + updated;

    } catch (error) {

        $("status").textContent =
            error.message +
            " · data/v2-data.json dosyasını kontrol et.";

        $("status").classList.add("error");

        $("content").innerHTML = `
            <div class="empty">
                Veriler yüklenemedi.
            </div>
        `;
    }
}

$("refresh").addEventListener("click", loadData);

$("search").addEventListener("input", render);

$("clear").addEventListener("click", () => {

    $("search").value = "";
    activeTab = "all";

    document.querySelectorAll(".tab").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.tab === "all"
        );
    });

    render();
});

$("tabs").addEventListener("click", event => {

    const button = event.target.closest("[data-tab]");

    if (!button) return;

    activeTab = button.dataset.tab;

    document.querySelectorAll(".tab").forEach(item => {
        item.classList.toggle("active", item === button);
    });

    render();
});

loadData();
</script>

</body>
</html>
