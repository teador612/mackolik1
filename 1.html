<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Oran Geçmişi</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #131e30;
  --panel2: #19263a;
  --border: #29384e;
  --text: #eef4ff;
  --muted: #9aaac0;
  --green: #36d399;
  --red: #fb7185;
  --yellow: #fbbf24;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
}
button, input { font: inherit; }
.container {
  width: min(1000px, 100%);
  margin: auto;
  padding: 14px 10px 30px;
}
header { margin-bottom: 14px; }
h1 {
  margin: 0 0 5px;
  font-size: 23px;
}
.subtitle {
  color: var(--muted);
  font-size: 12px;
}
.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.toolbar label {
  color: var(--muted);
  font-weight: 600;
}
input[type="date"] {
  min-height: 34px;
  padding: 5px 8px;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.button {
  min-height: 34px;
  padding: 6px 10px;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
}
.status {
  margin: 9px 0;
  color: var(--muted);
  overflow-wrap: anywhere;
  font-size: 12px;
}
.status.error { color: var(--red); }
.status.success { color: var(--green); }
.summary {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 14px;
}
.summary-item {
  padding: 6px 9px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  font-size: 12px;
}
.summary-item strong { color: var(--text); }
.section-heading {
  margin: 14px 0 9px;
  font-size: 17px;
}
.match-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.match-card {
  min-width: 0;
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.match-meta {
  display: flex;
  justify-content: space-between;
  gap: 7px;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 11px;
}
.teams {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}
.team {
  font-weight: 700;
  overflow-wrap: anywhere;
}
.team.away { text-align: right; }
.score {
  min-width: 40px;
  padding: 4px 5px;
  border-radius: 6px;
  background: var(--panel2);
  text-align: center;
  font-weight: 800;
  white-space: nowrap;
}
.market-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
}
.odd-button {
  display: flex;
  min-width: 0;
  min-height: 43px;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 3px;
  padding: 4px 1px;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  cursor: pointer;
}
.odd-button:disabled {
  opacity: .35;
  cursor: not-allowed;
}
.odd-button.selected {
  border-color: var(--green);
  background: #16342f;
}
.odd-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  text-align: center;
}
.odd-value {
  font-size: 12px;
  font-weight: 800;
}
.history-inline {
  margin-top: 10px;
  padding: 8px;
  background: #0e1929;
  border: 1px solid var(--border);
  border-radius: 8px;
}
.history-title {
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}
.history-row {
  display: grid;
  grid-template-columns: 66px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 7px;
  padding: 6px 2px;
  border-top: 1px solid var(--border);
  font-size: 11px;
}
.history-date {
  color: var(--muted);
  white-space: nowrap;
}
.history-teams {
  min-width: 0;
  overflow-wrap: anywhere;
  line-height: 1.35;
}
.history-score {
  font-weight: 800;
  white-space: nowrap;
}
.badge {
  padding: 3px 5px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}
.badge.win {
  color: var(--green);
  background: #12372e;
}
.badge.loss {
  color: var(--red);
  background: #3a1c2a;
}
.badge.pending {
  color: var(--yellow);
  background: #3b3017;
}
.empty {
  padding: 16px 10px;
  border: 1px dashed var(--border);
  border-radius: 9px;
  color: var(--muted);
  text-align: center;
  line-height: 1.5;
  font-size: 12px;
}
@media (max-width: 650px) {
  .container { padding: 12px 8px 25px; }
  h1 { font-size: 21px; }
  .match-list { grid-template-columns: 1fr; }
  .match-card { padding: 9px; }
  .history-row {
    grid-template-columns: 57px minmax(0, 1fr) auto auto;
    gap: 5px;
    font-size: 10px;
  }
  .history-date { font-size: 10px; }
  .badge { font-size: 9px; padding: 3px 4px; }
}
</style>
</head>
<body>
<main class="container">
  <header>
    <h1>Oran Geçmişi</h1>
    <div class="subtitle">Orana tıkla, aynı orandaki son 5 geçmiş maçı maçın altında gör.</div>
  </header>
  <div class="toolbar">
    <label for="matchDate">Tarih</label>
    <input type="date" id="matchDate">
    <button class="button" id="todayButton" type="button">Bugün</button>
    <button class="button" id="refreshButton" type="button">Yenile</button>
  </div>
  <div id="status" class="status">V2 verisi yükleniyor...</div>
  <div class="summary">
    <div class="summary-item">Toplam maç: <strong id="totalCount">-</strong></div>
    <div class="summary-item">Günün maçları: <strong id="dayCount">-</strong></div>
  </div>
  <h2 class="section-heading" id="matchesTitle">Günün maçları</h2>
  <div id="matchList" class="match-list">
    <div class="empty">Veriler yükleniyor...</div>
  </div>
</main>
<script>
"use strict";
const DATA_URL = "./data/v2-data.json";
const MARKETS = [
  { key: "iy1", label: "İY1", type: "halfHome" },
  { key: "iy2", label: "İY2", type: "halfAway" },
  { key: "iy15Ust", label: "İY 1.5 ÜST", type: "halfOver15" },
  { key: "ms1", label: "MS1", type: "fullHome" },
  { key: "ms2", label: "MS2", type: "fullAway" }
];
const $ = id => document.getElementById(id);
let allMatches = [];
let selectedMatchId = null;
let selectedMarketKey = null;
let loading = false;
function localDateString(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}
function parseDate(value) {
  if (!value) return null;
  const text = String(value).trim();
  let m = text.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  const d = new Date(text);
  if (Number.isNaN(d.getTime())) return null;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function dateKey(value) {
  const d = parseDate(value);
  if (!d || Number.isNaN(d.getTime())) return "";
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dateNumber(value) {
  const key = dateKey(value);
  return key ? Number(key.replaceAll("-", "")) : 0;
}
function formatDate(value) {
  const d = parseDate(value);
  return d ? new Intl.DateTimeFormat("tr-TR").format(d) : String(value || "-");
}
function normalizeText(value) {
  return String(value || "")
    .toLocaleLowerCase("tr-TR")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/ı/g, "i")
    .replace(/\s+/g, " ")
    .trim();
}
function parseOdd(value) {
  if (value === null || value === undefined || value === "") return null;
  if (typeof value === "boolean") return null;
  let n;
  if (typeof value === "number") {
    n = value;
  } else {
    let s = String(value).trim().replace(/\s/g, "");
    if (s.includes(",") && s.includes(".")) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else {
      s = s.replace(",", ".");
    }
    n = Number(s);
  }
  if (!Number.isFinite(n) || n <= 1) return null;
  return Math.round((n + Number.EPSILON) * 100) / 100;
}
function getOdd(match, key) {
  if (!match || typeof match !== "object") return null;
  const direct = [
    match.odds?.[key],
    match.openingOdds?.[key],
    match.opening_odds?.[key],
    match[key]
  ];
  for (const value of direct) {
    const odd = parseOdd(value);
    if (odd !== null) return odd;
  }
  const aliases = {
    iy1: ["iy1", "iy 1", "İY1", "İY 1"],
    iy2: ["iy2", "iy 2", "İY2", "İY 2"],
    iy15Ust: ["iy15Ust", "iy15ust", "iy 1,5 üst", "iy 1.5 üst", "İY 1,5 Üst"],
    ms1: ["ms1", "1"],
    ms2: ["ms2", "2"]
  };
  const maps = [match.marketOdds, match.openingOdds, match.opening_odds];
  for (const map of maps) {
    if (!map || typeof map !== "object" || Array.isArray(map)) continue;
    for (const [name, value] of Object.entries(map)) {
      if ((aliases[key] || []).some(alias => normalizeText(alias) === normalizeText(name))) {
        const odd = parseOdd(value);
        if (odd !== null) return odd;
      }
    }
  }
  return null;
}
function getDate(m) {
  return m?.date ?? m?.tarih ?? m?.Date ?? "";
}
function getTime(m) {
  return String(m?.time ?? m?.saat ?? m?.Time ?? "").trim();
}
function getHome(m) {
  return String(m?.home ?? m?.homeTeam ?? m?.home_team ?? m?.evSahibi ?? "").trim();
}
function getAway(m) {
  return String(m?.away ?? m?.awayTeam ?? m?.away_team ?? m?.deplasman ?? "").trim();
}
function getLeague(m) {
  return String(m?.league ?? m?.lig ?? m?.competition ?? "").trim();
}
function matchId(m) {
  return [dateKey(getDate(m)), getTime(m), normalizeText(getHome(m)), normalizeText(getAway(m))].join("|");
}
function parseScore(value) {
  if (value === null || value === undefined || value === "") return null;
  if (typeof value === "object") {
    const home = Number(value.home ?? value.homeScore);
    const away = Number(value.away ?? value.awayScore);
    if (Number.isInteger(home) && home >= 0 && Number.isInteger(away) && away >= 0) {
      return { home, away };
    }
    return null;
  }
  const m = String(value).trim().replace(/[–—:]/g, "-").match(/^(\d+)\s*-\s*(\d+)$/);
  return m ? { home: +m[1], away: +m[2] } : null;
}
function fullScore(m) {
  return parseScore(m?.score ?? m?.fullTimeScore ?? m?.full_score ?? m?.scoreMS);
}
function halfScore(m) {
  return parseScore(m?.halfTimeScore ?? m?.half_score ?? m?.scoreIY ?? m?.iyScore);
}
function marketResult(match, market) {
  const score = market.type.startsWith("half") ? halfScore(match) : fullScore(match);
  if (!score) return null;
  if (market.type === "halfHome") return score.home > score.away;
  if (market.type === "halfAway") return score.away > score.home;
  if (market.type === "halfOver15") return score.home + score.away >= 2;
  if (market.type === "fullHome") return score.home > score.away;
  if (market.type === "fullAway") return score.away > score.home;
  return null;
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
function setStatus(message, type = "") {
  $("status").textContent = message;
  $("status").className = "status" + (type ? " " + type : "");
}
function extractMatches(data) {
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== "object") throw new Error("V2 JSON biçimi geçersiz.");
  if (Array.isArray(data.matches)) return data.matches;
  for (const key of ["data", "rows", "results", "fixtures"]) {
    if (Array.isArray(data[key])) return data[key];
  }
  throw new Error("V2 JSON içinde maç listesi bulunamadı. Beklenen alan: matches.");
}
async function loadData() {
  if (loading) return;
  loading = true;
  $("refreshButton").disabled = true;
  setStatus("V2 verisi yükleniyor...");
  try {
    const response = await fetch(`${DATA_URL}?_=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`V2 JSON alınamadı: HTTP ${response.status}`);
    const data = await response.json();
    const rawMatches = extractMatches(data);
    const seen = new Set();
    allMatches = rawMatches.filter(m => {
      if (!m || typeof m !== "object" || !getDate(m) || !getHome(m) || !getAway(m)) return false;
      const id = matchId(m);
      if (seen.has(id)) return false;
      seen.add(id);
      return true;
    });
    $("totalCount").textContent = allMatches.length.toLocaleString("tr-TR");
    setStatus(`Veri yüklendi · Son güncelleme: ${data.updatedAt || "Belirtilmemiş"}`, "success");
    renderMatches();
  } catch (error) {
    console.error(error);
    allMatches = [];
    $("totalCount").textContent = "0";
    $("dayCount").textContent = "0";
    $("matchList").innerHTML = `<div class="empty">${escapeHtml(error.message)}<br>${escapeHtml(DATA_URL)} yolunu kontrol et.</div>`;
    setStatus("Veri yüklenemedi.", "error");
  } finally {
    loading = false;
    $("refreshButton").disabled = false;
  }
}
function renderMatches() {
  const selectedDate = $("matchDate").value;
  const dayMatches = allMatches
    .filter(m => dateKey(getDate(m)) === selectedDate)
    .sort((a, b) => getTime(a).localeCompare(getTime(b), "tr"));
  $("dayCount").textContent = dayMatches.length.toLocaleString("tr-TR");
  $("matchesTitle").textContent = `Günün maçları · ${formatDate(selectedDate)}`;
  if (!dayMatches.length) {
    $("matchList").innerHTML = `<div class="empty">Seçilen tarih için V2 verisinde maç bulunamadı.</div>`;
    return;
  }
  $("matchList").innerHTML = dayMatches.map((m, index) => {
    const id = matchId(m);
    const score = fullScore(m);
    const half = halfScore(m);
    const scoreText = score ? `${score.home}-${score.away}` : "VS";
    const oddsHtml = MARKETS.map(market => {
      const odd = getOdd(m, market.key);
      const selected = selectedMatchId === id && selectedMarketKey === market.key;
      return `
        <button type="button"
          class="odd-button ${selected ? "selected" : ""}"
          data-index="${index}"
          data-market="${market.key}"
          ${odd === null ? "disabled" : ""}>
          <span class="odd-label">${escapeHtml(market.label)}</span>
          <span class="odd-value">${odd === null ? "-" : odd.toFixed(2)}</span>
        </button>`;
    }).join("");
    const inlineHistory = selectedMatchId === id && selectedMarketKey
      ? renderHistoryHtml(m, selectedMarketKey)
      : "";
    return `
      <article class="match-card">
        <div class="match-meta">
          <span>${escapeHtml(getLeague(m) || "Lig yok")}</span>
          <span>${escapeHtml(getTime(m) || "Saat yok")}</span>
        </div>
        <div class="teams">
          <div class="team">${escapeHtml(getHome(m))}</div>
          <div class="score" title="İY ${half ? `${half.home}-${half.away}` : "-"}">${escapeHtml(scoreText)}</div>
          <div class="team away">${escapeHtml(getAway(m))}</div>
        </div>
        <div class="market-grid">${oddsHtml}</div>
        ${inlineHistory}
      </article>`;
  }).join("");
  $("matchList").querySelectorAll(".odd-button:not(:disabled)").forEach(button => {
    button.addEventListener("click", () => {
      const match = dayMatches[Number(button.dataset.index)];
      const marketKey = button.dataset.market;
      if (selectedMatchId === matchId(match) && selectedMarketKey === marketKey) {
        selectedMatchId = null;
        selectedMarketKey = null;
      } else {
        selectedMatchId = matchId(match);
        selectedMarketKey = marketKey;
      }
      // Kartın altındaki geçmişi aç/kapat; sayfa aşağıya kaydırılmaz.
      renderMatches();
    });
  });
}
function renderHistoryHtml(match, marketKey) {
  const market = MARKETS.find(item => item.key === marketKey);
  if (!market) return "";
  const targetOdd = getOdd(match, marketKey);
  if (targetOdd === null) return "";
  const targetDate = dateNumber(getDate(match));
  const history = allMatches
    .filter(item => {
      if (dateNumber(getDate(item)) >= targetDate) return false;
      const odd = getOdd(item, marketKey);
      return odd !== null && odd === targetOdd;
    })
    .sort((a, b) => {
      const difference = dateNumber(getDate(b)) - dateNumber(getDate(a));
      return difference || getTime(b).localeCompare(getTime(a), "tr");
    })
    .slice(0, 5);
  const rows = history.map(item => {
    const score = fullScore(item);
    const result = marketResult(item, market);
    let badgeClass = "pending";
    let badgeText = "Bekliyor";
    if (result === true) {
      badgeClass = "win";
      badgeText = "Başarılı";
    } else if (result === false) {
      badgeClass = "loss";
      badgeText = "Başarısız";
    }
    const scoreText = score ? `${score.home}-${score.away}` : "-";
    return `
      <div class="history-row">
        <span class="history-date">${escapeHtml(formatDate(getDate(item)))}</span>
        <span class="history-teams">${escapeHtml(getHome(item))} - ${escapeHtml(getAway(item))}</span>
        <span class="history-score">${escapeHtml(scoreText)}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>`;
  }).join("");
  return `
    <div class="history-inline">
      <div class="history-title">
        <strong>${escapeHtml(market.label)} · ${targetOdd.toFixed(2)}</strong>
        — ${history.length} geçmiş maç · ${escapeHtml(formatDate(getDate(match)))} öncesi
      </div>
      ${history.length ? rows : `<div class="history-title">Aynı oranla geçmiş maç bulunamadı.</div>`}
    </div>`;
}
$("matchDate").value = localDateString();
$("matchDate").addEventListener("change", () => {
  selectedMatchId = null;
  selectedMarketKey = null;
  renderMatches();
});
$("todayButton").addEventListener("click", () => {
  $("matchDate").value = localDateString();
  selectedMatchId = null;
  selectedMarketKey = null;
  renderMatches();
});
$("refreshButton").addEventListener("click", loadData);
loadData();
</script>
</body>
</html>
