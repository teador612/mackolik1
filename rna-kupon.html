
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="RNA otomatik futbol oran analizi ve kupon motoru">
  <title>RNA | Otomatik Kupon Motoru</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0d1a2b;
      --panel-2: #112238;
      --border: #263b55;
      --text: #edf4ff;
      --muted: #91a5bd;
      --blue: #60a5fa;
      --green: #22c55e;
      --yellow: #facc15;
      --red: #f87171;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #122742 0, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app-header {
      padding: 22px 16px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 17, 31, .92);
    }

    .header-inner {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      display: grid;
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      place-items: center;
      border: 1px solid #315b89;
      border-radius: 12px;
      background: #132d4a;
      color: #93c5fd;
      font-size: 19px;
      font-weight: 900;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 850;
      letter-spacing: -.5px;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .rules {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 16px;
    }

    .rule {
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1a2b;
      color: #c9d8ea;
      font-size: 11px;
    }

    .rule strong {
      color: #93c5fd;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 12px 40px;
    }

    /*
      RNA MOTORU
      rna.js kendi arayüzünü #coupon-root içine oluşturur.
      Eski HTML'deki ikinci kupon motoru burada bulunmamalıdır.
    */

    #coupon-root,
    #kupon-root,
    [data-coupon-root],
    #mk-coupon-root {
      width: 100%;
      min-width: 0;
      color: var(--text);
    }

    #mk-coupon-root {
      display: grid;
      gap: 14px;
    }

    #mk-coupon-root * {
      box-sizing: border-box;
    }

    #mk-coupon-root h1,
    #mk-coupon-root h2,
    #mk-coupon-root h3,
    #mk-coupon-root h4 {
      color: var(--text);
      line-height: 1.35;
    }

    #mk-coupon-root h1 {
      font-size: clamp(20px, 4vw, 26px);
    }

    #mk-coupon-root h2 {
      font-size: 18px;
    }

    #mk-coupon-root h3 {
      font-size: 15px;
    }

    #mk-coupon-root p {
      overflow-wrap: anywhere;
    }

    #mk-coupon-root section,
    #mk-coupon-root .card,
    #mk-coupon-root .panel,
    #mk-coupon-root .coupon-card,
    #mk-coupon-root .coupon,
    #mk-coupon-root .box,
    #mk-coupon-root .stat-card,
    #mk-coupon-root .summary-card {
      min-width: 0;
      border-color: var(--border);
      border-radius: var(--radius);
    }

    #mk-coupon-root .card,
    #mk-coupon-root .panel,
    #mk-coupon-root .coupon-card,
    #mk-coupon-root .coupon,
    #mk-coupon-root .box,
    #mk-coupon-root .stat-card,
    #mk-coupon-root .summary-card {
      background: var(--panel);
    }

    #mk-coupon-root button {
      min-height: 38px;
      max-width: 100%;
      padding: 8px 12px;
      border: 1px solid #34506f;
      border-radius: 9px;
      background: #16304d;
      color: var(--text);
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    #mk-coupon-root button:hover {
      border-color: var(--blue);
      background: #1a3b60;
    }

    #mk-coupon-root button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    #mk-coupon-root input,
    #mk-coupon-root select,
    #mk-coupon-root textarea {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      padding: 9px 11px;
      border: 1px solid #304761;
      border-radius: 9px;
      outline: none;
      background: #091525;
      color: var(--text);
    }

    #mk-coupon-root input:focus,
    #mk-coupon-root select:focus,
    #mk-coupon-root textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(96, 165, 250, .12);
    }

    #mk-coupon-root label {
      color: #c9d8ea;
    }

    #mk-coupon-root table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text);
      font-size: 12px;
    }

    #mk-coupon-root th,
    #mk-coupon-root td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    #mk-coupon-root th {
      background: #112238;
      color: #a9c8ed;
      font-weight: 750;
    }

    #mk-coupon-root tr:last-child td {
      border-bottom: 0;
    }

    #mk-coupon-root .success,
    #mk-coupon-root .won,
    #mk-coupon-root .win {
      color: var(--green);
    }

    #mk-coupon-root .pending,
    #mk-coupon-root .waiting {
      color: var(--yellow);
    }

    #mk-coupon-root .failure,
    #mk-coupon-root .lost,
    #mk-coupon-root .lose {
      color: var(--red);
    }

    #mk-coupon-root .muted,
    #mk-coupon-root .secondary {
      color: var(--muted);
    }

    .footer-note {
      margin-top: 18px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(13, 26, 43, .75);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .app-header {
        padding: 17px 12px 13px;
      }

      main {
        padding: 12px 9px 28px;
      }

      .rules {
        gap: 6px;
      }

      .rule {
        font-size: 10px;
      }

      #mk-coupon-root button {
        min-height: 40px;
      }

      #mk-coupon-root table {
        font-size: 11px;
      }

      #mk-coupon-root th,
      #mk-coupon-root td {
        padding: 7px 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">RNA</div>
        <div>
          <h1>Otomatik Kupon Motoru</h1>
          <p>Geçmiş oran analizi · Otomatik market taraması</p>
        </div>
      </div>

      <div class="rules">
        <span class="rule">Geçmiş: <strong>30 gün</strong></span>
        <span class="rule">Min. örnek: <strong>8</strong></span>
        <span class="rule">Min. başarı: <strong>%80</strong></span>
        <span class="rule">Min. tekli: <strong>1.35</strong></span>
        <span class="rule">Min. kupon: <strong>2.00</strong></span>
        <span class="rule">Maks. maç: <strong>5</strong></span>
      </div>
    </div>
  </header>

  <main>
    <!--
      RNA motorunun arayüzü bu kapsayıcıya eklenir.
      Eski HTML'deki dnaRunAnalysis(), dnaMatches ve ikinci
      kupon üretim kodu bu dosyada bulunmamalıdır.
    -->
    <div id="coupon-root"></div>

    <div class="footer-note">
      İstatistikler yüklenen geçmiş maç verilerine bağlıdır.
      Gelecek maçlar sonuçlanana kadar bekliyor olarak değerlendirilir.
    </div>
  </main>

  <script src="./rna.js"></script>
</body>
</html>
