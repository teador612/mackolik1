<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>DNA-RNA | Kupon Analizi</title>
<link rel="stylesheet" href="./style.css">

<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101d30;--panel2:#15243a;--border:#263953;--text:#edf4ff;--muted:#9aacc4;--blue:#5c9dff;--green:#28c785;--red:#ff6474;--yellow:#f6c453}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.dk-app{width:min(1120px,100%);margin:auto;padding:18px}
.dk-header,.dk-card-top,.dk-coupon-header,.dk-coupon-total{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.dk-header{margin-bottom:18px}.dk-brand{font-size:24px;font-weight:900;letter-spacing:1px}.dk-brand span{color:var(--blue)}
.dk-header a{color:var(--blue);text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px}
.dk-heading{margin:8px 0 5px;font-size:24px}.dk-description{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}
.dk-panel,.dk-stat,.dk-card{background:var(--panel);border:1px solid var(--border);border-radius:13px;min-width:0}
.dk-panel{padding:16px;margin-bottom:16px}.dk-panel-title{margin:0 0 14px;font-size:17px;font-weight:800}
.dk-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dk-field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.dk-field select,.dk-field input{width:100%;min-height:43px;padding:10px;color:var(--text);background:#091525;border:1px solid var(--border);border-radius:9px;font-size:14px}
.dk-buttons,.dk-card-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.dk-btn{min-height:42px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;color:var(--text);background:var(--panel2);font-size:13px;font-weight:700;cursor:pointer}
.dk-btn:disabled{opacity:.45;cursor:not-allowed}.dk-btn-primary{color:#07111f;background:var(--blue);border-color:var(--blue)}.dk-btn-green{color:#061a12;background:var(--green);border-color:var(--green)}
.dk-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.dk-stat{padding:13px}.dk-stat-label,.dk-number-label,.dk-total-label{color:var(--muted);font-size:11px;margin-bottom:7px}
.dk-stat-value{font-size:22px;font-weight:900;overflow-wrap:anywhere}.dk-stat-note{color:var(--muted);font-size:11px;margin-top:5px}
.dk-status{margin-bottom:14px;padding:12px;border:1px solid var(--border);border-radius:10px;color:var(--muted);background:#091525;font-size:13px;line-height:1.5}
.dk-status.dk-error{color:#ffb5bd;border-color:#743442}.dk-status.dk-ok{color:#9af0c8;border-color:#236b50}
.dk-list{display:grid;gap:10px}.dk-card{padding:14px}.dk-match-name{font-size:15px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}
.dk-meta{display:flex;flex-wrap:wrap;gap:7px 12px;color:var(--muted);font-size:11px;margin-top:7px}
.dk-market{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px;background:#1c3454;border:1px solid #31527b;color:#c8e0ff;border-radius:9px;font-weight:800;font-size:12px;flex-shrink:0}
.dk-numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
.dk-number{background:#091525;border:1px solid #20324b;border-radius:9px;padding:9px;min-width:0}
.dk-number-value{font-size:16px;font-weight:900;overflow-wrap:anywhere}.dk-rate-high{color:var(--green)}
.dk-status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:7px;padding:6px 8px;white-space:nowrap}
.dk-pending{color:var(--yellow);background:#3b3016}.dk-won{color:#8ef0bd;background:#123a2b}.dk-lost{color:#ff9da7;background:#481e2a}
.dk-empty{text-align:center;padding:25px 12px;color:var(--muted);border:1px dashed var(--border);border-radius:12px;line-height:1.7;font-size:13px}
.dk-coupon-header{margin-bottom:13px}.dk-coupon-header .dk-panel-title{margin:0}
.dk-coupon-total{padding:13px;margin-top:12px;background:#091525;border:1px solid var(--border);border-radius:10px}
.dk-total-value{font-size:23px;font-weight:900}.dk-total-good{color:var(--green)}.dk-total-low{color:var(--yellow)}
.dk-rules{color:var(--muted);font-size:12px;line-height:1.8;padding-left:18px;margin:0}
.dk-coupon-box{border:1px solid var(--border);border-radius:12px;padding:13px;background:#0b1829;margin-bottom:12px}
.dk-coupon-box:last-child{margin-bottom:0}.dk-coupon-box h3{margin:0;font-size:16px}.dk-coupon-box .dk-coupon-total{margin-bottom:12px}
.dk-footer{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 20px}
@media(max-width:650px){.dk-app{padding:12px}.dk-filters{grid-template-columns:1fr}.dk-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dk-heading{font-size:21px}.dk-panel,.dk-card{padding:12px}.dk-match-name{font-size:14px}.dk-numbers{gap:5px}.dk-number{padding:8px 6px}.dk-number-value{font-size:14px}}
</style>
</head>

<body>
<main class="dk-app">
<header class="dk-header">
  <div class="dk-brand">DNA<span>-RNA</span></div>
  <a href="./sonuc-analizi.html">← Sonuç Analizi</a>
</header>

<h1 class="dk-heading">Kupon Analizi</h1>
<p class="dk-description">
Geçmiş 30 günlük açılış oranlarını analiz eder. Seçilen sonuç grubuyla eşleşen geçmiş maçlarda bütün bahis türlerinin başarı oranları ayrı hesaplanır.
En az 8 örnek ve %80 başarı şartı aranır.
</p>

<section class="dk-panel">
<h2 class="dk-panel-title">Analiz Ayarları</h2>
<div class="dk-filters">
  <div class="dk-field">
    <label for="dkDate">Maç tarihi</label>
    <input type="date" id="dkDate">
  </div>
  <div class="dk-field">
    <label for="dkMarket">Geçmiş sonuç filtresi</label>
    <select id="dkMarket">
      <option value="ALL">Tüm sonuç türleri</option>
      <option value="MS1">MS1</option><option value="MSX">MSX</option><option value="MS2">MS2</option>
      <option value="IY1">İY1</option><option value="IYX">İYX</option><option value="IY2">İY2</option>
      <option value="KG_VAR">KG Var</option><option value="KG_YOK">KG Yok</option>
      <option value="IY_KG_VAR">İY KG Var</option><option value="IY_KG_YOK">İY KG Yok</option>
      <option value="IY15_ALT">İY 1.5 Alt</option><option value="IY15_UST">İY 1.5 Üst</option>
      <option value="15_ALT">1.5 Alt</option><option value="15_UST">1.5 Üst</option>
      <option value="25_UST">2.5 Üst</option>
    </select>
  </div>
</div>

<div class="dk-buttons">
  <button class="dk-btn dk-btn-primary" id="dkAnalyze">Analizi Çalıştır</button>
  <button class="dk-btn dk-btn-green" id="dkAuto">Otomatik Kuponları
