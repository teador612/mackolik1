
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>RNA | Otomatik Kupon</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0c1929;
      --panel2: #101f32;
      --border: #23354b;
      --text: #edf3fb;
      --muted: #93a5ba;
      --gold: #e6bc66;
      --gold2: #ffdf91;
      --green: #36d399;
      --red: #fb7185;
      --yellow: #facc15;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg) !important;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 16px 12px 36px;
      color: var(--text) !important;
      background:
        radial-gradient(ellipse at top, #142740 0%, transparent 48%),
        var(--bg) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif !important;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    #mk-coupon-root {
      display: block !important;
      width: 100% !important;
      max-width: 1100px !important;
      margin: 0 auto !important;
      padding: 0 !important;
      color: var(--text) !important;
      background: transparent !important;
      font-family: inherit !important;
    }

    #mk-coupon-root *,
    #mk-coupon-root *::before,
    #mk-coupon-root *::after {
      box-sizing: border-box;
    }

    #mk-coupon-root h1,
    #mk-coupon-root h2,
    #mk-coupon-root h3,
    #mk-coupon-root h4 {
      color: var(--text);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #mk-coupon-root button {
      min-height: 38px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      -webkit-tap-highlight-color: transparent;
    }

    #mk-coupon-root input,
    #mk-coupon-root select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      color: var(--text) !important;
      background: #081321 !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      outline: none;
    }

    #mk-coupon-root input:focus,
    #mk-coupon-root select:focus {
      border-color: var(--gold) !important;
      box-shadow: 0 0 0 3px #e6bc6618;
    }

    #mk-coupon-root button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    #mk-coupon-root [id="mk-coupon-content"] {
      min-width: 0;
    }

    #mk-coupon-root [id="mk-coupon-message"] {
      margin: 12px 0;
      padding: 12px 14px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #mk-coupon-root [id="mk-coupon-content"] > * {
      min-width: 0;
      max-width: 100%;
    }

    #mk-coupon-root section,
    #mk-coupon-root article {
      max-width: 100%;
    }

    #mk-coupon-root .mk-coupon-card,
    #mk-coupon-root .coupon-card,
    #mk-coupon-root [class*="coupon-card"] {
      overflow: hidden;
      color: var(--text) !important;
      background: linear-gradient(150deg, #102036, #0a1523 72%) !important;
      border: 1px solid var(--border) !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 30px #0002;
    }

    #mk-coupon-root [class*="match"],
    #mk-coupon-root [class*="pick"],
    #mk-coupon-root [class*="item"] {
      overflow-wrap: anywhere;
    }

    #mk-coupon-root [class*="odd"],
    #mk-coupon-root [class*="total"] {
      font-variant-numeric: tabular-nums;
    }

    #mk-coupon-root [class*="success"],
    #mk-coupon-root [class*="rate"] {
      font-variant-numeric: tabular-nums;
    }

    #mk-coupon-root [class*="won"],
    #mk-coupon-root [class*="success"] {
      color: var(--green);
    }

    #mk-coupon-root [class*="lost"],
    #mk-coupon-root [class*="fail"] {
      color: var(--red);
    }

    #mk-coupon-root [class*="pending"],
    #mk-coupon-root [class*="wait"] {
      color: var(--yellow);
    }

    #mk-coupon-root table {
      width: 100%;
      border-collapse: collapse;
    }

    #mk-coupon-root th,
    #mk-coupon-root td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      overflow-wrap: anywhere;
    }

    #mk-coupon-root th {
      color: var(--gold2);
      font-size: 12px;
    }

    #mk-coupon-root td {
      color: var(--text);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px 8px 28px;
      }

      #mk-coupon-root {
        width: 100% !important;
      }

      #mk-coupon-root button {
        max-width: 100%;
        white-space: normal;
      }

      #mk-coupon-root table {
        display: block;
        overflow-x: auto;
      }

      #mk-coupon-root th,
      #mk-coupon-root td {
        padding: 8px 6px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <!-- Kuponları doğrudan RNA motoru oluşturur. -->
  <script src="./rna.js"></script>
</body>
</html>
