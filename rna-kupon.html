<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="RNA futbol oran analizi ve otomatik kupon sistemi">
  <title>RNA | Akıllı Kupon Merkezi</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --text: #f3f6fc;
      --muted: #9aa9bd;
    }
    * {
      box-sizing: border-box;
    }
    html {
      min-height: 100%;
      background: var(--bg);
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding:
        max(14px, env(safe-area-inset-top))
        12px
        max(28px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at top, #142944 0%, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-wrap: anywhere;
    }
    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }
    #rna-load-status {
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #26364b;
      border-radius: 10px;
      background: #101b2c;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    #rna-load-status:empty {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <div id="rna-load-status" role="status" aria-live="polite">
      RNA sistemi yükleniyor…
    </div>
    <div id="mk-coupon-root"></div>
  </main>
  <script>
    window.addEventListener("error", function (event) {
      const status = document.getElementById("rna-load-status");
      if (status && event.message) {
        status.textContent = "JavaScript hatası: " + event.message;
      }
    });
    window.addEventListener("unhandledrejection", function (event) {
      const status = document.getElementById("rna-load-status");
      const reason = event.reason;
      const message = reason && reason.message
        ? reason.message
        : String(reason || "Bilinmeyen hata");
      if (status) {
        status.textContent = "Yükleme hatası: " + message;
      }
    });
  </script>
  <script
    src="./rnakupon.js"
    defer
    onload="document.getElementById('rna-load-status').textContent = ''"
    onerror="document.getElementById('rna-load-status').textContent = 'HATA: rnakupon.js yüklenemedi. Dosya adını ve yolunu kontrol et.'">
  </script>
</body>
</html>
