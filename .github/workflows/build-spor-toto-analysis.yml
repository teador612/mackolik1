
name: Oradan spor toto

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kütüphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn

      - name: Oran verilerini hazırla
        run: python scripts/build-spor-toto-analysis.py

      - name: Tahmin motorunu çalıştır
        run: python scripts/run-spor-toto-engine.py

      - name: Dosyaları kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spor-toto-analysis.json
          git add data/spor-toto-predictions.json
          git diff --cached --quiet || git commit -m "Spor Toto veri ve tahminlerini güncelle"
          git push
