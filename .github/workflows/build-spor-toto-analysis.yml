
name: Spor Toto Analiz Verisi Oluştur

on:
  workflow_dispatch:

  push:
    paths:
      - "data/v2-data.json"
      - "scripts/build-spor-toto-analysis.py"
      - ".github/workflows/build-spor-toto-analysis.yml"

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analiz verisini oluştur
        run: python scripts/build-spor-toto-analysis.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spor-toto-analysis.json
          git diff --cached --quiet || git commit -m "Spor Toto analiz verisini güncelle"
          git push
