name: Spor Toto veri güncelleme

on:
workflow_dispatch:
schedule:
- cron: “17 */6 * * *”

permissions:
contents: write

concurrency:
group: spor-toto-update
cancel-in-progress: false

jobs:
update:
runs-on: ubuntu-latest
steps:
- name: Depoyu indir
uses: actions/checkout@v4

  - name: Node.js kur
    uses: actions/setup-node@v4
    with:
      node-version: 20
  - name: Spor Toto verisini güncelle
    run: node scripts/update-spor-toto.mjs
  - name: Değişiklikleri kaydet
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add data/spor-toto-data.js
      if git diff --cached --quiet; then
        echo "Yeni değişiklik yok."
      else
        git commit -m "Spor Toto verilerini güncelle"
        git push
      fi
