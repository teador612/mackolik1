name: Spor Toto Update

on:
workflow_dispatch:
schedule:
- cron: “17 */6 * * *”

jobs:
update:
runs-on: ubuntu-latest
permissions:
contents: write
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: "20"
  - name: Update Spor Toto data
    run: node scripts/update-spor-toto.mjs
  - name: Commit data
    shell: bash
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add data/spor-toto-data.js
      if git diff --cached --quiet; then
        echo "Yeni değişiklik yok."
      else
        git commit -m "Update Spor Toto data"
        git push
      fi
