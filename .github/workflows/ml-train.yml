name: ML Model Training

on:
workflow_dispatch:
push:
paths:
- “scripts/train_ml.py”
- “requirements-ml.txt”
- “data/v2-data.json”
- “data/matches.json”
- “.github/workflows/ml-train.yml”
schedule:
- cron: “17 3 * * *”

permissions:
contents: write

jobs:
train:
runs-on: ubuntu-latest

steps:
  - name: Depoyu indir
    uses: actions/checkout@v4
  - name: Python kur
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
  - name: Kütüphaneleri kur
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements-ml.txt
  - name: Modeli eğit
    run: python scripts/train_ml.py
  - name: Model dosyalarını kaydet
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -f data/ml-model*
      git diff --cached --quiet || git commit -m "ML modelini güncelle"
      git push
