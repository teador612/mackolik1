name: ML Model Training

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: ml-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Veri dosyasını kontrol et
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/v2-data.json")
          if not path.exists():
              raise SystemExit("HATA: data/v2-data.json bulunamadı.")

          with path.open("r", encoding="utf-8-sig") as f:
              data = json.load(f)

          if isinstance(data, list):
              count = len(data)
          elif isinstance(data, dict):
              count = next(
                  (
                      len(data[k])
                      for k in ("matches", "data", "items", "results")
                      if isinstance(data.get(k), list)
                  ),
                  0,
              )
          else:
              count = 0

          if count == 0:
              raise SystemExit("HATA: v2-data.json içinde maç yok.")

          print(f"Kontrol başarılı. Maç kaydı: {count}")
          PY

      - name: Modelleri yükle veya eğit ve tahminleri üret
        run: python scripts/train_ml.py

      - name: Çıktıları kontrol et
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("outputs/ml-predictions.json"),
              Path("models/ml-models.joblib"),
              Path("models/ml-models-meta.json"),
          ]

          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f"HATA: çıktı eksik veya boş: {path}")
              print(f"OK: {path} ({path.stat().st_size} bayt)")

          with open("outputs/ml-predictions.json", encoding="utf-8") as f:
              output = json.load(f)

          print(f"Tahmin sayısı: {output.get('predictionCount', 0)}")
          print(f"Eğitim örneği: {output.get('trainingMatches', 0)}")
          print(f"Veri kaynağı: {output.get('source')}")

          if output.get("source") != "data/v2-data.json":
              raise SystemExit("HATA: Beklenmeyen veri kaynağı.")
          PY

      - name: Modelleri ve tahminleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add models/ml-models.joblib
          git add models/ml-models-meta.json
          git add outputs/ml-predictions.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "ML modellerini ve tahminleri güncelle"
            git push
          fi
