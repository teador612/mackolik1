name: ML Model Training

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Train model
        run: python scripts/train_ml.py

      - name: Verify prediction output
        run: |
          if [ ! -f outputs/ml-predictions.json ]; then
            echo "HATA: Tahmin dosyası oluşturulmadı."
            exit 1
          fi
          echo "Tahmin dosyası oluşturuldu."
          python -c "import json; d=json.load(open('outputs/ml-predictions.json', encoding='utf-8')); print('Eğitim maçları:', d.get('trainingMatches')); print('Tahmin sayısı:', d.get('predictionCount'))"

      - name: Save predictions to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ml-predictions.json
          if ! git diff --cached --quiet; then
            git commit -m "ML tahminlerini güncelle"
            git push
          else
            echo "Tahmin dosyasında değişiklik yok."
          fi
