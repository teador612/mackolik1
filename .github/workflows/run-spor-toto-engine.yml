
name: Spor Toto Tahmin Motoru

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */6 * * *"

  push:
    paths:
      - "data/spor-toto-analysis.json"
      - "scripts/run-spor-toto-engine.py"

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kütüphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn

      - name: Tahmin motorunu çalıştır
        run: python scripts/run-spor-toto-engine.py

      - name: Tahminleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spor-toto-predictions.json
          git diff --cached --quiet || git commit -m "Spor Toto tahminlerini güncelle"
          git push
