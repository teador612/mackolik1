
name: NBA Basketball System

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: nba-basketball-system
  cancel-in-progress: false

jobs:
  basketball:
    name: NBA Data, Predictions and ML Results
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy scikit-learn xgboost lightgbm catboost

      - name: Update NBA Data
        run: python basketbol/update_basketball_data.py

      - name: Run Existing Basketball Predictions
        run: python basketbol/predictions.py

      - name: Train ML Models and Generate Predictions
        run: python basketbol/ml_predictions.py

      - name: Evaluate ML Predictions and Update Performance
        run: python basketbol/ml_results.py

      - name: Update Match Results
        run: python basketbol/results.py

      - name: Update Basketball Analysis
        run: python basketbol/analysis.py

      - name: Validate JSON Files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("basketbol")

          files = [
              "data/basketball.json",
              "predictions.json",
              "ml-predictions.json",
              "ml-results.json",
              "results.json",
              "analysis.json"
          ]

          for filename in files:
              path = base / filename

              if not path.exists():
                  raise FileNotFoundError(
                      f"Dosya bulunamadı: {path}"
                  )

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"OK: {path}")

          print("Tüm JSON dosyaları geçerli.")
          PY

      - name: Commit Updated NBA Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add basketbol/

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "NBA: Update data, predictions and ML performance"
            git push
          fi
