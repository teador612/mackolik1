name: Spor Toto Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Spor Toto verisini çek
        run: node scripts/update-spor-toto.mjs

      - name: Değişiklikleri kaydet
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/spor-toto.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Spor Toto verilerini güncelle"
            git push
          fi
