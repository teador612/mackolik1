
name: AI V2 - MLP Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mlp-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python 3.12 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ML kütüphanelerini kur
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6
          pip install pandas==2.3.3
          pip install scikit-learn==1.7.2
          pip install xgboost==3.1.1
          pip install lightgbm==4.6.0
          pip install catboost==1.2.8

      - name: Girdi dosyalarını kontrol et
        run: |
          test -f data/v2-data.json
          test -f data/ai-v2-report.json
          test -f scripts/generate_ai_v2.py
          test -f scripts/test_ai_v2_mlp.py

      - name: MLP deneyini çalıştır
        run: |
          python scripts/test_ai_v2_mlp.py

      - name: MLP raporunu kontrol et
        run: |
          test -s data/ai-v2-mlp-report.json
          python -m json.tool data/ai-v2-mlp-report.json > /dev/null

      - name: MLP raporunu indirilebilir olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: ai-v2-mlp-report
          path: data/ai-v2-mlp-report.json
          if-no-files-found: error
          retention-days: 30
