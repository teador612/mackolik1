
name: GitHub Pages Otomatik Yayın

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: GitHub Pages ayarlarını yapılandır
        uses: actions/configure-pages@v5

      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
