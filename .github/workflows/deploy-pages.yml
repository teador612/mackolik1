name: GitHub Pages yayınlama

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Pages ayarını hazırla
        uses: actions/configure-pages@v5
      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css _site/
          cp data/matches.json _site/data/
      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
