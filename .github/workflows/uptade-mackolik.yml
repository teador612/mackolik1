name: Mackolik skor güncelleme

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  repository_dispatch:
    types:
      - run-script

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Futbol skorlarını güncelle
      - name: Mackolik futbol verilerini güncelle
        run: node scripts/update-mackolik.mjs

      # Basketbol verilerini güncelle
      - name: Mackolik basketbol verilerini güncelle
        run: node scripts/update-basketball.mjs

      # Değişiklikleri kaydet
      - name: Verileri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json data/basketball.json

          if git diff --cached --quiet; then
            echo "Yeni veri değişikliği yok."
          else
            git commit -m "Mackolik futbol ve basketbol verilerini güncelle"
            git push
          fi

      # GitHub Pages için site klasörü
      - name: Pages klasörünü hazırla
        run: |
          rm -rf _site
          mkdir -p _site

          # Ana site dosyaları
          cp -r ./*.html _site/ 2>/dev/null || true
          cp -r ./*.js _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r js _site/ 2>/dev/null || true

          # Veri klasörleri
          mkdir -p _site/data
          cp -r data/* _site/data/

          # Script klasörü Pages'e gerekmez
          rm -rf _site/scripts

          echo "Pages dosyaları:"
          find _site -maxdepth 2 -type f | sort

      - name: Pages artifact oluştur
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
