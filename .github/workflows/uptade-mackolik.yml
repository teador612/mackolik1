name: Mackolik skor güncelleme

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  repository_dispatch:
    types:
      - run-script

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ================================
      # REPO
      # ================================
      - name: 📥 Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================================
      # NODE
      # ================================
      - name: 🟢 Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ================================
      # FUTBOL + BASKETBOL VERİLERİ
      # ================================
      - name: ⚽🏀 Verileri güncelle
        run: |
          node scripts/update-mackolik.mjs

      # ================================
      # DEĞİŞİKLİK VAR MI?
      # ================================
      - name: 🔎 Değişiklik kontrolü
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Değişiklik yok."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Değişiklik bulundu."
          fi

      # ================================
      # COMMIT
      # ================================
      - name: 💾 Değişiklikleri commit et
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Mackolik futbol ve basketbol verilerini güncelle"

      # ================================
      # REMOTE SENKRONİZASYON
      # ================================
      - name: 🔄 GitHub ile senkronize et
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin main

          git rebase origin/main

      # ================================
      # PUSH
      # ================================
      - name: 🚀 GitHub'a gönder
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      # ================================
      # PAGES DEPLOY
      # ================================
      - name: 📦 GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 🌐 GitHub Pages yayınla
        uses: actions/deploy-pages@v4
