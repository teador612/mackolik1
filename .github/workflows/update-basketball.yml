name: Basketbol veri güncelleme

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basketball-update
  cancel-in-progress: true

jobs:
  update-basketball:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Basketbol verilerini güncelle
        run: node scripts/update-basketball.mjs

      - name: Değişiklik var mı kontrol et
        id: changes
        run: |
          if git diff --quiet -- data/basketball.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Değişiklikleri kaydet
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/basketball.json
          git commit -m "Basketbol verilerini güncelle"
          git push

      - name: Değişiklik yok
        if: steps.changes.outputs.changed == 'false'
        run: echo "Yeni basketbol verisi yok."
