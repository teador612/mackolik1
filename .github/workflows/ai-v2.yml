
name: AI V2 Model Training

on:
  workflow_dispatch:

  push:
    paths:
      - "input/acilis.xlsx"
      - "scripts/generate_ai_v2.py"
      - ".github/workflows/ai-v2.yml"

permissions:
  contents: write

concurrency:
  group: ai-v2-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: ML kütüphanelerini kur
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.2.6
          pip install pandas==2.3.3
          pip install scikit-learn==1.7.2
          pip install xgboost==3.1.1
          pip install lightgbm==4.6.0
          pip install catboost==1.2.8

      - name: Kütüphaneleri kontrol et
        run: |
          python -c "import numpy, pandas, sklearn, xgboost, lightgbm, catboost; print('AI V2 kütüphaneleri hazır.')"

      - name: Excel verisini hazırla
        run: python scripts/update_v2.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: V2 modellerini eğit ve tahmin üret
        run: python scripts/generate_ai_v2.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: V2 dosyalarını kontrol et
        run: |
          test -s data/v2-data.json
          test -s data/ai-v2-report.json
          test -s data/ai-v2-predictions.json

          echo "AI V2 dosyaları hazır."

          ls -lh \
            data/ai-v2-report.json \
            data/ai-v2-predictions.json

      - name: V2 sonuçlarını GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ai-v2-report.json
          git add data/ai-v2-predictions.json

          if git diff --cached --quiet; then
            echo "Yeni V2 değişikliği yok."
          else
            git commit -m "AI V2 tahminleri ve eğitim raporu güncellendi"
            git push
          fi
