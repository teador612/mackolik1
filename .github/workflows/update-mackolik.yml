name: Mackolik skor güncelleme

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions UTC kullanır.
    # Her 15 dakikada bir çalışır.
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node sürümünü kontrol et
        run: node --version

      - name: Skorları ve yeni maçları güncelle
        run: node scripts/update-mackolik.mjs

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json

          if git diff --cached --quiet; then
            echo "Yeni değişiklik yok."
          else
            git commit -m "Güncel Mackolik skorları"
            git push
          fi
