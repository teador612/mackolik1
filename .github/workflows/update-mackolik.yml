name: Mackolik skor güncelleme

on:
  repository_dispatch:
    types: [run-script]

  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mackolik-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skorları, yeni maçları ve analizi güncelle
        run: node scripts/update-mackolik.mjs

      - name: Değişiklikleri repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json
          git add data/analysis.json

          if git diff --cached --quiet; then
            echo "Yeni değişiklik yok."
          else
            git commit -m "Güncel Mackolik skorları ve analiz"
            git push
          fi

      - name: Pages ayarını hazırla
        uses: actions/configure-pages@v5

      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site/data

          cp index.html _site/
          cp skor.html _site/
          cp app.js _site/
          cp style.css _site/

          cp data/matches.json _site/data/
          cp data/analysis.json _site/data/

      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
