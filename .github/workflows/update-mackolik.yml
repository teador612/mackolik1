name: Mackolik skor güncelleme ve Yayınlama

on:
  workflow_dispatch:
  schedule:
    # Her 15 dakikada bir çalışır
    - cron: '*/15 * * * *'

on:
  repository_dispatch:
    types: [run-script]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skorları ve yeni maçları güncelle
        run: node scripts/update-mackolik.mjs

      - name: Değişiklikleri repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json

          if git diff --cached --quiet; then
            echo "Yeni skor değişikliği yok."
          else
            git commit -m "Güncel Mackolik skorları"
            git push
          fi

      - name: Pages ayarını hazırla
        uses: actions/configure-pages@v5

      - name: Site dosyalarını hazırla
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css _site/
          cp data/matches.json _site/data/

      - name: Site dosyalarını paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
