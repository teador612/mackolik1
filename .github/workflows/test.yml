
name: Mackolik erişim testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Mackolik sayfasına erişimi kontrol et
        run: |
          curl -sS -L -o /dev/null \
            -w "HTTP: %{http_code}\n" \
            --max-time 20 \
            "https://arsiv.mackolik.com/Genis-Iddaa-Programi"
