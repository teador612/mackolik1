name: Spor Toto Program Güncelleme

on:
workflow_dispatch:
schedule:
- cron: “17 */6 * * *”

permissions:
contents: write

concurrency:
group: spor-toto-program
cancel-in-progress: false

jobs:
update:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Depoyu indir
    uses: actions/checkout@v4
  - name: Python kur
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
  - name: Güncel Spor Toto programını bul
    shell: bash
    run: |
      python - <<'PY'
      import json
      import os
      import re
      import time
      import urllib.request
      import urllib.error
      from concurrent.futures import ThreadPoolExecutor, as_completed
      from datetime import datetime, timezone
      API = "https://webapi.sportoto.gov.tr/api/GameMatch/GetGameMatches/"
      OUTPUT = "data/spor-toto.json"
      HEADERS = {
          "User-Agent": "Mozilla/5.0 (compatible; SporTotoUpdater/1.0)",
          "Accept": "application/json, text/plain, */*",
          "Origin": "https://www.sportoto.gov.tr",
          "Referer": "https://www.sportoto.gov.tr/"
      }
      def request_round(round_id):
          url = API + "?gameRoundId=" + str(round_id)
          req = urllib.request.Request(url, headers=HEADERS)
          try:
              with urllib.request.urlopen(req, timeout=12) as response:
                  if response.status != 200:
                      return round_id, None
                  raw = response.read().decode("utf-8-sig")
                  if not raw.strip():
                      return round_id, None
                  return round_id, json.loads(raw)
          except Exception:
              return round_id, None
      def norm(value):
          if value is None:
              return ""
          if isinstance(value, (int, float)):
              return str(value)
          if isinstance(value, str):
              return value.strip()
          if isinstance(value, dict):
              for key in (
                  "name", "teamName", "team_name", "title",
                  "description", "value", "Name", "TeamName"
              ):
                  if value.get(key) not in (None, ""):
                      return norm(value[key])
          return ""
      def first(obj, keys):
          if not isinstance(obj, dict):
              return None
          lower = {str(k).lower(): v for k, v in obj.items()}
          for key in keys:
              value = lower.get(key.lower())
              if value not in (None, ""):
                  return value
          return None
      HOME_KEYS = [
          "homeTeamName", "homeTeam", "home", "homeTeamTitle",
          "hostTeam", "team1", "teamA", "localTeam",
          "HomeTeamName", "HomeTeam"
      ]
      AWAY_KEYS = [
          "awayTeamName", "awayTeam", "away", "awayTeamTitle",
          "guestTeam", "team2", "teamB", "visitorTeam",
          "AwayTeamName", "AwayTeam"
      ]
      MATCH_ID_KEYS = [
          "gameMatchId", "matchId", "id", "gameId", "fixtureId"
      ]
      DATE_KEYS = [
          "matchDate", "date", "dateTime", "matchDateTime",
          "startDate", "fixtureDate"
      ]
      WEEK_KEYS = [
          "gameRoundId", "roundId", "gameRound", "weekId"
      ]
      def get_team(obj, keys):
          value = first(obj, keys)
          return norm(value)
      def walk_lists(node):
          if isinstance(node, list):
              yield node
              for item in node:
                  yield from walk_lists(item)
          elif isinstance(node, dict):
              for value in node.values():
                  yield from walk_lists(value)
      def parse_matches(payload, round_id):
          if payload is None:
              return None
          candidates = []
          for items in walk_lists(payload):
              parsed = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  home = get_team(item, HOME_KEYS)
                  away = get_team(item, AWAY_KEYS)
                  # Bazı API yanıtlarında takım isimleri alt nesnelerde olabilir.
                  if not home or not away:
                      continue
                  if home.lower() == away.lower():
                      continue
                  match_id = first(item, MATCH_ID_KEYS)
                  match_date = first(item, DATE_KEYS)
                  parsed.append({
                      "id": str(match_id) if match_id is not None else "",
                      "no": len(parsed) + 1,
                      "home": home,
                      "away": away,
                      "date": str(match_date) if match_date is not None else "",
                      "roundId": round_id
                  })
              if len(parsed) == 15:
                  candidates.append(parsed)
          if not candidates:
              return None
          # Aynı liste birden fazla iç içe seviyede bulunabilir.
          # İlk geçerli 15 maçlık listeyi kullan.
          matches = candidates[0]
          ids = [m["id"] for m in matches if m["id"]]
          if len(ids) != len(set(ids)):
              return None
          for index, match in enumerate(matches, start=1):
              match["no"] = index
          return matches
      # Önceki JSON varsa hata durumunda koru.
      os.makedirs(os.path.dirname(OUTPUT), exist_ok=True)
      # Spor Toto round ID'leri ile Mackolik hafta numaraları aynı
      # olmak zorunda değildir. Bu nedenle round ID ayrı taranır.
      #
      # Yükü azaltmak için ID aralığı partiler halinde taranır.
      # Daha yüksek ID'li 15 maçlık liste bulunursa sonraki partilere
      # geçilmez.
      found = None
      checked = 0
      max_id = 3000
      batch_size = 100
      workers = 12
      print("Resmî Spor Toto API'si taranıyor:", API)
      for batch_end in range(max_id, 0, -batch_size):
          batch_start = max(1, batch_end - batch_size + 1)
          ids = list(range(batch_end, batch_start - 1, -1))
          with ThreadPoolExecutor(max_workers=workers) as pool:
              futures = [pool.submit(request_round, rid) for rid in ids]
              results = []
              for future in as_completed(futures):
                  rid, payload = future.result()
                  checked += 1
                  if payload is not None:
                      matches = parse_matches(payload, rid)
                      if matches:
                          results.append((rid, matches))
          if results:
              # Bu partideki en yüksek ID'yi seç.
              rid, matches = max(results, key=lambda item: item[0])
              found = (rid, matches)
              print(f"15 maç bulundu. Round ID: {rid}")
              break
          if checked % 500 == 0:
              print(f"Kontrol edilen round ID sayısı: {checked}")
      if not found:
          print("HATA: API yanıtlarından doğrulanabilir 15 maçlık liste bulunamadı.")
          print("Mevcut JSON dosyası korunuyor; tahmini program yazılmadı.")
          raise SystemExit(1)
      round_id, matches = found
      output = {
          "source": API,
          "updatedAt": datetime.now(timezone.utc).isoformat(),
          "roundId": round_id,
          "week": round_id,
          "matchCount": len(matches),
          "matches": matches
      }
      if len(output["matches"]) != 15:
          print("HATA: Maç sayısı 15 değil. Dosya güncellenmedi.")
          raise SystemExit(1)
      temp = OUTPUT + ".tmp"
      with open(temp, "w", encoding="utf-8") as f:
          json.dump(output, f, ensure_ascii=False, indent=2)
          f.write("\n")
      os.replace(temp, OUTPUT)
      print(f"{OUTPUT} güncellendi.")
      print(f"Round ID: {round_id}; maç sayısı: {len(matches)}")
      for match in matches:
          print(f'{match["no"]:02d}. {match["home"]} - {match["away"]}')
      PY
  - name: Değişiklikleri kaydet
    shell: bash
    run: |
      git add data/spor-toto.json
      if git diff --cached --quiet; then
        echo "Yeni bir program değişikliği yok."
      else
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Spor Toto programını güncelle"
        git push
      fi
