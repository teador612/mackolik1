name: Spor Toto Program Güncelleme

on:
workflow_dispatch:
schedule:
- cron: “17 */6 * * *”

permissions:
contents: write

concurrency:
group: spor-toto-program
cancel-in-progress: false

jobs:
update:
runs-on: ubuntu-latest
timeout-minutes: 15

steps:
  - name: Depoyu indir
    uses: actions/checkout@v4
  - name: Python kur
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
  - name: Resmi Spor Toto programini indir
    shell: bash
    run: |
      python - <<'PY'
      import concurrent.futures
      import json
      import os
      import urllib.request
      from datetime import datetime, timezone, timedelta
      API = "https://webapi.sportoto.gov.tr/api/GameMatch/GetGameMatches/?gameRoundId="
      OUTPUT = "data/spor-toto.json"
      HEADERS = {
          "User-Agent": "Mozilla/5.0",
          "Accept": "application/json, text/plain, */*",
          "Referer": "https://www.sportoto.gov.tr/spor-toto-listeler"
      }
      def get(obj, key, default=None):
          if not isinstance(obj, dict):
              return default
          for k, v in obj.items():
              if str(k).lower() == key.lower():
                  return v
          return default
      def parse_date(value):
          if not value:
              return None
          try:
              result = datetime.fromisoformat(
                  str(value).replace("Z", "+00:00")
              )
              if result.tzinfo is None:
                  result = result.replace(tzinfo=timezone.utc)
              return result.astimezone(timezone.utc)
          except (ValueError, TypeError):
              return None
      def download_round(round_id):
          req = urllib.request.Request(
              API + str(round_id),
              headers=HEADERS
          )
          try:
              with urllib.request.urlopen(req, timeout=12) as response:
                  if response.status != 200:
                      return None
                  payload = json.loads(
                      response.read().decode("utf-8-sig")
                  )
              items = get(payload, "object")
              if not isinstance(items, list) or len(items) != 15:
                  return None
              matches = []
              dates = []
              unfinished = 0
              round_name = ""
              for index, item in enumerate(items, 1):
                  match = get(item, "match")
                  if not isinstance(match, dict):
                      return None
                  home_obj = get(match, "homeTeam")
                  away_obj = get(match, "awayTeam")
                  home = get(home_obj, "name")
                  away = get(away_obj, "name")
                  if not isinstance(home, str) or not home.strip():
                      return None
                  if not isinstance(away, str) or not away.strip():
                      return None
                  date_value = get(match, "date")
                  parsed_date = parse_date(date_value)
                  if parsed_date:
                      dates.append(parsed_date)
                  result = get(match, "fullTimeWin")
                  if result not in (0, 1, 2):
                      unfinished += 1
                  if not round_name:
                      round_name = get(item, "gameRoundName", "") or ""
                  matches.append({
                      "no": index,
                      "id": get(match, "externalMatchId"),
                      "home": home.strip(),
                      "away": away.strip(),
                      "homeTeam": home.strip(),
                      "awayTeam": away.strip(),
                      "date": date_value,
                      "result": (
                          "1" if result == 1 else
                          "X" if result == 0 else
                          "2" if result == 2 else None
                      )
                  })
              if len(matches) != 15 or unfinished == 0:
                  return None
              now = datetime.now(timezone.utc)
              if dates and max(dates) < now - timedelta(hours=6):
                  return None
              return {
                  "roundId": round_id,
                  "roundName": round_name,
                  "matches": matches,
                  "startDate": min(dates) if dates else None,
                  "endDate": max(dates) if dates else None
              }
          except Exception as exc:
              print(f"Round {round_id}: {type(exc).__name__}")
              return None
      print("Spor Toto resmi API'si kontrol ediliyor.")
      candidates = []
      with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
          futures = [
              pool.submit(download_round, rid)
              for rid in range(1300, 1801)
          ]
          for future in concurrent.futures.as_completed(futures):
              candidate = future.result()
              if candidate:
                  candidates.append(candidate)
                  print(
                      f"Uygun program: Round {candidate['roundId']}, "
                      f"{len(candidate['matches'])} mac"
                  )
      if not candidates:
          print("HATA: Gecerli 15 maclik program bulunamadi.")
          print("Mevcut JSON dosyasi degistirilmedi.")
          raise SystemExit(1)
      dated = [x for x in candidates if x["startDate"]]
      if dated:
          selected = min(
              dated,
              key=lambda x: (x["startDate"], x["roundId"])
          )
      else:
          selected = max(candidates, key=lambda x: x["roundId"])
      output = {
          "source": API,
          "updatedAt": datetime.now(timezone.utc).isoformat(),
          "week": selected["roundId"],
          "roundId": selected["roundId"],
          "roundName": selected["roundName"],
          "matchCount": 15,
          "matches": selected["matches"]
      }
      os.makedirs(os.path.dirname(OUTPUT), exist_ok=True)
      temp = OUTPUT + ".tmp"
      with open(temp, "w", encoding="utf-8") as file:
          json.dump(output, file, ensure_ascii=False, indent=2)
          file.write("\n")
      os.replace(temp, OUTPUT)
      print(f"{OUTPUT} olusturuldu.")
      print(f"Hafta: {selected['roundId']}")
      print("Mac sayisi: 15")
      for match in selected["matches"]:
          print(
              f"{match['no']:02d}. "
              f"{match['home']} - {match['away']}"
          )
      PY
  - name: JSON dosyasini kaydet
    run: |
      git add data/spor-toto.json
      if git diff --cached --quiet; then
        echo "Program degismedi."
      else
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Spor Toto programini guncelle"
        git push
      fi
      
