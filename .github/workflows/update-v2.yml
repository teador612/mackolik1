name: V2 Excel → JSON
on:
  push:
    paths:
      - "input/acilis.xlsx"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v2-excel-json-main
  cancel-in-progress: false
jobs:
  update-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'i al
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
      - name: Güncel main dalını al
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Excel → JSON
        run: |
          python scripts/update_v2.py
      - name: JSON değiştiyse commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v2-data.json
          if git diff --cached --quiet; then
            echo "JSON değişmedi."
            exit 0
          fi
          git commit -m "V2 verisini güncelle"
          git push origin HEAD:main
