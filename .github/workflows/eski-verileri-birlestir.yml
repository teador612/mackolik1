name: Eski Verileri Matches JSON'a Aktar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-old-data:
    runs-on: ubuntu-latest

    steps:
      - name: Mackolik1 reposunu indir
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Eski data.js ve mevcut matches.json birleştir
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const crypto = require('crypto');

          const CUTOFF = '2026-10-02';

          const DATA_URL =
            'https://raw.githubusercontent.com/teador612/oran-analiz/main/data.js';

          const MATCHES_PATH =
            'data/matches.json';

          function download(url) {
            return new Promise((resolve, reject) => {
              https.get(url, res => {

                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return download(res.headers.location).then(resolve).catch(reject);
                }

                if (res.statusCode !== 200) {
                  reject(new Error(`HTTP ${res.statusCode}: ${url}`));
                  return;
                }

                let data = '';

                res.setEncoding('utf8');

                res.on('data', chunk => {
                  data += chunk;
                });

                res.on('end', () => resolve(data));

              }).on('error', reject);
            });
          }

          function clean(value) {
            return String(value ?? '').trim();
          }

          function dateISO(value) {
            if (!value) return '';

            const s = String(value).trim();

            // YYYY-MM-DD
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
              return s;
            }

            // DD.MM.YYYY
            const m = s.match(
              /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/
            );

            if (!m) return '';

            return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
          }

          function dateTR(value) {
            const iso = dateISO(value);

            if (!iso) return '';

            const [y, m, d] = iso.split('-');

            return `${d}.${m}.${y}`;
          }

          function numberOdd(value) {
            if (
              value === null ||
              value === undefined ||
              value === ''
            ) {
              return null;
            }

            const n = Number(
              String(value)
                .trim()
                .replace(/\s/g, '')
                .replace(',', '.')
            );

            if (!Number.isFinite(n) || n <= 0) {
              return null;
            }

            return n;
          }

          function parseScore(value) {
            const s = clean(value);

            const m = s.match(
              /^(\d+)\s*[-:]\s*(\d+)$/
            );

            if (!m) {
              return {
                home: '',
                away: ''
              };
            }

            return {
              home: m[1],
              away: m[2]
            };
          }

          function makeKey(match) {
            return [
              dateISO(match.date),
              clean(match.time),
              clean(match.home).toUpperCase(),
              clean(match.away).toUpperCase()
            ].join('|');
          }

          function makeCode(match, index) {
            const key = makeKey(match);

            const hash = crypto
              .createHash('sha1')
              .update(key)
              .digest('hex')
              .slice(0, 12);

            return `OLD-${hash}`;
          }

          function addOdd(target, source, odds) {
            const value = numberOdd(odds?.[source]);

            if (value !== null) {
              target[target.__target] = value;
            }
          }

          function convertOldMatch(old, index) {

            const odds = old.odds || {};

            const score = parseScore(old.scoreFT);
            const half = parseScore(old.scoreHT);

            const openingOdds = {};

            function put(target, source) {
              const value = numberOdd(odds[source]);

              if (value !== null) {
                openingOdds[target] = value;
              }
            }

            // MS
            put('ms1', 'ms1');
            put('msX', 'ms0');
            put('ms2', 'ms2');

            // KG
            put('kgVar', 'kgVar');
            put('kgYok', 'kgYok');

            // 1.5
            put('au15Ust', 'over15');
            put('au15Alt', 'under15');

            // 2.5
            put('au25Ust', 'over25');
            put('au25Alt', 'under25');

            // 3.5
            put('au35Ust', 'over35');
            put('au35Alt', 'under35');

            // İlk yarı MS
            put('iy1', 'iy1');
            put('iyX', 'iy0');
            put('iy2', 'iy2');

            // İlk yarı 1.5
            put('iy15Ust', 'iyOver15');
            put('iy15Alt', 'iyUnder15');

            const iso = dateISO(old.date);

            return {
              code: makeCode(old, index),
              week: '',
              date: dateTR(old.date),
              time: clean(old.time),
              league: clean(old.league),
              home: clean(old.home),
              away: clean(old.away),
              mbs: 0,

              status: old.played ? 4 : 0,

              score: {
                home: score.home,
                away: score.away
              },

              halfTimeScore: {
                home: half.home,
                away: half.away
              },

              openingOdds,

              openingRecordedAt:
                iso
                  ? `${iso}T00:00:00.000Z`
                  : null
            };
          }

          function extractOldData(text) {

            const marker = 'window.ORAN_DATA';

            const start = text.indexOf(marker);

            if (start === -1) {
              throw new Error(
                'window.ORAN_DATA bulunamadı.'
              );
            }

            const eq = text.indexOf('=', start);

            if (eq === -1) {
              throw new Error(
                'ORAN_DATA = bulunamadı.'
              );
            }

            const firstBracket = text.indexOf('[', eq);

            const lastBracket = text.lastIndexOf(']');

            if (
              firstBracket === -1 ||
              lastBracket === -1 ||
              lastBracket <= firstBracket
            ) {
              throw new Error(
                'ORAN_DATA dizisi bulunamadı.'
              );
            }

            const jsonText =
              text.slice(
                firstBracket,
                lastBracket + 1
              );

            return JSON.parse(jsonText);
          }

          function normalizeCurrentMatch(match) {

            return {
              ...match,

              openingOdds:
                match.openingOdds || {},

              score:
                match.score || {
                  home: '',
                  away: ''
                },

              halfTimeScore:
                match.halfTimeScore || {
                  home: '',
                  away: ''
                }
            };
          }

          async function main() {

            console.log('================================');
            console.log('ESKİ VERİ AKTARIMI BAŞLIYOR');
            console.log('================================');

            console.log('Eski data.js indiriliyor...');

            const oldText =
              await download(DATA_URL);

            console.log(
              `data.js boyutu: ${(Buffer.byteLength(oldText) / 1024 / 1024).toFixed(2)} MB`
            );

            console.log('ORAN_DATA okunuyor...');

            const oldData =
              extractOldData(oldText);

            console.log(
              `Eski toplam kayıt: ${oldData.length}`
            );

            console.log('Mevcut matches.json okunuyor...');

            const currentJSON =
              JSON.parse(
                fs.readFileSync(
                  MATCHES_PATH,
                  'utf8'
                )
              );

            const currentMatches =
              Array.isArray(currentJSON)
                ? currentJSON
                : currentJSON.matches;

            if (!Array.isArray(currentMatches)) {
              throw new Error(
                'matches.json içinde matches dizisi bulunamadı.'
              );
            }

            console.log(
              `Mevcut matches kayıtları: ${currentMatches.length}`
            );

            /*
             * ==========================================
             * ESKİ DATA.JS
             * 02.10.2026 DAHİL
             * ==========================================
             */

            const oldConverted = [];

            for (let i = 0; i < oldData.length; i++) {

              const old = oldData[i];

              if (
                !old ||
                !old.date ||
                !old.home ||
                !old.away
              ) {
                continue;
              }

              const iso = dateISO(old.date);

              if (!iso) {
                continue;
              }

              if (iso <= CUTOFF) {

                oldConverted.push(
                  convertOldMatch(old, i)
                );
              }
            }

            console.log(
              `02.10.2026 dahil eski kayıt: ${oldConverted.length}`
            );

            /*
             * ==========================================
             * MEVCUT MATCHES.JSON
             * 03.10.2026 VE SONRASI
             * ==========================================
             */

            const newMatches = [];

            for (const match of currentMatches) {

              const iso = dateISO(match.date);

              if (!iso) {
                continue;
              }

              if (iso > CUTOFF) {

                newMatches.push(
                  normalizeCurrentMatch(match)
                );
              }
            }

            console.log(
              `03.10.2026 sonrası yeni kayıt: ${newMatches.length}`
            );

            /*
             * ==========================================
             * BİRLEŞTİR
             * ==========================================
             */

            const map = new Map();

            /*
             * Önce eski kayıtlar
             */

            for (const match of oldConverted) {

              const key = makeKey(match);

              if (!key) continue;

              map.set(key, match);
            }

            /*
             * Sonra yeni kayıtlar
             */

            for (const match of newMatches) {

              const key = makeKey(match);

              if (!key) continue;

              map.set(key, match);
            }

            let finalMatches =
              Array.from(map.values());

            /*
             * Tarih + saat sıralaması
             */

            finalMatches.sort((a, b) => {

              const da = dateISO(a.date);
              const db = dateISO(b.date);

              if (da !== db) {
                return da.localeCompare(db);
              }

              return clean(a.time)
                .localeCompare(clean(b.time));
            });

            /*
             * ==========================================
             * YENİ MATCHES.JSON
             * ==========================================
             */

            const output = {

              source:
                currentJSON.source ||
                'https://arsiv.mackolik.com/Genis-Iddaa-Programi',

              week:
                currentJSON.week || '',

              updatedAt:
                new Date().toISOString(),

              matches:
                finalMatches
            };

            fs.writeFileSync(
              MATCHES_PATH,
              JSON.stringify(
                output,
                null,
                2
              ) + '\n',
              'utf8'
            );

            console.log('================================');
            console.log('İŞLEM TAMAMLANDI');
            console.log('================================');

            console.log(
              `Eski data.js: ${oldConverted.length}`
            );

            console.log(
              `Yeni matches: ${newMatches.length}`
            );

            console.log(
              `Son toplam: ${finalMatches.length}`
            );

            console.log(
              `Dosya: ${MATCHES_PATH}`
            );
          }

          main().catch(error => {

            console.error('');
            console.error('HATA:');
            console.error(error);
            process.exit(1);

          });
          NODE

      - name: Değişikliği kontrol et
        run: |
          git status --short

      - name: matches.json kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Eski data.js verilerini matches.json'a aktar"
            git push
          fi
