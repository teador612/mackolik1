<div class="container">

<script src="data/spor-toto-data.js"></script>

<script>
"use strict";

/* =========================================================
   AYARLAR
========================================================= */

const DATA_URL =
    "https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";

const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;

/*
   Tüm açılış oranı marketleri.
*/
const MARKETS = [
    "ms1",
    "msX",
    "ms2",

    "iy1",
    "iyX",
    "iy2",

    "cs1X",
    "cs12",
    "csX2",

    "au25Alt",
    "au25Ust",

    "kgVar",
    "kgYok",

    "iy15Alt",
    "iy15Ust",

    "au15Alt",
    "au15Ust",

    "au35Alt",
    "au35Ust",

    "gol01",
    "gol23",
    "gol46",
    "gol7",

    "handicap",
    "handicap1",
    "handicapX",
    "handicap2"
];

/* =========================================================
   GLOBAL
========================================================= */

let MACKOLIK_DATA = [];
let selectedWeek = null;
let predictionCache = new Map();

/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

function normalizeText(value){

    return String(value || "")
        .toLocaleLowerCase("tr-TR")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/ı/g,"i")
        .replace(/İ/g,"i")
        .replace(/ş/g,"s")
        .replace(/Ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/Ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/Ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/Ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/Ç/g,"c")
        .replace(/[^a-z0-9]/g,"");
}

/*
   Mackolik ile Spor Toto takım adlarını eşleştirmek
   için alias tablosu.
*/
const TEAM_ALIASES = {

    "ramsbasaksehir":"istanbulbasaksehir",
    "istanbulbasaksehir":"istanbulbasaksehir",

    "konyaspor":"tümosankonyaspor",
    "tumosankonyaspor":"tümosankonyaspor",

    "corumfk":"arcacorumfk",
    "arcacorumfk":"arcacorumfk",

    "amedspor":"amedsportiffaaliyetler",
    "amedsportiffaaliyetler":"amedsportiffaaliyetler",

    "kuzeymakedonyacumhuriyeti":"kuzeymakedonya",
    "kuzeymakedonya":"kuzeymakedonya",

    "parisstgermain":"parisstgermain",
    "psg":"parisstgermain",

    "manchestercity":"manchestercity",
    "mcity":"manchestercity",

    "manchesterutd":"manchesterutd",
    "manchesterunited":"manchesterutd",

    "tott enhamhotspur":"tottenhamhotspur",
    "thotspur":"tottenhamhotspur",

    "newcastleutd":"newcastleutd",
    "newcastleunited":"newcastleutd",

    "hcity":"hullcity"
};

function teamKey(name){

    let key = normalizeText(name);

    if(TEAM_ALIASES[key]){
        key = TEAM_ALIASES[key];
    }

    return key;
}

function sameTeam(a,b){

    const x = teamKey(a);
    const y = teamKey(b);

    if(!x || !y) return false;

    if(x === y) return true;

    return (
        x.includes(y) ||
        y.includes(x)
    );
}

function getHome(match){

    return (
        match?.home ??
        match?.homeTeam ??
        match?.team1 ??
        match?.ev ??
        ""
    );
}

function getAway(match){

    return (
        match?.away ??
        match?.awayTeam ??
        match?.team2 ??
        match?.dep ??
        ""
    );
}

/* =========================================================
   TARİH
========================================================= */

function parseDate(value){

    if(!value) return null;

    if(value instanceof Date && !isNaN(value)){
        return value;
    }

    const str = String(value).trim();

    /*
       24.09.2026
    */
    let m = str.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);

    if(m){

        const d = new Date(
            Number(m[3]),
            Number(m[2])-1,
            Number(m[1])
        );

        if(!isNaN(d)) return d;
    }

    /*
       2026-09-24
    */
    m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);

    if(m){

        const d = new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );

        if(!isNaN(d)) return d;
    }

    const d = new Date(str);

    return isNaN(d) ? null : d;
}

function getMatchDate(match){

    return (
        match?.date ??
        match?.matchDate ??
        match?.gameDate ??
        match?.tarih ??
        match?.day ??
        null
    );
}

/* =========================================================
   SKOR
========================================================= */

function getFullScore(match){

    if(!match) return null;

    let score =
        match.score ??
        match.fullTimeScore ??
        match.finalScore ??
        match.msScore ??
        null;

    if(score && typeof score === "object"){

        const h =
            score.home ??
            score.homeScore ??
            score.ev ??
            score[0];

        const a =
            score.away ??
            score.awayScore ??
            score.dep ??
            score[1];

        if(
            h !== undefined &&
            a !== undefined &&
            h !== null &&
            a !== null &&
            h !== "" &&
            a !== ""
        ){
            const home = Number(h);
            const away = Number(a);

            if(Number.isFinite(home) && Number.isFinite(away)){
                return {home,away};
            }
        }
    }

    if(typeof score === "string"){

        const m = score.match(/(\d+)\s*[-:]\s*(\d+)/);

        if(m){
            return {
                home:Number(m[1]),
                away:Number(m[2])
            };
        }
    }

    /*
       Bazı Mackolik kayıtlarında skor doğrudan
       homeScore / awayScore olabilir.
    */
    const hs =
        match.homeScore ??
        match.homeGoals ??
        match.evSkor;

    const as =
        match.awayScore ??
        match.awayGoals ??
        match.depSkor;

    if(
        hs !== undefined &&
        as !== undefined &&
        hs !== null &&
        as !== null &&
        hs !== "" &&
        as !== ""
    ){

        const home = Number(hs);
        const away = Number(as);

        if(Number.isFinite(home) && Number.isFinite(away)){
            return {home,away};
        }
    }

    return null;
}

function getResult(match){

    const score = getFullScore(match);

    if(!score) return null;

    if(score.home > score.away) return "1";

    if(score.home < score.away) return "2";

    return "X";
}

/* =========================================================
   AÇILIŞ ORANI OKUMA
========================================================= */

function numberValue(value){

    if(value === null || value === undefined) return null;

    if(typeof value === "number"){
        return Number.isFinite(value) ? value : null;
    }

    let s = String(value)
        .trim()
        .replace(",", ".");

    if(!s) return null;

    const n = Number(s);

    return Number.isFinite(n) ? n : null;
}

function getOpeningOdd(match, market){

    if(!match) return null;

    const containers = [
        match.openingOdds,
        match.opening,
        match.odds,
        match.markets,
        match.openingMarkets,
        match.openingOddsData
    ];

    for(const container of containers){

        if(!container || typeof container !== "object"){
            continue;
        }

        if(Object.prototype.hasOwnProperty.call(container,market)){

            const value = numberValue(container[market]);

            if(value !== null) return value;
        }

        /*
           Market bazen nesne olabilir:
           { ms1: { opening: 1.85 } }
        */
        const item = container[market];

        if(item && typeof item === "object"){

            const value = numberValue(
                item.opening ??
                item.openingOdd ??
                item.value ??
                item.odd ??
                item.rate
            );

            if(value !== null) return value;
        }
    }

    /*
       Doğrudan match.ms1 gibi alanlar
    */
    if(Object.prototype.hasOwnProperty.call(match,market)){

        const value = numberValue(match[market]);

        if(value !== null) return value;
    }

    return null;
}

/* =========================================================
   MACKOLIK MAÇ EŞLEŞTİRME
========================================================= */

function findMackolikMatch(sportMatch){

    const home = getHome(sportMatch);
    const away = getAway(sportMatch);

    if(!home || !away) return null;

    const candidates = MACKOLIK_DATA.filter(m => {

        return (
            sameTeam(getHome(m),home) &&
            sameTeam(getAway(m),away)
        );
    });

    if(!candidates.length) return null;

    /*
       Tarih varsa önce tarih eşleşmesine bak.
    */
    const targetDate = parseDate(getMatchDate(sportMatch));

    if(targetDate){

        const targetDay =
            targetDate.getFullYear() + "-" +
            String(targetDate.getMonth()+1).padStart(2,"0") + "-" +
            String(targetDate.getDate()).padStart(2,"0");

        const exact = candidates.filter(m => {

            const d = parseDate(getMatchDate(m));

            if(!d) return false;

            const day =
                d.getFullYear() + "-" +
                String(d.getMonth()+1).padStart(2,"0") + "-" +
                String(d.getDate()).padStart(2,"0");

            return day === targetDay;
        });

        if(exact.length){
            return exact[0];
        }
    }

    /*
       Tarih eşleşmesi yoksa skor bulunanı tercih et.
    */
    const scored = candidates.find(m => getFullScore(m));

    if(scored) return scored;

    return candidates[0];
}

/* =========================================================
   TARİH ARALIĞI
========================================================= */

function getHistoryEndDate(targetMatch){

    const d = parseDate(getMatchDate(targetMatch));

    if(d) return d;

    /*
       Hedef maçın tarihi yoksa bugünü kullan.
    */
    return new Date();
}

function isInsideHistory(match,endDate){

    const d = parseDate(getMatchDate(match));

    if(!d) return false;

    const end = new Date(endDate);
    end.setHours(23,59,59,999);

    const start = new Date(end);
    start.setDate(start.getDate() - HISTORY_DAYS);
    start.setHours(0,0,0,0);

    return d >= start && d < end;
}

function getHistory(targetMatch){

    const endDate = getHistoryEndDate(targetMatch);

    return MACKOLIK_DATA.filter(m => {

        const result = getResult(m);

        if(!result) return false;

        return isInsideHistory(m,endDate);
    });
}

/* =========================================================
   BAYESIAN + SQRT(N) HESAPLAMA
========================================================= */

function analyzeMarket(history,market,targetOdd){

    if(targetOdd === null) return null;

    let one = 0;
    let x = 0;
    let two = 0;

    for(const match of history){

        const odd = getOpeningOdd(match,market);

        /*
           EXACT ODDS:
           1.85 yalnızca 1.85 ile eşleşir.
        */
        if(odd === null || odd !== targetOdd){
            continue;
        }

        const result = getResult(match);

        if(result === "1") one++;
        else if(result === "X") x++;
        else if(result === "2") two++;
    }

    const n = one + x + two;

    if(n < MIN_SAMPLE){
        return null;
    }

    /*
       Bayesian / Laplace smoothing.
       100% gibi aşırı keskin sonuçların önüne geçer.
    */
    const alpha = 1;

    const denominator = n + (3 * alpha);

    const p1 = (one + alpha) / denominator;
    const px = (x + alpha) / denominator;
    const p2 = (two + alpha) / denominator;

    /*
       Kullanıcının istediği:
       sqrt(N) × N/(N+20)
    */
    const sqrtWeight = Math.sqrt(n);

    const confidenceWeight =
        n / (n + 20);

    const weight =
        sqrtWeight * confidenceWeight;

    return {
        p1,
        px,
        p2,
        n,
        weight
    };
}

/* =========================================================
   TEK TAHMİN
========================================================= */

function calculatePrediction(sportMatch){

    const cacheKey =
        getHome(sportMatch) + "|" +
        getAway(sportMatch);

    if(predictionCache.has(cacheKey)){
        return predictionCache.get(cacheKey);
    }

    const history = getHistory(sportMatch);

    let weighted1 = 0;
    let weightedX = 0;
    let weighted2 = 0;

    let totalWeight = 0;
    let marketCount = 0;
    let totalSamples = 0;

    /*
       Her marketin açılış oranını hedef maçtan al.
    */
    for(const market of MARKETS){

        const targetOdd =
            getOpeningOdd(
                findMackolikMatch(sportMatch),
                market
            );

        if(targetOdd === null){
            continue;
        }

        const analysis =
            analyzeMarket(
                history,
                market,
                targetOdd
            );

        if(!analysis){
            continue;
        }

        weighted1 += analysis.p1 * analysis.weight;
        weightedX += analysis.px * analysis.weight;
        weighted2 += analysis.p2 * analysis.weight;

        totalWeight += analysis.weight;

        marketCount++;
        totalSamples += analysis.n;
    }

    /*
       Hiçbir market yeterli örnek vermediyse
       tahmini rastgele üretme.
    */
    if(totalWeight <= 0){

        const result = {
            prediction:null,
            p1:0,
            px:0,
            p2:0,
            marketCount:0,
            totalSamples:0
        };

        predictionCache.set(cacheKey,result);

        return result;
    }

    let p1 = weighted1 / totalWeight;
    let px = weightedX / totalWeight;
    let p2 = weighted2 / totalWeight;

    /*
       Normalize.
    */
    const sum = p1 + px + p2;

    if(sum > 0){

        p1 /= sum;
        px /= sum;
        p2 /= sum;
    }

    let prediction = "1";

    if(px > p1 && px >= p2){
        prediction = "X";
    }
    else if(p2 > p1 && p2 > px){
        prediction = "2";
    }

    const result = {
        prediction,
        p1,
        px,
        p2,
        marketCount,
        totalSamples
    };

    predictionCache.set(cacheKey,result);

    return result;
}

/* =========================================================
   MAÇ SONUCU
========================================================= */

function getActualResult(sportMatch){

    const match = findMackolikMatch(sportMatch);

    if(!match) return null;

    return getResult(match);
}

function getScoreText(sportMatch){

    const match = findMackolikMatch(sportMatch);

    if(!match) return "Skor bekleniyor";

    const score = getFullScore(match);

    if(!score) return "Skor bekleniyor";

    return `${score.home} - ${score.away}`;
}

/* =========================================================
   HAFTA SEÇİMİ
========================================================= */

function setupWeeks(){

    const select =
        document.getElementById("weekSelect");

    select.innerHTML = "";

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    const keys =
        Object.keys(weeks)
            .map(Number)
            .sort((a,b)=>a-b);

    /*
       En güncel haftayı otomatik seç.
    */
    const current =
        Number(
            window.SPORT_TOTO_DATA?.currentWeek ||
            keys[keys.length-1]
        );

    for(const week of keys){

        const option =
            document.createElement("option");

        option.value = String(week);

        option.textContent =
            `${week}. Hafta` +
            (week === current ? " — Güncel" : "");

        select.appendChild(option);
    }

    if(keys.includes(current)){
        select.value = String(current);
    }

    selectedWeek = current;

    select.addEventListener("change",()=>{

        selectedWeek =
            Number(select.value);

        predictionCache.clear();

        render();
    });
}

/* =========================================================
   ÖZET
========================================================= */

function renderSummary(matches){

    let one = 0;
    let x = 0;
    let two = 0;

    for(const match of matches){

        const analysis =
            calculatePrediction(match);

        if(analysis.prediction === "1") one++;
        if(analysis.prediction === "X") x++;
        if(analysis.prediction === "2") two++;
    }

    return `
        <div class="summary">
            <div class="summary-box">
                <strong>${one}</strong>
                <span>1 Tahmini</span>
            </div>

            <div class="summary-box">
                <strong>${x}</strong>
                <span>X Tahmini</span>
            </div>

            <div class="summary-box">
                <strong>${two}</strong>
                <span>2 Tahmini</span>
            </div>
        </div>
    `;
}

/* =========================================================
   MAÇ RENDER
========================================================= */

function renderMatch(match,index){

    const analysis =
        calculatePrediction(match);

    const prediction =
        analysis.prediction;

    const actual =
        getActualResult(match);

    const score =
        getScoreText(match);

    let predictionClass = "";

    if(prediction === "1"){
        predictionClass = "one";
    }
    else if(prediction === "X"){
        predictionClass = "x";
    }
    else if(prediction === "2"){
        predictionClass = "two";
    }

    let statusHtml = "";

    if(!actual){

        statusHtml = `
            <span class="result-status waiting">
                • Sonuç bekleniyor
            </span>
        `;
    }
    else if(prediction === actual){

        statusHtml = `
            <span class="result-status success">
                ✓ Başarılı
            </span>
        `;
    }
    else{

        statusHtml = `
            <span class="result-status fail">
                ✕ Başarısız
            </span>
        `;
    }

    return `
        <div class="match">

            <div class="match-top">

                <div class="match-no">
                    ${index + 1}
                </div>

                <div class="teams">
                    ${escapeHtml(getHome(match))}
                    <span class="vs">-</span>
                    ${escapeHtml(getAway(match))}
                </div>

                <div class="prediction ${predictionClass}">
                    ${prediction || "—"}
                </div>

            </div>

            <div class="status">

                ${statusHtml}

                <span class="score">
                    ${escapeHtml(score)}
                </span>

            </div>

            <div class="details">

                <span class="badge">
                    1: ${(analysis.p1 * 100).toFixed(1)}%
                </span>

                <span class="badge">
                    X: ${(analysis.px * 100).toFixed(1)}%
                </span>

                <span class="badge">
                    2: ${(analysis.p2 * 100).toFixed(1)}%
                </span>

                <span class="badge">
                    ${analysis.marketCount} market
                </span>

                <span class="badge">
                    ${analysis.totalSamples} örnek
                </span>

            </div>

        </div>
    `;
}

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================================================
   ANA RENDER
========================================================= */

function render(){

    const content =
        document.getElementById("content");

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    const matches =
        Array.isArray(weeks[selectedWeek])
            ? weeks[selectedWeek]
            : [];

    if(!matches.length){

        content.innerHTML = `
            <div class="empty">
                Bu haftada maç bulunamadı.
            </div>
        `;

        return;
    }

    let html = "";

    html += `
        <div class="week-title">
            ${selectedWeek}. Hafta
            <span style="font-size:12px;color:#6b7280;font-weight:400">
                (${matches.length} maç)
            </span>
        </div>
    `;

    html += renderSummary(matches);

    matches.forEach((match,index)=>{

        html += renderMatch(match,index);

    });

    content.innerHTML = html;
}

/* =========================================================
   MACKOLIK VERİSİNİ YÜKLE
========================================================= */

async function loadMackolik(){

    const response =
        await fetch(
            DATA_URL + "?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "Mackolik verisi alınamadı: " +
            response.status
        );
    }

    const data =
        await response.json();

    /*
       matches doğrudan dizi olabilir.
    */
    if(Array.isArray(data)){

        MACKOLIK_DATA = data;
        return;
    }

    /*
       Normal matches.json yapısı:
       { matches:[...] }
    */
    if(Array.isArray(data.matches)){

        MACKOLIK_DATA = data.matches;
        return;
    }

    /*
       Başka olası yapılar.
    */
    if(Array.isArray(data.data)){

        MACKOLIK_DATA = data.data;
        return;
    }

    if(Array.isArray(data.items)){

        MACKOLIK_DATA = data.items;
        return;
    }

    throw new Error(
        "matches.json içinde maç listesi bulunamadı."
    );
}

/* =========================================================
   BAŞLAT
========================================================= */

async function init(){

    const content =
        document.getElementById("content");

    try{

        /*
           Spor Toto dosyasını önce kullan.
           Böylece Mackolik yüklenmese bile
           haftanın 15 maçı kaybolmaz.
        */
        setupWeeks();

        render();

        /*
           Sonra Mackolik verisini yükle.
        */
        await loadMackolik();

        predictionCache.clear();

        render();

    }
    catch(error){

        console.error(error);

        /*
           En önemli nokta:
           Mackolik yüklenmese bile Spor Toto haftası
           ekranda kalmaya devam eder.
        */
        try{
            predictionCache.clear();
            render();
        }
        catch(e){}

        /*
           Mackolik bağlantı hatasını üstteki maç listesini
           bozmayacak şekilde konsola bırakıyoruz.
        */

        console.error(
            "Mackolik verisi yüklenemedi:",
            error
        );
    }
}

/* =========================================================
   YENİLE
========================================================= */

document
    .getElementById("refreshBtn")
    .addEventListener("click",async()=>{

        const button =
            document.getElementById("refreshBtn");

        button.disabled = true;
        button.textContent = "Yükleniyor...";

        predictionCache.clear();

        try{

            await loadMackolik();

            render();

        }
        catch(error){

            console.error(error);

            /*
               Veri yüklenemese bile mevcut Spor Toto
               maçlarını göstermeye devam et.
            */
            render();
        }

        button.disabled = false;
        button.textContent = "↻ Yenile";
    });

init();

</script>
