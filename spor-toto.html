<script src="data/spor-toto-data.js"></script>

<script>
"use strict";

/*
=========================================================
 SPOR TOTO TAHMİN SİSTEMİ
=========================================================

KULLANILAN VERİ:
- data/spor-toto-data.js
- data/matches.json

HESAPLAMA:
- Son 60 gün
- Açılış oranları
- Tam eşleşen oran
- Minimum 5 örnek
- Tüm mevcut marketler
- Jeffreys smoothing
- sqrt(N) örnek ağırlığı
- N/(N+20) güven ağırlığı
- Market aileleri ayrı hesaplanır
- Sonuç yalnızca 1 / X / 2

ÖNEMLİ:
Aynı iki takım birden fazla maç yapabilir.
Bu sistem bunu hata olarak kabul etmez.
=========================================================
*/

const MATCHES_URL = "data/matches.json";

const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;

const JEFFREYS_ALPHA = 0.5;
const CONFIDENCE_K = 20;

/*
Marketler.
Mackolik update scriptindeki gerçek openingOdds
alanlarıyla uyumludur.
*/
const MARKETS = {

    MS: [
        "ms1",
        "msX",
        "ms2"
    ],

    IY: [
        "iy1",
        "iyX",
        "iy2"
    ],

    CS: [
        "cs1X",
        "cs12",
        "csX2"
    ],

    KG: [
        "kgVar",
        "kgYok"
    ],

    GOALS: [
        "au15Alt",
        "au15Ust",
        "au25Alt",
        "au25Ust",
        "au35Alt",
        "au35Ust",
        "gol01",
        "gol23",
        "gol46",
        "gol7"
    ],

    HANDICAP: [
        "handicap1",
        "handicapX",
        "handicap2"
    ]
};

const MARKET_FAMILIES = Object.keys(MARKETS);

let allMatches = [];
let historyMatches = [];
let matchIndex = new Map();

const state = {
    selectedWeek: null
};


/* =====================================================
   DOM
===================================================== */

const weekSelect = document.getElementById("weekSelect");
const refreshBtn = document.getElementById("refreshBtn");
const content = document.getElementById("content");
const weekTitle = document.getElementById("weekTitle");
const statusText = document.getElementById("statusText");


/* =====================================================
   NORMALİZASYON
===================================================== */

function normalizeText(value) {

    return String(value || "")
        .toLocaleLowerCase("tr-TR")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ı/g, "i")
        .replace(/ğ/g, "g")
        .replace(/ü/g, "u")
        .replace(/ş/g, "s")
        .replace(/ö/g, "o")
        .replace(/ç/g, "c")
        .replace(/[^a-z0-9]/g, "");
}


/*
Bazı Mackolik / Spor Toto isim farklılıkları.
*/
const TEAM_ALIASES = {

    "corumfk": "arcacorumfk",
    "arcacorumfk": "arcacorumfk",

    "ramsbasaksehir": "istanbulbasaksehir",
    "istanbulbasaksehir": "istanbulbasaksehir",

    "tmosankonyaspor": "konyaspor",
    "konyaspor": "konyaspor",

    "tothotspur": "tottenhamhotspur",
    "tottenhamhotspur": "tottenhamhotspur",

    "manchesterutd": "manchesterunited",
    "manchesterunited": "manchesterunited",

    "mcity": "manchestercity",
    "manchestercity": "manchestercity",

    "hcity": "hullcity",
    "hullcity": "hullcity",

    "newcastleutd": "newcastleunited",
    "newcastleunited": "newcastleunited",

    "vfbstuttgart": "stuttgart",
    "stuttgart": "stuttgart",

    "atleticomadrid": "atleticomadrid",

    "parisstgermain": "parissaintgermain",
    "parissaintgermain": "parissaintgermain"
};


function teamKey(name) {

    const key = normalizeText(name);

    return TEAM_ALIASES[key] || key;
}


function pairKey(home, away) {

    return teamKey(home) + "|" + teamKey(away);
}


/* =====================================================
   ORAN NORMALİZASYONU
===================================================== */

function parseOdd(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    if (typeof value === "number") {

        return Number.isFinite(value)
            ? value
            : null;
    }

    let text = String(value).trim();

    if (!text) {
        return null;
    }

    text = text.replace(",", ".");

    const number = Number(text);

    if (!Number.isFinite(number)) {
        return null;
    }

    return number;
}


/*
Exact odds.

1.85 yalnızca 1.85 ile eşleşir.
1.86 eşleşmez.

Anahtar oluştururken gereksiz floating point farklarını
önlemek için sayıyı standart metne çeviriyoruz.
Yuvarlama ile tolerans uygulanmıyor.
*/
function oddKey(value) {

    const odd = parseOdd(value);

    if (odd === null) {
        return null;
    }

    return String(odd);
}


/* =====================================================
   TARİH
===================================================== */

function parseDate(value) {

    if (!value) {
        return null;
    }

    const text = String(value).trim();

    /*
    24.09.2026
    */
    let m = text.match(
        /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/
    );

    if (m) {

        return new Date(
            Number(m[3]),
            Number(m[2]) - 1,
            Number(m[1])
        );
    }

    /*
    2026-09-24
    */
    m = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
    );

    if (m) {

        return new Date(
            Number(m[1]),
            Number(m[2]) - 1,
            Number(m[3])
        );
    }

    const d = new Date(text);

    return Number.isNaN(d.getTime())
        ? null
        : d;
}


function dateOnly(value) {

    const d = parseDate(value);

    if (!d) {
        return null;
    }

    return new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
    );
}


/* =====================================================
   SONUÇ
===================================================== */

function getResult(match) {

    if (!match) {
        return null;
    }

    const score = match.score;

    if (!score) {
        return null;
    }

    if (
        score.home === null ||
        score.home === undefined ||
        score.away === null ||
        score.away === undefined
    ) {
        return null;
    }

    const h = Number(score.home);
    const a = Number(score.away);

    if (
        !Number.isFinite(h) ||
        !Number.isFinite(a)
    ) {
        return null;
    }

    if (h > a) {
        return "1";
    }

    if (h < a) {
        return "2";
    }

    return "X";
}


/* =====================================================
   INDEX
===================================================== */

function buildIndex() {

    matchIndex.clear();

    for (const match of allMatches) {

        const key = pairKey(
            match.home,
            match.away
        );

        if (!matchIndex.has(key)) {
            matchIndex.set(key, []);
        }

        matchIndex.get(key).push(match);
    }
}


/*
Aynı takımlar birden fazla kez bulunabilir.

Burada ilk maçı almıyoruz.

Hedef maç için:
1. Aynı ev/deplasman eşleşmesini bul.
2. Açılış oranı bulunanları önceliklendir.
3. Birden fazla varsa hedef haftaya/date'e en uygun
   olanı seçmeye çalış.
*/
function findTargetMatches(home, away) {

    const key = pairKey(home, away);

    return matchIndex.get(key) || [];
}


function selectTargetMatch(
    candidates,
    targetWeek,
    targetResult
) {

    if (!candidates.length) {
        return null;
    }

    /*
    Sonucu bilinen eski haftalarda aynı sonucu taşıyan
    adayları önceliklendir.
    */
    if (targetResult) {

        const sameResult = candidates.filter(
            m => getResult(m) === targetResult
        );

        if (sameResult.length === 1) {
            return sameResult[0];
        }

        if (sameResult.length > 0) {
            candidates = sameResult;
        }
    }

    /*
    Açılış oranı olan adayları tercih et.
    */
    const withOdds = candidates.filter(
        m =>
            m &&
            m.openingOdds &&
            (
                parseOdd(m.openingOdds.ms1) !== null ||
                parseOdd(m.openingOdds.msX) !== null ||
                parseOdd(m.openingOdds.ms2) !== null
            )
    );

    if (withOdds.length === 1) {
        return withOdds[0];
    }

    if (withOdds.length > 0) {
        candidates = withOdds;
    }

    /*
    Aynı eşleşmeden birden fazla varsa tarih bilgisi olan
    en uygun adayı kullan.

    Burada asla "ilk bulunan" mantığı kullanılmıyor.
    */
    candidates = candidates.slice().sort(
        (a, b) => {

            const da = parseDate(a.date);
            const db = parseDate(b.date);

            if (!da && !db) {
                return 0;
            }

            if (!da) {
                return 1;
            }

            if (!db) {
                return -1;
            }

            return db.getTime() - da.getTime();
        }
    );

    return candidates[0] || null;
}


/* =====================================================
   HEDEF MAÇ TARİHİ
===================================================== */

function getTargetDate(match) {

    if (!match) {
        return null;
    }

    return dateOnly(match.date);
}


/* =====================================================
   60 GÜNLÜK TARİH GEÇMİŞİ
===================================================== */

function getHistoryForTarget(targetMatch) {

    const targetDate = getTargetDate(targetMatch);

    /*
    Hedef maçın tarihi bulunamazsa son 60 günü kullan.
    */
    if (!targetDate) {

        const now = new Date();

        const start = new Date(now);
        start.setDate(
            start.getDate() - HISTORY_DAYS
        );

        return historyMatches.filter(
            m => {

                const d = dateOnly(m.date);

                return d &&
                    d >= start &&
                    d <= now &&
                    getResult(m);
            }
        );
    }

    const start = new Date(targetDate);

    start.setDate(
        start.getDate() - HISTORY_DAYS
    );

    /*
    Hedef maçın kendisini dahil etmiyoruz.
    */
    return historyMatches.filter(
        m => {

            const d = dateOnly(m.date);

            if (!d) {
                return false;
            }

            if (d < start || d >= targetDate) {
                return false;
            }

            return Boolean(getResult(m));
        }
    );
}


/* =====================================================
   AÇILIŞ ORANI INDEXİ
===================================================== */

function buildOddsIndex(history) {

    const index = new Map();

    for (const match of history) {

        const result = getResult(match);

        if (!result) {
            continue;
        }

        const odds =
            match.openingOdds || {};

        for (const family of MARKET_FAMILIES) {

            for (const market of MARKETS[family]) {

                const odd =
                    parseOdd(odds[market]);

                if (odd === null) {
                    continue;
                }

                const key =
                    family +
                    "|" +
                    market +
                    "|" +
                    oddKey(odd);

                let bucket =
                    index.get(key);

                if (!bucket) {

                    bucket = {
                        "1": 0,
                        "X": 0,
                        "2": 0,
                        n: 0
                    };

                    index.set(key, bucket);
                }

                bucket[result]++;
                bucket.n++;
            }
        }
    }

    return index;
}


/* =====================================================
   BAYESIAN OLASILIK
===================================================== */

function getProbabilities(bucket) {

    const n = bucket.n;

    if (n < MIN_SAMPLE) {
        return null;
    }

    const total =
        n + JEFFREYS_ALPHA * 3;

    const p1 =
        (bucket["1"] + JEFFREYS_ALPHA) /
        total;

    const px =
        (bucket["X"] + JEFFREYS_ALPHA) /
        total;

    const p2 =
        (bucket["2"] + JEFFREYS_ALPHA) /
        total;

    return {
        p1,
        px,
        p2,
        n
    };
}


/* =====================================================
   DOĞRUDAN MS AÇILIŞ ORANI
===================================================== */

function directMSProbability(target) {

    if (!target || !target.openingOdds) {
        return null;
    }

    const o1 =
        parseOdd(target.openingOdds.ms1);

    const ox =
        parseOdd(target.openingOdds.msX);

    const o2 =
        parseOdd(target.openingOdds.ms2);

    if (
        o1 === null &&
        ox === null &&
        o2 === null
    ) {
        return null;
    }

    let p1 = o1 !== null ? 1 / o1 : 0;
    let px = ox !== null ? 1 / ox : 0;
    let p2 = o2 !== null ? 1 / o2 : 0;

    const total = p1 + px + p2;

    if (total <= 0) {
        return null;
    }

    p1 /= total;
    px /= total;
    p2 /= total;

    return {
        p1,
        px,
        p2
    };
}


/* =====================================================
   TEK MAÇ TAHMİNİ
===================================================== */

function calculatePrediction(target) {

    /*
    Doğrudan MS oranı.

    Hiçbir durumda varsayılan "1" yok.
    */
    const base =
        directMSProbability(target);

    /*
    Target için tarih geçmişi.
    */
    const history =
        getHistoryForTarget(target);

    if (!history.length) {

        return fallbackPrediction(base);
    }

    /*
    Aynı 60 günlük geçmiş için index oluştur.
    */
    const oddsIndex =
        buildOddsIndex(history);

    /*
    Her market ailesinin ayrı katkısı.
    Böylece örneğin 10 tane alt/üst marketi,
    MS marketini ezemez.
    */
    const familyResults = [];

    for (const family of MARKET_FAMILIES) {

        let familyP1 = 0;
        let familyPX = 0;
        let familyP2 = 0;

        let familyWeight = 0;

        for (const market of MARKETS[family]) {

            const targetOdd =
                parseOdd(
                    target.openingOdds?.[market]
                );

            if (targetOdd === null) {
                continue;
            }

            const key =
                family +
                "|" +
                market +
                "|" +
                oddKey(targetOdd);

            const bucket =
                oddsIndex.get(key);

            if (!bucket) {
                continue;
            }

            const probability =
                getProbabilities(bucket);

            if (!probability) {
                continue;
            }

            const n =
                probability.n;

            /*
            Örnek sayısı arttıkça güven artar.
            */
            const sampleWeight =
                Math.sqrt(n);

            const confidenceWeight =
                n / (n + CONFIDENCE_K);

            const weight =
                sampleWeight *
                confidenceWeight;

            /*
            Marketin üç sonuç arasındaki ayırma gücü.
            Rastgele 1/3'e çok yakın marketler daha az
            ağırlık alır.
            */
            const maxProbability =
                Math.max(
                    probability.p1,
                    probability.px,
                    probability.p2
                );

            const separation =
                Math.max(
                    0.25,
                    maxProbability - (1 / 3)
                );

            const finalWeight =
                weight * separation;

            familyP1 +=
                probability.p1 *
                finalWeight;

            familyPX +=
                probability.px *
                finalWeight;

            familyP2 +=
                probability.p2 *
                finalWeight;

            familyWeight += finalWeight;
        }

        if (familyWeight > 0) {

            familyResults.push({

                p1: familyP1 / familyWeight,
                px: familyPX / familyWeight,
                p2: familyP2 / familyWeight

            });
        }
    }


    /*
    Hiçbir tarihsel market eşleşmesi yoksa
    doğrudan MS açılış oranına dön.
    */
    if (!familyResults.length) {

        return fallbackPrediction(base);
    }


    /*
    Ailelerin ortalaması.

    Bu bölüm çok önemli:
    20 marketin hepsini bağımsız kabul edip
    1 sonucuna yığılmasını engeller.
    */
    let p1 = 0;
    let px = 0;
    let p2 = 0;

    for (const family of familyResults) {

        p1 += family.p1;
        px += family.px;
        p2 += family.p2;
    }

    p1 /= familyResults.length;
    px /= familyResults.length;
    p2 /= familyResults.length;


    /*
    Doğrudan MS açılış oranını küçük bir referans
    olarak dahil ediyoruz.

    Böylece tarihsel exact-odd örneği az olan maçlarda
    sistem anlamsız biçimde tek sonuca kilitlenmiyor.
    */
    if (base) {

        const HISTORY_WEIGHT = 0.75;
        const BASE_WEIGHT = 0.25;

        p1 =
            p1 * HISTORY_WEIGHT +
            base.p1 * BASE_WEIGHT;

        px =
            px * HISTORY_WEIGHT +
            base.px * BASE_WEIGHT;

        p2 =
            p2 * HISTORY_WEIGHT +
            base.p2 * BASE_WEIGHT;
    }


    /*
    Son kez normalize.
    */
    const total =
        p1 + px + p2;

    if (total <= 0) {

        return fallbackPrediction(base);
    }

    p1 /= total;
    px /= total;
    p2 /= total;


    /*
    SADECE 1 / X / 2.
    */
    let prediction = "1";
    let max = p1;

    if (px > max) {

        max = px;
        prediction = "X";
    }

    if (p2 > max) {

        max = p2;
        prediction = "2";
    }

    return {
        prediction,
        p1,
        px,
        p2
    };
}


/* =====================================================
   FALLBACK
===================================================== */

function fallbackPrediction(base) {

    if (!base) {

        /*
        Burada bile varsayılan olarak 1 vermiyoruz.
        Veri yoksa null döner.
        */
        return {
            prediction: null,
            p1: 0,
            px: 0,
            p2: 0
        };
    }

    let prediction = "1";
    let max = base.p1;

    if (base.px > max) {

        max = base.px;
        prediction = "X";
    }

    if (base.p2 > max) {

        max = base.p2;
        prediction = "2";
    }

    return {
        prediction,
        p1: base.p1,
        px: base.px,
        p2: base.p2
    };
}


/* =====================================================
   HAFTA SONUCU
===================================================== */

function getStoredResult(match) {

    return match.result || null;
}


/* =====================================================
   MAÇ RENDER
===================================================== */

function renderMatch(match) {

    const candidates =
        findTargetMatches(
            match.home,
            match.away
        );

    const target =
        selectTargetMatch(
            candidates,
            state.selectedWeek,
            match.result
        );

    /*
    Target yoksa bile tahmin sistemini bozma.
    */
    let prediction = null;

    if (target) {

        const calculation =
            calculatePrediction(target);

        prediction =
            calculation.prediction;
    }

    /*
    Geçmiş haftalarda sonucu doğrudan
    spor-toto-data.js'den alıyoruz.

    Bu sayede aynı takımların farklı haftaları
    birbirine karışmıyor.
    */
    const actual =
        getStoredResult(match);

    let resultSymbol = "•";
    let resultClass = "result-wait";

    if (actual) {

        if (
            prediction &&
            prediction === actual
        ) {

            resultSymbol = "✓";
            resultClass = "result-ok";

        } else {

            resultSymbol = "✕";
            resultClass = "result-bad";
        }
    }

    const card =
        document.createElement("div");

    card.className = "match";

    card.innerHTML = `

        <div class="teams">

            <div class="home">
                ${escapeHtml(match.home)}
            </div>

            <div class="away">
                ${escapeHtml(match.away)}
            </div>

            ${
                target && target.score &&
                target.score.home !== null &&
                target.score.away !== null

                ? `
                    <div class="score">
                        Skor:
                        ${escapeHtml(target.score.home)}
                        -
                        ${escapeHtml(target.score.away)}
                    </div>
                  `

                : ""
            }

        </div>

        <div class="prediction">
            ${prediction || "—"}
        </div>

        <div class="result-box ${resultClass}">
            ${resultSymbol}
        </div>
    `;

    return card;
}


/* =====================================================
   HAFTA RENDER
===================================================== */

function renderWeek() {

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    const matches =
        weeks[state.selectedWeek] || [];

    weekTitle.textContent =
        `${state.selectedWeek}. Hafta`;

    content.innerHTML = "";

    if (!matches.length) {

        content.innerHTML =
            `<div class="empty">
                Bu haftada maç bulunamadı.
             </div>`;

        return;
    }

    for (const match of matches) {

        content.appendChild(
            renderMatch(match)
        );
    }

    const played =
        matches.filter(
            m => m.result
        ).length;

    const pending =
        matches.length - played;

    statusText.textContent =
        `${matches.length} maç • ${played} sonuçlanmış • ${pending} bekliyor`;
}


/* =====================================================
   HAFTA SELECT
===================================================== */

function buildWeekSelect() {

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    weekSelect.innerHTML = "";

    const weekNumbers =
        Object.keys(weeks)
            .map(Number)
            .sort((a, b) => a - b);

    for (const week of weekNumbers) {

        const option =
            document.createElement("option");

        option.value = week;
        option.textContent =
            `${week}. Hafta`;

        weekSelect.appendChild(option);
    }

    const current =
        Number(
            window.SPORT_TOTO_DATA?.currentWeek
        );

    state.selectedWeek =
        weeks[current]
            ? current
            : weekNumbers[weekNumbers.length - 1];

    weekSelect.value =
        state.selectedWeek;
}


/* =====================================================
   VERİ YÜKLEME
===================================================== */

async function loadData() {

    content.innerHTML =
        `<div class="loading">
            Mackolik verileri yükleniyor...
         </div>`;

    statusText.textContent =
        "Veriler hazırlanıyor...";

    try {

        const response =
            await fetch(
                MATCHES_URL +
                "?v=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "matches.json yüklenemedi."
            );
        }

        const data =
            await response.json();

        allMatches =
            Array.isArray(data.matches)
                ? data.matches
                : [];

        /*
        Yalnızca sonucu belli olan maçlar
        tarihsel analizde kullanılacak.
        */
        historyMatches =
            allMatches.filter(
                m =>
                    m &&
                    m.openingOdds &&
                    getResult(m)
            );

        buildIndex();

        statusText.textContent =
            `${allMatches.length} Mackolik maçı yüklendi.`;

        renderWeek();

    } catch (error) {

        console.error(error);

        content.innerHTML =
            `<div class="error">
                Veri yüklenemedi.<br><br>
                ${escapeHtml(error.message)}
             </div>`;

        statusText.textContent =
            "Veri yükleme hatası.";
    }
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   EVENTS
===================================================== */

weekSelect.addEventListener(
    "change",
    () => {

        state.selectedWeek =
            Number(weekSelect.value);

        renderWeek();
    }
);


refreshBtn.addEventListener(
    "click",
    () => {

        loadData();
    }
);


/* =====================================================
   BAŞLAT
===================================================== */

buildWeekSelect();
loadData();

</script>
