<!-- =========================================================
     SPOR TOTO VERİSİ
========================================================= -->
<script src="data/spor-toto-data.js"></script>
<script>
"use strict";
/* =========================================================
   AYARLAR
========================================================= */
const MACKOLIK_URL =
    "https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";
const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;
const MARKETS = [
    {
        key:"iy15Ust",
        name:"İY 1.5 Üst"
    },
    {
        key:"iy1",
        name:"İY 1"
    },
    {
        key:"iy2",
        name:"İY 2"
    },
    {
        key:"au15Alt",
        name:"1.5 Alt"
    },
    {
        key:"au15Ust",
        name:"1.5 Üst"
    }
];
let mackolikMatches = [];
let selectedWeek = null;
const $ = id =>
    document.getElementById(id);
/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */
function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
/* =========================================================
   METİN NORMALİZASYONU
========================================================= */
function normalizeText(value){
    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/ı/g,"i")
        .replace(/ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/[^a-z0-9\s]/g," ")
        .replace(/\s+/g," ")
        .trim();
}
/* =========================================================
   GEREKSİZ TAKIM KELİMELERİ
========================================================= */
const IGNORE_TEAM_WORDS = new Set([
    "fk",
    "fc",
    "sk",
    "sc",
    "as",
    "cf",
    "afc",
    "club",
    "kulubu",
    "spor",
    "futbol",
    "takimi",
    "a",
    "milli",
    "cumhuriyeti"
]);
/* =========================================================
   TAKIM KELİME ALIASLARI
========================================================= */
const TEAM_WORD_ALIASES = {
    "k":[
        "k",
        "kuzey"
    ],
    "n":[
        "n",
        "north"
    ],
    "bor":[
        "bor",
        "borussia"
    ],
    "utd":[
        "utd",
        "united"
    ],
    "man":[
        "man",
        "manchester"
    ],
    "st":[
        "st",
        "saint"
    ],
    "vfb":[
        "vfb"
    ],
    "rb":[
        "rb"
    ],
    "psg":[
        "psg",
        "paris",
        "saint",
        "germain"
    ]
};
/* =========================================================
   TAKIM KELİMELERİ
========================================================= */
function teamWords(name){
    return normalizeText(name)
        .split(" ")
        .map(x => x.trim())
        .filter(Boolean)
        .filter(x =>
            !IGNORE_TEAM_WORDS.has(x)
        );
}
/* =========================================================
   KELİME UYUMLULUĞU
========================================================= */
function wordsCompatible(a,b){
    if(!a || !b){
        return false;
    }
    if(a === b){
        return true;
    }
    for(const key in TEAM_WORD_ALIASES){
        const aliases =
            TEAM_WORD_ALIASES[key];
        if(
            aliases.includes(a) &&
            aliases.includes(b)
        ){
            return true;
        }
    }
    if(
        a.length >= 4 &&
        b.length >= 4
    ){
        if(
            a.startsWith(b) ||
            b.startsWith(a)
        ){
            return true;
        }
    }
    return false;
}
/* =========================================================
   TAKIM BENZERLİĞİ
========================================================= */
function teamSimilarity(a,b){
    const wa = teamWords(a);
    const wb = teamWords(b);
    if(
        !wa.length ||
        !wb.length
    ){
        return 0;
    }
    if(
        normalizeText(a) ===
        normalizeText(b)
    ){
        return 1;
    }
    let matchedA = 0;
    for(const wordA of wa){
        if(
            wb.some(
                wordB =>
                    wordsCompatible(
                        wordA,
                        wordB
                    )
            )
        ){
            matchedA++;
        }
    }
    let matchedB = 0;
    for(const wordB of wb){
        if(
            wa.some(
                wordA =>
                    wordsCompatible(
                        wordA,
                        wordB
                    )
            )
        ){
            matchedB++;
        }
    }
    const scoreA =
        matchedA / wa.length;
    const scoreB =
        matchedB / wb.length;
    return (
        scoreA +
        scoreB
    ) / 2;
}
/* =========================================================
   TARİH
========================================================= */
function parseDate(value){
    if(!value){
        return null;
    }
    const s =
        String(value).trim();
    let d = null;
    if(
        /^\d{2}\.\d{2}\.\d{4}$/.test(s)
    ){
        const [
            day,
            month,
            year
        ] = s.split(".");
        d = new Date(
            Number(year),
            Number(month)-1,
            Number(day)
        );
    }else{
        d = new Date(s);
    }
    if(
        !d ||
        Number.isNaN(
            d.getTime()
        )
    ){
        return null;
    }
    d.setHours(0,0,0,0);
    return d;
}
/* =========================================================
   TARİH FARKI
========================================================= */
function dateDistance(a,b){
    const da =
        parseDate(a);
    const db =
        parseDate(b);
    if(!da || !db){
        return Number.MAX_SAFE_INTEGER;
    }
    return Math.abs(
        da.getTime() -
        db.getTime()
    );
}
/* =========================================================
   SKOR
========================================================= */
function getFullScore(match){
    if(!match){
        return null;
    }
    const home =
        Number(match?.score?.home);
    const away =
        Number(match?.score?.away);
    if(
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ){
        return null;
    }
    return {
        home,
        away
    };
}
/* =========================================================
   1 / X / 2
========================================================= */
function getResult(match){
    const score =
        getFullScore(match);
    if(!score){
        return null;
    }
    if(
        score.home >
        score.away
    ){
        return "1";
    }
    if(
        score.home <
        score.away
    ){
        return "2";
    }
    return "X";
}
/* =========================================================
   AÇILIŞ ORANI
========================================================= */
function getOpeningOdds(match,key){
    const value =
        match?.openingOdds?.[key];
    const number =
        Number(value);
    if(
        !Number.isFinite(number)
    ){
        return null;
    }
    return number;
}
/* =========================================================
   TAM ORAN EŞLEŞMESİ
========================================================= */
function exactOdds(a,b){
    if(
        a === null ||
        b === null
    ){
        return false;
    }
    return Number(a) === Number(b);
}
/* =========================================================
   MACKOLIK MAÇINI BUL
========================================================= */
function findMackolikCandidates(stMatch){
    if(!stMatch){
        return [];
    }
    return mackolikMatches
        .map(match => {
            if(
                !match ||
                !match.home ||
                !match.away
            ){
                return null;
            }
            const homeScore =
                teamSimilarity(
                    stMatch.home,
                    match.home
                );
            const awayScore =
                teamSimilarity(
                    stMatch.away,
                    match.away
                );
            if(
                homeScore < 0.50 ||
                awayScore < 0.50
            ){
                return null;
            }
            const nameScore =
                (
                    homeScore +
                    awayScore
                ) / 2;
            const distance =
                dateDistance(
                    stMatch.date,
                    match.date
                );
            return {
                match,
                homeScore,
                awayScore,
                nameScore,
                distance
            };
        })
        .filter(Boolean);
}
/* =========================================================
   EN UYGUN MACKOLIK MAÇI
========================================================= */
function findMackolikMatch(stMatch){
    const candidates =
        findMackolikCandidates(
            stMatch
        );
    if(!candidates.length){
        console.log(
            "EŞLEŞME YOK:",
            stMatch.home,
            "-",
            stMatch.away
        );
        return null;
    }
    candidates.sort(
        (a,b) => {
            /*
             * Önce isim uyumu.
             */
            if(
                b.nameScore !==
                a.nameScore
            ){
                return (
                    b.nameScore -
                    a.nameScore
                );
            }
            /*
             * Aynı isim uyumunda
             * tarihe en yakın maç.
             */
            return (
                a.distance -
                b.distance
            );
        }
    );
    const best =
        candidates[0];
    console.log(
        "EŞLEŞTİ:",
        stMatch.home,
        "-",
        stMatch.away,
        "=>",
        best.match.home,
        "-",
        best.match.away,
        "|",
        (
            best.nameScore * 100
        ).toFixed(1) + "%",
        "| Tarih farkı:",
        Math.round(
            best.distance /
            86400000
        ),
        "gün"
    );
    return best.match;
}
/* =========================================================
   GEÇMİŞ 60 GÜN
========================================================= */
function getHistory(targetDate){
    const target =
        parseDate(targetDate);
    if(!target){
        return [];
    }
    const from =
        new Date(target);
    from.setDate(
        from.getDate() -
        HISTORY_DAYS
    );
    return mackolikMatches.filter(
        match => {
            const date =
                parseDate(match.date);
            if(!date){
                return false;
            }
            /*
             * Sonuçlanmış maçlar.
             */
            const result =
                getResult(match);
            if(!result){
                return false;
            }
            /*
             * Hedef maçtan önceki
             * 60 günlük dönem.
             */
            return (
                date >= from &&
                date < target
            );
        }
    );
}
/* =========================================================
   MARKET ÖRNEKLERİ
========================================================= */
function getMarketSamples(
    history,
    market,
    targetOdd
){
    if(
        targetOdd === null
    ){
        return [];
    }
    return history.filter(
        match => {
            const odd =
                getOpeningOdds(
                    match,
                    market
                );
            return exactOdds(
                odd,
                targetOdd
            );
        }
    );
}
/* =========================================================
   ORTAK TAHMİN
========================================================= */
function calculatePrediction(
    stMatch,
    mackolikMatch
){
    if(!mackolikMatch){
        return {
            p1:0,
            px:0,
            p2:0,
            main:null,
            system:"1X2",
            validMarkets:0,
            totalSamples:0
        };
    }
    /*
     * Eğer Spor Toto maçında tarih varsa
     * onu kullan.
     *
     * Yoksa eşleşen Mackolik maçının
     * tarihini kullan.
     */
    const targetDate =
        stMatch.date ||
        mackolikMatch.date;
    const history =
        getHistory(
            targetDate
        );
    let weighted1 = 0;
    let weightedX = 0;
    let weighted2 = 0;
    let totalWeight = 0;
    let validMarkets = 0;
    let totalSamples = 0;
    for(
        const market of MARKETS
    ){
        const targetOdd =
            getOpeningOdds(
                mackolikMatch,
                market.key
            );
        if(
            targetOdd === null
        ){
            continue;
        }
        const samples =
            getMarketSamples(
                history,
                market.key,
                targetOdd
            );
        /*
         * Minimum 5 birebir örnek.
         */
        if(
            samples.length <
            MIN_SAMPLE
        ){
            continue;
        }
        let c1 = 0;
        let cx = 0;
        let c2 = 0;
        for(
            const sample of samples
        ){
            const result =
                getResult(sample);
            if(result === "1"){
                c1++;
            }
            else if(result === "X"){
                cx++;
            }
            else if(result === "2"){
                c2++;
            }
        }
        const total =
            c1 + cx + c2;
        if(!total){
            continue;
        }
        /*
         * Ağırlık:
         * sqrt(sample)
         */
        const weight =
            Math.sqrt(total);
        weighted1 +=
            (c1 / total) *
            weight;
        weightedX +=
            (cx / total) *
            weight;
        weighted2 +=
            (c2 / total) *
            weight;
        totalWeight +=
            weight;
        validMarkets++;
        totalSamples +=
            total;
    }
    if(
        !totalWeight
    ){
        return {
            p1:33.33,
            px:33.33,
            p2:33.34,
            main:null,
            system:"1X2",
            validMarkets:0,
            totalSamples:0
        };
    }
    const p1 =
        weighted1 /
        totalWeight *
        100;
    const px =
        weightedX /
        totalWeight *
        100;
    const p2 =
        weighted2 /
        totalWeight *
        100;
    const values = [
        {
            key:"1",
            value:p1
        },
        {
            key:"X",
            value:px
        },
        {
            key:"2",
            value:p2
        }
    ];
    values.sort(
        (a,b) =>
            b.value -
            a.value
    );
    const top =
        values[0];
    const second =
        values[1];
    const gap =
        top.value -
        second.value;
    let system;
    /*
     * TEK
     */
    if(
        top.value >= 50 &&
        gap >= 15
    ){
        system =
            top.key;
    }
    /*
     * ÇİFT
     */
    else if(
        top.value >= 40 &&
        gap >= 7
    ){
        system =
            top.key +
            second.key;
    }
    /*
     * ÜÇLÜ
     */
    else{
        system =
            "1X2";
    }
    return {
        p1,
        px,
        p2,
        main:top.key,
        system,
        validMarkets,
        totalSamples
    };
}
/* =========================================================
   SİSTEM SONUCU İÇERİYOR MU?
========================================================= */
function systemContains(
    system,
    result
){
    if(
        !system ||
        !result
    ){
        return false;
    }
    system =
        String(system)
            .replace(/\s+/g,"")
            .toUpperCase();
    if(
        system === "1X2"
    ){
        return true;
    }
    return system.includes(
        result
    );
}
/* =========================================================
   SONUÇ DURUMU
   EN ÖNEMLİ DÜZELTME BURADA
========================================================= */
function getResultStatus(
    prediction,
    stMatch,
    mackolik
){
    /*
     * =====================================================
     * 1. ÖNCELİK
     *
     * Spor Toto veri dosyasındaki gerçek sonuç.
     *
     * Geçmiş haftalarda örneğin:
     *
     * result: "2"
     *
     * varsa kesinlikle bunu kullan.
     *
     * Böylece yanlış Mackolik eşleşmesi sonucu
     * değiştiremez.
     * =====================================================
     */
    let result = null;
    const storedResult =
        String(
            stMatch?.result ?? ""
        )
            .trim()
            .toUpperCase();
    if(
        storedResult === "1" ||
        storedResult === "X" ||
        storedResult === "2"
    ){
        result =
            storedResult;
    }
    /*
     * =====================================================
     * 2. ÖNCELİK
     *
     * Spor Toto dosyasında sonuç yoksa
     * Mackolik skorunu kullan.
     *
     * Bu özellikle güncel hafta içindir.
     * =====================================================
     */
    if(!result){
        result =
            getResult(
                mackolik
            );
    }
    /*
     * Sonuç hâlâ yok.
     */
    if(!result){
        return {
            type:"waiting",
            text:"⏳ Henüz sonuç yok"
        };
    }
    const score =
        getFullScore(
            mackolik
        );
    const scoreText =
        score
            ? `${score.home} - ${score.away}`
            : "";
    /*
     * Tahmin tuttu.
     */
    if(
        systemContains(
            prediction.system,
            result
        )
    ){
        return {
            type:"hit",
            text:
                `✓ Tuttu${
                    scoreText
                        ? ` · ${scoreText}`
                        : ""
                }`
        };
    }
    /*
     * Tahmin tutmadı.
     */
    return {
        type:"miss",
        text:
            `✕ Tutmadı${
                scoreText
                    ? ` · ${scoreText}`
                    : ""
            }`
    };
}
/* =========================================================
   YÜZDE
========================================================= */
function pct(value){
    return Math.round(value) + "%";
}
/* =========================================================
   SİSTEM SINIFI
========================================================= */
function systemClass(system){
    if(
        system === "1" ||
        system === "X" ||
        system === "2"
    ){
        return "single";
    }
    if(
        system === "1X2"
    ){
        return "triple";
    }
    return "double";
}
/* =========================================================
   SONUÇ ROZETİ
========================================================= */
function resultBadge(status){
    if(
        status.type === "hit"
    ){
        return `
            <span
                class="result-badge result-hit"
                title="Tahmin tuttu">
                ✓
            </span>
        `;
    }
    if(
        status.type === "miss"
    ){
        return `
            <span
                class="result-badge result-miss"
                title="Tahmin tutmadı">
                ✕
            </span>
        `;
    }
    return `
        <span
            class="result-badge result-wait"
            title="Sonuç bekleniyor">
            •
        </span>
    `;
}
/* =========================================================
   MAÇ RENDER
========================================================= */
function renderMatch(
    stMatch,
    index
){
    const mackolik =
        findMackolikMatch(
            stMatch
        );
    /*
     * Mackolik eşleşmesi yok.
     */
    if(!mackolik){
        return `
            <div class="match">
                <div class="match-top">
                    <div class="number">
                        ${index + 1}
                    </div>
                    <div class="teams">
                        ${escapeHtml(
                            stMatch.home
                        )}
                        -
                        ${escapeHtml(
                            stMatch.away
                        )}
                    </div>
                    <div class="main-pred">
                        ?
                    </div>
                    <div class="system triple">
                        1X2
                    </div>
                </div>
                <div class="no-data">
                    Mackolik1 içinde bu maç için
                    eşleşme bulunamadı.
                </div>
            </div>
        `;
    }
    const prediction =
        calculatePrediction(
            stMatch,
            mackolik
        );
    const resultStatus =
        getResultStatus(
            prediction,
            stMatch,
            mackolik
        );
    return `
        <div class="match">
            <div class="match-top">
                <div class="number">
                    ${index + 1}
                </div>
                <div class="teams">
                    ${escapeHtml(
                        stMatch.home
                    )}
                    -
                    ${escapeHtml(
                        stMatch.away
                    )}
                </div>
                <div class="main-pred">
                    ${
                        prediction.main ||
                        "?"
                    }
                </div>
                ${resultBadge(
                    resultStatus
                )}
                <div class="system ${
                    systemClass(
                        prediction.system
                    )
                }">
                    ${prediction.system}
                </div>
            </div>
            <div class="percentages">
                <div class="percent">
                    1
                    <b>
                        ${pct(
                            prediction.p1
                        )}
                    </b>
                </div>
                <div class="percent">
                    X
                    <b>
                        ${pct(
                            prediction.px
                        )}
                    </b>
                </div>
                <div class="percent">
                    2
                    <b>
                        ${pct(
                            prediction.p2
                        )}
                    </b>
                </div>
            </div>
            <div class="confidence">
                Ortak karar:
                <b>
                    ${
                        prediction.main ||
                        "?"
                    }
                </b>
                •
                Sistem:
                <b>
                    ${prediction.system}
                </b>
                •
                ${prediction.validMarkets}
                / ${MARKETS.length}
                örneklem türü kullanıldı
                •
                ${prediction.totalSamples}
                toplam geçmiş eşleşme
                ${
                    resultStatus.text
                        ? `
                            •
                            <b>
                                ${resultStatus.text}
                            </b>
                        `
                        : ""
                }
            </div>
            ${
                prediction.validMarkets === 0
                    ? `
                        <div class="no-data">
                            En az ${MIN_SAMPLE}
                            birebir oran eşleşmesi
                            bulunan örneklem yok.
                        </div>
                    `
                    : ""
            }
        </div>
    `;
}
/* =========================================================
   SONUÇ ÖZETİ
========================================================= */
function renderResultSummary(
    total,
    hit,
    miss,
    waiting
){
    const finished =
        hit + miss;
    const success =
        finished > 0
            ? (
                hit /
                finished *
                100
            )
            : 0;
    return `
        <div class="result-summary">
            <div class="result-summary-title">
                📊 Tahmin Sonuçları
            </div>
            <div class="result-summary-items">
                <div class="result-summary-item">
                    <strong>
                        ${total}
                    </strong>
                    <small>
                        Toplam
                    </small>
                </div>
                <div class="result-summary-item summary-hit">
                    <strong>
                        ${hit}
                    </strong>
                    <small>
                        ✓ Tuttu
                    </small>
                </div>
                <div class="result-summary-item summary-miss">
                    <strong>
                        ${miss}
                    </strong>
                    <small>
                        ✕ Tutmadı
                    </small>
                </div>
                <div class="result-summary-item summary-success">
                    <strong>
                        ${success.toFixed(1)}%
                    </strong>
                    <small>
                        Başarı
                    </small>
                </div>
            </div>
        </div>
    `;
}
/* =========================================================
   HAFTA RENDER
========================================================= */
function renderWeek(){
    const weekData =
        window.SPORT_TOTO_DATA
            ?.weeks
            ?. [selectedWeek];
    if(!weekData){
        $("content").innerHTML =
            `
                <div class="error">
                    ${selectedWeek}. hafta
                    verisi bulunamadı.
                </div>
            `;
        return;
    }
    const matches =
        Array.isArray(
            weekData
        )
            ? weekData
            : (
                Array.isArray(
                    weekData.matches
                )
                    ? weekData.matches
                    : []
            );
    let hit = 0;
    let miss = 0;
    let waiting = 0;
    const rows =
        matches.map(
            (match,index) => {
                const mackolik =
                    findMackolikMatch(
                        match
                    );
                const prediction =
                    calculatePrediction(
                        match,
                        mackolik
                    );
                const status =
                    mackolik
                        ? getResultStatus(
                            prediction,
                            match,
                            mackolik
                        )
                        : {
                            type:"waiting",
                            text:
                                "⏳ Mackolik maçı bulunamadı"
                        };
                if(
                    status.type ===
                    "hit"
                ){
                    hit++;
                }
                else if(
                    status.type ===
                    "miss"
                ){
                    miss++;
                }
                else{
                    waiting++;
                }
                return renderMatch(
                    match,
                    index
                );
            }
        ).join("");
    let single = 0;
    let double = 0;
    let triple = 0;
    matches.forEach(
        match => {
            const mackolik =
                findMackolikMatch(
                    match
                );
            if(!mackolik){
                return;
            }
            const prediction =
                calculatePrediction(
                    match,
                    mackolik
                );
            if(
                prediction.system === "1" ||
                prediction.system === "X" ||
                prediction.system === "2"
            ){
                single++;
            }
            else if(
                prediction.system === "1X2"
            ){
                triple++;
            }
            else{
                double++;
            }
        }
    );
    $("content").innerHTML = `
        ${renderResultSummary(
            matches.length,
            hit,
            miss,
            waiting
        )}
        <div class="info">
            <div class="info-title">
                Spor Toto ${selectedWeek}. Hafta
            </div>
            <div class="info-text">
                Her maç için birden fazla
                Mackolik örneklemi ayrı ayrı
                tahmin olarak gösterilmez.
                Tüm geçerli örneklemler
                birleştirilerek tek bir ortak
                1/X/2 kararı oluşturulur.
            </div>
        </div>
        <div class="coupon">
            <div class="coupon-head">
                <strong>
                    Ortak Karar Kuponu
                </strong>
                <div class="summary">
                    <span class="badge">
                        Tek: ${single}
                    </span>
                    <span class="badge">
                        Çift: ${double}
                    </span>
                    <span class="badge">
                        Üçlü: ${triple}
                    </span>
                    <span class="badge">
                        Maç: ${matches.length}
                    </span>
                </div>
            </div>
            ${rows}
        </div>
    `;
}
/* =========================================================
   HAFTA BUTONLARI
========================================================= */
function renderWeeks(){
    const weeks =
        window.SPORT_TOTO_DATA
            ?.weeks || {};
    const numbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a,b) => a - b
            );
    $("weeks").innerHTML =
        numbers
            .map(
                week => `
                    <button
                        class="week-btn ${
                            Number(week) ===
                            Number(selectedWeek)
                                ? "active"
                                : ""
                        }"
                        data-week="${week}">
                        ${week}. Hafta
                    </button>
                `
            )
            .join("");
    document
        .querySelectorAll(
            ".week-btn"
        )
        .forEach(
            button => {
                button.addEventListener(
                    "click",
                    () => {
                        selectedWeek =
                            Number(
                                button.dataset.week
                            );
                        renderWeeks();
                        renderWeek();
                    }
                );
            }
        );
}
/* =========================================================
   MACKOLIK VERİSİ
========================================================= */
async function loadMackolik(){
    const response =
        await fetch(
            MACKOLIK_URL +
            "?t=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );
    if(!response.ok){
        throw new Error(
            "Mackolik verisi alınamadı. HTTP " +
            response.status
        );
    }
    const data =
        await response.json();
    if(
        !data ||
        !Array.isArray(
            data.matches
        )
    ){
        throw new Error(
            "Mackolik matches verisi bulunamadı."
        );
    }
    mackolikMatches =
        data.matches;
    console.log(
        "Mackolik maç sayısı:",
        mackolikMatches.length
    );
}
/* =========================================================
   BAŞLAT
========================================================= */
async function init(){
    try{
        if(
            !window.SPORT_TOTO_DATA
        ){
            throw new Error(
                "data/spor-toto-data.js yüklenemedi."
            );
        }
        const weeks =
            window.SPORT_TOTO_DATA
                .weeks || {};
        const numbers =
            Object.keys(weeks)
                .map(Number)
                .sort(
                    (a,b) => a - b
                );
        selectedWeek =
            Number(
                window.SPORT_TOTO_DATA
                    .currentWeek
            ) ||
            numbers[
                numbers.length - 1
            ];
        renderWeeks();
        $("content").innerHTML =
            `
                <div class="loading">
                    Mackolik açılış oranları
                    yükleniyor...
                </div>
            `;
        await loadMackolik();
        renderWeek();
    }catch(error){
        console.error(error);
        $("content").innerHTML =
            `
                <div class="error">
                    <strong>
                        Veri yüklenemedi.
                    </strong>
                    <br><br>
                    ${escapeHtml(
                        error.message ||
                        error
                    )}
                </div>
            `;
    }
}
/* =========================================================
   ÇALIŞTIR
========================================================= */
init();
</script>
