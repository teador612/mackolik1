<script src="data/spor-toto-data.js"></script>

<script>
"use strict";

/*
==========================================================
 SPOR TOTO HESAPLAMA

 Bayesian
      ↓
 √N × N/(N+20)
      ↓
 Ağırlıklı 1 / X / 2
      ↓
 En yüksek sonuç

 EKSTRA AĞIRLIK YOK.
 SEPARATION YOK.
 MARKET AİLESİ AĞIRLIĞI YOK.
==========================================================
*/

const MATCHES_URL = "data/matches.json";

const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;

const BAYES_ALPHA = 0.5;
const CONFIDENCE_K = 20;


/*
Mackolik openingOdds marketleri
*/
const MARKETS = [
    "ms1",
    "msX",
    "ms2",

    "iy1",
    "iyX",
    "iy2",

    "cs1X",
    "cs12",
    "csX2",

    "au25Alt",
    "au25Ust",

    "kgVar",
    "kgYok",

    "iy15Alt",
    "iy15Ust",

    "au15Alt",
    "au15Ust",

    "au35Alt",
    "au35Ust",

    "gol01",
    "gol23",
    "gol46",
    "gol7",

    "handicap",
    "handicap1",
    "handicapX",
    "handicap2"
];


let allMatches = [];
let historicalMatches = [];

let pairIndex = new Map();

let selectedWeek = null;


/* ======================================================
 DOM
====================================================== */

const weekSelect =
    document.getElementById("weekSelect");

const refreshButton =
    document.getElementById("refresh");

const matchesContainer =
    document.getElementById("matches");

const weekTitle =
    document.getElementById("weekTitle");

const statusText =
    document.getElementById("status");


/* ======================================================
 METİN NORMALİZASYONU
====================================================== */

function normalizeText(value) {

    return String(value || "")
        .toLocaleLowerCase("tr-TR")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ı/g, "i")
        .replace(/ğ/g, "g")
        .replace(/ü/g, "u")
        .replace(/ş/g, "s")
        .replace(/ö/g, "o")
        .replace(/ç/g, "c")
        .replace(/[^a-z0-9]/g, "");
}


const ALIASES = {

    "corumfk": "arcacorumfk",
    "arcacorumfk": "arcacorumfk",

    "ramsbasaksehir": "istanbulbasaksehir",
    "istanbulbasaksehir": "istanbulbasaksehir",

    "tmosankonyaspor": "konyaspor",
    "konyaspor": "konyaspor",

    "tottenhamhotspur": "tottenhamhotspur",
    "thotspur": "tottenhamhotspur",

    "tothotspur": "tottenhamhotspur",

    "manchesterunited": "manchesterunited",
    "manchesterutd": "manchesterunited",

    "mancity": "mancity",
    "mcity": "mancity",
    "manchestercity": "mancity",

    "hcity": "hullcity",
    "hullcity": "hullcity",

    "newcastleutd": "newcastleunited",
    "newcastleunited": "newcastleunited",

    "vfbstuttgart": "stuttgart",
    "stuttgart": "stuttgart"
};


function teamKey(name) {

    const key =
        normalizeText(name);

    return ALIASES[key] || key;
}


function pairKey(home, away) {

    return (
        teamKey(home) +
        "|" +
        teamKey(away)
    );
}


/* ======================================================
 ORAN
====================================================== */

function parseOdd(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    if (typeof value === "number") {

        return Number.isFinite(value)
            ? value
            : null;
    }

    let text =
        String(value).trim();

    if (!text) {
        return null;
    }

    text =
        text.replace(",", ".");

    const n =
        Number(text);

    return Number.isFinite(n)
        ? n
        : null;
}


/*
Exact eşleşme.

1.85 = 1.85
1.85 != 1.86
*/
function oddKey(value) {

    const odd =
        parseOdd(value);

    if (odd === null) {
        return null;
    }

    return String(odd);
}


/* ======================================================
 TARİH
====================================================== */

function parseDate(value) {

    if (!value) {
        return null;
    }

    const text =
        String(value).trim();

    let m =
        text.match(
            /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/
        );

    if (m) {

        return new Date(
            Number(m[3]),
            Number(m[2]) - 1,
            Number(m[1])
        );
    }

    m =
        text.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})/
        );

    if (m) {

        return new Date(
            Number(m[1]),
            Number(m[2]) - 1,
            Number(m[3])
        );
    }

    const d =
        new Date(text);

    return Number.isNaN(d.getTime())
        ? null
        : d;
}


function dateOnly(value) {

    const d =
        parseDate(value);

    if (!d) {
        return null;
    }

    return new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
    );
}


/* ======================================================
 MAÇ SONUCU
====================================================== */

function getMatchResult(match) {

    if (!match) {
        return null;
    }

    /*
    Eğer sonuç direkt result alanındaysa
    */
    if (
        match.result === "1" ||
        match.result === "X" ||
        match.result === "2"
    ) {
        return match.result;
    }

    const score =
        match.score;

    if (!score) {
        return null;
    }

    if (
        score.home === null ||
        score.home === undefined ||
        score.away === null ||
        score.away === undefined
    ) {
        return null;
    }

    const home =
        Number(score.home);

    const away =
        Number(score.away);

    if (
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ) {
        return null;
    }

    if (home > away) {
        return "1";
    }

    if (home < away) {
        return "2";
    }

    return "X";
}


/* ======================================================
 INDEX
====================================================== */

function buildPairIndex() {

    pairIndex.clear();

    for (const match of allMatches) {

        if (!match.home || !match.away) {
            continue;
        }

        const key =
            pairKey(
                match.home,
                match.away
            );

        if (!pairIndex.has(key)) {
            pairIndex.set(key, []);
        }

        pairIndex
            .get(key)
            .push(match);
    }
}


/* ======================================================
 HEDEF MAÇI BUL
====================================================== */

/*
Aynı takımlar birden fazla maç yapabilir.

Bu fonksiyon ilk eşleşmeyi körlemesine almıyor.
*/
function findTargetMatch(home, away, expectedResult) {

    const candidates =
        pairIndex.get(
            pairKey(home, away)
        ) || [];

    if (!candidates.length) {
        return null;
    }

    /*
    Sonucu bilinen geçmiş maçlarda,
    Spor Toto'daki gerçek sonuçla eşleşen
    adayları önceliklendir.
    */
    let filtered =
        expectedResult
            ? candidates.filter(
                m =>
                    getMatchResult(m) ===
                    expectedResult
              )
            : [];

    if (!filtered.length) {
        filtered = candidates.slice();
    }

    /*
    Açılış oranı bulunan maçları tercih et.
    */
    const withOpeningOdds =
        filtered.filter(
            m =>
                m &&
                m.openingOdds &&
                Object.keys(
                    m.openingOdds
                ).some(
                    key =>
                        parseOdd(
                            m.openingOdds[key]
                        ) !== null
                )
        );

    if (withOpeningOdds.length) {
        filtered = withOpeningOdds;
    }

    /*
    Birden fazla aday varsa tarih sıralaması.
    */
    filtered.sort(
        (a, b) => {

            const da =
                parseDate(a.date);

            const db =
                parseDate(b.date);

            if (!da && !db) {
                return 0;
            }

            if (!da) {
                return 1;
            }

            if (!db) {
                return -1;
            }

            return (
                db.getTime() -
                da.getTime()
            );
        }
    );

    return filtered[0] || null;
}


/* ======================================================
 TARİHSEL VERİ
====================================================== */

function getHistory(targetMatch) {

    const targetDate =
        dateOnly(
            targetMatch.date
        );

    /*
    Hedef tarih yoksa son 60 gün.
    */
    if (!targetDate) {

        const now =
            new Date();

        const start =
            new Date(now);

        start.setDate(
            start.getDate() -
            HISTORY_DAYS
        );

        return historicalMatches.filter(
            match => {

                const d =
                    dateOnly(match.date);

                return (
                    d &&
                    d >= start &&
                    d <= now
                );
            }
        );
    }

    const start =
        new Date(targetDate);

    start.setDate(
        start.getDate() -
        HISTORY_DAYS
    );

    /*
    Hedef maç dahil edilmiyor.
    */
    return historicalMatches.filter(
        match => {

            const d =
                dateOnly(match.date);

            if (!d) {
                return false;
            }

            if (
                d < start ||
                d >= targetDate
            ) {
                return false;
            }

            return Boolean(
                getMatchResult(match)
            );
        }
    );
}


/* ======================================================
 ODDS INDEX
====================================================== */

function buildOddsIndex(history) {

    const index =
        new Map();

    for (const match of history) {

        const result =
            getMatchResult(match);

        if (!result) {
            continue;
        }

        const odds =
            match.openingOdds || {};

        for (const market of MARKETS) {

            const odd =
                parseOdd(
                    odds[market]
                );

            if (odd === null) {
                continue;
            }

            const key =
                market +
                "|" +
                oddKey(odd);

            let bucket =
                index.get(key);

            if (!bucket) {

                bucket = {
                    "1": 0,
                    "X": 0,
                    "2": 0,
                    n: 0
                };

                index.set(
                    key,
                    bucket
                );
            }

            bucket[result]++;
            bucket.n++;
        }
    }

    return index;
}


/* ======================================================
 BAYESIAN
====================================================== */

function bayesian(bucket) {

    if (
        !bucket ||
        bucket.n < MIN_SAMPLE
    ) {
        return null;
    }

    const n =
        bucket.n;

    /*
    Jeffreys prior:

    (sonuç sayısı + 0.5)
    --------------------
       N + 1.5
    */

    const denominator =
        n +
        BAYES_ALPHA * 3;

    return {

        p1:
            (
                bucket["1"] +
                BAYES_ALPHA
            ) / denominator,

        px:
            (
                bucket["X"] +
                BAYES_ALPHA
            ) / denominator,

        p2:
            (
                bucket["2"] +
                BAYES_ALPHA
            ) / denominator,

        n
    };
}


/* ======================================================
 AĞIRLIK
====================================================== */

function calculateWeight(n) {

    /*
    İSTENEN FORMÜL:

    √N × N/(N+20)
    */

    return (
        Math.sqrt(n) *
        (
            n /
            (n + CONFIDENCE_K)
        )
    );
}


/* ======================================================
 DOĞRUDAN MS ORANI
====================================================== */

/*
Tarihsel exact-odd örneği bulunmadığında
1/X/2 arasında anlamsız şekilde 1'e düşmemesi
için doğrudan MS açılış oranı kullanılabilir.

Bu bir ekstra tarihsel ağırlık değildir.
Sadece veri hiç oluşmadığında fallback'tir.
*/
function directMS(target) {

    if (
        !target ||
        !target.openingOdds
    ) {
        return null;
    }

    const o1 =
        parseOdd(
            target.openingOdds.ms1
        );

    const ox =
        parseOdd(
            target.openingOdds.msX
        );

    const o2 =
        parseOdd(
            target.openingOdds.ms2
        );

    if (
        o1 === null ||
        ox === null ||
        o2 === null
    ) {
        return null;
    }

    let p1 =
        1 / o1;

    let px =
        1 / ox;

    let p2 =
        1 / o2;

    const total =
        p1 + px + p2;

    if (total <= 0) {
        return null;
    }

    p1 /= total;
    px /= total;
    p2 /= total;

    return {
        p1,
        px,
        p2
    };
}


/* ======================================================
 ANA HESAPLAMA
====================================================== */

function calculatePrediction(target) {

    const history =
        getHistory(target);

    /*
    Aynı tarihsel geçmiş için tek index.
    */
    const oddsIndex =
        buildOddsIndex(history);

    let weighted1 = 0;
    let weightedX = 0;
    let weighted2 = 0;

    let totalWeight = 0;

    /*
    BÜTÜN MARKETLER.

    Her market:
    - hedef açılış oranını alır
    - geçmişte aynı oranı arar
    - N >= 5 ise Bayesian hesaplar
    - √N × N/(N+20) ağırlığı verir
    */

    const odds =
        target.openingOdds || {};

    for (const market of MARKETS) {

        const targetOdd =
            parseOdd(
                odds[market]
            );

        if (targetOdd === null) {
            continue;
        }

        const key =
            market +
            "|" +
            oddKey(targetOdd);

        const bucket =
            oddsIndex.get(key);

        if (!bucket) {
            continue;
        }

        /*
        Minimum örnek 5.
        */
        if (
            bucket.n <
            MIN_SAMPLE
        ) {
            continue;
        }

        const probability =
            bayesian(bucket);

        if (!probability) {
            continue;
        }

        /*
        TAM OLARAK:

        √N × N/(N+20)
        */
        const weight =
            calculateWeight(
                probability.n
            );

        weighted1 +=
            probability.p1 *
            weight;

        weightedX +=
            probability.px *
            weight;

        weighted2 +=
            probability.p2 *
            weight;

        totalWeight +=
            weight;
    }


    /*
    Hiçbir markette yeterli örnek yok.
    */
    if (totalWeight <= 0) {

        const direct =
            directMS(target);

        if (!direct) {

            return {
                prediction: null,
                p1: 0,
                px: 0,
                p2: 0
            };
        }

        return choosePrediction(
            direct.p1,
            direct.px,
            direct.p2
        );
    }


    /*
    AĞIRLIKLI SONUÇ
    */

    let p1 =
        weighted1 /
        totalWeight;

    let px =
        weightedX /
        totalWeight;

    let p2 =
        weighted2 /
        totalWeight;


    /*
    Sonuçların toplamını 1 yap.
    */
    const total =
        p1 + px + p2;

    if (total > 0) {

        p1 /= total;
        px /= total;
        p2 /= total;
    }


    return choosePrediction(
        p1,
        px,
        p2
    );
}


/* ======================================================
 1 / X / 2 SEÇ
====================================================== */

function choosePrediction(
    p1,
    px,
    p2
) {

    let prediction = "1";
    let max = p1;

    if (px > max) {

        max = px;
        prediction = "X";
    }

    if (p2 > max) {

        max = p2;
        prediction = "2";
    }

    return {
        prediction,
        p1,
        px,
        p2
    };
}


/* ======================================================
 HTML ESCAPE
====================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ======================================================
 MAÇ ÇİZ
====================================================== */

function renderMatch(match) {

    const target =
        findTargetMatch(
            match.home,
            match.away,
            match.result
        );

    let prediction = null;

    if (target) {

        const result =
            calculatePrediction(
                target
            );

        prediction =
            result.prediction;
    }

    /*
    Geçmiş sonuç doğrudan
    spor-toto-data.js'den.
    */
    const actual =
        match.result || null;

    let symbol = "•";
    let className = "pending";

    if (actual) {

        if (
            prediction &&
            prediction === actual
        ) {

            symbol = "✓";
            className = "correct";

        } else {

            symbol = "✕";
            className = "wrong";
        }
    }

    const card =
        document.createElement("div");

    card.className =
        "match";

    let scoreHtml = "";

    if (
        target &&
        target.score &&
        target.score.home !== null &&
        target.score.away !== null
    ) {

        scoreHtml = `
            <div class="score">
                Skor:
                ${escapeHtml(target.score.home)}
                -
                ${escapeHtml(target.score.away)}
            </div>
        `;
    }

    card.innerHTML = `

        <div class="teams">

            <div class="team">
                ${escapeHtml(match.home)}
            </div>

            <div class="team">
                ${escapeHtml(match.away)}
            </div>

            ${scoreHtml}

        </div>

        <div class="prediction">
            ${prediction || "—"}
        </div>

        <div class="check ${className}">
            ${symbol}
        </div>
    `;

    return card;
}


/* ======================================================
 HAFTA GÖSTER
====================================================== */

function renderWeek() {

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    const matches =
        weeks[selectedWeek] || [];

    weekTitle.textContent =
        `${selectedWeek}. Hafta`;

    matchesContainer.innerHTML = "";

    if (!matches.length) {

        matchesContainer.innerHTML =
            `<div class="empty">
                Bu haftada maç bulunamadı.
             </div>`;

        return;
    }

    let played = 0;

    for (const match of matches) {

        if (match.result) {
            played++;
        }

        matchesContainer.appendChild(
            renderMatch(match)
        );
    }

    const pending =
        matches.length - played;

    statusText.textContent =
        `${matches.length} maç • ${played} sonuçlanmış • ${pending} bekliyor`;
}


/* ======================================================
 HAFTALARI YÜKLE
====================================================== */

function buildWeeks() {

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    const numbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a, b) => a - b
            );

    weekSelect.innerHTML = "";

    for (const week of numbers) {

        const option =
            document.createElement("option");

        option.value =
            week;

        option.textContent =
            `${week}. Hafta`;

        weekSelect.appendChild(
            option
        );
    }

    const current =
        Number(
            window.SPORT_TOTO_DATA?.currentWeek
        );

    if (weeks[current]) {

        selectedWeek =
            current;

    } else {

        selectedWeek =
            numbers[
                numbers.length - 1
            ];
    }

    weekSelect.value =
        selectedWeek;
}


/* ======================================================
 MACKOLIK VERİLERİNİ YÜKLE
====================================================== */

async function loadMatches() {

    matchesContainer.innerHTML =
        `<div class="loading">
            Mackolik verileri yükleniyor...
         </div>`;

    statusText.textContent =
        "Veriler hazırlanıyor...";

    try {

        const response =
            await fetch(
                MATCHES_URL +
                "?v=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "matches.json yüklenemedi."
            );
        }

        const data =
            await response.json();

        allMatches =
            Array.isArray(data.matches)
                ? data.matches
                : [];

        /*
        Sadece sonuçlanmış ve openingOdds
        bulunan maçlar tarihsel örneklem olur.
        */
        historicalMatches =
            allMatches.filter(
                match =>
                    match &&
                    match.openingOdds &&
                    getMatchResult(match)
            );

        buildPairIndex();

        statusText.textContent =
            `${allMatches.length} Mackolik maçı yüklendi.`;

        renderWeek();

    } catch (error) {

        console.error(error);

        matchesContainer.innerHTML =
            `<div class="error">
                Veri yüklenemedi.<br><br>
                ${escapeHtml(error.message)}
             </div>`;

        statusText.textContent =
            "Veri yükleme hatası.";
    }
}
