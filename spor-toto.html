<header>

<script>
"use strict";
/* =========================================================
   AYARLAR
========================================================= */
const DATA_URL =
    "./data/matches.json";
const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;
/*
 * SADECE BU 5 ORAN ÖRNEKLEM OLARAK KULLANILIR
 */
const MARKETS = [
    {
        key:"iy15Ust",
        name:"İY 1.5 Üst"
    },
    {
        key:"iy1",
        name:"İY 1"
    },
    {
        key:"iy2",
        name:"İY 2"
    },
    {
        key:"au15Alt",
        name:"1.5 Alt"
    },
    {
        key:"au15Ust",
        name:"1.5 Üst"
    }
];
let allMatches = [];
let selectedWeek = null;
/* =========================================================
   DOM
========================================================= */
const $ = id =>
    document.getElementById(id);
/* =========================================================
   HTML
========================================================= */
function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
/* =========================================================
   DEĞER OKUMA
========================================================= */
function getValue(obj, keys){
    if(
        !obj ||
        typeof obj !== "object"
    ){
        return undefined;
    }
    for(
        const key of keys
    ){
        if(
            obj[key] !== undefined &&
            obj[key] !== null &&
            obj[key] !== ""
        ){
            return obj[key];
        }
    }
    return undefined;
}
/* =========================================================
   TARİH
========================================================= */
function parseDate(value){
    if(!value){
        return null;
    }
    if(value instanceof Date){
        if(
            Number.isNaN(
                value.getTime()
            )
        ){
            return null;
        }
        return new Date(
            value.getFullYear(),
            value.getMonth(),
            value.getDate()
        );
    }
    const text =
        String(value).trim();
    let m =
        text.match(
            /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/
        );
    if(m){
        return new Date(
            Number(m[3]),
            Number(m[2])-1,
            Number(m[1])
        );
    }
    m =
        text.match(
            /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/
        );
    if(m){
        return new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );
    }
    const d =
        new Date(text);
    if(
        Number.isNaN(
            d.getTime()
        )
    ){
        return null;
    }
    return new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
    );
}
/* =========================================================
   MAÇ TARİHİ
========================================================= */
function getDate(match){
    return getValue(
        match,
        [
            "date",
            "Date",
            "tarih",
            "Tarih",
            "matchDate",
            "match_date"
        ]
    );
}
/* =========================================================
   TAKIM
========================================================= */
function getHome(match){
    return getValue(
        match,
        [
            "home",
            "Home",
            "homeTeam",
            "home_team",
            "ev",
            "Ev"
        ]
    ) || "";
}
function getAway(match){
    return getValue(
        match,
        [
            "away",
            "Away",
            "awayTeam",
            "away_team",
            "deplasman",
            "Deplasman"
        ]
    ) || "";
}
/* =========================================================
   SKOR
   Mackolik'teki farklı skor yapılarını destekler
========================================================= */
function parseScore(value){
    if(
        value === undefined ||
        value === null ||
        value === ""
    ){
        return null;
    }
    /*
     * {home:0, away:1}
     */
    if(
        typeof value === "object"
    ){
        const home =
            getValue(
                value,
                [
                    "home",
                    "Home",
                    "ev",
                    "h"
                ]
            );
        const away =
            getValue(
                value,
                [
                    "away",
                    "Away",
                    "deplasman",
                    "a"
                ]
            );
        if(
            home !== undefined &&
            away !== undefined
        ){
            const h =
                Number(home);
            const a =
                Number(away);
            if(
                Number.isFinite(h) &&
                Number.isFinite(a)
            ){
                return {
                    home:h,
                    away:a
                };
            }
        }
    }
    /*
     * "2-1"
     * "2 : 1"
     */
    const text =
        String(value)
            .trim();
    const match =
        text.match(
            /(\d+)\s*[-:]\s*(\d+)/
        );
    if(!match){
        return null;
    }
    return {
        home:Number(match[1]),
        away:Number(match[2])
    };
}
/* =========================================================
   MAÇ SKORU
========================================================= */
function getFullTimeScore(match){
    const value =
        getValue(
            match,
            [
                "score",
                "Score",
                "fullTimeScore",
                "fulltimeScore",
                "ftScore",
                "ft",
                "FT",
                "fullTime",
                "FullTime",
                "ms",
                "MS",
                "macSonucu",
                "MaçSonucu"
            ]
        );
    return parseScore(value);
}
/* =========================================================
   MAÇ OYNANDI MI?
========================================================= */
function isPlayed(match){
    const score =
        getFullTimeScore(match);
    return !!score;
}
/* =========================================================
   MAÇ SONUCU
========================================================= */
function getResult(match){
    const score =
        getFullTimeScore(match);
    /*
     * SKOR YOKSA KESİNLİKLE
     * SONUÇ YOK.
     */
    if(!score){
        return null;
    }
    if(
        score.home >
        score.away
    ){
        return "1";
    }
    if(
        score.home <
        score.away
    ){
        return "2";
    }
    return "X";
}
/* =========================================================
   ORAN NORMALİZASYONU
========================================================= */
function normalizeOdd(value){
    if(
        value === undefined ||
        value === null ||
        value === ""
    ){
        return null;
    }
    const number =
        Number(
            String(value)
                .replace(",",".")
                .trim()
        );
    if(
        !Number.isFinite(number)
    ){
        return null;
    }
    /*
     * 1.7 ve 1.70 AYNI kabul edilir.
     *
     * Ama 1.71 ile 1.70 eşleşmez.
     */
    return number.toFixed(2);
}
/* =========================================================
   AÇILIŞ ORANI
========================================================= */
function getOpeningOdds(
    match,
    key
){
    const containers = [
        match?.openingOdds,
        match?.opening_odds,
        match?.opening,
        match?.odds,
        match?.Odds,
        match?.oranlar,
        match?.Oranlar
    ];
    for(
        const container
        of containers
    ){
        if(
            !container ||
            typeof container !== "object"
        ){
            continue;
        }
        const value =
            getValue(
                container,
                [
                    key
                ]
            );
        if(
            value !== undefined
        ){
            return normalizeOdd(
                value
            );
        }
    }
    /*
     * Bazı kayıtlarda oran doğrudan
     * maç nesnesinde olabilir.
     */
    const direct =
        getValue(
            match,
            [
                key
            ]
        );
    return normalizeOdd(
        direct
    );
}
/* =========================================================
   TAKIM NORMALİZASYONU
========================================================= */
const ALIASES = {
    "kuzey":"k",
    "k":"k",
    "cumhuriyeti":"",
    "borussia":"bor",
    "bor":"bor",
    "united":"utd",
    "utd":"utd",
    "manchester":"man",
    "man":"man",
    "vfb":"vfb",
    "rb":"rb",
    "st":"saint",
    "saint":"saint",
    "paris":"paris",
    "germain":"germain"
};
const IGNORE = new Set([
    "fk",
    "fc",
    "sc",
    "sk",
    "as",
    "cf",
    "afc",
    "club",
    "spor",
    "futbol",
    "takimi",
    "kulubu"
]);
function normalizeTeam(name){
    let words =
        String(name ?? "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"")
            .replace(/ı/g,"i")
            .replace(/ş/g,"s")
            .replace(/ğ/g,"g")
            .replace(/ü/g,"u")
            .replace(/ö/g,"o")
            .replace(/ç/g,"c")
            .replace(/[^a-z0-9\s]/g," ")
            .split(/\s+/)
            .filter(Boolean);
    words =
        words
            .filter(
                word =>
                    !IGNORE.has(word)
            )
            .map(
                word =>
                    ALIASES[word] !== undefined
                        ? ALIASES[word]
                        : word
            )
            .filter(Boolean);
    return words;
}
/* =========================================================
   TAKIM BENZERLİĞİ
========================================================= */
function teamSimilarity(a,b){
    const aa =
        normalizeTeam(a);
    const bb =
        normalizeTeam(b);
    if(
        !aa.length ||
        !bb.length
    ){
        return 0;
    }
    if(
        aa.join(" ") ===
        bb.join(" ")
    ){
        return 1;
    }
    let matchesA = 0;
    for(
        const wordA
        of aa
    ){
        if(
            bb.some(
                wordB => {
                    if(
                        wordA === wordB
                    ){
                        return true;
                    }
                    if(
                        wordA.length >= 4 &&
                        wordB.length >= 4
                    ){
                        return (
                            wordA.startsWith(wordB) ||
                            wordB.startsWith(wordA)
                        );
                    }
                    return false;
                }
            )
        ){
            matchesA++;
        }
    }
    let matchesB = 0;
    for(
        const wordB
        of bb
    ){
        if(
            aa.some(
                wordA =>
                    wordA === wordB ||
                    (
                        wordA.length >= 4 &&
                        wordB.length >= 4 &&
                        (
                            wordA.startsWith(wordB) ||
                            wordB.startsWith(wordA)
                        )
                    )
            )
        ){
            matchesB++;
        }
    }
    return (
        (
            matchesA / aa.length
        ) +
        (
            matchesB / bb.length
        )
    ) / 2;
}
/* =========================================================
   MACKOLIK MAÇI BUL
========================================================= */
function findMackolikMatch(
    sportMatch
){
    const sportHome =
        getHome(
            sportMatch
        );
    const sportAway =
        getAway(
            sportMatch
        );
    const sportDate =
        parseDate(
            sportMatch.date
        );
    const candidates =
        allMatches
            .map(
                match => {
                    const homeScore =
                        teamSimilarity(
                            sportHome,
                            getHome(match)
                        );
                    const awayScore =
                        teamSimilarity(
                            sportAway,
                            getAway(match)
                        );
                    /*
                     * Ev/deplasman sırası korunuyor.
                     */
                    if(
                        homeScore < 0.5 ||
                        awayScore < 0.5
                    ){
                        return null;
                    }
                    const nameScore =
                        (
                            homeScore +
                            awayScore
                        ) / 2;
                    const matchDate =
                        parseDate(
                            getDate(match)
                        );
                    let dateDiff =
                        Number.MAX_SAFE_INTEGER;
                    if(
                        sportDate &&
                        matchDate
                    ){
                        dateDiff =
                            Math.abs(
                                sportDate -
                                matchDate
                            );
                    }
                    return {
                        match,
                        nameScore,
                        dateDiff
                    };
                }
            )
            .filter(Boolean);
    if(
        !candidates.length
    ){
        return null;
    }
    candidates.sort(
        (a,b) => {
            /*
             * İsim eşleşmesi birinci.
             */
            if(
                b.nameScore !==
                a.nameScore
            ){
                return (
                    b.nameScore -
                    a.nameScore
                );
            }
            /*
             * Tarih ikinci.
             */
            return (
                a.dateDiff -
                b.dateDiff
            );
        }
    );
    return candidates[0].match;
}
/* =========================================================
   GEÇMİŞ 60 GÜN
========================================================= */
function getHistory(
    targetDate
){
    const target =
        parseDate(
            targetDate
        );
    if(!target){
        return [];
    }
    const start =
        new Date(target);
    start.setDate(
        start.getDate() -
        HISTORY_DAYS
    );
    return allMatches.filter(
        match => {
            const date =
                parseDate(
                    getDate(match)
                );
            if(!date){
                return false;
            }
            /*
             * Hedef maçtan önceki
             * 60 gün.
             */
            if(
                date < start ||
                date >= target
            ){
                return false;
            }
            /*
             * SKORU OLMAYAN MAÇ
             * ÖRNEKLEMEYE GİREMEZ.
             */
            if(
                !isPlayed(match)
            ){
                return false;
            }
            /*
             * 0-0 gerçek bir sonuçtur.
             * Burada false yapılmıyor.
             */
            return true;
        }
    );
}
/* =========================================================
   BİREBİR ORAN ÖRNEKLEMİ
========================================================= */
function getSamples(
    history,
    marketKey,
    targetOdd
){
    if(!targetOdd){
        return [];
    }
    return history.filter(
        match => {
            const historicalOdd =
                getOpeningOdds(
                    match,
                    marketKey
                );
            /*
             * TAM ORAN EŞLEŞMESİ
             */
            return (
                historicalOdd ===
                targetOdd
            );
        }
    );
}
/* =========================================================
   ORTAK TAHMİN
========================================================= */
function calculatePrediction(
    sportMatch,
    mackolikMatch
){
    if(!mackolikMatch){
        return {
            p1:0,
            px:0,
            p2:0,
            main:null,
            system:"1X2",
            markets:0,
            samples:0
        };
    }
    /*
     * HEDEF TARİH:
     *
     * Spor Toto maçında tarih varsa
     * onu kullan.
     *
     * Yoksa Mackolik tarihini kullan.
     */
    const targetDate =
        sportMatch.date ||
        getDate(
            mackolikMatch
        );
    const history =
        getHistory(
            targetDate
        );
    let score1 = 0;
    let scoreX = 0;
    let score2 = 0;
    let totalWeight = 0;
    let validMarkets = 0;
    let totalSamples = 0;
    for(
        const market
        of MARKETS
    ){
        const targetOdd =
            getOpeningOdds(
                mackolikMatch,
                market.key
            );
        if(!targetOdd){
            continue;
        }
        const samples =
            getSamples(
                history,
                market.key,
                targetOdd
            );
        /*
         * En az 5.
         */
        if(
            samples.length <
            MIN_SAMPLE
        ){
            continue;
        }
        let one = 0;
        let draw = 0;
        let two = 0;
        for(
            const historical
            of samples
        ){
            const result =
                getResult(
                    historical
                );
            if(
                result === "1"
            ){
                one++;
            }
            else if(
                result === "X"
            ){
                draw++;
            }
            else if(
                result === "2"
            ){
                two++;
            }
        }
        const total =
            one +
            draw +
            two;
        if(
            total <
            MIN_SAMPLE
        ){
            continue;
        }
        /*
         * sqrt örneklem ağırlığı.
         */
        const weight =
            Math.sqrt(total);
        score1 +=
            (
                one / total
            ) * weight;
        scoreX +=
            (
                draw / total
            ) * weight;
        score2 +=
            (
                two / total
            ) * weight;
        totalWeight +=
            weight;
        validMarkets++;
        totalSamples +=
            total;
    }
    /*
     * Hiç örneklem yok.
     */
    if(
        totalWeight === 0
    ){
        return {
            p1:0,
            px:0,
            p2:0,
            main:null,
            system:"1X2",
            markets:0,
            samples:0
        };
    }
    let p1 =
        score1 /
        totalWeight *
        100;
    let px =
        scoreX /
        totalWeight *
        100;
    let p2 =
        score2 /
        totalWeight *
        100;
    /*
     * Yuvarlama hatasını önle.
     */
    const sum =
        p1 +
        px +
        p2;
    if(
        sum > 0 &&
        Math.abs(sum - 100) > 0.01
    ){
        p1 =
            p1 /
            sum *
            100;
        px =
            px /
            sum *
            100;
        p2 =
            p2 /
            sum *
            100;
    }
    const results = [
        {
            key:"1",
            value:p1
        },
        {
            key:"X",
            value:px
        },
        {
            key:"2",
            value:p2
        }
    ];
    results.sort(
        (a,b) =>
            b.value -
            a.value
    );
    const first =
        results[0];
    const second =
        results[1];
    const gap =
        first.value -
        second.value;
    let system;
    /*
     * TEK
     */
    if(
        first.value >= 50 &&
        gap >= 15
    ){
        system =
            first.key;
    }
    /*
     * ÇİFT
     */
    else if(
        first.value >= 40 &&
        gap >= 7
    ){
        system =
            first.key +
            second.key;
    }
    /*
     * ÜÇLÜ
     */
    else{
        system =
            "1X2";
    }
    return {
        p1,
        px,
        p2,
        main:
            first.key,
        system,
        markets:
            validMarkets,
        samples:
            totalSamples
    };
}
/* =========================================================
   SİSTEM TUTTU MU?
========================================================= */
function isSystemHit(
    system,
    result
){
    if(
        !system ||
        !result
    ){
        return false;
    }
    system =
        system
            .replace(/\s/g,"")
            .toUpperCase();
    result =
        result
            .toUpperCase();
    if(
        system === "1X2"
    ){
        return true;
    }
    return system.includes(
        result
    );
}
/* =========================================================
   SONUÇ DURUMU
========================================================= */
function getStatus(
    sportMatch,
    prediction,
    mackolikMatch
){
    /*
     * ÖNEMLİ:
     *
     * Spor Toto DATA'daki sonuç varsa
     * onu kullanıyoruz.
     *
     * Böylece geçmiş haftalarda
     * Mackolik yanlış eşleşse bile
     * sonuç değişmez.
     */
    const stored =
        String(
            sportMatch?.result ?? ""
        )
            .trim()
            .toUpperCase();
    let actual =
        null;
    if(
        stored === "1" ||
        stored === "X" ||
        stored === "2"
    ){
        actual =
            stored;
    }
    /*
     * Sadece Spor Toto sonucu yoksa
     * Mackolik skoruna bak.
     */
    else if(
        mackolikMatch
    ){
        actual =
            getResult(
                mackolikMatch
            );
    }
    /*
     * SONUÇ YOKSA
     * ASLA TUTTU DEME.
     */
    if(!actual){
        return {
            type:"wait",
            icon:"•"
        };
    }
    if(
        isSystemHit(
            prediction.system,
            actual
        )
    ){
        return {
            type:"hit",
            icon:"✓"
        };
    }
    return {
        type:"miss",
        icon:"✕"
    };
}
/* =========================================================
   SONUÇ ROZETİ
========================================================= */
function resultBadge(
    status
){
    if(
        status.type === "hit"
    ){
        return `
            <span
                class="result-badge result-hit"
                title="Tuttu">
                ✓
            </span>
        `;
    }
    if(
        status.type === "miss"
    ){
        return `
            <span
                class="result-badge result-miss"
                title="Tutmadı">
                ✕
            </span>
        `;
    }
    return `
        <span
            class="result-badge result-wait"
            title="Sonuç bekleniyor">
            •
        </span>
    `;
}
/* =========================================================
   SİSTEM SINIFI
========================================================= */
function systemClass(
    system
){
    if(
        system === "1" ||
        system === "X" ||
        system === "2"
    ){
        return "single";
    }
    if(
        system === "1X2"
    ){
        return "triple";
    }
    return "double";
}
/* =========================================================
   YÜZDE
========================================================= */
function percent(value){
    return (
        Number(value || 0)
            .toFixed(0)
    ) + "%";
}
/* =========================================================
   MAÇ
========================================================= */
function renderMatch(
    sportMatch,
    index
){
    const mackolik =
        findMackolikMatch(
            sportMatch
        );
    /*
     * Mackolik maçı bulunamadı.
     */
    if(!mackolik){
        return `
            <div class="match">
                <div class="match-top">
                    <div class="number">
                        ${index + 1}
                    </div>
                    <div class="teams">
                        ${escapeHtml(
                            getHome(
                                sportMatch
                            )
                        )}
                        -
                        ${escapeHtml(
                            getAway(
                                sportMatch
                            )
                        )}
                    </div>
                    <div class="main-pred">
                        -
                    </div>
                    <div class="result-badge result-wait">
                        •
                    </div>
                    <div class="system triple">
                        1X2
                    </div>
                </div>
                <div class="no-data">
                    Mackolik eşleşmesi bulunamadı.
                </div>
            </div>
        `;
    }
    const prediction =
        calculatePrediction(
            sportMatch,
            mackolik
        );
    const status =
        getStatus(
            sportMatch,
            prediction,
            mackolik
        );
    /*
     * Hiç örneklem yoksa
     * tahmin gösterme.
     *
     * Böylece her maçta otomatik
     * 1 görünmesi engellenir.
     */
    const hasPrediction =
        prediction.markets > 0;
    return `
        <div class="match">
            <div class="match-top">
                <div class="number">
                    ${index + 1}
                </div>
                <div class="teams">
                    ${escapeHtml(
                        getHome(
                            sportMatch
                        )
                    )}
                    -
                    ${escapeHtml(
                        getAway(
                            sportMatch
                        )
                    )}
                </div>
                <div class="main-pred">
                    ${
                        hasPrediction
                            ? prediction.main
                            : "-"
                    }
                </div>
                ${resultBadge(
                    status
                )}
                <div class="system ${
                    hasPrediction
                        ? systemClass(
                            prediction.system
                        )
                        : "triple"
                }">
                    ${
                        hasPrediction
                            ? prediction.system
                            : "-"
                    }
                </div>
            </div>
            <div class="percentages">
                <div class="percent">
                    1
                    <b>
                        ${
                            hasPrediction
                                ? percent(
                                    prediction.p1
                                )
                                : "-"
                        }
                    </b>
                </div>
                <div class="percent">
                    X
                    <b>
                        ${
                            hasPrediction
                                ? percent(
                                    prediction.px
                                )
                                : "-"
                        }
                    </b>
                </div>
                <div class="percent">
                    2
                    <b>
                        ${
                            hasPrediction
                                ? percent(
                                    prediction.p2
                                )
                                : "-"
                        }
                    </b>
                </div>
            </div>
            <div class="confidence">
                ${
                    hasPrediction
                        ? `
                            <b>
                                ${prediction.main}
                            </b>
                            ana tahmin
                            •
                            Sistem:
                            <b>
                                ${prediction.system}
                            </b>
                            •
                            ${prediction.markets}
                            / ${MARKETS.length}
                            oran türü
                            •
                            ${prediction.samples}
                            geçmiş örneklem
                        `
                        : `
                            Bu maç için
                            en az ${MIN_SAMPLE}
                            birebir geçmiş oran
                            örneklemi bulunamadı.
                            Tahmin üretilmedi.
                        `
                }
            </div>
        </div>
    `;
}
/* =========================================================
   ÖZET
========================================================= */
function renderSummary(
    total,
    hit,
    miss,
    waiting
){
    const played =
        hit + miss;
    const success =
        played > 0
            ? (
                hit /
                played *
                100
            )
            : 0;
    return `
        <div class="result-summary">
            <div class="result-summary-title">
                📊 Tahmin Sonuçları
            </div>
            <div class="result-summary-items">
                <div class="result-summary-item">
                    <strong>
                        ${total}
                    </strong>
                    <small>
                        Toplam
                    </small>
                </div>
                <div class="result-summary-item summary-hit">
                    <strong>
                        ${hit}
                    </strong>
                    <small>
                        ✓ Tuttu
                    </small>
                </div>
                <div class="result-summary-item summary-miss">
                    <strong>
                        ${miss}
                    </strong>
                    <small>
                        ✕ Tutmadı
                    </small>
                </div>
                <div class="result-summary-item summary-success">
                    <strong>
                        ${
                            success.toFixed(1)
                        }%
                    </strong>
                    <small>
                        Başarı
                    </small>
                </div>
            </div>
        </div>
    `;
}
/* =========================================================
   HAFTA
========================================================= */
function getWeekMatches(
    week
){
    const data =
        window.SPORT_TOTO_DATA
            ?.weeks
            ?. [week];
    if(
        Array.isArray(data)
    ){
        return data;
    }
    if(
        Array.isArray(
            data?.matches
        )
    ){
        return data.matches;
    }
    return [];
}
/* =========================================================
   HAFTAYI GÖSTER
========================================================= */
function renderWeek(){
    const matches =
        getWeekMatches(
            selectedWeek
        );
    if(!matches.length){
        $("content").innerHTML = `
            <div class="error">
                ${selectedWeek}. hafta verisi bulunamadı.
            </div>
        `;
        return;
    }
    let hit = 0;
    let miss = 0;
    let waiting = 0;
    for(
        const sportMatch
        of matches
    ){
        const mackolik =
            findMackolikMatch(
                sportMatch
            );
        /*
         * SONUÇ KONTROLÜ:
         *
         * Stored result varsa
         * onu esas al.
         *
         * Yoksa Mackolik skoruna bak.
         */
        const prediction =
            calculatePrediction(
                sportMatch,
                mackolik
            );
        const status =
            getStatus(
                sportMatch,
                prediction,
                mackolik
            );
        if(
            status.type === "hit"
        ){
            hit++;
        }
        else if(
            status.type === "miss"
        ){
            miss++;
        }
        else{
            waiting++;
        }
    }
    $("content").innerHTML = `
        ${renderSummary(
            matches.length,
            hit,
            miss,
            waiting
        )}
        <div class="info">
            <div class="info-title">
                Spor Toto ${selectedWeek}. Hafta
            </div>
            <div class="info-text">
                Mackolik açılış oranları üzerinden
                son ${HISTORY_DAYS} gün içindeki
                birebir oran eşleşmeleri kullanılır.
                Minimum örneklem ${MIN_SAMPLE}'tir.
                Geçmiş haftaların gerçek sonuçları
                Spor Toto veri dosyasından alınır.
            </div>
        </div>
        <div class="coupon">
            <div class="coupon-head">
                <strong>
                    Ortak Karar Kuponu
                </strong>
                <div class="summary">
                    <span class="badge">
                        15 Maç
                    </span>
                    <span class="badge">
                        Min. ${MIN_SAMPLE} örnek
                    </span>
                    <span class="badge">
                        60 Gün
                    </span>
                </div>
            </div>
            ${
                matches
                    .map(
                        (match,index) =>
                            renderMatch(
                                match,
                                index
                            )
                    )
                    .join("")
            }
        </div>
    `;
}
/* =========================================================
   HAFTA BUTONLARI
========================================================= */
function renderWeeks(){
    const weeks =
        window.SPORT_TOTO_DATA
            ?.weeks || {};
    const numbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a,b) => a - b
            );
    $("weeks").innerHTML =
        numbers
            .map(
                week => `
                    <button
                        class="week-btn ${
                            Number(week) ===
                            Number(selectedWeek)
                                ? "active"
                                : ""
                        }"
                        data-week="${week}">
                        ${week}. Hafta
                    </button>
                `
            )
            .join("");
    document
        .querySelectorAll(
            ".week-btn"
        )
        .forEach(
            button => {
                button.onclick =
                    () => {
                        selectedWeek =
                            Number(
                                button.dataset.week
                            );
                        renderWeeks();
                        renderWeek();
                    };
            }
        );
}
/* =========================================================
   MACKOLIK VERİSİNİ ÇEK
========================================================= */
async function loadData(){
    const response =
        await fetch(
            DATA_URL +
            "?t=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );
    if(!response.ok){
        throw new Error(
            "Mackolik skor verisi alınamadı. HTTP " +
            response.status
        );
    }
    const json =
        await response.json();
    if(
        !json ||
        !Array.isArray(
            json.matches
        )
    ){
        throw new Error(
            "matches.json içinde maç verisi bulunamadı."
        );
    }
    allMatches =
        json.matches;
    console.log(
        "Mackolik veri:",
        allMatches.length,
        "maç"
    );
}
/* =========================================================
   BAŞLAT
========================================================= */
async function init(){
    try{
        if(
            !window.SPORT_TOTO_DATA
        ){
            throw new Error(
                "data/spor-toto-data.js yüklenemedi."
            );
        }
        const weeks =
            window.SPORT_TOTO_DATA
                .weeks || {};
        const numbers =
            Object.keys(weeks)
                .map(Number)
                .sort(
                    (a,b) => a - b
                );
        selectedWeek =
            Number(
                window.SPORT_TOTO_DATA
                    .currentWeek
            ) ||
            numbers[
                numbers.length - 1
            ];
        renderWeeks();
        $("content").innerHTML = `
            <div class="loading">
                Mackolik skorları ve açılış oranları yükleniyor...
            </div>
        `;
        await loadData();
        renderWeek();
    }catch(error){
        console.error(
            "SPOR TOTO HATA:",
            error
        );
        $("content").innerHTML = `
            <div class="error">
                <strong>
                    Veri çekme hatası
                </strong>
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}
init();
</script>
