<body>

<header>
    <h1>⚽ Spor Toto Sistemi</h1>
    <p>Açılış oranları istatistiksel analiz</p>
</header>

<div class="container">

    <div class="controls">
        <div class="controls-row">
            <select id="weekSelect"></select>
            <button id="refreshBtn">↻</button>
        </div>
    </div>

    <div id="content">
        <div class="loading">
            Veriler hazırlanıyor...
        </div>
    </div>

</div>

<script src="data/spor-toto-data.js"></script>

<script>
"use strict";

/* =========================================================
   AYARLAR
========================================================= */

const DATA_URL =
"https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";

const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;

/*
   Tüm marketler arka planda kullanılır.
*/
const MARKETS = [
    "ms1","msX","ms2",
    "iy1","iyX","iy2",
    "cs1X","cs12","csX2",
    "au25Alt","au25Ust",
    "kgVar","kgYok",
    "iy15Alt","iy15Ust",
    "au15Alt","au15Ust",
    "au35Alt","au35Ust",
    "gol01","gol23","gol46","gol7",
    "handicap","handicap1","handicapX","handicap2"
];

/* =========================================================
   CACHE
========================================================= */

let MACKOLIK = [];
let HISTORY = [];
let ODDS_INDEX = new Map();
let MATCH_INDEX = new Map();
let selectedWeek = null;

/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(value || "")
        .toLocaleLowerCase("tr-TR")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/ı/g,"i")
        .replace(/ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/[^a-z0-9]/g,"");
}

const ALIASES = {

    kuzeymakedonyacumhuriyeti:"kuzeymakedonya",
    kuzeymakedonya:"kuzeymakedonya",

    istanbulbasaksehir:"istanbulbasaksehir",
    ramsbasaksehir:"istanbulbasaksehir",

    manchesterunited:"manchesterunited",
    manchesterutd:"manchesterunited",

    newcastleunited:"newcastleunited",
    newcastleutd:"newcastleunited"
};

function teamKey(value){

    let x = normalize(value);

    return ALIASES[x] || x;
}

function sameTeam(a,b){

    const x = teamKey(a);
    const y = teamKey(b);

    if(!x || !y) return false;

    return x === y || x.includes(y) || y.includes(x);
}

/* =========================================================
   ALANLAR
========================================================= */

function homeOf(m){

    return m?.home ??
           m?.homeTeam ??
           m?.team1 ??
           m?.ev ??
           "";
}

function awayOf(m){

    return m?.away ??
           m?.awayTeam ??
           m?.team2 ??
           m?.dep ??
           "";
}

/* =========================================================
   TARİH
========================================================= */

function dateOf(value){

    if(!value) return null;

    if(value instanceof Date){
        return isNaN(value) ? null : value;
    }

    const s = String(value).trim();

    let m = s.match(
        /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/
    );

    if(m){

        const d = new Date(
            Number(m[3]),
            Number(m[2])-1,
            Number(m[1])
        );

        return isNaN(d) ? null : d;
    }

    m = s.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})/
    );

    if(m){

        const d = new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3])
        );

        return isNaN(d) ? null : d;
    }

    const d = new Date(s);

    return isNaN(d) ? null : d;
}

function matchDate(m){

    return dateOf(
        m?.date ??
        m?.matchDate ??
        m?.gameDate ??
        m?.tarih ??
        null
    );
}

function dayKey(d){

    if(!d) return "";

    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");
}

/* =========================================================
   SKOR
========================================================= */

function scoreOf(m){

    if(!m) return null;

    const s =
        m.score ??
        m.fullTimeScore ??
        m.finalScore ??
        m.msScore;

    if(s && typeof s === "object"){

        const h =
            s.home ??
            s.homeScore ??
            s.ev ??
            s[0];

        const a =
            s.away ??
            s.awayScore ??
            s.dep ??
            s[1];

        if(
            h !== undefined &&
            a !== undefined &&
            h !== null &&
            a !== null &&
            h !== "" &&
            a !== ""
        ){

            const home = Number(h);
            const away = Number(a);

            if(
                Number.isFinite(home) &&
                Number.isFinite(away)
            ){
                return {home,away};
            }
        }
    }

    if(typeof s === "string"){

        const m2 =
            s.match(/(\d+)\s*[-:]\s*(\d+)/);

        if(m2){

            return {
                home:Number(m2[1]),
                away:Number(m2[2])
            };
        }
    }

    const h =
        m.homeScore ??
        m.homeGoals ??
        m.evSkor;

    const a =
        m.awayScore ??
        m.awayGoals ??
        m.depSkor;

    if(
        h !== undefined &&
        a !== undefined &&
        h !== null &&
        a !== null &&
        h !== "" &&
        a !== ""
    ){

        const home = Number(h);
        const away = Number(a);

        if(
            Number.isFinite(home) &&
            Number.isFinite(away)
        ){
            return {home,away};
        }
    }

    return null;
}

function resultOf(m){

    const s = scoreOf(m);

    if(!s) return null;

    if(s.home > s.away) return "1";
    if(s.home < s.away) return "2";

    return "X";
}

/* =========================================================
   ORAN
========================================================= */

function toNumber(v){

    if(v === null || v === undefined){
        return null;
    }

    if(typeof v === "number"){
        return Number.isFinite(v) ? v : null;
    }

    const n = Number(
        String(v)
            .trim()
            .replace(",",".")
    );

    return Number.isFinite(n) ? n : null;
}

function openingOdd(market, key){

    if(!market || typeof market !== "object"){
        return null;
    }

    const containers = [
        market.openingOdds,
        market.opening,
        market.odds,
        market.markets,
        market.openingMarkets,
        market.openingOddsData
    ];

    for(const c of containers){

        if(!c || typeof c !== "object"){
            continue;
        }

        const item = c[key];

        if(item === undefined){
            continue;
        }

        if(item && typeof item === "object"){

            const n = toNumber(
                item.opening ??
                item.openingOdd ??
                item.value ??
                item.odd ??
                item.rate
            );

            if(n !== null) return n;
        }

        const n = toNumber(item);

        if(n !== null) return n;
    }

    if(
        Object.prototype.hasOwnProperty.call(
            market,
            key
        )
    ){

        return toNumber(market[key]);
    }

    return null;
}

/* =========================================================
   MAÇ INDEX
========================================================= */

function createMatchIndex(){

    MATCH_INDEX = new Map();

    for(const m of MACKOLIK){

        const h = teamKey(homeOf(m));
        const a = teamKey(awayOf(m));

        if(!h || !a) continue;

        const key = h + "|" + a;

        let arr = MATCH_INDEX.get(key);

        if(!arr){

            arr = [];
            MATCH_INDEX.set(key,arr);
        }

        arr.push(m);
    }
}

function findMatch(sportMatch){

    const h = teamKey(homeOf(sportMatch));
    const a = teamKey(awayOf(sportMatch));

    if(!h || !a) return null;

    const key = h + "|" + a;

    const list =
        MATCH_INDEX.get(key);

    if(!list || !list.length){

        /*
           Daha toleranslı arama.
        */
        for(const m of MACKOLIK){

            if(
                sameTeam(homeOf(m),homeOf(sportMatch)) &&
                sameTeam(awayOf(m),awayOf(sportMatch))
            ){
                return m;
            }
        }

        return null;
    }

    const targetDate =
        matchDate(sportMatch);

    if(targetDate){

        const target =
            dayKey(targetDate);

        for(const m of list){

            const d = matchDate(m);

            if(d && dayKey(d) === target){
                return m;
            }
        }
    }

    /*
       Skoru bulunanı tercih et.
    */
    for(const m of list){

        if(scoreOf(m)){
            return m;
        }
    }

    return list[0];
}

/* =========================================================
   60 GÜNLÜK GEÇMİŞ
========================================================= */

function buildHistory(){

    HISTORY = [];

    const now = new Date();

    const start =
        new Date(now);

    start.setDate(
        start.getDate() - HISTORY_DAYS
    );

    start.setHours(0,0,0,0);

    now.setHours(23,59,59,999);

    for(const m of MACKOLIK){

        const d = matchDate(m);

        if(!d) continue;

        if(d < start || d > now){
            continue;
        }

        const result =
            resultOf(m);

        if(!result){
            continue;
        }

        HISTORY.push(m);
    }
}

/* =========================================================
   ORAN INDEX
=========================================================

   Yapı:

   market|oran

   örnek:

   ms1|1.85
   kgVar|1.70
   au25Ust|1.90
*/

function buildOddsIndex(){

    ODDS_INDEX = new Map();

    for(const m of HISTORY){

        for(const market of MARKETS){

            const odd =
                openingOdd(m,market);

            if(odd === null) continue;

            /*
               EXACT ODDS.
            */
            const key =
                market + "|" +
                odd.toFixed(2);

            let list =
                ODDS_INDEX.get(key);

            if(!list){

                list = [];
                ODDS_INDEX.set(key,list);
            }

            list.push(m);
        }
    }
}

/* =========================================================
   MARKET ANALİZİ
========================================================= */

function analyze(market,odd){

    if(odd === null) return null;

    const key =
        market + "|" +
        odd.toFixed(2);

    const list =
        ODDS_INDEX.get(key);

    if(!list || list.length < MIN_SAMPLE){
        return null;
    }

    let one = 0;
    let x = 0;
    let two = 0;

    for(const m of list){

        const r = resultOf(m);

        if(r === "1") one++;
        else if(r === "X") x++;
        else if(r === "2") two++;
    }

    const n =
        one + x + two;

    if(n < MIN_SAMPLE){
        return null;
    }

    /*
       Jeffreys prior.
    */
    const alpha = 0.5;

    const denominator =
        n + 3 * alpha;

    const p1 =
        (one + alpha) / denominator;

    const px =
        (x + alpha) / denominator;

    const p2 =
        (two + alpha) / denominator;

    /*
       Örneklem ağırlığı.
    */
    const sampleWeight =
        Math.sqrt(n) *
        (n / (n + 20));

    /*
       Ayrıştırma gücü.

       Tamamen rastgele üç sonuç:
       1/3 - 1/3 - 1/3

       Bu nedenle 1/3 taban kabul edilir.
    */
    const maxP =
        Math.max(p1,px,p2);

    const separation =
        Math.max(
            0.05,
            maxP - (1/3)
        );

    /*
       Çok baskın sonuç veren oranların
       katkısını artır.
    */
    const weight =
        sampleWeight *
        separation;

    return {
        p1,
        px,
        p2,
        weight
    };
}

/* =========================================================
   TEK TAHMİN
========================================================= */

function calculate(sportMatch){

    const m =
        findMatch(sportMatch);

    if(!m){

        return {
            prediction:null,
            p1:0,
            px:0,
            p2:0
        };
    }

    let w1 = 0;
    let wx = 0;
    let w2 = 0;

    let total = 0;

    /*
       Aynı marketi tekrar tekrar bulmamak için
       hedef oranlar yalnızca bir kez okunur.
    */
    for(const market of MARKETS){

        const odd =
            openingOdd(m,market);

        if(odd === null) continue;

        const a =
            analyze(market,odd);

        if(!a) continue;

        w1 += a.p1 * a.weight;
        wx += a.px * a.weight;
        w2 += a.p2 * a.weight;

        total += a.weight;
    }

    if(total <= 0){

        return {
            prediction:null,
            p1:0,
            px:0,
            p2:0
        };
    }

    let p1 = w1 / total;
    let px = wx / total;
    let p2 = w2 / total;

    const sum =
        p1 + px + p2;

    p1 /= sum;
    px /= sum;
    p2 /= sum;

    let prediction = "1";

    if(px > p1 && px >= p2){

        prediction = "X";

    }else if(p2 > p1 && p2 > px){

        prediction = "2";
    }

    return {
        prediction,
        p1,
        px,
        p2
    };
}

/* =========================================================
   HAFTA
========================================================= */

function setupWeeks(){

    const select =
        document.getElementById("weekSelect");

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    const keys =
        Object.keys(weeks)
            .map(Number)
            .sort((a,b)=>a-b);

    const current =
        Number(
            window.SPORT_TOTO_DATA?.currentWeek ??
            keys[keys.length-1]
        );

    select.innerHTML = "";

    for(const week of keys){

        const option =
            document.createElement("option");

        option.value = week;

        option.textContent =
            `${week}. Hafta` +
            (week === current
                ? " — Güncel"
                : "");

        select.appendChild(option);
    }

    selectedWeek = current;

    select.value = current;

    select.onchange = function(){

        selectedWeek =
            Number(this.value);

        render();
    };
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================================================
   MAÇ RENDER
========================================================= */

function renderMatch(m,index){

    const analysis =
        calculate(m);

    const prediction =
        analysis.prediction;

    const actualMatch =
        findMatch(m);

    const actual =
        actualMatch
            ? resultOf(actualMatch)
            : null;

    const score =
        actualMatch
            ? scoreOf(actualMatch)
            : null;

    let predictionClass =
        "none";

    if(prediction === "1"){
        predictionClass = "one";
    }
    else if(prediction === "X"){
        predictionClass = "x";
    }
    else if(prediction === "2"){
        predictionClass = "two";
    }

    let status = "";

    if(!actual){

        status = `
            <span class="waiting">
                • Bekleniyor
            </span>
        `;

    }else if(prediction === actual){

        status = `
            <span class="success">
                ✓ Başarılı
            </span>
        `;

    }else{

        status = `
            <span class="failed">
                ✕ Başarısız
            </span>
        `;
    }

    const scoreText =
        score
            ? `${score.home} - ${score.away}`
            : "—";

    return `
        <div class="match">

            <div class="match-row">

                <div class="number">
                    ${index + 1}
                </div>

                <div class="teams">
                    ${escapeHTML(homeOf(m))}
                    -
                    ${escapeHTML(awayOf(m))}
                </div>

                <div class="prediction ${predictionClass}">
                    ${prediction || "—"}
                </div>

            </div>

            <div class="bottom">

                ${status}

                <span class="score">
                    ${scoreText}
                </span>

            </div>

        </div>
    `;
}

/* =========================================================
   RENDER
========================================================= */

function render(){

    const content =
        document.getElementById("content");

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    const matches =
        Array.isArray(weeks[selectedWeek])
            ? weeks[selectedWeek]
            : [];

    if(!matches.length){

        content.innerHTML = `
            <div class="empty">
                Bu haftada maç bulunamadı.
            </div>
        `;

        return;
    }

    let html = `
        <div class="week-title">
            ${selectedWeek}. Hafta
        </div>
    `;

    for(let i=0;i<matches.length;i++){

        html +=
            renderMatch(matches[i],i);
    }

    content.innerHTML = html;
}

/* =========================================================
   MACKOLIK VERİSİNİ YÜKLE
========================================================= */

async function loadData(){

    const response =
        await fetch(
            DATA_URL + "?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "Mackolik verisi yüklenemedi."
        );
    }

    const data =
        await response.json();

    if(Array.isArray(data)){

        MACKOLIK = data;

    }else if(Array.isArray(data.matches)){

        MACKOLIK = data.matches;

    }else if(Array.isArray(data.data)){

        MACKOLIK = data.data;

    }else if(Array.isArray(data.items)){

        MACKOLIK = data.items;

    }else{

        throw new Error(
            "Maç listesi bulunamadı."
        );
    }

    /*
       AĞIR İŞLER SADECE BİR KEZ.
    */
    createMatchIndex();

    buildHistory();

    buildOddsIndex();
}

/* =========================================================
   YENİLE
========================================================= */

document
.getElementById("refreshBtn")
.addEventListener("click",async function(){

    const button = this;

    button.disabled = true;
    button.textContent = "…";

    try{

        await loadData();

        render();

    }catch(error){

        console.error(error);

    }

    button.disabled = false;
    button.textContent = "↻";
});

/* =========================================================
   BAŞLANGIÇ
========================================================= */

async function init(){

    try{

        /*
           Spor Toto haftalarını Mackolik'ten bağımsız
           hemen hazırla.
        */
        setupWeeks();

        /*
           İlk olarak maç listesini göster.
           Kullanıcı boş sayfa beklemez.
        */
        render();

        /*
           Sonra Mackolik verisini hazırla.
        */
        await loadData();

        /*
           Tahminler hazır.
        */
        render();

    }catch(error){

        console.error(error);

        /*
           Mackolik yüklenmese bile Spor Toto maçları
           ekranda kalır.
        */
        render();
    }
}

init();

</script>

</body>
</html>
