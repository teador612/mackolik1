```html

<body>

<div class="container">

<script src="data/spor-toto-data.js"></script>

<script>

"use strict";


/*
==========================================================
 AYARLAR
==========================================================
*/


const MATCHES_URL =
    "data/matches.json";


const HISTORY_DAYS =
    60;


const MIN_SAMPLE =
    5;


const BAYES =
    0.5;


const CONFIDENCE =
    20;


/*
==========================================================
 SADECE 2 MARKET
==========================================================

 iy2
 İY 2

 iy15Ust
 İY 1,5 Üst
==========================================================
*/


const MARKETS = [

    "iy2",

    "iy15Ust"

];


/*
==========================================================
 GLOBAL
==========================================================
*/


let allMatches = [];

let historicalMatches = [];

let pairIndex = new Map();

let selectedWeek;


/*
==========================================================
 DOM
==========================================================
*/


const weekSelect =
    document.getElementById(
        "weekSelect"
    );


const refreshButton =
    document.getElementById(
        "refresh"
    );


const matchesContainer =
    document.getElementById(
        "matches"
    );


const weekTitle =
    document.getElementById(
        "weekTitle"
    );


const statusText =
    document.getElementById(
        "status"
    );


/*
==========================================================
 NORMALIZE
==========================================================
*/


function normalizeText(value) {

    return String(value || "")
        .toLocaleLowerCase("tr-TR")
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .replace(
            /ı/g,
            "i"
        )
        .replace(
            /ğ/g,
            "g"
        )
        .replace(
            /ü/g,
            "u"
        )
        .replace(
            /ş/g,
            "s"
        )
        .replace(
            /ö/g,
            "o"
        )
        .replace(
            /ç/g,
            "c"
        )
        .replace(
            /[^a-z0-9]/g,
            ""
        );
}


/*
==========================================================
 TAKIM ALIAS
==========================================================
*/


const TEAM_ALIASES = {

    "corumfk":
        "arcacorumfk",

    "arcacorumfk":
        "arcacorumfk",

    "ramsbasaksehir":
        "istanbulbasaksehir",

    "istanbulbasaksehir":
        "istanbulbasaksehir",

    "tmosankonyaspor":
        "konyaspor",

    "konyaspor":
        "konyaspor",

    "thotspur":
        "tottenhamhotspur",

    "tothotspur":
        "tottenhamhotspur",

    "tottenhamhotspur":
        "tottenhamhotspur",

    "manchesterutd":
        "manchesterunited",

    "manchesterunited":
        "manchesterunited",

    "mcity":
        "manchestercity",

    "mancity":
        "manchestercity",

    "manchestercity":
        "manchestercity",

    "newcastleutd":
        "newcastleunited",

    "newcastleunited":
        "newcastleunited"

};


function teamKey(name) {

    const key =
        normalizeText(name);

    return (
        TEAM_ALIASES[key] ||
        key
    );
}


function pairKey(home, away) {

    return (
        teamKey(home) +
        "|" +
        teamKey(away)
    );
}


/*
==========================================================
 ORAN
==========================================================
*/


function parseOdd(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }


    if (
        typeof value === "number"
    ) {

        return Number.isFinite(value)
            ? value
            : null;
    }


    const number =
        Number(
            String(value)
                .trim()
                .replace(",", ".")
        );


    return Number.isFinite(number)
        ? number
        : null;
}


/*
==========================================================
 EXACT ORAN
==========================================================
*/


function oddKey(value) {

    const odd =
        parseOdd(value);


    if (odd === null) {
        return null;
    }


    return String(odd);
}


/*
==========================================================
 TARİH
==========================================================
*/


function parseDate(value) {

    if (!value) {
        return null;
    }


    const text =
        String(value).trim();


    let match =
        text.match(
            /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/
        );


    if (match) {

        return new Date(
            Number(match[3]),
            Number(match[2]) - 1,
            Number(match[1])
        );
    }


    match =
        text.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})/
        );


    if (match) {

        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );
    }


    const date =
        new Date(text);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return null;
    }


    return date;
}


function dateOnly(value) {

    const date =
        parseDate(value);


    if (!date) {
        return null;
    }


    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );
}


/*
==========================================================
 MS SONUCU
==========================================================
*/


function getMSResult(match) {

    if (!match) {
        return null;
    }


    /*
    Spor Toto verisi
    */

    if (
        match.result === "1" ||
        match.result === "X" ||
        match.result === "2"
    ) {

        return match.result;
    }


    /*
    Mackolik skor
    */

    if (!match.score) {
        return null;
    }


    if (
        match.score.home === null ||
        match.score.home === undefined ||
        match.score.away === null ||
        match.score.away === undefined
    ) {
        return null;
    }


    const home =
        Number(match.score.home);


    const away =
        Number(match.score.away);


    if (
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ) {
        return null;
    }


    if (home > away) {
        return "1";
    }


    if (home < away) {
        return "2";
    }


    return "X";
}


/*
==========================================================
 PAIR INDEX
==========================================================
*/


function buildPairIndex() {

    pairIndex.clear();


    for (
        const match of allMatches
    ) {

        if (
            !match.home ||
            !match.away
        ) {
            continue;
        }


        const key =
            pairKey(
                match.home,
                match.away
            );


        if (
            !pairIndex.has(key)
        ) {

            pairIndex.set(
                key,
                []
            );
        }


        pairIndex
            .get(key)
            .push(match);
    }
}


/*
==========================================================
 HEDEF MAÇ
==========================================================
*/


function findTargetMatch(
    home,
    away
) {

    const candidates =
        pairIndex.get(
            pairKey(home, away)
        ) || [];


    if (
        !candidates.length
    ) {
        return null;
    }


    /*
    openingOdds bulunan kayıtları
    tercih ediyoruz.
    */

    const withOdds =
        candidates.filter(
            match =>
                match.openingOdds &&
                (
                    parseOdd(
                        match.openingOdds.iy2
                    ) !== null ||

                    parseOdd(
                        match.openingOdds.iy15Ust
                    ) !== null
                )
        );


    const list =
        withOdds.length
            ? withOdds
            : candidates;


    /*
    En güncel kayıt.
    */

    return list
        .slice()
        .sort(
            (a, b) => {

                const da =
                    parseDate(a.date);

                const db =
                    parseDate(b.date);


                if (!da && !db) {
                    return 0;
                }


                if (!da) {
                    return 1;
                }


                if (!db) {
                    return -1;
                }


                return (
                    db.getTime() -
                    da.getTime()
                );
            }
        )[0] || null;
}


/*
==========================================================
 SON 60 GÜN
==========================================================
*/


function getHistory(
    target
) {

    const targetDate =
        dateOnly(
            target.date
        );


    if (!targetDate) {

        return [];
    }


    const start =
        new Date(targetDate);


    start.setDate(
        start.getDate() -
        HISTORY_DAYS
    );


    return historicalMatches.filter(
        match => {

            const date =
                dateOnly(
                    match.date
                );


            if (!date) {
                return false;
            }


            /*
            Hedef maç dahil değil.
            */

            if (
                date < start ||
                date >= targetDate
            ) {
                return false;
            }


            return Boolean(
                getMSResult(match)
            );
        }
    );
}


/*
==========================================================
 MARKET HESAPLAMA
==========================================================
*/


function calculateMarket(
    history,
    market,
    targetOdd
) {

    const targetKey =
        oddKey(targetOdd);


    if (!targetKey) {
        return null;
    }


    let count1 = 0;

    let countX = 0;

    let count2 = 0;


    for (
        const match of history
    ) {

        const odds =
            match.openingOdds;


        if (!odds) {
            continue;
        }


        const historicalOdd =
            parseOdd(
                odds[market]
            );


        if (
            historicalOdd === null
        ) {
            continue;
        }


        /*
        SADECE TAM AYNI ORAN
        */

        if (
            oddKey(historicalOdd) !==
            targetKey
        ) {
            continue;
        }


        const result =
            getMSResult(match);


        if (
            result === "1"
        ) {

            count1++;

        } else if (
            result === "X"
        ) {

            countX++;

        } else if (
            result === "2"
        ) {

            count2++;
        }
    }


    const N =
        count1 +
        countX +
        count2;


    /*
    Minimum 5 örnek.
    */

    if (
        N < MIN_SAMPLE
    ) {

        return null;
    }


    /*
    Bayesian
    */

    const denominator =
        N + 1.5;


    const p1 =
        (
            count1 +
            BAYES
        ) /
        denominator;


    const px =
        (
            countX +
            BAYES
        ) /
        denominator;


    const p2 =
        (
            count2 +
            BAYES
        ) /
        denominator;


    /*
    √N × N/(N+20)
    */

    const weight =
        Math.sqrt(N) *
        (
            N /
            (N + CONFIDENCE)
        );


    return {

        market,

        N,

        count1,

        countX,

        count2,

        p1,

        px,

        p2,

        weight

    };
}


/*
==========================================================
 ANA TAHMİN
==========================================================
*/


function calculatePrediction(
    target
) {

    if (
        !target ||
        !target.openingOdds
    ) {

        return null;
    }


    const history =
        getHistory(target);


    if (
        !history.length
    ) {

        return null;
    }


    let totalWeight = 0;

    let weighted1 = 0;

    let weightedX = 0;

    let weighted2 = 0;


    /*
    SADECE:

    iy2
    iy15Ust
    */

    for (
        const market of MARKETS
    ) {

        const targetOdd =
            parseOdd(
                target
                    .openingOdds
                    [market]
            );


        if (
            targetOdd === null
        ) {
            continue;
        }


        const result =
            calculateMarket(
                history,
                market,
                targetOdd
            );


        if (!result) {
            continue;
        }


        weighted1 +=
            result.p1 *
            result.weight;


        weightedX +=
            result.px *
            result.weight;


        weighted2 +=
            result.p2 *
            result.weight;


        totalWeight +=
            result.weight;
    }


    /*
    Yeterli örnek yok.
    */

    if (
        totalWeight <= 0
    ) {

        return null;
    }


    /*
    Final
    */

    const p1 =
        weighted1 /
        totalWeight;


    const px =
        weightedX /
        totalWeight;


    const p2 =
        weighted2 /
        totalWeight;


    /*
    Kesinlikle 1'e sabitleme yok.
    */

    let prediction;


    if (
        p1 >= px &&
        p1 >= p2
    ) {

        prediction = "1";

    } else if (
        px >= p1 &&
        px >= p2
    ) {

        prediction = "X";

    } else {

        prediction = "2";
    }


    return {

        prediction,

        p1,

        px,

        p2
    };
}


/*
==========================================================
 ESCAPE
==========================================================
*/


function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/*
==========================================================
 MAÇ KARTI
==========================================================
*/


function renderMatch(
    sportMatch
) {

    const target =
        findTargetMatch(
            sportMatch.home,
            sportMatch.away
        );


    const calculation =
        calculatePrediction(
            target
        );


    const prediction =
        calculation
            ?.prediction ||
        "—";


    const actual =
        sportMatch.result ||
        null;


    let symbol = "•";

    let resultClass =
        "pending";


    if (actual) {

        if (
            prediction !== "—" &&
            prediction === actual
        ) {

            symbol = "✓";

            resultClass =
                "correct";

        } else {

            symbol = "✕";

            resultClass =
                "wrong";
        }
    }


    let scoreHTML = "";


    if (
        target &&
        target.score &&
        target.score.home !== null &&
        target.score.away !== null
    ) {

        scoreHTML = `

            <div class="score">

                Skor:
                ${escapeHtml(
                    target.score.home
                )}
                -
                ${escapeHtml(
                    target.score.away
                )}

            </div>
        `;
    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "match";


    card.innerHTML = `

        <div>

            <div class="team">

                ${escapeHtml(
                    sportMatch.home
                )}

            </div>

            <div class="team">

                ${escapeHtml(
                    sportMatch.away
                )}

            </div>

            ${scoreHTML}

        </div>


        <div class="prediction">

            ${prediction}

        </div>


        <div class="check ${resultClass}">

            ${symbol}

        </div>

    `;


    return card;
}


/*
==========================================================
 HAFTA
==========================================================
*/


function renderWeek() {

    const weeks =
        window
            .SPORT_TOTO_DATA
            ?.weeks || {};


    const matches =
        weeks[selectedWeek] || [];


    weekTitle.textContent =
        `${selectedWeek}. Hafta`;


    matchesContainer.innerHTML =
        "";


    if (
        !matches.length
    ) {

        matchesContainer.innerHTML = `

            <div class="empty">

                Maç bulunamadı.

            </div>

        `;

        return;
    }


    let played = 0;


    for (
        const match of matches
    ) {

        if (
            match.result
        ) {
            played++;
        }


        matchesContainer.appendChild(
            renderMatch(match)
        );
    }


    const waiting =
        matches.length -
        played;


    statusText.textContent =
        `${matches.length} maç • ` +
        `${played} sonuçlanmış • ` +
        `${waiting} bekliyor`;
}


/*
==========================================================
 HAFTALAR
==========================================================
*/


function buildWeeks() {

    const weeks =
        window
            .SPORT_TOTO_DATA
            ?.weeks || {};


    const numbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a, b) =>
                    a - b
            );


    weekSelect.innerHTML =
        "";


    for (
        const week of numbers
    ) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            week;


        option.textContent =
            `${week}. Hafta`;


        weekSelect.appendChild(
            option
        );
    }


    const currentWeek =
        Number(
            window
                .SPORT_TOTO_DATA
                ?.currentWeek
        );


    if (
        weeks[currentWeek]
    ) {

        selectedWeek =
            currentWeek;

    } else {

        selectedWeek =
            numbers[
                numbers.length - 1
            ];
    }


    weekSelect.value =
        selectedWeek;
}


/*
==========================================================
 VERİ
==========================================================
*/


async function loadData() {

    matchesContainer.innerHTML = `

        <div class="loading">

            Mackolik verileri yükleniyor...

        </div>

    `;


    try {

        const response =
            await fetch(
                MATCHES_URL +
                "?v=" +
                Date.now()
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "matches.json yüklenemedi."
            );
        }


        const data =
            await response.json();


        allMatches =
            Array.isArray(
                data.matches
            )
            ? data.matches
            : [];


        /*
        Sadece sonucu belli ve
        openingOdds bulunan maçlar
        tarihsel örneklem olur.
        */

        historicalMatches =
            allMatches.filter(
                match =>
                    match &&
                    match.openingOdds &&
                    getMSResult(match)
            );


        buildPairIndex();


        statusText.textContent =
            `${allMatches.length} Mackolik maçı yüklendi. ` +
            `${historicalMatches.length} tarihsel örneklem hazır.`;


        renderWeek();


    } catch (error) {

        console.error(
            error
        );


        matchesContainer.innerHTML = `

            <div class="error">

                Veri yüklenemedi.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        statusText.textContent =
            "Veri yükleme hatası.";
    }
}


/*
==========================================================
 EVENTS
==========================================================
*/


weekSelect.addEventListener(
    "change",
    () => {

        selectedWeek =
            Number(
                weekSelect.value
            );

        renderWeek();
    }
);


refreshButton.addEventListener(
    "click",
    () => {

        loadData();
    }
);


/*
==========================================================
 BAŞLAT
==========================================================
*/


buildWeeks();

loadData();

</script>

</body>
</html>
