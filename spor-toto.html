<script>
"use strict";

/* =========================================================
   AYARLAR
========================================================= */

const MACKOLIK_URL =
"https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";

const HISTORY_DAYS = 60;

/*
   Bir marketin hesaba girebilmesi için
   son 60 günde birebir aynı açılış oranından
   en az bu kadar örnek bulunması gerekir.
*/
const MIN_SAMPLE = 5;

/*
   Bütün açılış marketleri.
   Burada sadece openingOdds kullanılır.
   Güncel/kapanış oranları kullanılmaz.
*/
const MARKETS = [

    { key:"ms1",       name:"MS 1" },
    { key:"msX",       name:"MS X" },
    { key:"ms2",       name:"MS 2" },

    { key:"iy1",       name:"İY 1" },
    { key:"iyX",       name:"İY X" },
    { key:"iy2",       name:"İY 2" },

    { key:"cs1X",      name:"ÇS 1X" },
    { key:"cs12",      name:"ÇS 12" },
    { key:"csX2",      name:"ÇS X2" },

    { key:"au25Alt",   name:"2.5 Alt" },
    { key:"au25Ust",   name:"2.5 Üst" },

    { key:"kgVar",     name:"KG Var" },
    { key:"kgYok",     name:"KG Yok" },

    { key:"iy15Alt",   name:"İY 1.5 Alt" },
    { key:"iy15Ust",   name:"İY 1.5 Üst" },

    { key:"au15Alt",   name:"1.5 Alt" },
    { key:"au15Ust",   name:"1.5 Üst" },

    { key:"au35Alt",   name:"3.5 Alt" },
    { key:"au35Ust",   name:"3.5 Üst" },

    { key:"gol01",     name:"Gol 0-1" },
    { key:"gol23",     name:"Gol 2-3" },
    { key:"gol46",     name:"Gol 4-6" },
    { key:"gol7",      name:"Gol 7+" },

    { key:"handicap",  name:"Handikap" },
    { key:"handicap1", name:"Handikap 1" },
    { key:"handicapX", name:"Handikap X" },
    { key:"handicap2", name:"Handikap 2" }

];


/* =========================================================
   GLOBAL
========================================================= */

let mackolikMatches = [];
let selectedWeek = null;


/* =========================================================
   METİN NORMALİZASYONU
========================================================= */

function normalizeText(value){

    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/ı/g,"i")
        .replace(/ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/[^a-z0-9]/g,"");

}


/* =========================================================
   TAKIM ALIASLARI
========================================================= */

const TEAM_ALIASES = {

    "corumfk":[
        "corumfk",
        "arcacorumfk",
        "corum"
    ],

    "istanbulbasaksehir":[
        "istanbulbasaksehir",
        "ramsbasaksehir",
        "basaksehir"
    ],

    "tottenhamhotspur":[
        "tottenhamhotspur",
        "thotspur",
        "tottenham"
    ],

    "hullcity":[
        "hullcity",
        "hcity"
    ],

    "manchestercity":[
        "manchestercity",
        "mcity"
    ],

    "manchesterunited":[
        "manchesterunited",
        "manchesterutd",
        "manutd"
    ],

    "parissaintgermain":[
        "parissaintgermain",
        "parisstgermain",
        "psg"
    ],

    "kuzeymakedonya":[
        "kuzeymakonyacumhuriyeti",
        "kuzeymakedonya",
        "makedonya",
        "northmacedonia"
    ],

    "vfbstuttgart":[
        "vfbstuttgart",
        "stuttgart"
    ],

    "bayerleverkusen":[
        "bayerleverkusen",
        "leverkusen"
    ],

    "rbleipzig":[
        "rbleipzig",
        "leipzig"
    ],

    "galatasaray":[
        "galatasaray"
    ],

    "fenerbahce":[
        "fenerbahce"
    ],

    "besiktas":[
        "besiktas"
    ],

    "trabzonspor":[
        "trabzonspor"
    ],

    "samsunspor":[
        "samsunspor"
    ],

    "goztepe":[
        "goztepe"
    ],

    "kocaelispor":[
        "kocaelispor"
    ],

    "amedspor":[
        "amedsportiffaaliyetler",
        "amedspor",
        "amed"
    ],

    "erzurumspor":[
        "erzurumsporfk",
        "erzurumspor"
    ],

    "gaziantepfk":[
        "gaziantepfk",
        "gaziantep"
    ],

    "alanyaspor":[
        "corendonalanyaspor",
        "alanyaspor"
    ],

    "kasimpasa":[
        "kasimpasa"
    ],

    "eyupspor":[
        "eyupspor"
    ],

    "rizespor":[
        "caykurrizespor",
        "rizespor"
    ],

    "konyaspor":[
        "tumosankonyaspor",
        "konyaspor"
    ],

    "genclerbirligi":[
        "genclerbirligi"
    ]

};


function canonicalTeam(name){

    const n = normalizeText(name);

    for(const canonical in TEAM_ALIASES){

        if(
            TEAM_ALIASES[canonical].includes(n)
        ){
            return canonical;
        }

    }

    return n;
}


function sameTeam(a,b){

    return canonicalTeam(a) === canonicalTeam(b);

}


/* =========================================================
   TARİH
========================================================= */

function parseDate(value){

    if(!value){
        return null;
    }

    const s = String(value).trim();

    let d = null;

    if(/^\d{2}\.\d{2}\.\d{4}$/.test(s)){

        const [
            day,
            month,
            year
        ] = s.split(".");

        d = new Date(
            Number(year),
            Number(month)-1,
            Number(day)
        );

    }else{

        d = new Date(s);

    }

    if(
        !d ||
        Number.isNaN(d.getTime())
    ){
        return null;
    }

    d.setHours(0,0,0,0);

    return d;

}


/* =========================================================
   SKOR
========================================================= */

function getFullScore(match){

    const score = match?.score;

    if(!score){
        return null;
    }

    const home = Number(score.home);
    const away = Number(score.away);

    if(
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ){
        return null;
    }

    return {
        home,
        away
    };

}


function getResult(match){

    const score = getFullScore(match);

    if(!score){
        return null;
    }

    if(score.home > score.away){
        return "1";
    }

    if(score.home < score.away){
        return "2";
    }

    return "X";

}


/* =========================================================
   AÇILIŞ ORANI
========================================================= */

function getOpeningOdd(match,key){

    const odds = match?.openingOdds;

    if(!odds){
        return null;
    }

    const value = odds[key];

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return null;
    }

    const number = Number(value);

    return Number.isFinite(number)
        ? number
        : null;

}


/* =========================================================
   BİREBİR ORAN
========================================================= */

function exactOdds(a,b){

    if(
        a === null ||
        b === null
    ){
        return false;
    }

    /*
       TOLERANS YOK.
       1.85 sadece 1.85 ile eşleşir.
       1.86 eşleşmez.
    */
    return Number(a) === Number(b);

}


/* =========================================================
   SON 60 GÜN
========================================================= */

function getHistory(targetDate){

    const target = parseDate(targetDate);

    if(!target){
        return [];
    }

    const start = new Date(target);

    start.setDate(
        start.getDate() - HISTORY_DAYS
    );

    return mackolikMatches.filter(match => {

        const date = parseDate(match.date);

        if(!date){
            return false;
        }

        if(date < start){
            return false;
        }

        if(date >= target){
            return false;
        }

        /*
           Sadece MS skoru bulunan maçlar
           geçmiş örnekleme girer.
        */
        if(!getFullScore(match)){
            return false;
        }

        /*
           Açılış oranı olmayan kayıt
           örnekleme girmez.
        */
        return true;

    });

}


/* =========================================================
   SPOR TOTO MAÇINI MACKOLIK'TE BUL
========================================================= */

function findMackolikCandidates(stMatch){

    return mackolikMatches.filter(match => {

        return (
            sameTeam(match.home,stMatch.home) &&
            sameTeam(match.away,stMatch.away)
        );

    });

}


function findMackolikMatch(stMatch){

    const candidates =
        findMackolikCandidates(stMatch);

    if(!candidates.length){
        return null;
    }

    /*
       Eğer tek kayıt varsa doğrudan kullan.
    */
    if(candidates.length === 1){
        return candidates[0];
    }

    /*
       Spor Toto verisinde tarih varsa
       tarihe en yakın Mackolik kaydını seç.
    */
    const targetDate =
        parseDate(stMatch.date);

    if(targetDate){

        const sorted =
            [...candidates].sort((a,b)=>{

                const da = parseDate(a.date);
                const db = parseDate(b.date);

                if(!da && !db){
                    return 0;
                }

                if(!da){
                    return 1;
                }

                if(!db){
                    return -1;
                }

                return Math.abs(
                    da.getTime() -
                    targetDate.getTime()
                )
                -
                Math.abs(
                    db.getTime() -
                    targetDate.getTime()
                );

            });

        return sorted[0];

    }

    /*
       Tarih yoksa en güncel kayıt.
       Özellikle güncel hafta için kullanılır.
    */
    return [...candidates].sort((a,b)=>{

        const da = parseDate(a.date);
        const db = parseDate(b.date);

        if(!da && !db){
            return 0;
        }

        if(!da){
            return 1;
        }

        if(!db){
            return -1;
        }

        return db.getTime() - da.getTime();

    })[0];

}


/* =========================================================
   MARKET ANALİZİ
========================================================= */

function analyzeMarket(
    targetMatch,
    market,
    targetDate
){

    const targetOdd =
        getOpeningOdd(
            targetMatch,
            market.key
        );

    /*
       Hedef maçta bu açılış oranı yoksa
       market hesaba katılmaz.
    */
    if(targetOdd === null){
        return null;
    }

    const history =
        getHistory(targetDate);

    /*
       SON 60 GÜN + BİREBİR AYNI AÇILIŞ ORANI
    */
    const samples =
        history.filter(match => {

            const odd =
                getOpeningOdd(
                    match,
                    market.key
                );

            return exactOdds(
                odd,
                targetOdd
            );

        });

    if(samples.length < MIN_SAMPLE){
        return null;
    }

    let one = 0;
    let x = 0;
    let two = 0;

    samples.forEach(match => {

        const result =
            getResult(match);

        if(result === "1"){
            one++;
        }

        if(result === "X"){
            x++;
        }

        if(result === "2"){
            two++;
        }

    });

    const total =
        one + x + two;

    if(total < MIN_SAMPLE){
        return null;
    }

    const p1 =
        one / total;

    const px =
        x / total;

    const p2 =
        two / total;

    /*
       Market ağırlığı.

       Örnek sayısı arttıkça ağırlık artar
       fakat doğrusal şekilde sonsuza gitmez.

       n / (n + 20)
    */
    const sampleWeight =
        total /
        (total + 20);

    return {

        key:market.key,

        name:market.name,

        odd:targetOdd,

        sample:total,

        one:p1 * 100,

        x:px * 100,

        two:p2 * 100,

        weight:sampleWeight

    };

}


/* =========================================================
   TÜM MARKETLERDEN MATEMATİKSEL KARAR
========================================================= */

function calculatePrediction(
    targetMatch,
    targetDate
){

    const analyses = [];

    /*
       BÜTÜN MARKETLER
    */
    MARKETS.forEach(market => {

        const result =
            analyzeMarket(
                targetMatch,
                market,
                targetDate
            );

        if(result){
            analyses.push(result);
        }

    });

    /*
       Hiçbir markette yeterli
       birebir örnek yok.
    */
    if(!analyses.length){

        return {

            prediction:null,

            one:0,
            x:0,
            two:0,

            validMarkets:0,
            totalSample:0,

            markets:[]

        };

    }

    let score1 = 0;
    let scoreX = 0;
    let score2 = 0;

    let totalWeight = 0;
    let totalSample = 0;

    analyses.forEach(item => {

        const weight =
            item.weight;

        score1 +=
            item.one *
            weight;

        scoreX +=
            item.x *
            weight;

        score2 +=
            item.two *
            weight;

        totalWeight += weight;

        totalSample +=
            item.sample;

    });

    if(totalWeight <= 0){

        return {

            prediction:null,

            one:0,
            x:0,
            two:0,

            validMarkets:0,
            totalSample:0,

            markets:[]

        };

    }

    /*
       Ağırlıklı ortalama
    */
    score1 /= totalWeight;
    scoreX /= totalWeight;
    score2 /= totalWeight;

    const total =
        score1 +
        scoreX +
        score2;

    const one =
        score1 / total * 100;

    const x =
        scoreX / total * 100;

    const two =
        score2 / total * 100;

    /*
       SADECE TEK SONUÇ
    */
    const values = [

        {
            key:"1",
            value:one
        },

        {
            key:"X",
            value:x
        },

        {
            key:"2",
            value:two
        }

    ];

    values.sort(
        (a,b)=>
            b.value - a.value
    );

    const prediction =
        values[0].key;

    return {

        prediction,

        one,
        x,
        two,

        validMarkets:
            analyses.length,

        totalSample,

        markets:
            analyses

    };

}


/* =========================================================
   YÜZDE
========================================================= */

function pct(value){

    return (
        Number(value || 0)
            .toFixed(1)
        + "%"
    );

}


/* =========================================================
   HTML GÜVENLİ
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   TAHMİN SINIFI
========================================================= */

function predictionClass(prediction){

    if(prediction === "1"){
        return "one";
    }

    if(prediction === "X"){
        return "x";
    }

    if(prediction === "2"){
        return "two";
    }

    return "none";

}


/* =========================================================
   GERÇEK SONUÇ ROZETİ
========================================================= */

function renderResultBadge(
    prediction,
    actualResult
){

    if(!actualResult){

        return `
            <span
                class="result-badge result-wait"
                title="Skor bekleniyor">
                •
            </span>
        `;

    }

    if(
        prediction &&
        prediction === actualResult
    ){

        return `
            <span
                class="result-badge result-hit"
                title="Tahmin tuttu">
                ✓
            </span>
        `;

    }

    return `
        <span
            class="result-badge result-miss"
            title="Tahmin tutmadı">
            ✕
        </span>
    `;

}


/* =========================================================
   MARKET DETAYI
========================================================= */

function renderMarketDetails(decision){

    if(
        !decision ||
        !decision.markets ||
        !decision.markets.length
    ){

        return `
            <div class="no-data">
                Son 60 günde birebir aynı açılış
                oranlarından yeterli örnek bulunamadı.
            </div>
        `;

    }

    const sorted =
        [...decision.markets]
            .sort(
                (a,b)=>
                    b.sample - a.sample
            );

    const rows =
        sorted.map(item => {

            return `
                <div>
                    <strong>
                        ${escapeHtml(item.name)}
                    </strong>
                    =
                    ${item.odd}
                    •
                    ${item.sample} maç
                    •
                    1: ${pct(item.one)}
                    •
                    X: ${pct(item.x)}
                    •
                    2: ${pct(item.two)}
                </div>
            `;

        }).join("");

    return `
        <div class="details">

            <strong>
                Kullanılan marketler:
            </strong>

            ${rows}

        </div>
    `;

}


/* =========================================================
   MAÇ RENDER
========================================================= */

function renderMatch(
    match,
    index
){

    const mackolik =
        findMackolikMatch(match);

    /*
       Mackolik eşleşmesi yoksa
       tahmin üretme.
    */
    if(!mackolik){

        return `
            <div class="match">

                <div class="match-top">

                    <div class="number">
                        ${index + 1}
                    </div>

                    <div class="teams">
                        ${escapeHtml(match.home)}
                        -
                        ${escapeHtml(match.away)}
                    </div>

                    <div class="prediction none">
                        -
                    </div>

                    <span
                        class="result-badge result-wait">
                        •
                    </span>

                </div>

                <div class="no-data">
                    Mackolik'te bu maç için eşleşen
                    kayıt bulunamadı.
                </div>

            </div>
        `;

    }

    /*
       Hedef maçın Mackolik tarihi
    */
    const targetDate =
        mackolik.date;

    /*
       TÜM MARKETLERDEN HESAP
    */
    const decision =
        calculatePrediction(
            mackolik,
            targetDate
        );

    /*
       GERÇEK SKOR
       ARTIK DOĞRUDAN MACKOLIK'TEN
    */
    const actualResult =
        getResult(mackolik);

    const score =
        getFullScore(mackolik);

    const prediction =
        decision.prediction;

    const resultBadge =
        renderResultBadge(
            prediction,
            actualResult
        );

    const scoreHtml =
        score
        ?
        `
            <div class="score">
                MS Skor:
                ${score.home}-${score.away}
                ${actualResult
                    ? ` • Sonuç: ${actualResult}`
                    : ""}
            </div>
        `
        :
        `
            <div class="score">
                MS Skor: Henüz yok
            </div>
        `;

    return `
        <div class="match">

            <div class="match-top">

                <div class="number">
                    ${index + 1}
                </div>

                <div class="teams">

                    ${escapeHtml(match.home)}
                    -
                    ${escapeHtml(match.away)}

                </div>

                <div
                    class="prediction
                    ${predictionClass(prediction)}">

                    ${prediction || "-"}

                </div>

                ${resultBadge}

            </div>

            ${scoreHtml}

            <div class="probabilities">

                <div class="prob">
                    1
                    <b>
                        ${pct(decision.one)}
                    </b>
                </div>

                <div class="prob">
                    X
                    <b>
                        ${pct(decision.x)}
                    </b>
                </div>

                <div class="prob">
                    2
                    <b>
                        ${pct(decision.two)}
                    </b>
                </div>

            </div>

            <div class="details">

                <strong>
                    Tahmin:
                </strong>

                ${prediction || "Yetersiz veri"}

                •
                <strong>
                    ${decision.validMarkets}
                </strong>
                / ${MARKETS.length}
                market kullanıldı

                •
                <strong>
                    ${decision.totalSample}
                </strong>
                geçmiş eşleşme

                •
                Son 60 gün

                •
                Oran toleransı: 0

            </div>

            ${renderMarketDetails(decision)}

        </div>
    `;

}


/* =========================================================
   HAFTANIN BAŞARI ÖZETİ
========================================================= */

function renderResultSummary(matches){

    let hit = 0;
    let miss = 0;
    let wait = 0;

    matches.forEach(match => {

        const mackolik =
            findMackolikMatch(match);

        if(!mackolik){

            wait++;
            return;

        }

        const decision =
            calculatePrediction(
                mackolik,
                mackolik.date
            );

        if(!decision.prediction){

            wait++;
            return;

        }

        /*
           GERÇEK SONUÇ MACKOLIK SKORUNDAN
        */
        const actual =
            getResult(mackolik);

        if(!actual){

            wait++;
            return;

        }

        if(
            decision.prediction === actual
        ){

            hit++;

        }else{

            miss++;

        }

    });

    const finished =
        hit + miss;

    const rate =
        finished > 0
        ?
        hit / finished * 100
        :
        0;

    return `
        <div class="result-summary">

            <div class="result-summary-title">
                📊 ${selectedWeek}. Hafta Tahmin Sonuçları
            </div>

            <div class="result-summary-grid">

                <div class="result-box hit">

                    <div class="icon">
                        ✓
                    </div>

                    <strong>
                        ${hit}
                    </strong>

                    <small>
                        Tuttu
                    </small>

                </div>

                <div class="result-box miss">

                    <div class="icon">
                        ✕
                    </div>

                    <strong>
                        ${miss}
                    </strong>

                    <small>
                        Tutmadı
                    </small>

                </div>

                <div class="result-box wait">

                    <div class="icon">
                        •
                    </div>

                    <strong>
                        ${wait}
                    </strong>

                    <small>
                        Bekliyor
                    </small>

                </div>

                <div class="result-box rate">

                    <div class="icon">
                        %
                    </div>

                    <strong>
                        ${rate.toFixed(1)}
                    </strong>

                    <small>
                        Başarı
                    </small>

                </div>

            </div>

        </div>
    `;

}


/* =========================================================
   HAFTAYI RENDER
========================================================= */

function renderWeek(){

    const weekData =
        window.SPORT_TOTO_DATA
        ?.weeks
        ?.[selectedWeek];

    if(!weekData){

        document.getElementById("content")
            .innerHTML = `
                <div class="error">
                    ${selectedWeek}.
                    hafta verisi bulunamadı.
                </div>
            `;

        return;

    }

    const matches =
        Array.isArray(weekData)
        ?
        weekData
        :
        (
            weekData.matches || []
        );

    const rows =
        matches
            .map(
                (match,index)=>
                    renderMatch(
                        match,
                        index
                    )
            )
            .join("");

    const summary =
        renderResultSummary(matches);

    document.getElementById("content")
        .innerHTML = `

        ${summary}

        <div class="info">

            <div class="info-title">
                Spor Toto ${selectedWeek}. Hafta
            </div>

            <div class="info-text">

                Tahmin motoru yalnızca Mackolik
                açılış oranlarını kullanır.

                <br>

                Son 60 gündeki birebir aynı açılış
                oranları geçmiş maçların MS
                sonuçlarıyla karşılaştırılır.

                <br>

                Oran toleransı yoktur.
                Güncel ve kapanış oranları
                kullanılmaz.

                <br>

                Tüm marketler birlikte
                matematiksel olarak ağırlıklandırılır
                ve her maç için yalnızca
                <strong>1 / X / 2</strong>
                üretilir.

            </div>

        </div>

        <div class="coupon">

            <div class="coupon-head">

                <strong>
                    Tek Sonuç Kuponu
                </strong>

                <div class="summary">

                    <span class="badge">
                        1 / X / 2
                    </span>

                    <span class="badge">
                        ${MARKETS.length}
                        market
                    </span>

                    <span class="badge">
                        60 gün
                    </span>

                    <span class="badge">
                        ${matches.length}
                        maç
                    </span>

                </div>

            </div>

            ${rows}

        </div>

    `;

}


/* =========================================================
   HAFTA BUTONLARI
========================================================= */

function renderWeeks(){

    const weeks =
        window.SPORT_TOTO_DATA
        ?.weeks || {};

    const numbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a,b)=>a-b
            );

    document.getElementById("weeks")
        .innerHTML =
        numbers
            .map(
                week => `

                    <button
                        class="week-btn
                        ${
                            Number(week) ===
                            Number(selectedWeek)
                            ?
                            "active"
                            :
                            ""
                        }"
                        data-week="${week}">

                        ${week}. Hafta

                    </button>

                `
            )
            .join("");

    document
        .querySelectorAll(".week-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    selectedWeek =
                        Number(
                            button.dataset.week
                        );

                    renderWeeks();
                    renderWeek();

                }
            );

        });

}


/* =========================================================
   MACKOLIK VERİSİNİ ÇEK
========================================================= */

async function loadMackolik(){

    const response =
        await fetch(
            MACKOLIK_URL +
            "?t=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "Mackolik verisi alınamadı. HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    if(
        !data ||
        !Array.isArray(data.matches)
    ){

        throw new Error(
            "Mackolik matches verisi bulunamadı."
        );

    }

    mackolikMatches =
        data.matches;

    console.log(
        "Mackolik maç sayısı:",
        mackolikMatches.length
    );

}


/* =========================================================
   BAŞLAT
========================================================= */

async function init(){

    try{

        if(!window.SPORT_TOTO_DATA){

            throw new Error(
                "spor-toto-data.js yüklenemedi."
            );

        }

        const weeks =
            window.SPORT_TOTO_DATA
                .weeks || {};

        const numbers =
            Object.keys(weeks)
                .map(Number)
                .sort(
                    (a,b)=>a-b
                );

        selectedWeek =
            Number(
                window.SPORT_TOTO_DATA
                    .currentWeek
            )
            ||
            numbers[
                numbers.length - 1
            ];

        renderWeeks();

        document.getElementById("content")
            .innerHTML = `
                <div class="loading">
                    Mackolik açılış oranları
                    ve skorlar yükleniyor...
                </div>
            `;

        await loadMackolik();

        renderWeek();

    }catch(error){

        console.error(error);

        document.getElementById("content")
            .innerHTML = `

                <div class="error">

                    <strong>
                        Veri yüklenemedi.
                    </strong>

                    <br><br>

                    ${escapeHtml(
                        error.message ||
                        error
                    )}

                </div>

            `;

    }

}

init();

</script>
