        haftalar kullanılır.
      </div>
    </div>

    <div id="backtestWeeks"></div>

  </section>

<script src="spor-toto-data.js"></script>

<script>
"use strict";

/* =========================================================
   TEMEL
========================================================= */

const DATA = window.SPORT_TOTO_DATA;

const $ = id => document.getElementById(id);

let currentSeason = "";
let currentWeek = 1;


/* =========================================================
   SEZON / HAFTA
========================================================= */

function init(){

  if(!DATA || !DATA.seasons){
    document.body.innerHTML =
      "<div style='padding:30px;text-align:center'>spor-toto-data.js yüklenemedi.</div>";
    return;
  }

  const seasons = Object.keys(DATA.seasons);

  currentSeason = seasons[0] || "";

  $("seasonSelect").innerHTML = seasons.map(season => `
    <option value="${escapeHtml(season)}">
      ${escapeHtml(season)}
    </option>
  `).join("");

  loadWeeks();

  $("seasonSelect").addEventListener("change", () => {

    currentSeason = $("seasonSelect").value;

    loadWeeks();

    renderAll();

  });

  $("weekSelect").addEventListener("change", () => {

    currentWeek = Number($("weekSelect").value);

    renderAll();

  });

  document.querySelectorAll(".tab").forEach(button => {

    button.addEventListener("click", () => {

      document.querySelectorAll(".tab")
        .forEach(x => x.classList.remove("active"));

      document.querySelectorAll(".panel")
        .forEach(x => x.classList.remove("active"));

      button.classList.add("active");

      $(button.dataset.tab).classList.add("active");

      if(button.dataset.tab === "backtest"){
        renderBacktest();
      }

    });

  });

  renderAll();
}


/* =========================================================
   HAFTALAR
========================================================= */

function loadWeeks(){

  const season = DATA.seasons[currentSeason];

  if(!season){
    $("weekSelect").innerHTML = "";
    return;
  }

  const weeks = Object.keys(season.weeks)
    .map(Number)
    .sort((a,b) => a-b);

  const latest = DATA.getLatestWeek
    ? DATA.getLatestWeek(currentSeason)
    : weeks[weeks.length - 1];

  currentWeek = latest;

  $("weekSelect").innerHTML = weeks.map(week => {

    const item = season.weeks[week];

    const status =
      item.status === "finished"
        ? "Tamamlandı"
        : "Devam ediyor";

    return `
      <option value="${week}" ${week === latest ? "selected" : ""}>
        ${week}. Hafta - ${status}
      </option>
    `;

  }).join("");

}


/* =========================================================
   YARDIMCILAR
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));

}

function clamp(value,min,max){

  return Math.max(min,Math.min(max,value));

}

function normalizeResult(result){

  if(result === "1" || result === "X" || result === "2"){
    return result;
  }

  return null;

}

function getWeek(season,week){

  return DATA.getWeek
    ? DATA.getWeek(season,week)
    : DATA.seasons[season]?.weeks?.[week];

}


/* =========================================================
   TAKIM GEÇMİŞİ

   KRİTİK:
   beforeWeek verilir.
   Sadece week < beforeWeek kullanılır.
========================================================= */

function getTeamHistory(season, team, beforeWeek){

  const seasonData = DATA.seasons[season];

  if(!seasonData) return [];

  const result = [];

  Object.keys(seasonData.weeks)
    .map(Number)
    .sort((a,b)=>a-b)
    .forEach(weekNo => {

      if(weekNo >= beforeWeek) return;

      const week = seasonData.weeks[weekNo];

      if(!week || week.status !== "finished") return;

      (week.matches || []).forEach(match => {

        const resultCode = normalizeResult(match.result);

        if(!resultCode) return;

        if(match.home === team){

          result.push({
            week:weekNo,
            side:"home",
            result:
              resultCode === "1"
                ? "W"
                : resultCode === "X"
                  ? "D"
                  : "L"
          });

        }

        if(match.away === team){

          result.push({
            week:weekNo,
            side:"away",
            result:
              resultCode === "2"
                ? "W"
                : resultCode === "X"
                  ? "D"
                  : "L"
          });

        }

      });

    });

  return result;

}


/* =========================================================
   FORM PUANI
========================================================= */

function formScore(history){

  if(!history.length) return 0.5;

  const recent = history.slice(-6);

  let total = 0;

  recent.forEach(item => {

    if(item.result === "W") total += 1;
    else if(item.result === "D") total += 0.5;

  });

  return total / recent.length;

}


/* =========================================================
   EV / DEPLASMAN FORMU
========================================================= */

function sideScore(history, side){

  const filtered = history.filter(x => x.side === side);

  if(!filtered.length) return 0.5;

  const recent = filtered.slice(-5);

  let total = 0;

  recent.forEach(item => {

    if(item.result === "W") total += 1;
    else if(item.result === "D") total += 0.5;

  });

  return total / recent.length;

}


/* =========================================================
   GENEL SONUÇ ORANLARI

   SADECE ÖNCEKİ HAFTALAR
========================================================= */

function globalRates(season,beforeWeek){

  const seasonData = DATA.seasons[season];

  const counts = {
    "1":0,
    "X":0,
    "2":0
  };

  let total = 0;

  if(!seasonData) return counts;

  Object.keys(seasonData.weeks)
    .map(Number)
    .forEach(weekNo => {

      if(weekNo >= beforeWeek) return;

      const week = seasonData.weeks[weekNo];

      if(!week || week.status !== "finished") return;

      (week.matches || []).forEach(match => {

        const r = normalizeResult(match.result);

        if(!r) return;

        counts[r]++;
        total++;

      });

    });

  if(!total){
    return {
      "1":0.45,
      "X":0.27,
      "2":0.28
    };
  }

  return {
    "1":counts["1"]/total,
    "X":counts["X"]/total,
    "2":counts["2"]/total
  };

}


/* =========================================================
   TAHMİN

   Gelecek haftanın sonucu ASLA kullanılmaz.
========================================================= */

function predictMatch(match,season,beforeWeek){

  const homeHistory =
    getTeamHistory(
      season,
      match.home,
      beforeWeek
    );

  const awayHistory =
    getTeamHistory(
      season,
      match.away,
      beforeWeek
    );

  const homeForm = formScore(homeHistory);
  const awayForm = formScore(awayHistory);

  const homeSide =
    sideScore(homeHistory,"home");

  const awaySide =
    sideScore(awayHistory,"away");

  const global =
    globalRates(
      season,
      beforeWeek
    );

  /*
    Başlangıç olasılıkları
  */

  let p1 =
    global["1"] * 0.35 +
    homeForm * 0.30 +
    homeSide * 0.20 +
    (1-awayForm) * 0.15;

  let p2 =
    global["2"] * 0.35 +
    awayForm * 0.30 +
    awaySide * 0.20 +
    (1-homeForm) * 0.15;

  let px =
    global["X"] * 0.50 +
    (1-Math.abs(homeForm-awayForm)) * 0.30 +
    (1-Math.abs(homeSide-awaySide)) * 0.20;

  /*
    Ev avantajı.
  */

  p1 += 0.06;

  /*
    Çok güçlü deplasman formunda
    deplasman ihtimalini artır.
  */

  if(awayForm > 0.75){
    p2 += 0.04;
  }

  if(homeForm > 0.75){
    p1 += 0.04;
  }

  /*
    Beraberliği aşırı düşürme.
  */

  px = Math.max(px,0.16);

  /*
    Negatifleri temizle.
  */

  p1 = Math.max(0.01,p1);
  px = Math.max(0.01,px);
  p2 = Math.max(0.01,p2);

  const total = p1 + px + p2;

  p1 /= total;
  px /= total;
  p2 /= total;

  const probabilities = {
    "1":p1,
    "X":px,
    "2":p2
  };

  const sorted =
    Object.entries(probabilities)
      .sort((a,b)=>b[1]-a[1]);

  const main = sorted[0][0];

  /*
    Sistem seçimi.

    İlk sonuç ile ikinci sonuç birbirine yakınsa
    çift önerilir.
  */

  const first = sorted[0];
  const second = sorted[1];

  const difference =
    first[1] - second[1];

  let picks = [first[0]];

  if(difference < 0.08){

    picks = [
      first[0],
      second[0]
    ];

  }

  if(difference < 0.035){

    picks = [
      "1",
      "X",
      "2"
    ];

  }

  return {

    probabilities,

    main,

    picks,

    history:{
      home:homeHistory,
      away:awayHistory
    }

  };

}


/* =========================================================
   YÜZDE
========================================================= */

function pct(value){

  return Math.round(value * 100);

}


/* =========================================================
   FORM HTML
========================================================= */

function formHtml(history){

  const recent = history.slice(-5);

  if(!recent.length){
    return `
      <div class="small">
        Geçmiş maç verisi yok
      </div>
    `;
  }

  return `
    <div class="form-row">
      ${recent.map(item => {

        const cls =
          item.result === "W"
            ? "win"
            : item.result === "D"
              ? "draw"
              : "loss";

        const label =
          item.result === "W"
            ? "G"
            : item.result === "D"
              ? "B"
              : "M";

        return `
          <div class="form-item ${cls}">
            ${label}
          </div>
        `;

      }).join("")}
    </div>
  `;

}


/* =========================================================
   HAFTALIK PROGRAM
========================================================= */

function renderWeekly(){

  const week =
    getWeek(
      currentSeason,
      currentWeek
    );

  if(!week){

    $("weekInfo").innerHTML =
      "Hafta bulunamadı.";

    $("matches").innerHTML = "";

    return;
  }

  const finished =
    (week.matches || [])
      .filter(x => normalizeResult(x.result))
      .length;

  $("weekInfo").innerHTML = `
    <strong>${currentWeek}. Hafta</strong>

    <div class="small">
      ${finished} / ${(week.matches || []).length}
      maç sonucu mevcut.
      Tahminler yalnızca önceki haftalar kullanılarak
      hesaplanır.
    </div>
  `;

  const predictions =
    (week.matches || []).map(match => {

      return {
        match,
        prediction:
          predictMatch(
            match,
            currentSeason,
            currentWeek
          )
      };

    });

  renderStats(predictions);

  $("matches").innerHTML =
    predictions.map(item =>
      matchHtml(
        item.match,
        item.prediction
      )
    ).join("");

}


/* =========================================================
   MAÇ KARTI
========================================================= */

function matchHtml(match,p){

  const main = p.main;

  return `
    <div class="match">

      <div class="match-top">

        <div class="match-no">
          ${match.no}. MAÇ
        </div>

        <div class="prediction">
          Ana Tahmin: ${main}
        </div>

      </div>

      <div class="teams">

        <div class="team">
          ${escapeHtml(match.home)}
        </div>

        <div class="vs">
          VS
        </div>

        <div class="team away">
          ${escapeHtml(match.away)}
        </div>

      </div>

      <div class="probs">

        ${probHtml(
          "1",
          p.probabilities["1"],
          main
        )}

        ${probHtml(
          "X",
          p.probabilities["X"],
          main
        )}

        ${probHtml(
          "2",
          p.probabilities["2"],
          main
        )}

      </div>

      <div style="margin-top:9px">

        <div class="small">
          Sistem:
          <strong>${p.picks.join(" / ")}</strong>
        </div>

        ${formHtml(p.history.home)}

        <div class="small" style="margin-top:5px">
          Deplasman formu
        </div>

        ${formHtml(p.history.away)}

      </div>

      ${
        match.score
          ? `
            <div class="score">
              Sonuç: ${escapeHtml(match.score)}
            </div>
          `
          : `
            <div class="score">
              Maç sonucu henüz yok
            </div>
          `
      }

    </div>
  `;

}


/* =========================================================
   OLASILIK KUTUSU
========================================================= */

function probHtml(label,value,main){

  return `
    <div class="prob ${label === main ? "main" : ""}">

      <b>${pct(value)}%</b>

      <span>${label}</span>

    </div>
  `;

}


/* =========================================================
   İSTATİSTİK
========================================================= */

function renderStats(predictions){

  const counts = {
    "1":0,
    "X":0,
    "2":0
  };

  predictions.forEach(item => {

    counts[item.prediction.main]++;

  });

  $("stats").innerHTML = `

    <div class="stat">
      <b>${counts["1"]}</b>
      <span>MS 1</span>
    </div>

    <div class="stat">
      <b>${counts["X"]}</b>
      <span>MS X</span>
    </div>

    <div class="stat">
      <b>${counts["2"]}</b>
      <span>MS 2</span>
    </div>

  `;

}


/* =========================================================
   KUPON
========================================================= */

function renderCoupon(){

  const week =
    getWeek(
      currentSeason,
      currentWeek
    );

  if(!week){

    $("couponLine").innerHTML = "";
    $("systemRows").innerHTML = "";

    return;
  }

  const predictions =
    (week.matches || []).map(match => {

      return {
        match,
        prediction:
          predictMatch(
            match,
            currentSeason,
            currentWeek
          )
      };

    });

  /*
    Ana kupon:
    her maçın ana tahmini
  */

  $("couponLine").innerHTML =
    predictions.map(item => `
      <div class="coupon-pick">
        ${item.match.no}-${item.prediction.main}
      </div>
    `).join("");

  /*
    Sistem satırları
  */

  $("systemRows").innerHTML =
    predictions.map(item => {

      const picks =
        item.prediction.picks;

      return `
        <div class="system-row">

          <div class="system-no">
            ${item.match.no}
          </div>

          <div class="system-teams">
            ${escapeHtml(item.match.home)}
            -
            ${escapeHtml(item.match.away)}
          </div>

          <div class="system-picks">
            ${["1","X","2"].map(x => {

              if(picks.includes(x)){

                return `
                  <span class="selected">
                    ${x}
                  </span>
                `;

              }

              return `<span>${x}</span>`;

            }).join(" ")}

          </div>

        </div>
      `;

    }).join("");

}


/* =========================================================
   BACKTEST
========================================================= */

function renderBacktest(){

  const season =
    DATA.seasons[currentSeason];

  if(!season){

    $("backtestStats").innerHTML = "";
    $("backtestWeeks").innerHTML = "";

    return;
  }

  const weeks =
    Object.keys(season.weeks)
      .map(Number)
      .sort((a,b)=>a-b)
      .filter(weekNo => {

        return (
          season.weeks[weekNo].status === "finished" &&
          weekNo > 1
        );

      });

  let total = 0;
  let correct = 0;

  let mainCount = {
    "1":0,
    "X":0,
    "2":0
  };

  let html = "";

  weeks.forEach(weekNo => {

    const week =
      season.weeks[weekNo];

    let weekTotal = 0;
    let weekCorrect = 0;

    (week.matches || []).forEach(match => {

      const actual =
        normalizeResult(match.result);

      if(!actual) return;

      /*
        EN ÖNEMLİ KISIM:

        weekNo veriliyor.

        Böylece predictMatch:
        getTeamHistory(..., weekNo)
        globalRates(..., weekNo)

        kullanıyor ve hafta N sonuçlarını
        hesaba katmıyor.
      */

      const prediction =
        predictMatch(
          match,
          currentSeason,
          weekNo
        );

      total++;
      weekTotal++;

      mainCount[prediction.main]++;

      if(prediction.main === actual){

        correct++;
        weekCorrect++;

      }

    });

    const rate =
      weekTotal
        ? Math.round(
            weekCorrect / weekTotal * 100
          )
        : 0;

    html += `
      <div class="backtest-week">

        <div class="bt-head">

          <span>
            ${weekNo}. Hafta
          </span>

          <span>
            ${weekCorrect}/${weekTotal}
            (%${rate})
          </span>

        </div>

        <div class="bt-grid">

          <div class="bt-box">
            <b>${weekCorrect}</b>
            <span class="small">
              Doğru
            </span>
          </div>

          <div class="bt-box">
            <b>${weekTotal - weekCorrect}</b>
            <span class="small">
              Yanlış
            </span>
          </div>

          <div class="bt-box">
            <b>%${rate}</b>
            <span class="small">
              Başarı
            </span>
          </div>

        </div>

      </div>
    `;

  });

  const totalRate =
    total
      ? Math.round(correct / total * 100)
      : 0;

  $("backtestStats").innerHTML = `

    <div class="stat">
      <b>${total}</b>
      <span>Toplam Maç</span>
    </div>

    <div class="stat">
      <b>${correct}</b>
      <span>Doğru</span>
    </div>

    <div class="stat">
      <b>%${totalRate}</b>
      <span>Başarı</span>
    </div>

  `;

  $("backtestWeeks").innerHTML =
    html ||
    `<div class="empty">
      Backtest için yeterli geçmiş hafta yok.
    </div>`;

}


/* =========================================================
   TÜM EKRANI YENİLE
========================================================= */

function renderAll(){

  renderWeekly();

  renderCoupon();

  /*
    Backtest paneli açıkken
    hafta değişiminde de güncelle.
  */

  const backtestPanel =
    $("backtest").classList.contains("active");

  if(backtestPanel){
    renderBacktest();
  }

}


/* =========================================================
   BAŞLAT
========================================================= */

init();

</script>

</body>
