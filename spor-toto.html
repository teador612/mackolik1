<script src="data/spor-toto-data.js"></script>

<script>

"use strict";

/*
==========================================================
 SPOR TOTO

 HESAPLAMA:

 1. Son 60 gün
 2. Exact opening odds
 3. Minimum N = 5
 4. Bayesian
 5. Ağırlık = √N × N/(N+20)
 6. Bütün marketler birleştirilir
 7. En yüksek olasılık:
       1
       X
       2

 ÖNEMLİ:

 1'E SABİT FALLBACK YOKTUR.

 X veya 2 daha yüksek çıkarsa X veya 2 çıkar.
==========================================================
*/


const MATCHES_URL =
    "data/matches.json";


const HISTORY_DAYS =
    60;


const MIN_SAMPLE =
    5;


const BAYES_ALPHA =
    0.5;


const CONFIDENCE_K =
    20;


/*
==========================================================
 GERÇEK openingOdds MARKETLERİ
==========================================================
*/

const MARKETS = [

    "ms1",
    "msX",
    "ms2",

    "cs1X",
    "cs12",
    "csX2",

    "au25Alt",
    "au25Ust",

    "handicap",
    "handicap1",
    "handicapX",
    "handicap2",

    "kgVar",
    "kgYok",

    "iy15Alt",
    "iy15Ust",

    "au15Alt",
    "au15Ust",

    "au35Alt",
    "au35Ust",

    "gol01",
    "gol23",
    "gol46",
    "gol7",

    "iy1",
    "iyX",
    "iy2"
];


/*
==========================================================
 GLOBAL
==========================================================
*/

let allMatches = [];

let historicalMatches = [];

let pairIndex = new Map();

let selectedWeek = null;


/*
==========================================================
 DOM
==========================================================
*/

const weekSelect =
    document.getElementById("weekSelect");

const refreshButton =
    document.getElementById("refresh");

const matchesContainer =
    document.getElementById("matches");

const weekTitle =
    document.getElementById("weekTitle");

const statusText =
    document.getElementById("status");


/*
==========================================================
 METİN NORMALİZASYONU
==========================================================
*/

function normalizeText(value) {

    return String(value || "")
        .toLocaleLowerCase("tr-TR")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ı/g, "i")
        .replace(/ğ/g, "g")
        .replace(/ü/g, "u")
        .replace(/ş/g, "s")
        .replace(/ö/g, "o")
        .replace(/ç/g, "c")
        .replace(/[^a-z0-9]/g, "");
}


/*
==========================================================
 TAKIM ALIAS
==========================================================
*/

const TEAM_ALIASES = {

    "corumfk":
        "arcacorumfk",

    "arcacorumfk":
        "arcacorumfk",

    "ramsbasaksehir":
        "istanbulbasaksehir",

    "istanbulbasaksehir":
        "istanbulbasaksehir",

    "tmosankonyaspor":
        "konyaspor",

    "konyaspor":
        "konyaspor",

    "thotspur":
        "tottenhamhotspur",

    "tothotspur":
        "tottenhamhotspur",

    "tottenhamhotspur":
        "tottenhamhotspur",

    "manchesterutd":
        "manchesterunited",

    "manchesterunited":
        "manchesterunited",

    "mcity":
        "manchestercity",

    "mancity":
        "manchestercity",

    "manchestercity":
        "manchestercity",

    "hcity":
        "hullcity",

    "hullcity":
        "hullcity",

    "newcastleutd":
        "newcastleunited",

    "newcastleunited":
        "newcastleunited",

    "vfbstuttgart":
        "stuttgart",

    "stuttgart":
        "stuttgart"
};


function teamKey(name) {

    const key =
        normalizeText(name);

    return (
        TEAM_ALIASES[key] ||
        key
    );
}


function pairKey(home, away) {

    return (
        teamKey(home) +
        "|" +
        teamKey(away)
    );
}


/*
==========================================================
 ORAN OKUMA
==========================================================
*/

function parseOdd(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    if (
        typeof value === "number"
    ) {

        if (
            Number.isFinite(value)
        ) {
            return value;
        }

        return null;
    }

    let text =
        String(value).trim();

    if (!text) {
        return null;
    }

    text =
        text.replace(",", ".");

    const number =
        Number(text);

    if (
        !Number.isFinite(number)
    ) {
        return null;
    }

    return number;
}


/*
==========================================================
 EXACT ODDS KEY

 1.85 -> 1.85
 1.86 -> 1.86

 TOLERANS YOK.
==========================================================
*/

function oddKey(value) {

    const odd =
        parseOdd(value);

    if (odd === null) {
        return null;
    }

    return String(odd);
}


/*
==========================================================
 TARİH
==========================================================
*/

function parseDate(value) {

    if (!value) {
        return null;
    }

    const text =
        String(value).trim();


    /*
    29.05.2026
    */

    let match =
        text.match(
            /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/
        );


    if (match) {

        return new Date(
            Number(match[3]),
            Number(match[2]) - 1,
            Number(match[1])
        );
    }


    /*
    2026-05-29
    */

    match =
        text.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})/
        );


    if (match) {

        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );
    }


    const date =
        new Date(text);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return null;
    }

    return date;
}


function dateOnly(value) {

    const date =
        parseDate(value);

    if (!date) {
        return null;
    }

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );
}


/*
==========================================================
 MS SONUCU
==========================================================
*/

function getMSResult(match) {

    if (!match) {
        return null;
    }


    /*
    Spor Toto data result alanı
    */

    if (
        match.result === "1" ||
        match.result === "X" ||
        match.result === "2"
    ) {

        return match.result;
    }


    /*
    Mackolik skor
    */

    if (!match.score) {
        return null;
    }


    if (
        match.score.home === null ||
        match.score.home === undefined ||
        match.score.away === null ||
        match.score.away === undefined
    ) {
        return null;
    }


    const home =
        Number(match.score.home);

    const away =
        Number(match.score.away);


    if (
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ) {
        return null;
    }


    if (home > away) {
        return "1";
    }

    if (home < away) {
        return "2";
    }

    return "X";
}


/*
==========================================================
 INDEX
==========================================================
*/

function buildPairIndex() {

    pairIndex.clear();


    for (
        const match of allMatches
    ) {

        if (
            !match.home ||
            !match.away
        ) {
            continue;
        }


        const key =
            pairKey(
                match.home,
                match.away
            );


        if (
            !pairIndex.has(key)
        ) {

            pairIndex.set(
                key,
                []
            );
        }


        pairIndex
            .get(key)
            .push(match);
    }
}


/*
==========================================================
 HEDEF MAÇI BUL
==========================================================

 Aynı iki takımın birden fazla maçı olabilir.

 Hata değildir.

 Geçmiş maçlarda hedef sonucu kullanılarak
 eşleşme yapılmaz.

 Böylece tahmin sonucunu önceden kullanıp
 tahmini etkilemiyoruz.

 Açılış oranı bulunan adaylar önceliklidir.
==========================================================
*/

function findTargetMatch(
    home,
    away,
    isCurrentWeek
) {

    const candidates =
        pairIndex.get(
            pairKey(home, away)
        ) || [];


    if (
        !candidates.length
    ) {
        return null;
    }


    /*
    Opening odds bulunanlar
    */

    const withOdds =
        candidates.filter(
            match =>
                match &&
                match.openingOdds &&
                Object.keys(
                    match.openingOdds
                ).some(
                    market =>
                        parseOdd(
                            match.openingOdds[market]
                        ) !== null
                )
        );


    let list =
        withOdds.length
            ? withOdds.slice()
            : candidates.slice();


    /*
    Tarihe göre sırala.

    Güncel haftada en yeni/future kayıt tercih edilir.

    Geçmiş haftada ise yine en yakın kayıt alınır.
    */

    list.sort(
        (a, b) => {

            const da =
                parseDate(a.date);

            const db =
                parseDate(b.date);


            if (!da && !db) {
                return 0;
            }

            if (!da) {
                return 1;
            }

            if (!db) {
                return -1;
            }


            return (
                db.getTime() -
                da.getTime()
            );
        }
    );


    return list[0] || null;
}


/*
==========================================================
 TARİHSEL 60 GÜN
==========================================================
*/

function getHistory(targetMatch) {

    const targetDate =
        dateOnly(
            targetMatch.date
        );


    /*
    Hedef tarih yoksa son 60 gün.
    */

    if (!targetDate) {

        const today =
            new Date();

        const start =
            new Date(today);

        start.setDate(
            start.getDate() -
            HISTORY_DAYS
        );


        return historicalMatches.filter(
            match => {

                const date =
                    dateOnly(
                        match.date
                    );


                if (!date) {
                    return false;
                }


                return (
                    date >= start &&
                    date <= today
                );
            }
        );
    }


    const start =
        new Date(targetDate);


    start.setDate(
        start.getDate() -
        HISTORY_DAYS
    );


    /*
    Hedef maçın kendisini
    geçmişten çıkarıyoruz.
    */

    return historicalMatches.filter(
        match => {

            const date =
                dateOnly(
                    match.date
                );


            if (!date) {
                return false;
            }


            if (
                date < start ||
                date >= targetDate
            ) {
                return false;
            }


            return Boolean(
                getMSResult(match)
            );
        }
    );
}


/*
==========================================================
 ODDS INDEX

 market + exact odd

 Örnek:

 ms1|1.85

 au25Ust|1.85

 kgVar|1.85

 Her biri ayrı tutulur.
==========================================================
*/

function buildOddsIndex(history) {

    const index =
        new Map();


    for (
        const match of history
    ) {

        const result =
            getMSResult(match);


        if (!result) {
            continue;
        }


        const odds =
            match.openingOdds || {};


        for (
            const market of MARKETS
        ) {

            const odd =
                parseOdd(
                    odds[market]
                );


            if (
                odd === null
            ) {
                continue;
            }


            const key =
                market +
                "|" +
                oddKey(odd);


            let bucket =
                index.get(key);


            if (!bucket) {

                bucket = {

                    "1": 0,

                    "X": 0,

                    "2": 0,

                    n: 0
                };


                index.set(
                    key,
                    bucket
                );
            }


            bucket[result]++;

            bucket.n++;
        }
    }


    return index;
}


/*
==========================================================
 BAYESIAN
==========================================================

 P = (sonuç sayısı + 0.5)
     ---------------------
          N + 1.5
==========================================================
*/

function calculateBayesian(bucket) {

    if (!bucket) {
        return null;
    }


    const N =
        bucket.n;


    if (
        N < MIN_SAMPLE
    ) {
        return null;
    }


    const denominator =
        N +
        (BAYES_ALPHA * 3);


    const p1 =
        (
            bucket["1"] +
            BAYES_ALPHA
        ) /
        denominator;


    const px =
        (
            bucket["X"] +
            BAYES_ALPHA
        ) /
        denominator;


    const p2 =
        (
            bucket["2"] +
            BAYES_ALPHA
        ) /
        denominator;


    return {

        p1,

        px,

        p2,

        N
    };
}


/*
==========================================================
 AĞIRLIK
==========================================================

 √N × N/(N+20)
==========================================================
*/

function calculateWeight(N) {

    return (
        Math.sqrt(N) *
        (
            N /
            (N + CONFIDENCE_K)
        )
    );
}


/*
==========================================================
 ANA HESAPLAMA
==========================================================
*/

function calculatePrediction(
    targetMatch
) {

    if (
        !targetMatch ||
        !targetMatch.openingOdds
    ) {

        return {
            prediction: null,
            p1: 0,
            px: 0,
            p2: 0
        };
    }


    /*
    Hedef maçın tarihine göre
    son 60 gün.
    */

    const history =
        getHistory(
            targetMatch
        );


    if (!history.length) {

        return {
            prediction: null,
            p1: 0,
            px: 0,
            p2: 0
        };
    }


    /*
    Tarihsel oran indexi.
    */

    const oddsIndex =
        buildOddsIndex(
            history
        );


    let weighted1 = 0;

    let weightedX = 0;

    let weighted2 = 0;

    let totalWeight = 0;


    /*
    ======================================================
    TÜM MARKETLER
    ======================================================
    */

    const targetOdds =
        targetMatch.openingOdds;


    for (
        const market of MARKETS
    ) {

        /*
        Hedef maçın opening odd'u
        */

        const targetOdd =
            parseOdd(
                targetOdds[market]
            );


        if (
            targetOdd === null
        ) {
            continue;
        }


        /*
        Exact eşleşme.
        */

        const key =
            market +
            "|" +
            oddKey(targetOdd);


        const bucket =
            oddsIndex.get(key);


        if (!bucket) {
            continue;
        }


        /*
        Minimum N = 5
        */

        if (
            bucket.n <
            MIN_SAMPLE
        ) {
            continue;
        }


        /*
        Bayesian
        */

        const probability =
            calculateBayesian(
                bucket
            );


        if (!probability) {
            continue;
        }


        /*
        √N × N/(N+20)
        */

        const weight =
            calculateWeight(
                probability.N
            );


        /*
        AĞIRLIKLI TOPLAM
        */

        weighted1 +=
            probability.p1 *
            weight;


        weightedX +=
            probability.px *
            weight;


        weighted2 +=
            probability.p2 *
            weight;


        totalWeight +=
            weight;
    }


    /*
    Hiçbir markette N >= 5 yoksa
    tahmin uydurmuyoruz.
    */

    if (
        totalWeight <= 0
    ) {

        return {
            prediction: null,
            p1: 0,
            px: 0,
            p2: 0
        };
    }


    /*
    Final olasılıklar
    */

    let p1 =
        weighted1 /
        totalWeight;


    let px =
        weightedX /
        totalWeight;


    let p2 =
        weighted2 /
        totalWeight;


    /*
    Normalize
    */

    const total =
        p1 + px + p2;


    if (
        total > 0
    ) {

        p1 /= total;

        px /= total;

        p2 /= total;
    }


    /*
    ======================================================
    EN YÜKSEK SONUÇ
    ======================================================

    Burada 1'e özel bir avantaj yok.
    */

    let prediction;

    if (
        p1 >= px &&
        p1 >= p2
    ) {

        prediction = "1";

    } else if (
        px >= p1 &&
        px >= p2
    ) {

        prediction = "X";

    } else {

        prediction = "2";
    }


    return {

        prediction,

        p1,

        px,

        p2
    };
}


/*
==========================================================
 HTML ESCAPE
==========================================================
*/

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/*
==========================================================
 MAÇI GÖSTER
==========================================================
*/

function renderMatch(
    sportTotoMatch
) {

    /*
    Güncel haftanın 8. hafta olduğunu
    data dosyasından alıyoruz.
    */

    const currentWeek =
        Number(
            window
                .SPORT_TOTO_DATA
                ?.currentWeek
        );


    const isCurrentWeek =
        Number(selectedWeek) ===
        currentWeek;


    /*
    Mackolik karşılığı.
    */

    const target =
        findTargetMatch(
            sportTotoMatch.home,
            sportTotoMatch.away,
            isCurrentWeek
        );


    let prediction = null;


    if (target) {

        const calculation =
            calculatePrediction(
                target
            );


        prediction =
            calculation.prediction;
    }


    /*
    Geçmiş sonuç:
    Spor Toto data dosyasındaki
    result alanı.
    */

    const actual =
        sportTotoMatch.result ||
        null;


    let symbol = "•";

    let resultClass =
        "pending";


    /*
    Oynanmış maç
    */

    if (actual) {

        if (
            prediction &&
            prediction === actual
        ) {

            symbol = "✓";

            resultClass =
                "correct";

        } else {

            symbol = "✕";

            resultClass =
                "wrong";
        }
    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "match";


    let scoreHTML = "";


    if (
        target &&
        target.score &&
        target.score.home !== null &&
        target.score.away !== null
    ) {

        scoreHTML = `

            <div class="score">

                Skor:
                ${escapeHtml(
                    target.score.home
                )}

                -

                ${escapeHtml(
                    target.score.away
                )}

            </div>
        `;
    }


    card.innerHTML = `

        <div class="teams">

            <div class="team">

                ${escapeHtml(
                    sportTotoMatch.home
                )}

            </div>

            <div class="team">

                ${escapeHtml(
                    sportTotoMatch.away
                )}

            </div>

            ${scoreHTML}

        </div>


        <div class="prediction">

            ${prediction || "—"}

        </div>


        <div class="check ${resultClass}">

            ${symbol}

        </div>

    `;


    return card;
}


/*
==========================================================
 HAFTA GÖSTER
==========================================================
*/

function renderWeek() {

    const weeks =
        window
            .SPORT_TOTO_DATA
            ?.weeks || {};


    const matches =
        weeks[selectedWeek] || [];


    weekTitle.textContent =
        `${selectedWeek}. Hafta`;


    matchesContainer.innerHTML =
        "";


    if (
        !matches.length
    ) {

        matchesContainer.innerHTML = `

            <div class="empty">

                Bu haftada maç bulunamadı.

            </div>

        `;

        return;
    }


    let played = 0;


    for (
        const match of matches
    ) {

        if (
            match.result
        ) {

            played++;
        }


        matchesContainer.appendChild(
            renderMatch(match)
        );
    }


    const waiting =
        matches.length -
        played;


    statusText.textContent =
        `${matches.length} maç • ` +
        `${played} sonuçlanmış • ` +
        `${waiting} bekliyor`;
}


/*
==========================================================
 HAFTALARI OLUŞTUR
==========================================================
*/

function buildWeeks() {

    const weeks =
        window
            .SPORT_TOTO_DATA
            ?.weeks || {};


    const numbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a, b) =>
                    a - b
            );


    weekSelect.innerHTML =
        "";


    for (
        const week of numbers
    ) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            week;


        option.textContent =
            `${week}. Hafta`;


        weekSelect.appendChild(
            option
        );
    }


    const currentWeek =
        Number(
            window
                .SPORT_TOTO_DATA
                ?.currentWeek
        );


    if (
        weeks[currentWeek]
    ) {

        selectedWeek =
            currentWeek;

    } else {

        selectedWeek =
            numbers[
                numbers.length - 1
            ];
    }


    weekSelect.value =
        selectedWeek;
}

 VERİLERİ YÜKLE

async function loadData() {

    matchesContainer.innerHTML = `

        <div class="loading">

            Mackolik verileri yükleniyor...

        </div>

    `;


    statusText.textContent =
        "Veriler hazırlanıyor...";


    try {

        const response =
            await fetch(
                MATCHES_URL +
                "?v=" +
                Date.now()
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "matches.json yüklenemedi."
            );
        }


        const data =
            await response.json();


        allMatches =
            Array.isArray(
                data.matches
            )
            ? data.matches
            : [];


        /*
        Tarihsel hesaplamaya sadece:

        - openingOdds bulunan
        - MS sonucu belli

        maçlar girer.
        */

        historicalMatches =
            allMatches.filter(
                match =>
                    match &&
                    match.openingOdds &&
                    getMSResult(match)
            );


        buildPairIndex();


        statusText.textContent =
            `${allMatches.length} Mackolik maçı yüklendi.`;


        renderWeek();


    } catch (error) {

        console.error(
            error
        );


        matchesContainer.innerHTML = `

            <div class="error">

                Veri yüklenemedi.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        statusText.textContent =
            "Veri yükleme hatası.";
    }
}
