<header>

<script>
"use strict";


/* =========================================================
   AYARLAR
========================================================= */

const MACKOLIK_URL =
"https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";

const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;


/* =========================================================
   GLOBAL
========================================================= */

let mackolikMatches = [];
let selectedWeek = null;


/* =========================================================
   NORMALİZASYON
========================================================= */

function normalizeText(value){

    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/ı/g,"i")
        .replace(/ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/[^a-z0-9]/g,"");
}


/* =========================================================
   TAKIM ALIASLARI
========================================================= */

const TEAM_ALIASES = {

    "corumfk":[
        "corumfk",
        "arcacorumfk",
        "corum"
    ],

    "istanbulbasaksehir":[
        "istanbulbasaksehir",
        "ramsbasaksehir",
        "basaksehir"
    ],

    "tottenhamhotspur":[
        "tottenhamhotspur",
        "thotspur",
        "tottenham"
    ],

    "hullcity":[
        "hullcity",
        "hcity"
    ],

    "manchestercity":[
        "manchestercity",
        "mcity"
    ],

    "manchesterunited":[
        "manchesterunited",
        "manchesterutd",
        "manutd"
    ],

    "parissaintgermain":[
        "parissaintgermain",
        "parisstgermain",
        "psg"
    ],

    "kuzeymakedonya":[
        "kuzeymakedonyacumhuriyeti",
        "kuzeymakedonya",
        "makedonya",
        "northmacedonia"
    ],

    "vfbstuttgart":[
        "vfbstuttgart",
        "stuttgart"
    ],

    "bayerleverkusen":[
        "bayerleverkusen",
        "leverkusen"
    ],

    "rbleipzig":[
        "rbleipzig",
        "leipzig"
    ],

    "galatasaray":[
        "galatasaray"
    ],

    "fenerbahce":[
        "fenerbahce"
    ],

    "besiktas":[
        "besiktas"
    ],

    "trabzonspor":[
        "trabzonspor"
    ],

    "samsunspor":[
        "samsunspor"
    ],

    "goztepe":[
        "goztepe"
    ],

    "kocaelispor":[
        "kocaelispor"
    ],

    "amedspor":[
        "amedsportiffaaliyetler",
        "amedspor",
        "amed"
    ],

    "erzurumspor":[
        "erzurumsporfk",
        "erzurumspor"
    ],

    "gaziantepfk":[
        "gaziantepfk",
        "gaziantep"
    ],

    "alanyaspor":[
        "corendonalanyaspor",
        "alanyaspor"
    ],

    "kasimpasa":[
        "kasimpasa"
    ],

    "eyupspor":[
        "eyupspor"
    ],

    "rizespor":[
        "caykurrizespor",
        "rizespor"
    ],

    "konyaspor":[
        "tumosankonyaspor",
        "konyaspor"
    ],

    "genclerbirligi":[
        "genclerbirligi"
    ]
};


function canonicalTeam(name){

    const n = normalizeText(name);

    for(const canonical in TEAM_ALIASES){

        if(TEAM_ALIASES[canonical].includes(n)){
            return canonical;
        }
    }

    return n;
}


function sameTeam(a,b){

    const ca = canonicalTeam(a);
    const cb = canonicalTeam(b);

    return ca === cb;
}


/* =========================================================
   TARİH
========================================================= */

function parseDate(value){

    if(!value) return null;

    const s = String(value).trim();

    let d = null;

    if(/^\d{2}\.\d{2}\.\d{4}$/.test(s)){

        const [day,month,year] = s.split(".");

        d = new Date(
            Number(year),
            Number(month)-1,
            Number(day)
        );

    }else{

        d = new Date(s);
    }

    if(Number.isNaN(d?.getTime())) return null;

    d.setHours(0,0,0,0);

    return d;
}


/* =========================================================
   SKOR
========================================================= */

function getFullScore(match){

    const score = match?.score;

    if(!score) return null;

    const home = Number(score.home);
    const away = Number(score.away);

    if(!Number.isFinite(home) ||
       !Number.isFinite(away)){

        return null;
    }

    return {
        home,
        away
    };
}


function getResult(match){

    const score = getFullScore(match);

    if(!score) return null;

    if(score.home > score.away) return "1";
    if(score.home < score.away) return "2";

    return "X";
}


/* =========================================================
   AÇILIŞ ORANI
========================================================= */

function getOpeningOdds(match,key){

    const odds = match?.openingOdds;

    if(!odds) return null;

    const value = odds[key];

    if(value === null ||
       value === undefined ||
       value === ""){

        return null;
    }

    const number = Number(value);

    return Number.isFinite(number)
        ? number
        : null;
}


/* =========================================================
   TAM ORAN EŞLEŞMESİ
========================================================= */

function exactOdds(a,b){

    if(a === null || b === null){
        return false;
    }

    return Number(a) === Number(b);
}


/* =========================================================
   GEÇMİŞ 60 GÜN
========================================================= */

function getHistory(targetDate){

    const target = parseDate(targetDate);

    if(!target) return [];

    const start = new Date(target);

    start.setDate(
        start.getDate() - HISTORY_DAYS
    );

    return mackolikMatches.filter(match => {

        const date = parseDate(match.date);

        if(!date) return false;

        if(date < start) return false;
        if(date >= target) return false;

        return getFullScore(match) !== null;
    });
}


/* =========================================================
   MACKOLIK MAÇINI BUL
========================================================= */

function findMackolikCandidates(stMatch){

    return mackolikMatches.filter(match => {

        return sameTeam(match.home,stMatch.home) &&
               sameTeam(match.away,stMatch.away);
    });
}


function findMackolikMatch(stMatch){

    const candidates =
        findMackolikCandidates(stMatch);

    if(!candidates.length){
        return null;
    }

    /*
       Aynı takım eşleşmesinden birden fazla kayıt varsa
       bugüne en yakın olanı tercih ediyoruz.
    */

    const today = new Date();
    today.setHours(0,0,0,0);

    candidates.sort((a,b)=>{

        const da = parseDate(a.date);
        const db = parseDate(b.date);

        if(!da && !db) return 0;
        if(!da) return 1;
        if(!db) return -1;

        return Math.abs(
            da.getTime()-today.getTime()
        ) -
        Math.abs(
            db.getTime()-today.getTime()
        );
    });

    return candidates[0];
}


/* =========================================================
   ÖRNEKLEM PAZARLARI
========================================================= */

const MARKETS = [

    {
        key:"iy15Ust",
        name:"İY 1.5 Üst"
    },

    {
        key:"iy1",
        name:"İY 1"
    },

    {
        key:"iy2",
        name:"İY 2"
    },

    {
        key:"au15Alt",
        name:"1.5 Alt"
    },

    {
        key:"au15Ust",
        name:"1.5 Üst"
    }

];


/* =========================================================
   TEK PAZARIN ÖRNEKLEMİNİ HESAPLA
========================================================= */

function analyzeMarket(targetMatch,market,targetDate){

    const targetOdd =
        getOpeningOdds(
            targetMatch,
            market.key
        );

    if(targetOdd === null){
        return null;
    }

    const history =
        getHistory(targetDate);

    const samples =
        history.filter(match => {

            const odd =
                getOpeningOdds(
                    match,
                    market.key
                );

            return exactOdds(
                odd,
                targetOdd
            );
        });

    if(samples.length < MIN_SAMPLE){
        return null;
    }

    let one = 0;
    let x = 0;
    let two = 0;

    samples.forEach(match => {

        const result =
            getResult(match);

        if(result === "1") one++;
        if(result === "X") x++;
        if(result === "2") two++;
    });

    const total =
        one + x + two;

    if(total < MIN_SAMPLE){
        return null;
    }

    return {
        market:market.name,
        key:market.key,
        odd:targetOdd,
        sample:total,
        one:(one/total)*100,
        x:(x/total)*100,
        two:(two/total)*100
    };
}


/* =========================================================
   ORTAK KARAR MOTORU
=========================================================

   BURASI SİSTEMİN ANA NOKTASI.

   5 farklı örneklem ayrı tahmin olarak kullanılmıyor.

   Hepsinin 1/X/2 dağılımı tek havuzda birleştiriliyor.

   Daha fazla örnekleme sahip pazarın etkisi:
       sqrt(örneklem)

   Böylece 100 örneklemli veri,
   5 örneklemli veriden daha fazla ağırlık taşır.

========================================================= */

function calculateCommonDecision(targetMatch,targetDate){

    const analyses = [];

    MARKETS.forEach(market => {

        const result =
            analyzeMarket(
                targetMatch,
                market,
                targetDate
            );

        if(result){
            analyses.push(result);
        }
    });


    /*
       Hiçbir pazarda yeterli örneklem yok.
    */

    if(!analyses.length){

        return {
            one:33.33,
            x:33.33,
            two:33.34,
            main:"?",
            system:"1X2",
            validMarkets:0,
            totalSample:0
        };
    }


    /*
       ORTAK KARAR

       Her marketin 1/X/2 yüzdesini alıyoruz.

       Fakat marketleri eşit kabul etmiyoruz.

       Ağırlık = sqrt(örneklem sayısı)
    */

    let one = 0;
    let x = 0;
    let two = 0;

    let totalWeight = 0;
    let totalSample = 0;

    analyses.forEach(item => {

        const weight =
            Math.sqrt(item.sample);

        one += item.one * weight;
        x += item.x * weight;
        two += item.two * weight;

        totalWeight += weight;
        totalSample += item.sample;
    });


    one /= totalWeight;
    x /= totalWeight;
    two /= totalWeight;


    /*
       Yuvarlama sonrası toplamın 100 olması için
       son değeri normalize ediyoruz.
    */

    const total =
        one + x + two;

    one = one / total * 100;
    x = x / total * 100;
    two = two / total * 100;


    const values = [

        {
            key:"1",
            value:one
        },

        {
            key:"X",
            value:x
        },

        {
            key:"2",
            value:two
        }

    ].sort(
        (a,b)=>b.value-a.value
    );


    const first = values[0];
    const second = values[1];


    /*
       SİSTEM KARARI

       Çok belirgin ortak sonuç:
       TEK

       İki sonuç belirgin:
       ÇİFT

       Sonuçlar birbirine yakın:
       ÜÇLÜ
    */

    let system = "1X2";

    if(
        first.value >= 50 &&
        first.value - second.value >= 15
    ){

        system = first.key;

    }else if(
        first.value >= 40 &&
        first.value - second.value >= 7
    ){

        system =
            first.key +
            second.key;

    }else{

        system = "1X2";
    }


    return {

        one,
        x,
        two,

        main:first.key,

        system,

        validMarkets:analyses.length,

        totalSample,

        markets:analyses
    };
}


/* =========================================================
   YÜZDE
========================================================= */

function pct(value){

    return Math.round(value) + "%";
}


/* =========================================================
   SİSTEM SINIFI
========================================================= */

function systemClass(system){

    if(
        system === "1" ||
        system === "X" ||
        system === "2"
    ){
        return "single";
    }

    if(system === "1X2"){
        return "triple";
    }

    return "double";
}


/* =========================================================
   MAÇ RENDER
========================================================= */

function renderMatch(match,index){

    const mackolik =
        findMackolikMatch(match);


    /*
       Mackolik eşleşmesi yok.
    */

    if(!mackolik){

        return `

            <div class="match">

                <div class="match-top">

                    <div class="number">
                        ${index+1}
                    </div>

                    <div class="teams">
                        ${escapeHtml(match.home)}
                        -
                        ${escapeHtml(match.away)}
                    </div>

                    <div class="main-pred">
                        ?
                    </div>

                    <div class="system triple">
                        1X2
                    </div>

                </div>

                <div class="no-data">
                    Mackolik1 içinde bu maç için eşleşme bulunamadı.
                </div>

            </div>

        `;
    }


    /*
       Çok önemli:

       Hedef maçın Mackolik'teki kendi tarihini kullanıyoruz.

       Böylece son 60 gün,
       hedef maçın tarihine göre hesaplanıyor.
    */

    const targetDate =
        mackolik.date;


    const decision =
        calculateCommonDecision(
            mackolik,
            targetDate
        );


    return `

        <div class="match">

            <div class="match-top">

                <div class="number">
                    ${index+1}
                </div>

                <div class="teams">
                    ${escapeHtml(match.home)}
                    -
                    ${escapeHtml(match.away)}
                </div>

                <div class="main-pred">
                    ${decision.main}
                </div>

                <div class="system ${systemClass(decision.system)}">
                    ${decision.system}
                </div>

            </div>


            <div class="percentages">

                <div class="percent">
                    1
                    <b>${pct(decision.one)}</b>
                </div>

                <div class="percent">
                    X
                    <b>${pct(decision.x)}</b>
                </div>

                <div class="percent">
                    2
                    <b>${pct(decision.two)}</b>
                </div>

            </div>


            <div class="confidence">

                Ortak karar:
                <b>${decision.main}</b>

                • Sistem:
                <b>${decision.system}</b>

                •
                ${decision.validMarkets}
                / ${MARKETS.length}
                örneklem türü kullanıldı

                •
                ${decision.totalSample}
                toplam geçmiş eşleşme

            </div>


            ${
                decision.validMarkets === 0

                ?

                `
                <div class="no-data">
                    En az ${MIN_SAMPLE} birebir oran eşleşmesi
                    bulunan örneklem yok.
                </div>
                `

                :

                ""
            }

        </div>

    `;
}


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   HAFTA RENDER
========================================================= */

function renderWeek(){

    const weekData =
        window.SPORT_TOTO_DATA
        ?.weeks
        ?.[selectedWeek];


    if(!weekData){

        document.getElementById("content").innerHTML =
            `
            <div class="error">
                ${selectedWeek}. hafta verisi bulunamadı.
            </div>
            `;

        return;
    }


    const matches =
        Array.isArray(weekData)
        ? weekData
        : weekData.matches || [];


    let single = 0;
    let double = 0;
    let triple = 0;


    /*
       Kupon özetini hesapla.
    */

    matches.forEach(match => {

        const mackolik =
            findMackolikMatch(match);

        if(!mackolik) return;

        const decision =
            calculateCommonDecision(
                mackolik,
                mackolik.date
            );


        if(
            decision.system === "1" ||
            decision.system === "X" ||
            decision.system === "2"
        ){

            single++;

        }else if(
            decision.system === "1X2"
        ){

            triple++;

        }else{

            double++;
        }
    });


    const rows =
        matches
            .map((match,index)=>
                renderMatch(match,index)
            )
            .join("");


    document.getElementById("content").innerHTML = `

        <div class="info">

            <div class="info-title">
                Spor Toto ${selectedWeek}. Hafta
            </div>

            <div class="info-text">
                Her maç için birden fazla Mackolik örneklemi
                ayrı ayrı tahmin olarak gösterilmez.
                Tüm geçerli örneklemler birleştirilerek
                tek bir ortak 1/X/2 kararı oluşturulur.
            </div>

        </div>


        <div class="coupon">

            <div class="coupon-head">

                <strong>Ortak Karar Kuponu</strong>

                <div class="summary">

                    <span class="badge">
                        Tek: ${single}
                    </span>

                    <span class="badge">
                        Çift: ${double}
                    </span>

                    <span class="badge">
                        Üçlü: ${triple}
                    </span>

                    <span class="badge">
                        Maç: ${matches.length}
                    </span>

                </div>

            </div>

            ${rows}

        </div>

    `;
}


/* =========================================================
   HAFTA BUTONLARI
========================================================= */

function renderWeeks(){

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};


    const numbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a,b)=>a-b
            );


    document.getElementById("weeks").innerHTML =
        numbers
            .map(week => `

                <button
                    class="week-btn ${
                        Number(week) ===
                        Number(selectedWeek)
                        ? "active"
                        : ""
                    }"
                    data-week="${week}"
                >
                    ${week}. Hafta
                </button>

            `)
            .join("");


    document
        .querySelectorAll(".week-btn")
        .forEach(button => {

            button.addEventListener(

async function loadMackolik(){

    const response =
        await fetch(
            MACKOLIK_URL +
            "?t=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "Mackolik verisi alınamadı. HTTP " +
            response.status
        );
    }


    const data =
        await response.json();


    if(
        !data ||
        !Array.isArray(data.matches)
    ){

        throw new Error(
            "Mackolik matches verisi bulunamadı."
        );
    }


    mackolikMatches =
        data.matches;


    console.log(
        "Mackolik maç sayısı:",
        mackolikMatches.length
    );
}


/* =========================================================
   BAŞLAT
========================================================= */

async function init(){

    try{

        if(!window.SPORT_TOTO_DATA){

            throw new Error(
                "spor-toto-data.js yüklenemedi."
            );
        }


        const weeks =
            window.SPORT_TOTO_DATA.weeks || {};


        const numbers =
            Object.keys(weeks)
                .map(Number)
                .sort(
                    (a,b)=>a-b
                );


        selectedWeek =
            Number(
                window.SPORT_TOTO_DATA.currentWeek
            ) ||
            numbers[numbers.length-1];


        renderWeeks();


        document.getElementById("content").innerHTML =
            `
            <div class="loading">
                Mackolik açılış oranları yükleniyor...
            </div>
            `;


        await loadMackolik();


        renderWeek();


    }catch(error){

        console.error(error);


        document.getElementById("content").innerHTML = `

            <div class="error">

                <strong>Veri yüklenemedi.</strong>

                <br><br>

                ${escapeHtml(
                    error.message || error
                )}

            </div>

        `;
    }
}

(function () {
    "use strict";

    function getMatchResult(match) {
        if (!match) return null;

        const score = match.score;

        if (!score) return null;

        const home = Number(score.home);
        const away = Number(score.away);

        if (!Number.isFinite(home) || !Number.isFinite(away)) {
            return null;
        }

        /*
         * Mackolik'te maçın sonucu henüz oluşmadıysa
         * status değerine göre bekleyen kabul ediyoruz.
         */
        const status = String(match.status ?? "").toLowerCase();

        const finishedStatuses = [
            "4",
            "finished",
            "ft",
            "ended",
            "completed"
        ];

        if (
            status &&
            !finishedStatuses.includes(status)
        ) {
            return null;
        }

        if (home > away) return "1";
        if (home < away) return "2";

        return "X";
    }


    function predictionHit(prediction, result) {

        if (!prediction || prediction === "?") {
            return false;
        }

        if (!result) {
            return false;
        }

        /*
         * Sistem:
         *
         * 1   -> sadece 1
         * X   -> sadece X
         * 2   -> sadece 2
         * 1X  -> 1 veya X
         * X2  -> X veya 2
         * 12  -> 1 veya 2
         * 1X2 -> herhangi biri
         */

        return prediction.includes(result);
    }


    function createResultBadge(state) {

        if (state === "hit") {
            return `
                <span class="prediction-result prediction-hit"
                      title="Tahmin tuttu">
                    ✓
                </span>
            `;
        }

        if (state === "miss") {
            return `
                <span class="prediction-result prediction-miss"
                      title="Tahmin tutmadı">
                    ✕
                </span>
            `;
        }

        return `
            <span class="prediction-result prediction-wait"
                  title="Maç henüz sonuçlanmadı">
                •
            </span>
        `;
    }


    function updateSummary(total, hit, miss, waiting) {

        const old = document.getElementById(
            "predictionResultSummary"
        );

        if (old) {
            old.remove();
        }

        const finished = hit + miss;

        let success = 0;

        if (finished > 0) {
            success = (hit / finished) * 100;
        }

        const summary = document.createElement("div");

        summary.id = "predictionResultSummary";

        summary.innerHTML = `
            <div class="result-summary-title">
                📊 Tahmin Sonuçları
            </div>

                    <span>%</span>

                    <small>Başarı</small>
                </div>

        `;

        const content = document.getElementById("content");

    function updatePredictionResults() {

        if (
            typeof selectedWeek === "undefined" ||
            !window.SPORT_TOTO_DATA ||
            typeof findMackolikMatch !== "function"
        ) {
            return;
        }

        const weekData =
            window.SPORT_TOTO_DATA?.weeks?.[selectedWeek];

        if (!weekData) {
            return;
        }

        const matches =
            Array.isArray(weekData)
                ? weekData
                : weekData.matches || [];

        const matchElements =
            document.querySelectorAll(".match");

        let hit = 0;
        let miss = 0;
        let waiting = 0;

        matches.forEach((sportMatch, index) => {

            const element = matchElements[index];

            if (!element) {
                return;
            }

            /*
             * Daha önce eklenmiş sonucu temizle
             */
            const oldBadge =
                element.querySelector(".prediction-result");

            if (oldBadge) {
                oldBadge.remove();
            }

            const mackolikMatch =
                findMackolikMatch(sportMatch);

            if (!mackolikMatch) {
                waiting++;
                return;
            }

            const actualResult =
                getMatchResult(mackolikMatch);

            /*
             * Tahmin kutusunu bul
             */
            const predictionElement =
                element.querySelector(".main-pred");

            const systemElement =
                element.querySelector(".system");

            if (!predictionElement) {
                waiting++;
                return;
            }

            /*
             * Öncelikle sistem tahminini kullanıyoruz.
             *
             * Örneğin:
             * 1
             * X
             * 2
             * 1X
             * X2
             * 12
             * 1X2
             */

            const system =
                systemElement
                    ? systemElement.textContent.trim()
                    : predictionElement.textContent.trim();

            /*
             * Maç henüz sonuçlanmadı

            if (!actualResult) {

                predictionElement.insertAdjacentHTML(

                    createResultBadge("waiting")
                );

                waiting++;

            }

            /*
             * Sistem tahminini gerçek sonuçla karşılaştır
             */
            const isHit =
                predictionHit(
                    system,
                    actualResult
                );

            if (isHit) {

                predictionElement.insertAdjacentHTML(
                    "afterend",
                    createResultBadge("hit")
                );

                hit++;

            } else {

                predictionElement.insertAdjacentHTML(
                    "afterend",
                    createResultBadge("miss")
                );

                miss++;
            }

        });

        updateSummary(
            matches.length,
            hit,
            miss,
            waiting
        );
    }
