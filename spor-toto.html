<header>
    <h1>⚽ Spor Toto Analiz</h1>
    <p>Mackolik açılış oranları • Son 60 gün • Tam oran eşleşmesi</p>
</header>

<div class="container">

<script src="spor-toto-data.js"></script>

<script>
"use strict";

/* =========================================================
   AYARLAR
========================================================= */

const MACKOLIK_URL =
    "https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";

const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;


/* =========================================================
   GLOBAL
========================================================= */

let mackolikMatches = [];
let selectedWeek = null;


/* =========================================================
   TAKIM İSİM NORMALİZASYONU
========================================================= */

function normalizeText(value){
    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/ı/g,"i")
        .replace(/ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/[^a-z0-9]/g,"");
}


/* =========================================================
   TAKIM ALIASLARI
========================================================= */

const TEAM_ALIASES = {

    "corumfk":[
        "corumfk",
        "arcacorumfk",
        "corum"
    ],

    "istanbulbasaksehir":[
        "istanbulbasaksehir",
        "ramsbasaksehir",
        "basaksehir",
        "istanbulbasaksehirfk"
    ],

    "tottenhamhotspur":[
        "tottenhamhotspur",
        "thotspur",
        "tottenham"
    ],

    "hullcity":[
        "hullcity",
        "hcity"
    ],

    "manchestercity":[
        "manchestercity",
        "mcity"
    ],

    "manchesterunited":[
        "manchesterunited",
        "manchesterutd",
        "manutd"
    ],

    "parissaintgermain":[
        "parissaintgermain",
        "parisstgermain",
        "psg"
    ],

    "nordmakedonia":[
        "kuzeymakedonyacumhuriyeti",
        "kuzeymakedonya",
        "makedonya",
        "northmacedonia"
    ],

    "vfbstuttgart":[
        "vfbstuttgart",
        "stuttgart"
    ],

    "bayerleverkusen":[
        "bayerleverkusen",
        "leverkusen"
    ],

    "rbleipzig":[
        "rb_leipzig",
        "rbleipzig",
        "leipzig"
    ],

    "galatasaray":[
        "galatasaray"
    ],

    "fenerbahce":[
        "fenerbahce"
    ],

    "besiktas":[
        "besiktas"
    ],

    "trabzonspor":[
        "trabzonspor"
    ],

    "samsunspor":[
        "samsunspor"
    ],

    "goztepe":[
        "goztepe"
    ],

    "kocaelispor":[
        "kocaelispor"
    ],

    "amedspor":[
        "amedsportiffaaliyetler",
        "amedspor",
        "amed"
    ],

    "erzurumspor":[
        "erzurumsporfk",
        "erzurumspor"
    ],

    "gaziantepfk":[
        "gaziantepfk",
        "gaziantep"
    ],

    "alanyaspor":[
        "corendonalanyaspor",
        "alanyaspor"
    ],

    "kasimpasa":[
        "kasimpasa"
    ],

    "eyupspor":[
        "eyupspor"
    ],

    "rizespor":[
        "caykurrizespor",
        "rizespor"
    ],

    "konyaspor":[
        "tumosankonyaspor",
        "konyaspor"
    ],

    "genclerbirligi":[
        "genclerbirligi"
    ]
};


function canonicalTeam(name){

    const n = normalizeText(name);

    for(const canonical of Object.keys(TEAM_ALIASES)){
        if(TEAM_ALIASES[canonical].includes(n)){
            return canonical;
        }
    }

    return n;
}


function sameTeam(a,b){

    const ca = canonicalTeam(a);
    const cb = canonicalTeam(b);

    if(ca === cb) return true;

    return normalizeText(a) === normalizeText(b);
}


/* =========================================================
   TARİH
========================================================= */

function parseDate(value){

    if(!value) return null;

    const s = String(value).trim();

    let d;

    if(/^\d{2}\.\d{2}\.\d{4}$/.test(s)){
        const [day,month,year] = s.split(".");
        d = new Date(
            Number(year),
            Number(month)-1,
            Number(day)
        );
    }else{
        d = new Date(s);
    }

    if(Number.isNaN(d.getTime())) return null;

    d.setHours(0,0,0,0);

    return d;
}


/* =========================================================
   SKOR
========================================================= */

function getFullScore(match){

    const score = match?.score;

    if(!score) return null;

    const h = Number(score.home);
    const a = Number(score.away);

    if(!Number.isFinite(h) || !Number.isFinite(a)){
        return null;
    }

    return {
        home:h,
        away:a
    };
}


function getResult(match){

    const score = getFullScore(match);

    if(!score) return null;

    if(score.home > score.away) return "1";
    if(score.home < score.away) return "2";

    return "X";
}


/* =========================================================
   ORAN
========================================================= */

function getOpeningOdds(match,key){

    const odds = match?.openingOdds;

    if(!odds) return null;

    const value = odds[key];

    if(value === null || value === undefined || value === ""){
        return null;
    }

    const n = Number(value);

    if(!Number.isFinite(n)) return null;

    return n;
}


/*
   ÖNEMLİ:
   TOLERANS YOK.

   1.72 === 1.72
   1.71 !== 1.72
   1.73 !== 1.72
*/

function exactOdds(a,b){

    if(a === null || b === null){
        return false;
    }

    return Number(a) === Number(b);
}


/* =========================================================
   GEÇMİŞ 60 GÜN
========================================================= */

function getHistory(targetDate){

    const target = parseDate(targetDate);

    if(!target) return [];

    const start = new Date(target);
    start.setDate(start.getDate() - HISTORY_DAYS);

    return mackolikMatches.filter(match => {

        const date = parseDate(match.date);

        if(!date) return false;

        if(date < start) return false;
        if(date >= target) return false;

        return getFullScore(match) !== null;
    });
}


/* =========================================================
   MACKOLIK MAÇINI BUL
========================================================= */

function findMackolikMatch(stMatch){

    const home = stMatch.home;
    const away = stMatch.away;

    const exact = mackolikMatches.find(m =>
        sameTeam(m.home,home) &&
        sameTeam(m.away,away)
    );

    if(exact) return exact;

    /*
       İkinci kontrol:
       İsimlerde ufak farklılıklar varsa normalize edilmiş
       parçalı eşleşme.
    */

    const h = normalizeText(home);
    const a = normalizeText(away);

    return mackolikMatches.find(m => {

        const mh = normalizeText(m.home);
        const ma = normalizeText(m.away);

        return (
            (mh.includes(h) || h.includes(mh)) &&
            (ma.includes(a) || a.includes(ma))
        );
    }) || null;
}


/* =========================================================
   ÖRNEKLEM PAZARLARI
========================================================= */

const MARKETS = [
    {
        name:"İY 1.5 Üst",
        key:"iy15Ust"
    },
    {
        name:"İY 1",
        key:"iy1"
    },
    {
        name:"İY 2",
        key:"iy2"
    },
    {
        name:"1.5 Alt",
        key:"au15Alt"
    },
    {
        name:"1.5 Üst",
        key:"au15Ust"
    }
];


/* =========================================================
   ÖRNEKLEM BUL
========================================================= */

function findSamples(targetMatch, market, targetDate){

    const targetOdds =
        getOpeningOdds(targetMatch,market.key);

    if(targetOdds === null){
        return [];
    }

    const history = getHistory(targetDate);

    return history.filter(match => {

        const historicalOdds =
            getOpeningOdds(match,market.key);

        if(!exactOdds(historicalOdds,targetOdds)){
            return false;
        }

        return true;
    });
}


/* =========================================================
   PAZAR ANALİZİ
========================================================= */

function analyzeMarket(targetMatch,market,targetDate){

    const samples =
        findSamples(targetMatch,market,targetDate);

    if(samples.length < MIN_SAMPLE){
        return null;
    }

    let one = 0;
    let x = 0;
    let two = 0;

    samples.forEach(match => {

        const result = getResult(match);

        if(result === "1") one++;
        else if(result === "X") x++;
        else if(result === "2") two++;
    });

    const total = one + x + two;

    if(total < MIN_SAMPLE){
        return null;
    }

    return {
        market:market.name,
        key:market.key,
        odds:getOpeningOdds(targetMatch,market.key),
        sample:total,
        one:one / total * 100,
        x:x / total * 100,
        two:two / total * 100
    };
}


/* =========================================================
   GENEL TAHMİN
========================================================= */

function prediction(targetMatch,targetDate){

    const results = [];

    MARKETS.forEach(market => {

        const result =
            analyzeMarket(targetMatch,market,targetDate);

        if(result){
            results.push(result);
        }
    });

    if(!results.length){

        return {
            one:33.33,
            x:33.33,
            two:33.34,
            main:"?",
            system:"Üçlü",
            markets:[]
        };
    }

    let one = 0;
    let x = 0;
    let two = 0;
    let weightTotal = 0;

    results.forEach(r => {

        /*
           Daha fazla örneklem = daha fazla ağırlık.
        */

        const weight = Math.sqrt(r.sample);

        one += r.one * weight;
        x += r.x * weight;
        two += r.two * weight;

        weightTotal += weight;
    });

    one /= weightTotal;
    x /= weightTotal;
    two /= weightTotal;

    const values = [
        {key:"1",value:one},
        {key:"X",value:x},
        {key:"2",value:two}
    ].sort((a,b)=>b.value-a.value);

    const first = values[0];
    const second = values[1];

    let system;

    /*
       Tek:
       En güçlü sonuç en az %50 ve ikinci sonuçtan
       en az 15 puan önde.

       Çift:
       Güçlü iki sonuç arasında yeterli yakınlık.

       Üçlü:
       Veri zayıf / sonuçlar birbirine yakın.
    */

    if(first.value >= 50 && first.value - second.value >= 15){
        system = "Tek";
    }else if(first.value >= 40){
        system = first.key + second.key;
    }else{
        system = "1X2";
    }

    return {
        one,
        x,
        two,
        main:first.key,
        system,
        markets:results
    };
}


/* =========================================================
   YÜZDE FORMAT
========================================================= */

function pct(value){

    if(!Number.isFinite(value)){
        return "-";
    }

    return Math.round(value) + "%";
}


/* =========================================================
   ORAN GÖSTER
========================================================= */

function renderOdds(match){

    const keys = [
        ["MS1","ms1"],
        ["MSX","msX"],
        ["MS2","ms2"],
        ["KG Var","kgVar"],
        ["KG Yok","kgYok"],
        ["2.5 Üst","au25Ust"],
        ["2.5 Alt","au25Alt"],
        ["İY1","iy1"],
        ["İYX","iyX"],
        ["İY2","iy2"],
        ["İY1.5 Üst","iy15Ust"],
        ["İY1.5 Alt","iy15Alt"]
    ];

    const html = [];

    keys.forEach(([label,key]) => {

        const value = getOpeningOdds(match,key);

        if(value !== null){

            html.push(
                `<span class="odd">${label}: ${value.toFixed(2)}</span>`
            );
        }
    });

    return html.join("");
}


/* =========================================================
   PAZARLAR
========================================================= */

function renderMarkets(markets){

    if(!markets.length){

        return `
            <div class="note">
                Yeterli örneklem bulunamadı.
                Bu maç için en az ${MIN_SAMPLE} tam oran eşleşmesi gerekli.
            </div>
        `;
    }

    return `
        <div class="samples">

            ${markets.map(m => {

                const arr = [
                    {k:"1",v:m.one},
                    {k:"X",v:m.x},
                    {k:"2",v:m.two}
                ].sort((a,b)=>b.v-a.v);

                return `
                    <div class="sample">

                        <span class="sample-name">
                            ${m.market}
                            (${m.odds.toFixed(2)})
                            • ${m.sample} örnek
                        </span>

                        <span class="sample-result">
                            1 ${pct(m.one)}
                            &nbsp; X ${pct(m.x)}
                            &nbsp; 2 ${pct(m.two)}
                            → <strong>${arr[0].k}</strong>
                        </span>

                    </div>
                `;

            }).join("")}

        </div>
    `;
}


/* =========================================================
   SİSTEM TİPİ
========================================================= */

function systemClass(system){

    if(system === "Tek") return "single";
    if(system === "1X2") return "triple";

    return "double";
}


/* =========================================================
   MAÇ RENDER
========================================================= */

function renderMatch(stMatch,index){

    const targetDate =
        selectedWeekData()?.date ||
        stMatch.date ||
        new Date().toISOString().slice(0,10);

    const mackolik =
        findMackolikMatch(stMatch);

    if(!mackolik){

        return `
            <div class="match">

                <div class="match-top">

                    <div class="no">${index+1}</div>

                    <div class="teams">
                        ${stMatch.home}
                        -
                        ${stMatch.away}
                    </div>

                    <div class="pred">?</div>

                    <div class="system triple">
                        1X2
                    </div>

                </div>

                <div class="note">
                    Mackolik maçında eşleşme bulunamadı.
                </div>

            </div>
        `;
    }

    const predictionData =
        prediction(mackolik,targetDate);

    return `
        <div class="match">

            <div class="match-top">

                <div class="no">${index+1}</div>

                <div class="teams">
                    ${stMatch.home}
                    -
                    ${stMatch.away}
                </div>

                <div class="pred">
                    ${predictionData.main}
                </div>

                <div class="system ${systemClass(predictionData.system)}">
                    ${predictionData.system}
                </div>

            </div>


            <div class="percentages">

                <div class="pbox">
                    1
                    <b>${pct(predictionData.one)}</b>
                </div>

                <div class="pbox">
                    X
                    <b>${pct(predictionData.x)}</b>
                </div>

                <div class="pbox">
                    2
                    <b>${pct(predictionData.two)}</b>
                </div>

            </div>


            <div class="odds">
                ${renderOdds(mackolik)}
            </div>


            ${renderMarkets(predictionData.markets)}

        </div>
    `;
}


/* =========================================================
   HAFTA TARİHİ
========================================================= */

function selectedWeekData(){

    if(!selectedWeek) return null;

    const data =
        window.SPORT_TOTO_DATA?.weeks?.[selectedWeek];

    if(!data) return null;

    /*
       Veri dosyasında tarih yoksa Mackolik eşleşmesinden
       mümkün olan tarih kullanılacaktır.
    */

    return data;
}


/* =========================================================
   HAFTA RENDER
========================================================= */

function renderWeek(){

    const data =
        window.SPORT_TOTO_DATA?.weeks?.[selectedWeek];

    if(!data){

        document.getElementById("content").innerHTML =
            `<div class="error">Hafta verisi bulunamadı.</div>`;

        return;
    }

    const matches =
        Array.isArray(data)
            ? data
            : data.matches || [];

    const rows = [];

    let single = 0;
    let double = 0;
    let triple = 0;

    matches.forEach((match,index) => {

        const html =
            renderMatch(match,index);

        rows.push(html);
    });


    /*
       Kupon özetini ayrıca hesaplıyoruz.
    */

    matches.forEach(match => {

        const mackolik =
            findMackolikMatch(match);

        if(!mackolik) return;

        const p =
            prediction(
                mackolik,
                match.date || new Date().toISOString().slice(0,10)
            );

        if(p.system === "Tek") single++;
        else if(p.system === "1X2") triple++;
        else double++;
    });


    document.getElementById("content").innerHTML = `

        <div class="info">

            <div class="info-title">
                Spor Toto ${selectedWeek}. Hafta
            </div>

            <div class="info-text">
                ${matches.length} maç •
                Son ${HISTORY_DAYS} gün •
                Birebir açılış oranı •
                Minimum ${MIN_SAMPLE} örneklem
            </div>

        </div>


        <div class="coupon">

            <div class="coupon-head">

                <strong>Kupon Özeti</strong>

                <div class="coupon-summary">

                    <span class="badge">
                        Tek: ${single}
                    </span>

                    <span class="badge">
                        Çift: ${double}
                    </span>

                    <span class="badge">
                        Üçlü: ${triple}
                    </span>

                    <span class="badge">
                        Toplam: ${matches.length}
                    </span>

                </div>

            </div>


            ${rows.join("")}

        </div>
    `;
}


/* =========================================================
   HAFTALAR
========================================================= */

function renderWeeks(){

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};

    const container =
        document.getElementById("weeks");

    container.innerHTML =
        Object.keys(weeks)
            .sort((a,b)=>Number(a)-Number(b))
            .map(week => `

                <button
                    class="week-btn ${Number(week)===Number(selectedWeek) ? "active":""}"
                    data-week="${week}"
                >
                    ${week}. Hafta
                </button>

            `)
            .join("");

    container
        .querySelectorAll(".week-btn")
        .forEach(button => {

            button.addEventListener("click",() => {

                selectedWeek =
                    Number(button.dataset.week);

                renderWeeks();
                renderWeek();
            });
        });
}


/* =========================================================
   MACKOLIK VERİSİNİ ÇEK
========================================================= */

async function loadMackolik(){

    const response =
        await fetch(
            MACKOLIK_URL + "?t=" + Date.now(),
            {
                cache:"no-store"
            }
        );

    if(!response.ok){
        throw new Error(
            "Mackolik verisi alınamadı. HTTP " +
            response.status
        );
    }

    const data =
        await response.json();

    if(!Array.isArray(data.matches)){
        throw new Error(
            "Mackolik matches verisi bulunamadı."
        );
    }

    mackolikMatches =
        data.matches;

    console.log(
        "Mackolik maç sayısı:",
        mackolikMatches.length
    );
}


/* =========================================================
   BAŞLAT
========================================================= */

async function init(){

    try{

        if(!window.SPORT_TOTO_DATA){
            throw new Error(
                "spor-toto-data.js yüklenemedi."
            );
        }

        const weeks =
            window.SPORT_TOTO_DATA.weeks || {};

        const weekNumbers =
            Object.keys(weeks)
                .map(Number)
                .sort((a,b)=>a-b);

        selectedWeek =
            Number(
                window.SPORT_TOTO_DATA.currentWeek
            ) ||
            weekNumbers[weekNumbers.length-1];

        renderWeeks();

        document.getElementById("content").innerHTML =
            `<div class="loading">Mackolik verisi yükleniyor...</div>`;

        await loadMackolik();

        renderWeek();

    }catch(error){

        console.error(error);

        document.getElementById("content").innerHTML = `

            <div class="error">

                <strong>Veri yüklenemedi.</strong><br><br>

                ${String(error.message || error)}

                <br><br>

                Mackolik verisi GitHub'dan alınamadıysa
                birkaç saniye sonra sayfayı yenileyin.

            </div>
        `;
    }
}


init();
</script>
