<header>

    <h1>⚽ Spor Toto Analiz</h1>

    <p>
        Geçmiş örneklemlerden ortak sonuç • Tek tahmin
    </p>

</header>


<div class="container">

    <div id="weeks" class="weeks"></div>

        <div class="loading">
            Veriler yükleniyor...
        </div>

<script src="data/spor-toto-data.js"></script>


<script>

"use strict";


/* =========================================================
   AYARLAR
========================================================= */

const MACKOLIK_URL =
"https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";

const HISTORY_DAYS = 60;

const MIN_SAMPLE = 5;


/* =========================================================
   GLOBAL
========================================================= */

let mackolikMatches = [];

let selectedWeek = null;


/* =========================================================
   TAKIM NORMALİZASYONU
========================================================= */

function normalizeTeam(value){

    return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/ı/g,"i")
        .replace(/ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/[^a-z0-9]/g,"");

}


/* =========================================================
   TAKIM İSİM EŞLEŞMESİ
========================================================= */

const ALIASES = {

    corumfk:[
        "corumfk",
        "arcacorumfk",
        "corum"
    ],

    basaksehir:[
        "istanbulbasaksehir",
        "ramsbasaksehir",
        "basaksehir"
    ],

    alanyaspor:[
        "alanyaspor",
        "corendonalanyaspor"
    ],

    konyaspor:[
        "konyaspor",
        "tumosankonyaspor"
    ],

    rizespor:[
        "rizespor",
        "caykurrizespor"
    ],

    amedspor:[
        "amedspor",
        "amedsportiffaaliyetler"
    ],

    erzurumspor:[
        "erzurumspor",
        "erzurumsporfk"
    ],

    tottenham:[
        "tottenham",
        "tottenhamhotspur",
        "thotspur"
    ],

    manchestercity:[
        "manchestercity",
        "mcity"
    ],

    manchesterunited:[
        "manchesterunited",
        "manchesterutd",
        "manutd"
    ],

    psg:[
        "psg",
        "parissaintgermain",
        "parisstgermain"
    ],

    stuttgart:[
        "stuttgart",
        "vfbstuttgart"
    ],

    leverkusen:[
        "leverkusen",
        "bayerleverkusen"
    ],

    leipzig:[
        "leipzig",
        "rbleipzig"
    ]

};


function sameTeam(a,b){

    const aa =
        normalizeTeam(a);

    const bb =
        normalizeTeam(b);


    if(aa === bb){
        return true;
    }


    for(
        const key in ALIASES
    ){

        const list =
            ALIASES[key];


        if(
            list.includes(aa) &&
            list.includes(bb)
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   TARİH
========================================================= */

function parseDate(value){

    if(!value){
        return null;
    }


    const text =
        String(value).trim();


    if(
        /^\d{2}\.\d{2}\.\d{4}$/
            .test(text)
    ){

        const parts =
            text.split(".");


        const date =
            new Date(
                Number(parts[2]),
                Number(parts[1])-1,
                Number(parts[0])
            );


        date.setHours(
            0,0,0,0
        );


        return date;

    }


    const date =
        new Date(text);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return null;

    }


    date.setHours(
        0,0,0,0
    );


    return date;

}


/* =========================================================
   SKOR
========================================================= */

function getScore(match){

    const score =
        match?.score;


    if(!score){
        return null;
    }


    const home =
        Number(score.home);

    const away =
        Number(score.away);


    if(
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ){

        return null;

    }


    return {
        home,
        away
    };

}


/* =========================================================
   SONUÇ
========================================================= */

function getResult(match){

    const score =
        getScore(match);


    if(!score){
        return null;
    }


    if(
        score.home >
        score.away
    ){

        return "1";

    }


    if(
        score.home <
        score.away
    ){

        return "2";

    }


    return "X";

}


/* =========================================================
   AÇILIŞ ORANI
========================================================= */

function getOpeningOdd(
    match,
    market
){

    const odds =
        match?.openingOdds;


    if(!odds){
        return null;
    }


    const value =
        odds[market];


    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return null;

    }


    const number =
        Number(value);


    return Number.isFinite(number)
        ? number
        : null;

}


/* =========================================================
   MACKOLIK MAÇ BUL
========================================================= */

function findMackolikMatch(
    sportMatch
){

    const candidates =
        mackolikMatches.filter(
            match =>

                sameTeam(
                    match.home,
                    sportMatch.home
                )

                &&

                sameTeam(
                    match.away,
                    sportMatch.away
                )
        );


    if(
        !candidates.length
    ){

        return null;

    }


    if(
        candidates.length === 1
    ){

        return candidates[0];

    }


    /*
       Birden fazla aynı eşleşme varsa
       Spor Toto maçının tarihine en yakın
       Mackolik kaydını seç.
    */

    const targetDate =
        parseDate(
            sportMatch.date
        );


    if(!targetDate){

        return candidates
            .sort(
                (a,b)=>{

                    const da =
                        parseDate(a.date);

                    const db =
                        parseDate(b.date);


                    if(!da) return 1;

                    if(!db) return -1;


                    return (
                        db.getTime() -
                        da.getTime()
                    );

                }
            )[0];

    }


    return candidates
        .sort(
            (a,b)=>{

                const da =
                    parseDate(a.date);

                const db =
                    parseDate(b.date);


                if(!da) return 1;

                if(!db) return -1;


                return Math.abs(
                    da.getTime() -
                    targetDate.getTime()
                )
                -
                Math.abs(
                    db.getTime() -
                    targetDate.getTime()
                );

            }
        )[0];

}


/* =========================================================
   GEÇMİŞ 60 GÜN
========================================================= */

function getHistory(
    targetDate
){

    const target =
        parseDate(targetDate);


    if(!target){
        return [];
    }


    const start =
        new Date(target);


    start.setDate(
        start.getDate() -
        HISTORY_DAYS
    );


    return mackolikMatches.filter(
        match => {

            const date =
                parseDate(
                    match.date
                );


            if(!date){
                return false;
            }


            if(
                date < start ||
                date >= target
            ){

                return false;

            }


            return (
                getScore(match)
                !== null
            );

        }
    );

}


/* =========================================================
   KULLANILACAK ÖRNEKLEM PAZARLARI
========================================================= */

const MARKETS = [

    "iy15Ust",

    "iy1",

    "iy2",

    "au15Alt",

    "au15Ust"

];


/* =========================================================
   PAZAR ANALİZİ
========================================================= */

function analyzeMarket(
    targetMatch,
    targetDate,
    market
){

    const targetOdd =
        getOpeningOdd(
            targetMatch,
            market
        );


    if(
        targetOdd === null
    ){

        return null;

    }


    const history =
        getHistory(
            targetDate
        );


    const samples =
        history.filter(
            match => {

                const odd =
                    getOpeningOdd(
                        match,
                        market
                    );


                return (
                    odd !== null &&
                    Number(odd) ===
                    Number(targetOdd)
                );

            }
        );


    if(
        samples.length <
        MIN_SAMPLE
    ){

        return null;

    }


    let one = 0;

    let draw = 0;

    let two = 0;


    samples.forEach(
        match => {

            const result =
                getResult(match);


            if(result === "1"){
                one++;
            }

            if(result === "X"){
                draw++;
            }

            if(result === "2"){
                two++;
            }

        }
    );


    const total =
        one +
        draw +
        two;


    if(
        total <
        MIN_SAMPLE
    ){

        return null;

    }


    return {

        one:
            one / total * 100,

        x:
            draw / total * 100,

        two:
            two / total * 100,

        sample:
            total

    };

}


/* =========================================================
   TEK TAHMİN MOTORU
========================================================= */

function calculatePrediction(
    targetMatch,
    targetDate
){

    const analyses = [];


    MARKETS.forEach(
        market => {

            const analysis =
                analyzeMarket(
                    targetMatch,
                    targetDate,
                    market
                );


            if(analysis){

                analyses.push(
                    analysis
                );

            }

        }
    );


    /*
       Yeterli örneklem yok.
    */

    if(
        !analyses.length
    ){

        return {

            prediction:"?",

            one:0,

            x:0,

            two:0,

            sample:0,

            markets:0

        };

    }


    let one = 0;

    let x = 0;

    let two = 0;

    let weightTotal = 0;

    let sampleTotal = 0;


    /*
       Örneklem sayısı fazla olan
       pazar biraz daha ağırlıklı.
    */

    analyses.forEach(
        item => {

            const weight =
                Math.sqrt(
                    item.sample
                );


            one +=
                item.one *
                weight;


            x +=
                item.x *
                weight;


            two +=
                item.two *
                weight;


            weightTotal +=
                weight;


            sampleTotal +=
                item.sample;

        }
    );


    one /=
        weightTotal;


    x /=
        weightTotal;


    two /=
        weightTotal;


    const total =
        one +
        x +
        two;


    one =
        one / total * 100;


    x =
        x / total * 100;


    two =
        two / total * 100;


    /*
       EN YÜKSEK ORAN = TEK TAHMİN
    */

    let prediction = "1";

    let confidence = one;


    if(x > confidence){

        prediction = "X";

        confidence = x;

    }


    if(two > confidence){

        prediction = "2";

        confidence = two;

    }


    return {

        prediction,

        one,

        x,

        two,

        confidence,

        sample:
            sampleTotal,

        markets:
            analyses.length

    };

}


/* =========================================================
   SONUÇ NORMALİZASYONU
========================================================= */

function normalizeResult(value){

    if(
        value === null ||
        value === undefined
    ){

        return null;

    }


    const result =
        String(value)
            .trim()
            .toUpperCase();


    if(
        result === "1" ||
        result === "MS1"
    ){

        return "1";

    }


    if(
        result === "X" ||
        result === "0" ||
        result === "MSX"
    ){

        return "X";

    }


    if(
        result === "2" ||
        result === "MS2"
    ){

        return "2";

    }


    return null;

}


/* =========================================================
   GÜVENLİ METİN
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   SONUÇ ROZETİ
========================================================= */

function resultBadge(
    prediction,
    actual
){

    if(!actual){

        return `
            <span
                class="result result-wait"
                title="Sonuç bekleniyor">
                •
            </span>
        `;

    }


    if(
        prediction ===
        actual
    ){

        return `
            <span
                class="result result-hit"
                title="Tahmin tuttu">
                ✓
            </span>
        `;

    }


    return `
        <span
            class="result result-miss"
            title="Tahmin tutmadı">
            ✕
        </span>
    `;

}


/* =========================================================
   MAÇ RENDER
========================================================= */

function renderMatch(
    match,
    index
){

    /*
       Önce Mackolik'ten bu maçın
       açılış oranını buluyoruz.
    */

    const mackolik =
        findMackolikMatch(
            match
        );


    if(!mackolik){

        return `
            <div class="match">

                <div class="match-main">

                    <div class="match-number">
                        ${index + 1}
                    </div>

                    <div class="teams">

                        ${escapeHtml(match.home)}
                        -
                        ${escapeHtml(match.away)}

                    </div>

                    <div class="prediction">
                        -
                    </div>

                </div>

                <div class="no-data">

                    Bu maç için Mackolik
                    açılış oranı bulunamadı.

                </div>

            </div>
        `;

    }


    const prediction =
        calculatePrediction(
            mackolik,
            mackolik.date
        );


    /*
       Spor Toto'nun gerçek sonucu.
       Geçmiş haftalarda 1/X/2,
       oynanmamış haftada null.
    */

    const actual =
        normalizeResult(
            match.result
        );


    return `

        <div class="match">

            <div class="match-main">

                <div class="match-number">
                    ${index + 1}
                </div>


                <div class="teams">

                    ${escapeHtml(match.home)}
                    -
                    ${escapeHtml(match.away)}

                </div>


                <!-- SADECE TEK TAHMİN -->

                <div
                    class="prediction">

                    ${prediction.prediction}

                </div>


                ${resultBadge(
                    prediction.prediction,
                    actual
                )}

            </div>


            <div class="percentages">

                <div class="percent">

                    1

                    <strong>
                        ${prediction.one.toFixed(1)}%
                    </strong>

                </div>


                <div class="percent">

                    X

                    <strong>
                        ${prediction.x.toFixed(1)}%
                    </strong>

                </div>


                <div class="percent">

                    2

                    <strong>
                        ${prediction.two.toFixed(1)}%
                    </strong>

                </div>

            </div>


            <div class="details">

                <strong>
                    Tek tahmin:
                </strong>

                ${prediction.prediction}

                &nbsp; • &nbsp;

                <strong>
                    Güven:
                </strong>

                ${prediction.confidence
                    ? prediction.confidence.toFixed(1) + "%"
                    : "-"
                }

                &nbsp; • &nbsp;

                <strong>
                    Örneklem:
                </strong>

                ${prediction.sample}

            </div>


            ${
                prediction.prediction === "?"
                ?

                `
                    <div class="no-data">

                        Bu maç için en az
                        ${MIN_SAMPLE}
                        eşleşen örneklem bulunamadı.

                    </div>
                `

                :

                ""
            }

        </div>

    `;

}


/* =========================================================
   ÖZET
========================================================= */

function renderSummary(
    matches
){

    let hit = 0;

    let miss = 0;

    let wait = 0;


    matches.forEach(
        match => {

            const actual =
                normalizeResult(
                    match.result
                );


            if(!actual){

                wait++;

                return;

            }


            const mackolik =
                findMackolikMatch(
                    match
                );


            if(!mackolik){

                wait++;

                return;

            }


            const prediction =
                calculatePrediction(
                    mackolik,
                    mackolik.date
                );


            if(
                prediction.prediction === "?"
            ){

                wait++;

                return;

            }


            if(
                prediction.prediction ===
                actual
            ){

                hit++;

            }else{

                miss++;

            }

        }
    );


    const finished =
        hit + miss;


    const rate =
        finished
        ?
        hit / finished * 100
        :
        0;


    return `

        <div class="summary">

            <div class="summary-title">

                📊 Tahmin Sonuçları

            </div>


            <div class="summary-grid">


                <div
                    class="summary-box summary-hit">

                    <div class="icon">
                        ✓
                    </div>

                    <strong>
                        ${hit}
                    </strong>

                    <small>
                        Tuttu
                    </small>

                </div>


                <div
                    class="summary-box summary-miss">

                    <div class="icon">
                        ✕
                    </div>

                    <strong>
                        ${miss}
                    </strong>

                    <small>
                        Tutmadı
                    </small>

                </div>


                <div
                    class="summary-box summary-wait">

                    <div class="icon">
                        •
                    </div>

                    <strong>
                        ${wait}
                    </strong>

                    <small>
                        Bekliyor
                    </small>

                </div>


                <div
                    class="summary-box summary-rate">

                    <div class="icon">
                        %
                    </div>

                    <strong>
                        ${rate.toFixed(1)}
                    </strong>

                    <small>
                        Başarı
                    </small>

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   HAFTA RENDER
========================================================= */

function renderWeek(){

    const weeks =
        window.SPORT_TOTO_DATA?.weeks;


    const matches =
        weeks?.[selectedWeek];


    if(
        !Array.isArray(matches)
    ){

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="error">

                ${selectedWeek}.
                hafta bulunamadı.

            </div>

        `;

        return;

    }


    const summary =
        renderSummary(
            matches
        );


    const rows =
        matches
            .map(
                (match,index)=>
                    renderMatch(
                        match,
                        index
                    )
            )
            .join("");


    document.getElementById(
        "content"
    ).innerHTML = `

        ${summary}


        <div class="info">

            <div class="info-title">

                ${selectedWeek}. Hafta

            </div>

            <div class="info-text">

                Her maç için sadece en yüksek
                olasılığa sahip sonuç tahmin edilir.
                Çift veya üçlü sistem kullanılmaz.

            </div>

        </div>


        <div class="matches">

            <div class="matches-header">

                <div class="matches-header-title">

                    Tek Tahmin Kuponu

                </div>


                <div class="matches-header-info">

                    <span class="header-badge">
                        15 Maç
                    </span>

                    <span class="header-badge">
                        60 Gün
                    </span>

                    <span class="header-badge">
                        Min. ${MIN_SAMPLE} Örneklem
                    </span>

                    <span class="header-badge">
                        Sadece 1 / X / 2
                    </span>

                </div>

            </div>


            ${rows}

        </div>

    `;

}


/* =========================================================
   HAFTA BUTONLARI
========================================================= */

function renderWeeks(){

    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};


    const weekNumbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a,b)=>a-b
            );


    document.getElementById(
        "weeks"
    ).innerHTML =

        weekNumbers
            .map(
                week => `

                    <button
                        class="week-btn ${
                            Number(week) ===
                            Number(selectedWeek)
                            ? "active"
                            : ""
                        }"
                        data-week="${week}">

                        ${week}. Hafta

                    </button>

                `
            )
            .join("");


    document
        .querySelectorAll(
            ".week-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function(){

                        selectedWeek =
                            Number(
                                this.dataset.week
                            );


                        renderWeeks();

                        renderWeek();

                    }
                );

            }
        );

}


/* =========================================================
   MACKOLIK VERİSİ
========================================================= */

async function loadMackolik(){

    const response =
        await fetch(
            MACKOLIK_URL +
            "?t=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "Mackolik verisi alınamadı. HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if(
        !data ||
        !Array.isArray(
            data.matches
        )
    ){

        throw new Error(
            "Mackolik maç listesi bulunamadı."
        );

    }


    mackolikMatches =
        data.matches;

}


/* =========================================================
   BAŞLAT
========================================================= */

async function init(){

    try{

        if(
            !window.SPORT_TOTO_DATA
        ){

            throw new Error(
                "spor-toto-data.js yüklenemedi."
            );

        }


        const weeks =
            window.SPORT_TOTO_DATA.weeks;


        const numbers =
            Object.keys(weeks)
                .map(Number)
                .sort(
                    (a,b)=>a-b
                );


        selectedWeek =
            Number(
                window.SPORT_TOTO_DATA
                    .currentWeek
            )
            ||
            numbers[
                numbers.length - 1
            ];


        renderWeeks();


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="loading">

                Mackolik verileri yükleniyor...

            </div>

        `;


        await loadMackolik();


        renderWeek();


    }catch(error){

        console.error(error);


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="error">

                <strong>
                    Veri yüklenemedi.
                </strong>

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


init();

</script>
