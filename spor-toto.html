<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<title>Spor Toto Tahmin Sistemi</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  background:#f3f5f8;

  padding:9px 5px;
  border-radius:10px;

}
.pred strong{

}

  color:#667085;

}
.details{
  display:flex;

  gap:6px;
  font-size:11px;
  color:#667085;
}
.badge{
  background:#f3f4f6;

  border-radius:8px;
}

  padding:10px;
  border-radius:10px;

  font-weight:700;

  margin-top:10px;
  font-size:11px;
  color:#8a8f98;
}
.loading,

  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
}
.error{
  color:#b91c1c;
}
.hit{
  color:#16a34a;
}
.miss{
  color:#dc2626;
}

  color:#9ca3af;
}
@media(max-width:650px){
  .container{
    width:95%;
    margin-top:10px;
  }
  .header h1{
    font-size:21px;
  }
  .summary-grid{
    grid-template-columns:repeat(3,1fr);
  }
  .teams{
    font-size:14px;
  }
  .pred strong{
    font-size:15px;
  }

</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚽ Spor Toto Tahmin Sistemi</h1>
    <p>Mackolik açılış oranları ve geçmiş sonuçlara göre istatistiksel tahmin</p>
  </div>
  <div class="controls">
    <select id="weekSelect">
      <option value="">Hafta seçiliyor...</option>
    </select>
    <button id="refreshBtn">
      🔄 Yenile
    </button>
  </div>
  <div id="summary" class="summary"></div>
  <div id="content">
    <div class="loading">
      Veriler yükleniyor...
    </div>
  </div>
</div>
<!-- ======================================================
     SPOR TOTO VERİSİ
     ====================================================== -->
<script src="data/spor-toto-data.js"></script>
<script>
"use strict";
/* ======================================================
   AYARLAR
   ====================================================== */
const MACKOLIK_URL =
  "https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";
const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;
const MARKETS = [
  "iy15Ust",
  "iy1",
  "iy2",
  "au15Alt",
  "au15Ust"
];
/* ======================================================
   DOM
   ====================================================== */
const weekSelect = document.getElementById("weekSelect");
const refreshBtn = document.getElementById("refreshBtn");
const content = document.getElementById("content");
const summary = document.getElementById("summary");
/* ======================================================
   DURUM
   ====================================================== */
let mackolikMatches = [];
/* ======================================================
   YARDIMCI
   ====================================================== */
function escapeHtml(value){
  return String(value ?? "")
    .replace(/[&<>"']/g, char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char]));
}
function normalizeText(value){
  return String(value ?? "")
    .toLocaleLowerCase("tr-TR")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ı/g,"i")
    .replace(/ğ/g,"g")
    .replace(/ü/g,"u")
    .replace(/ş/g,"s")
    .replace(/ö/g,"o")
    .replace(/ç/g,"c")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function teamWords(value){
  const ignore = new Set([
    "fk",
    "fc",
    "sk",
    "sc",
    "as",
    "cf",
    "afc",
    "club",
    "kulubu",
    "spor",
    "futbol",
    "takimi",
    "a",
    "milli",
    "cumhuriyeti"
  ]);
  return normalizeText(value)
    .split(" ")
    .filter(Boolean)
    .filter(x => !ignore.has(x));
}
/* ======================================================
   TAKIM İSİM EŞLEŞTİRME
   ====================================================== */
const aliases = [
  ["k","kuzey"],
  ["n","north"],
  ["bor","borussia"],
  ["utd","united"],
  ["man","manchester"],
  ["st","saint"],
  ["vfb"],
  ["rb"],
  ["psg","paris","saint","germain"]
];
function wordsCompatible(a,b){
  if(a === b) return true;
  for(const group of aliases){
    if(group.includes(a) && group.includes(b)){
      return true;
    }
  }
  return false;
}
function teamSimilarity(a,b){
  const aw = teamWords(a);
  const bw = teamWords(b);
  if(!aw.length || !bw.length){
    return 0;
  }
  let matched = 0;
  for(const word of aw){
    if(
      bw.some(other => wordsCompatible(word,other))
    ){
      matched++;
    }
  }
  const scoreA = matched / aw.length;
  let matchedB = 0;
  for(const word of bw){
    if(
      aw.some(other => wordsCompatible(word,other))
    ){
      matchedB++;
    }
  }
  const scoreB = matchedB / bw.length;
  return Math.min(scoreA,scoreB);
}
/* ======================================================
   TARİH
   ====================================================== */
function parseDate(value){
  if(!value) return null;
  const text = String(value).trim();
  let m =
    text.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(m){
    return new Date(
      Number(m[3]),
      Number(m[2])-1,
      Number(m[1])
    );
  }
  m =
    text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){
    return new Date(
      Number(m[1]),
      Number(m[2])-1,
      Number(m[3])
    );
  }
  const d = new Date(text);
  return Number.isNaN(d.getTime()) ? null : d;
}
function dateDistance(a,b){
  const da = parseDate(a);
  const db = parseDate(b);
  if(!da || !db){
    return Number.MAX_SAFE_INTEGER;
  }
  return Math.abs(
    da.getTime() - db.getTime()
  );
}
/* ======================================================
   MACKOLIK MAÇ BUL
   ====================================================== */
function findMackolikMatch(stMatch){
  const candidates = [];
  for(const match of mackolikMatches){
    const homeScore =
      teamSimilarity(
        stMatch.home,
        match.home
      );
    const awayScore =
      teamSimilarity(
        stMatch.away,
        match.away
      );
    if(
      homeScore < 0.50 ||
      awayScore < 0.50
    ){
      continue;
    }
    const nameScore =
      (homeScore + awayScore) / 2;
    const distance =
      dateDistance(
        stMatch.date,
        match.date
      );
    candidates.push({
      match,
      homeScore,
      awayScore,
      nameScore,
      distance
    });
  }
  candidates.sort((a,b) => {
    if(b.nameScore !== a.nameScore){
      return b.nameScore - a.nameScore;
    }
    return a.distance - b.distance;
  });
  return candidates[0]?.match || null;
}
/* ======================================================
   SKOR
   ====================================================== */
function getFullScore(match){
  if(!match?.score){
    return null;
  }
  const h = Number(match.score.home);
  const a = Number(match.score.away);
  if(
    !Number.isFinite(h) ||
    !Number.isFinite(a)
  ){
    return null;
  }
  return {
    home:h,
    away:a
  };
}
function getResult(match){
  const score = getFullScore(match);
  if(!score){
    return null;
  }
  if(score.home > score.away) return "1";
  if(score.home < score.away) return "2";
  return "X";
}
/* ======================================================
   AÇILIŞ ORANLARI
   ====================================================== */
function getOpeningOdds(match){
  return match?.openingOdds || {};
}
function exactOdds(a,b){
  if(a == null || b == null){
    return false;
  }
  return Number(a) === Number(b);
}
/* ======================================================
   TARİH FİLTRESİ
   ====================================================== */
function getHistory(targetDate){
  const target = parseDate(targetDate);
  if(!target){
    return [];
  }
  const start =
    new Date(target.getTime());
  start.setDate(
    start.getDate() - HISTORY_DAYS
  );
  return mackolikMatches.filter(match => {
    const d = parseDate(match.date);
    if(!d){
      return false;
    }
    if(d >= target){
      return false;
    }
    if(d < start){
      return false;
    }
    return getResult(match) !== null;
  });
}
/* ======================================================
   MARKET SONUÇLARI
   ====================================================== */
function marketMatched(match, market, odd){
  const odds =
    getOpeningOdds(match);
  return exactOdds(
    odds[market],
    odd
  );
}
/* ======================================================
   GEÇMİŞ ÖRNEKLER
   ====================================================== */
function getMarketSamples(
  history,
  market,
  odd
){
  return history.filter(match => {
    return marketMatched(
      match,
      market,
      odd
    );
  });
}
/* ======================================================
   TAHMİN
   ====================================================== */
function calculatePrediction(
  targetMatch,
  targetMackolik
){
  const odds =
    getOpeningOdds(targetMackolik);
  const history =
    getHistory(
      targetMatch.date ||
      targetMackolik.date
    );
  const totals = {
    "1":0,
    "X":0,
    "2":0
  };
  let totalSample = 0;
  let validMarkets = 0;
  for(const market of MARKETS){
    const odd = odds[market];
    if(odd == null){
      continue;
    }
    const samples =
      getMarketSamples(
        history,
        market,
        odd
      );
    if(samples.length < MIN_SAMPLE){
      continue;
    }
    validMarkets++;
    const weight =
      Math.sqrt(samples.length);
    const local = {
      "1":0,
      "X":0,
      "2":0
    };
    for(const match of samples){
      const result =
        getResult(match);
      if(result){
        local[result]++;
      }
    }
    const localTotal =
      local["1"] +
      local["X"] +
      local["2"];
    if(!localTotal){
      continue;
    }
    totals["1"] +=
      (local["1"] / localTotal) * weight;
    totals["X"] +=
      (local["X"] / localTotal) * weight;
    totals["2"] +=
      (local["2"] / localTotal) * weight;
    totalSample += samples.length;
  }
  const sum =
    totals["1"] +
    totals["X"] +
    totals["2"];
  if(
    !sum ||
    validMarkets === 0
  ){
    return null;
  }
  const percentages = {
    "1": totals["1"] / sum * 100,
    "X": totals["X"] / sum * 100,
    "2": totals["2"] / sum * 100
  };
  const sorted =
    Object.entries(percentages)
      .sort((a,b) => b[1] - a[1]);
  const top = sorted[0];
  const second = sorted[1];
  let system = "1X2";
  if(
    top[1] >= 50 &&
    top[1] - second[1] >= 15
  ){
    system = top[0];
  }
  else if(
    top[1] >= 40 &&
    top[1] - second[1] >= 7
  ){
    system =
      [top[0],second[0]]
        .sort()
        .join("");
  }
  return {
    percentages,
    prediction:top[0],
    system,
    validMarkets,
    totalSample
  };
}
/* ======================================================
   SİSTEM SONUCU
   ====================================================== */
function systemContains(
  system,
  result
){
  if(!result){
    return false;
  }
  if(system === "1X2"){
    return true;
  }
  return system.includes(result);
}
function resultStatus(
  prediction,
  actual
){
  if(!actual){
    return "waiting";
  }
  if(
    systemContains(
      prediction.system,
      actual
    )
  ){
    return "hit";
  }
  return "miss";
}
/* ======================================================
   HAFTALAR
   ====================================================== */
function getWeeks(){
  const data =
    window.SPORT_TOTO_DATA;
  if(
    !data ||
    !data.weeks
  ){
    return [];
  }
  return Object.keys(data.weeks)
    .sort((a,b) => Number(a)-Number(b));
}
function getWeekMatches(week){
  const data =
    window.SPORT_TOTO_DATA;
  const value =
    data?.weeks?.[week];
  if(Array.isArray(value)){
    return value;
  }
  if(
    value &&
    Array.isArray(value.matches)
  ){
    return value.matches;
  }
  return [];
}
/* ======================================================
   HAFTA TARİHİ YOKSA
   ====================================================== */
function getTargetDate(match){
  return (
    match.date ||
    match.matchDate ||
    null
  );
}
/* ======================================================
   HAFTA SEÇİCİ
   ====================================================== */
function fillWeeks(){
  const weeks =
    getWeeks();
  weekSelect.innerHTML = "";
  if(!weeks.length){
    weekSelect.innerHTML =
      `<option>Hafta bulunamadı</option>`;
    return;
  }
  for(const week of weeks){
    const option =
      document.createElement("option");
    option.value = week;
    option.textContent =
      `${week}. Hafta`;
    weekSelect.appendChild(option);
  }
  const current =
    Number(
      window.SPORT_TOTO_DATA?.currentWeek
    );
  if(
    current &&
    weeks.includes(String(current))
  ){
    weekSelect.value =
      String(current);
  }
  else{
    weekSelect.value =
      weeks[weeks.length-1];
  }
}
/* ======================================================
   ÖZET
   ====================================================== */
function renderSummary(
  total,
  hit,
  miss,
  waiting
){
  const played =
    hit + miss;
  const success =
    played
      ? (hit / played * 100)
      : 0;
  summary.innerHTML = `
    <div class="summary-grid">
      <div class="summary-item">
        <b>${total}</b>
        <span>Toplam</span>
      </div>
      <div class="summary-item">
        <b class="hit">${hit}</b>
        <span>Tuttu</span>
      </div>
      <div class="summary-item">
        <b class="miss">${miss}</b>
        <span>Tutmadı</span>
      </div>
      <div class="summary-item">
        <b class="wait">${waiting}</b>
        <span>Bekliyor</span>
      </div>
      <div class="summary-item">
        <b>${success.toFixed(1)}%</b>
        <span>Başarı</span>
      </div>
    </div>
  `;
}
/* ======================================================
   MAÇ RENDER
   ====================================================== */
function renderMatch(
  match,
  index
){
  const mackolik =
    findMackolikMatch(match);
  let prediction = null;
  if(mackolik){
    prediction =
      calculatePrediction(
        match,
        mackolik
      );
  }
  const actual =
    match.result ||
    getResult(mackolik);
  let status =
    "waiting";
  if(prediction){
    status =
      resultStatus(
        prediction,
        actual
      );
  }
  let statusIcon = "⏳";
  if(status === "hit"){
    statusIcon = "✅";
  }
  if(status === "miss"){
    statusIcon = "❌";
  }
  const p1 =
    prediction?.percentages?.["1"] ?? 0;
  const px =
    prediction?.percentages?.["X"] ?? 0;
  const p2 =
    prediction?.percentages?.["2"] ?? 0;
  let system =
    prediction?.system || "-";
  let main =
    prediction?.prediction || "-";
  const sourceText =
    mackolik
      ? `${mackolik.home} - ${mackolik.away}`
      : "Mackolik eşleşmesi bulunamadı";
  return `
    <div class="match">
      <div class="match-top">
        <div class="number">
          ${index + 1}
        </div>
        <div class="teams">
          <span>${escapeHtml(match.home)}</span>
          <div class="vs">vs</div>
          <span>${escapeHtml(match.away)}</span>
        </div>
        <div class="status ${status}">
          ${statusIcon}
        </div>
      </div>
      <div class="predictions">
        <div class="pred ${
          main === "1" ? "main" : ""
        }">
          <strong>1</strong>
          <small>${p1.toFixed(1)}%</small>
        </div>
        <div class="pred ${
          main === "X" ? "main" : ""
        }">
          <strong>X</strong>
          <small>${px.toFixed(1)}%</small>
        </div>
        <div class="pred ${
          main === "2" ? "main" : ""
        }">
          <strong>2</strong>
          <small>${p2.toFixed(1)}%</small>
        </div>
      </div>
      <div class="system">
        Ana tahmin:
        <strong>${main}</strong>
        &nbsp; | &nbsp;
        Sistem:
        <strong>${system}</strong>
      </div>
      <div class="details">
        <span class="badge">
          Geçerli market:
          ${prediction?.validMarkets || 0}
        </span>
        <span class="badge">
          Tarihsel örnek:
          ${prediction?.totalSample || 0}
        </span>
        ${
          actual
          ? `<span class="badge">
               Sonuç: ${actual}
             </span>`
          : ""
        }
      </div>
      <div class="source">
        Mackolik:
        ${escapeHtml(sourceText)}
      </div>
    </div>
  `;
}
/* ======================================================
   HAFTA GÖSTER
   ====================================================== */
function renderWeek(){
  const week =
    weekSelect.value;
  const matches =
    getWeekMatches(week);
  if(!matches.length){
    content.innerHTML = `
      <div class="empty">
        Bu haftada maç bulunamadı.
      </div>
    `;
    renderSummary(0,0,0,0);
    return;
  }
  let hit = 0;
  let miss = 0;
  let waiting = 0;
  const html =
    matches.map((match,index) => {
      const mackolik =
        findMackolikMatch(match);
      const prediction =
        mackolik
          ? calculatePrediction(
              match,
              mackolik
            )
          : null;
      const actual =
        match.result ||
        getResult(mackolik);
      if(prediction && actual){
        if(
          systemContains(
            prediction.system,
            actual
          )
        ){
          hit++;
        }
        else{
          miss++;
        }
      }
      else{
        waiting++;
      }
      return renderMatch(
        match,
        index
      );
    }).join("");
  content.innerHTML =
    `<div class="matches">${html}</div>`;
  renderSummary(
    matches.length,
    hit,
    miss,
    waiting
  );
}
/* ======================================================
   MACKOLIK VERİSİNİ YÜKLE
   ====================================================== */
async function loadMackolik(){
  content.innerHTML = `
    <div class="loading">
      Mackolik verileri yükleniyor...
    </div>
  `;
  const url =
    MACKOLIK_URL +
    "?v=" +
    Date.now();
  const response =
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );
  if(!response.ok){
    throw new Error(
      "Mackolik verisi alınamadı. HTTP " +
      response.status
    );
  }
  const data =
    await response.json();
  if(Array.isArray(data)){
    mackolikMatches = data;
  }
  else if(Array.isArray(data.matches)){
    mackolikMatches = data.matches;
  }
  else{
    throw new Error(
      "Mackolik veri formatı tanınamadı."
    );
  }
  console.log(
    "Mackolik maç sayısı:",
    mackolikMatches.length
  );
}
/* ======================================================
   BAŞLAT
   ====================================================== */
async function init(){
  try{
    if(
      !window.SPORT_TOTO_DATA
    ){
      throw new Error(
        "Spor Toto veri dosyası yüklenemedi."
      );
    }
    fillWeeks();
    await loadMackolik();
    renderWeek();
  }
  catch(error){
    console.error(error);
    content.innerHTML = `
      <div class="error">
        <strong>Veriler yüklenemedi.</strong>
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}
/* ======================================================
   EVENTS
   ====================================================== */
weekSelect.addEventListener(
  "change",
  renderWeek
);
refreshBtn.addEventListener(
  "click",
  init
);
/* ======================================================
   ÇALIŞTIR
   ====================================================== */
init();
</script>
</body>
</html>
