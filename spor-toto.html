<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#17202a;
}
.container{
    max-width:900px;

header{

    border-radius:14px;

    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);

h1{
    margin:0 0 12px;
    font-size:24px;

.controls{
    display:flex;
    gap:8px;

}
select,

    border:1px solid #d8dde3;

.summary{

    grid-template-columns:repeat(4,1fr);

    border-radius:12px;

}

}

    font-size:12px;
    color:#68737d;
}
.matches{
    display:flex;
    flex-direction:column;

}
.match{
    background:#fff;
    border-radius:14px;
    padding:14px;

}
.match-top{
    display:flex;

}
.match-number{

}
.match-date{

}
.teams{
    font-size:17px;

    line-height:1.4;
    margin-bottom:12px;
}
.prediction{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-bottom:10px;
}
.percent{
    background:#f2f4f6;
    border-radius:9px;
    padding:9px 5px;
    text-align:center;
}
.percent b{
    display:block;
    font-size:17px;
}
.percent span{
    font-size:11px;
    color:#69737d;
}
.main-pred{
    font-size:18px;
    font-weight:bold;
    padding:10px;
    border-radius:10px;
    background:#eef3ff;
    text-align:center;
    margin-bottom:8px;
}
.system{
    text-align:center;
    font-weight:bold;
    padding:8px;
    border-radius:8px;
    background:#f5f5f5;
}
.result{
    margin-top:9px;
    padding:9px;
    border-radius:9px;
    text-align:center;
    font-weight:bold;
}
.result.hit{
    background:#dcfce7;
    color:#15803d;
}
.result.miss{
    background:#fee2e2;
    color:#b91c1c;
}
.result.waiting{
    background:#f3f4f6;
    color:#6b7280;
}
.no-data{
    background:#fff4d6;
    color:#795900;
    padding:10px;
    border-radius:9px;
    font-size:13px;
    margin-top:8px;
}
.match-source{
    margin-top:8px;
    font-size:11px;
    color:#89929a;
    text-align:center;
}
.loading,
.error,
.empty{
    background:#fff;
    padding:20px;
    border-radius:12px;
    text-align:center;
}
@media(max-width:600px){
    .summary{
        grid-template-columns:repeat(2,1fr);
    }
    .teams{
        font-size:16px;
    }
    .prediction{
        gap:5px;
    }
}

<body>
<div class="container">
<header>
    <h1>⚽ Spor Toto</h1>

        <select id="weekSelect"></select>

    </div>
</header>
<div class="summary">
    <div class="summary-box">
        <strong id="totalCount">0</strong>
        <span>Toplam</span>
    </div>
    <div class="summary-box">

        <span>Tuttu</span>

        <strong id="missCount">0</strong>
        <span>Tutmadı</span>
    </div>

        <strong id="successRate">-%</strong>
        <span>Başarı</span>
    </div>
</div>
<div id="matches" class="matches">
    <div class="loading">Yükleniyor...</div>
</div>
</div>
<!-- SPOR TOTO VERİSİ -->
<script src="data/spor-toto-data.js"></script>
<script>
"use strict";
/* =========================================================
   AYARLAR
========================================================= */
const MACKOLIK_URL =
    "https://raw.githubusercontent.com/teador612/mackolik1/refs/heads/main/data/matches.json";
const HISTORY_DAYS = 60;
const MIN_SAMPLE = 5;
const MARKETS = [
    "iy15Ust",
    "iy1",
    "iy2",
    "au15Alt",
    "au15Ust"
];
/* =========================================================
   GLOBAL
========================================================= */
let mackolikMatches = [];
let selectedWeek = null;
/* =========================================================
   ELEMENTLER
========================================================= */
const $ = id =>
    document.getElementById(id);
/* =========================================================
   METİN NORMALİZASYONU
========================================================= */
function normalizeText(value){
    return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/ı/g,"i")
        .replace(/ş/g,"s")
        .replace(/ğ/g,"g")
        .replace(/ü/g,"u")
        .replace(/ö/g,"o")
        .replace(/ç/g,"c")
        .replace(/[^a-z0-9\s]/g," ")
        .replace(/\s+/g," ")
        .trim();
}
/* =========================================================
   GEREKSİZ TAKIM KELİMELERİ
========================================================= */
const IGNORE_TEAM_WORDS = new Set([
    "fk",
    "fc",
    "sk",
    "sc",
    "as",
    "cf",
    "afc",
    "club",
    "kulubu",
    "spor",
    "futbol",
    "takimi",
    "a",
    "milli",
    "cumhuriyeti"
]);
/* =========================================================
   KISALTMA / KELİME ALIAS
========================================================= */
const TEAM_WORD_ALIASES = {
    "k":[
        "k",
        "kuzey"
    ],
    "n":[
        "n",
        "north"
    ],
    "bor":[
        "bor",
        "borussia"
    ],
    "utd":[
        "utd",
        "united"
    ],
    "man":[
        "man",
        "manchester"
    ],
    "st":[
        "st",
        "saint"
    ],
    "vfb":[
        "vfb"
    ],
    "rb":[
        "rb"
    ],
    "psg":[
        "psg",
        "paris",
        "saint",
        "germain"
    ]
};
/* =========================================================
   TAKIM KELİMELERİ
========================================================= */
function teamWords(name){
    return normalizeText(name)
        .split(" ")
        .map(x => x.trim())
        .filter(Boolean)
        .filter(x => !IGNORE_TEAM_WORDS.has(x));
}
/* =========================================================
   KELİME UYUMLULUĞU
========================================================= */
function wordsCompatible(a,b){
    if(!a || !b){
        return false;
    }
    if(a === b){
        return true;
    }
    for(const key in TEAM_WORD_ALIASES){
        const aliases =
            TEAM_WORD_ALIASES[key];
        if(
            aliases.includes(a) &&
            aliases.includes(b)
        ){
            return true;
        }
    }
    if(
        a.length >= 4 &&
        b.length >= 4
    ){
        if(
            a.startsWith(b) ||
            b.startsWith(a)
        ){
            return true;
        }
    }
    return false;
}
/* =========================================================
   TAKIM BENZERLİK PUANI
========================================================= */
function teamSimilarity(a,b){
    const wa = teamWords(a);
    const wb = teamWords(b);
    if(
        !wa.length ||
        !wb.length
    ){
        return 0;
    }
    if(
        normalizeText(a) ===
        normalizeText(b)
    ){
        return 1;
    }
    let matchedA = 0;
    for(const wordA of wa){
        if(
            wb.some(
                wordB =>
                    wordsCompatible(
                        wordA,
                        wordB
                    )
            )
        ){
            matchedA++;
        }
    }
    let matchedB = 0;
    for(const wordB of wb){
        if(
            wa.some(
                wordA =>
                    wordsCompatible(
                        wordA,
                        wordB
                    )
            )
        ){
            matchedB++;
        }
    }
    const scoreA =
        matchedA / wa.length;
    const scoreB =
        matchedB / wb.length;
    return (
        scoreA +
        scoreB
    ) / 2;
}
/* =========================================================
   TARİH
========================================================= */
function parseDate(value){
    if(!value){
        return null;
    }
    const s =
        String(value).trim();
    let d = null;
    if(
        /^\d{2}\.\d{2}\.\d{4}$/.test(s)
    ){
        const [
            day,
            month,
            year
        ] = s.split(".");
        d = new Date(
            Number(year),
            Number(month) - 1,
            Number(day)
        );
    }else{
        d = new Date(s);
    }
    if(
        !d ||
        Number.isNaN(
            d.getTime()
        )
    ){
        return null;
    }
    d.setHours(0,0,0,0);
    return d;
}
/* =========================================================
   TARİH FARKI
========================================================= */
function dateDistance(a,b){
    const da =
        parseDate(a);
    const db =
        parseDate(b);
    if(!da || !db){
        return Number.MAX_SAFE_INTEGER;
    }
    return Math.abs(
        da.getTime() -
        db.getTime()
    );
}
/* =========================================================
   MACKOLIK ADAYLARINI BUL
========================================================= */
function findMackolikCandidates(stMatch){
    if(!stMatch){
        return [];
    }
    return mackolikMatches
        .map(match => {
            if(
                !match ||
                !match.home ||
                !match.away
            ){
                return null;
            }
            const homeScore =
                teamSimilarity(
                    stMatch.home,
                    match.home
                );
            const awayScore =
                teamSimilarity(
                    stMatch.away,
                    match.away
                );
            if(
                homeScore < 0.50 ||
                awayScore < 0.50
            ){
                return null;
            }
            const nameScore =
                (
                    homeScore +
                    awayScore
                ) / 2;
            const distance =
                dateDistance(
                    stMatch.date,
                    match.date
                );
            return {
                match,
                homeScore,
                awayScore,
                nameScore,
                distance
            };
        })
        .filter(Boolean);
}
/* =========================================================
   EN UYGUN MACKOLIK MAÇI
========================================================= */
function findMackolikMatch(stMatch){
    const candidates =
        findMackolikCandidates(
            stMatch
        );
    if(!candidates.length){
        console.log(
            "EŞLEŞME YOK:",
            stMatch.home,
            "-",
            stMatch.away
        );
        return null;
    }
    candidates.sort(
        (a,b) => {
            if(
                b.nameScore !==
                a.nameScore
            ){
                return (
                    b.nameScore -
                    a.nameScore
                );
            }
            return (
                a.distance -
                b.distance
            );
        }
    );
    const best =
        candidates[0];
    console.log(
        "EŞLEŞTİ:",
        stMatch.home,
        "-",
        stMatch.away,
        "=>",
        best.match.home,
        "-",
        best.match.away,
        "|",
        (
            best.nameScore * 100
        ).toFixed(1) + "%",
        "| Tarih farkı:",
        Math.round(
            best.distance /
            86400000
        ),
        "gün"
    );
    return best.match;
}
/* =========================================================
   SKOR
========================================================= */
function getFullScore(match){
    if(!match){
        return null;
    }
    const h =
        Number(match?.score?.home);
    const a =
        Number(match?.score?.away);
    if(
        Number.isFinite(h) &&
        Number.isFinite(a)
    ){
        return {
            home:h,
            away:a
        };
    }
    return null;
}
/* =========================================================
   1 / X / 2 SONUCU
========================================================= */
function getResult(match){
    const score =
        getFullScore(match);
    if(!score){
        return null;
    }
    if(
        score.home >
        score.away
    ){
        return "1";
    }
    if(
        score.home <
        score.away
    ){
        return "2";
    }
    return "X";
}
/* =========================================================
   ORAN
========================================================= */
function getOpeningOdds(match,key){
    const value =
        match?.openingOdds?.[key];
    const number =
        Number(value);
    if(
        !Number.isFinite(number)
    ){
        return null;
    }
    return number;
}
/* =========================================================
   TAM ORAN EŞLEŞMESİ
========================================================= */
function exactOdds(a,b){
    if(
        a === null ||
        b === null
    ){
        return false;
    }
    return Number(a) === Number(b);
}
/* =========================================================
   TARİH ARALIĞI
========================================================= */
function getHistory(targetDate){
    const target =
        parseDate(targetDate);
    if(!target){
        return [];
    }
    const from =
        new Date(target);
    from.setDate(
        from.getDate() -
        HISTORY_DAYS
    );
    return mackolikMatches.filter(
        match => {
            const d =
                parseDate(match.date);
            if(!d){
                return false;
            }
            const result =
                getResult(match);
            if(!result){
                return false;
            }
            return (
                d >= from &&
                d < target
            );
        }
    );
}
/* =========================================================
   MARKET ÖRNEĞİ
========================================================= */
function getMarketSample(
    history,
    market,
    targetOdd
){
    if(
        targetOdd === null
    ){
        return [];
    }
    return history.filter(
        match => {
            const odd =
                getOpeningOdds(
                    match,
                    market
                );
            return exactOdds(
                odd,
                targetOdd
            );
        }
    );
}
/* =========================================================
   ORTAK TAHMİN
========================================================= */
function calculatePrediction(
    stMatch,
    mackolikMatch
){
    if(!mackolikMatch){
        return {
            p1:0,
            px:0,
            p2:0,
            main:null,
            system:"—",
            validMarkets:0,
            totalSamples:0
        };
    }
    const targetDate =
        stMatch.date ||
        mackolikMatch.date;
    const history =
        getHistory(
            targetDate
        );
    let totalWeight = 0;
    let weighted1 = 0;
    let weightedX = 0;
    let weighted2 = 0;
    let validMarkets = 0;
    let totalSamples = 0;
    for(
        const market of MARKETS
    ){
        const targetOdd =
            getOpeningOdds(
                mackolikMatch,
                market
            );
        if(
            targetOdd === null
        ){
            continue;
        }
        const samples =
            getMarketSample(
                history,
                market,
                targetOdd
            );
        if(
            samples.length <
            MIN_SAMPLE
        ){
            continue;
        }
        let c1 = 0;
        let cx = 0;
        let c2 = 0;
        for(
            const sample of samples
        ){
            const result =
                getResult(sample);
            if(result === "1"){
                c1++;
            }
            else if(result === "X"){
                cx++;
            }
            else if(result === "2"){
                c2++;
            }
        }
        const total =
            c1 + cx + c2;
        if(!total){
            continue;
        }
        const weight =
            Math.sqrt(total);
        weighted1 +=
            (c1 / total) *
            weight;
        weightedX +=
            (cx / total) *
            weight;
        weighted2 +=
            (c2 / total) *
            weight;
        totalWeight +=
            weight;
        validMarkets++;
        totalSamples +=
            total;
    }
    if(
        !totalWeight
    ){
        return {
            p1:0,
            px:0,
            p2:0,
            main:null,
            system:"—",
            validMarkets:0,
            totalSamples:0
        };
    }
    const p1 =
        weighted1 /
        totalWeight *
        100;
    const px =
        weightedX /
        totalWeight *
        100;
    const p2 =
        weighted2 /
        totalWeight *
        100;
    const values = [
        {
            key:"1",
            value:p1
        },
        {
            key:"X",
            value:px
        },
        {
            key:"2",
            value:p2
        }
    ];
    values.sort(
        (a,b) =>
            b.value -
            a.value
    );
    const top =
        values[0];
    const second =
        values[1];
    const gap =
        top.value -
        second.value;
    let system;
    if(
        top.value >= 50 &&
        gap >= 15
    ){
        system = top.key;
    }
    else if(
        top.value >= 40 &&
        gap >= 7
    ){
        system =
            top.key +
            second.key;
    }
    else{
        system = "1X2";
    }
    return {
        p1,
        px,
        p2,
        main:top.key,
        system,
        validMarkets,
        totalSamples
    };
}
/* =========================================================
   SİSTEM SONUCU
========================================================= */
function systemContains(
    system,
    result
){
    if(
        !system ||
        !result
    ){
        return false;
    }
    if(system === "1X2"){
        return true;
    }
    return system.includes(
        result
    );
}
/* =========================================================
   SONUÇ DURUMU
========================================================= */
function getResultStatus(
    prediction,
    mackolik
){
    const result =
        getResult(mackolik);
    if(!result){
        return {
            type:"waiting",
            text:"⏳ Henüz oynanmadı"
        };
    }
    const score =
        getFullScore(mackolik);
    const scoreText =
        score
            ? `${score.home} - ${score.away}`
            : "";
    if(
        systemContains(
            prediction.system,
            result
        )
    ){
        return {
            type:"hit",
            text:
                `✓ Tuttu · ${scoreText}`
        };
    }
    return {
        type:"miss",
        text:
            `✕ Tutmadı · ${scoreText}`
    };
}
/* =========================================================
   HAFTAYI RENDER ET
========================================================= */
function renderWeek(){
    const container =
        $("matches");
    container.innerHTML = "";
    const weeks =
        window.SPORT_TOTO_DATA?.weeks;
    if(!weeks){
        container.innerHTML =
            `<div class="error">
                Spor Toto verisi bulunamadı.
            </div>`;
        return;
    }
    const week =
        weeks[selectedWeek];
    if(
        !week ||
        !Array.isArray(
            week.matches
        )
    ){
        container.innerHTML =
            `<div class="empty">
                Bu haftada maç bulunamadı.
            </div>`;
        return;
    }
    let hit = 0;
    let miss = 0;
    let waiting = 0;
    week.matches.forEach(
        (stMatch,index) => {
            const mackolik =
                findMackolikMatch(
                    stMatch
                );
            const prediction =
                calculatePrediction(
                    stMatch,
                    mackolik
                );
            const resultStatus =
                mackolik
                    ? getResultStatus(
                        prediction,
                        mackolik
                    )
                    : {
                        type:"waiting",
                        text:"⏳ Mackolik maçı bulunamadı"
                    };
            if(
                resultStatus.type ===
                "hit"
            ){
                hit++;
            }
            else if(
                resultStatus.type ===
                "miss"
            ){
                miss++;
            }
            else{
                waiting++;
            }
            const div =
                document.createElement(
                    "div"
                );
            div.className =
                "match";
            const p1 =
                prediction.p1.toFixed(1);
            const px =
                prediction.px.toFixed(1);
            const p2 =
                prediction.p2.toFixed(1);
            div.innerHTML = `
                <div class="match-top">
                    <span class="match-number">
                        ${index + 1}. maç
                    </span>
                    <span class="match-date">
                        ${stMatch.date || ""}
                        ${stMatch.time || ""}
                    </span>
                </div>
                <div class="teams">
                    ${escapeHtml(stMatch.home)}
                    -
                    ${escapeHtml(stMatch.away)}
                </div>
                ${
                    prediction.main
                    ?
                    `
                    <div class="prediction">
                        <div class="percent">
                            <b>${p1}%</b>
                            <span>1</span>
                        </div>
                        <div class="percent">
                            <b>${px}%</b>
                            <span>X</span>
                        </div>
                        <div class="percent">
                            <b>${p2}%</b>
                            <span>2</span>
                        </div>
                    </div>
                    <div class="main-pred">
                        Ana tahmin:
                        ${prediction.main}
                    </div>
                    <div class="system">
                        Sistem:
                        ${prediction.system}
                    </div>
                    <div class="match-source">
                        ${prediction.validMarkets}
                        market ·
                        ${prediction.totalSamples}
                        örnek
                    </div>
                    `
                    :
                    `
                    <div class="no-data">
                        Yeterli geçmiş oran örneği bulunamadı.
                    </div>
                    `
                }
                ${
                    mackolik
                    ?
                    `
                    <div class="result ${resultStatus.type}">
                        ${resultStatus.text}
                    </div>
                    `
                    :
                    `
                    <div class="result waiting">
                        ⏳ Mackolik eşleşmesi bulunamadı
                    </div>
                    `
                }
                ${
                    mackolik
                    ?
                    `
                    <div class="match-source">
                        Mackolik:
                        ${escapeHtml(mackolik.home)}
                        -
                        ${escapeHtml(mackolik.away)}
                    </div>
                    `
                    :
                    ""
                }
            `;
            container.appendChild(
                div
            );
        }
    );
    $("totalCount").textContent =
        week.matches.length;
    $("hitCount").textContent =
        hit;
    $("missCount").textContent =
        miss;
    const played =
        hit + miss;
    $("successRate").textContent =
        played
            ? (
                hit /
                played *
                100
            ).toFixed(1) + "%"
            : "-%";
}
/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */
function escapeHtml(value){
    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[char])
    );
}
/* =========================================================
   HAFTA SEÇİMİ
========================================================= */
function initWeeks(){
    const select =
        $("weekSelect");
    select.innerHTML = "";
    const weeks =
        window.SPORT_TOTO_DATA?.weeks || {};
    const weekNumbers =
        Object.keys(weeks)
            .map(Number)
            .sort(
                (a,b) => a - b
            );
    weekNumbers.forEach(
        weekNo => {
            const option =
                document.createElement(
                    "option"
                );
            option.value =
                weekNo;
            option.textContent =
                `${weekNo}. Hafta`;
            select.appendChild(
                option
            );
        }
    );
    const current =
        Number(
            window.SPORT_TOTO_DATA
                ?.currentWeek
        );
    selectedWeek =
        weeks[current]
            ? current
            : weekNumbers[
                weekNumbers.length - 1
            ];
    select.value =
        selectedWeek;
}
/* =========================================================
   MACKOLIK VERİSİNİ AL
========================================================= */
async function loadMackolik(){
    $("matches").innerHTML =
        `<div class="loading">
            Mackolik verileri yükleniyor...
        </div>`;
    try{
        const response =
            await fetch(
                MACKOLIK_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );
        if(!response.ok){
            throw new Error(
                "Mackolik verisi alınamadı."
            );
        }
        const data =
            await response.json();
        mackolikMatches =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(
                        data.matches
                    )
                    ? data.matches
                    : []
                );
        renderWeek();
    }catch(error){
        console.error(error);
        $("matches").innerHTML =
            `<div class="error">
                Mackolik verileri yüklenemedi.
            </div>`;
    }
}
/* =========================================================
   OLAYLAR
========================================================= */
$("weekSelect")
    .addEventListener(
        "change",
        event => {
            selectedWeek =
                Number(
                    event.target.value
                );
            renderWeek();
        }
    );
$("refreshBtn")
    .addEventListener(
        "click",
        loadMackolik
    );
/* =========================================================
   BAŞLAT
========================================================= */
initWeeks();
loadMackolik();
</script>
