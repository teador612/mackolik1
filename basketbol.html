<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Basketbol Oran Analizi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      padding: 20px 0 50px;
    }

    /* HEADER */

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 7px 0 0;
      color: #8d98a8;
      font-size: 13px;
    }

    /* DATE SELECTOR */

    .date-selector {
      position: relative;
      margin-bottom: 18px;
    }

    .date-button {
      width: 100%;
      border: 1px solid #26303d;
      background: #151b23;
      color: #fff;
      border-radius: 12px;
      padding: 15px 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 15px;
    }

    .date-button:hover {
      background: #1a222c;
    }

    .date-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .calendar-icon {
      font-size: 20px;
    }

    .date-text {
      font-weight: 700;
    }

    .arrow {
      font-size: 18px;
      transition: transform .2s;
    }

    .date-selector.open .arrow {
      transform: rotate(180deg);
    }

    /* CALENDAR */

    .calendar-panel {
      display: none;
      margin-top: 8px;
      background: #11171f;
      border: 1px solid #26303d;
      border-radius: 14px;
      padding: 14px;
    }

    .date-selector.open .calendar-panel {
      display: block;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .month-title {
      font-size: 16px;
      font-weight: 700;
    }

    .month-button {
      width: 36px;
      height: 36px;
      border: 1px solid #303a48;
      background: #181f28;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 20px;
    }

    .month-button:hover {
      background: #222b36;
    }

    .weekdays,
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday {
      text-align: center;
      color: #758194;
      font-size: 11px;
      padding: 5px 0;
      font-weight: 700;
    }

    .calendar-day {
      min-height: 42px;
      border: 1px solid transparent;
      background: #171e27;
      color: #dfe5ed;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      font-size: 13px;
    }

    .calendar-day:hover {
      background: #222b36;
    }

    .calendar-day.today {
      border-color: #596779;
    }

    .calendar-day.selected {
      background: #fff;
      color: #111;
      border-color: #fff;
      font-weight: 700;
    }

    .calendar-day.has-matches::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #55d98b;
    }

    .calendar-day.selected.has-matches::after {
      background: #111;
    }

    .empty-day {
      background: transparent;
      cursor: default;
    }

    .match-dot {
      display: none;
    }

    /* SELECTED DATE */

    .selected-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 12px;
    }

    .selected-header h2 {
      margin: 0;
      font-size: 18px;
    }

    #matchCount {
      color: #8d98a8;
      font-size: 13px;
    }

    /* MATCH CARD */

    .basket-match-card {
      background: #121820;
      border: 1px solid #26303d;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .16);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .league {
      color: #8d98a8;
      font-size: 12px;
      font-weight: 600;
    }

    .match-time {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 70px 1fr;
      align-items: center;
      gap: 10px;
    }

    .team {
      font-size: 15px;
      line-height: 1.35;
    }

    .team.home {
      text-align: right;
    }

    .team.away {
      text-align: left;
    }

    .vs {
      text-align: center;
      font-size: 16px;
      font-weight: 800;
    }

    .vs span {
      padding: 0 5px;
      color: #6e7b8c;
    }

    /* PREDICTION */

    .prediction-box {
      margin-top: 16px;
      padding: 13px;
      border-radius: 11px;
      background: #181f28;
      text-align: center;
    }

    .prediction-title {
      color: #778496;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .predicted-score {
      font-size: 23px;
      font-weight: 800;
    }

    .predicted-score b {
      color: #697587;
      margin: 0 7px;
    }

    /* STATS */

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .stats-row > div {
      background: #171e27;
      border-radius: 9px;
      padding: 10px 6px;
      text-align: center;
    }

    .stats-row small {
      display: block;
      color: #727f90;
      font-size: 9px;
      margin-bottom: 5px;
    }

    .stats-row strong {
      font-size: 13px;
    }

    /* BUTTON */

    .analysis-button {
      width: 100%;
      margin-top: 11px;
      padding: 11px;
      border: 1px solid #303b49;
      background: transparent;
      color: #fff;
      border-radius: 9px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .analysis-button:hover {
      background: #1c2530;
    }

    /* EMPTY */

    .empty,
    .loading {
      background: #121820;
      border: 1px solid #26303d;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      color: #8b97a8;
    }

    .empty strong,
    .loading strong {
      display: block;
      color: #fff;
      margin-top: 8px;
    }

    .empty p {
      margin-bottom: 0;
      font-size: 13px;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, .78);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-box {
      width: min(650px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #11171f;
      border: 1px solid #303b49;
      border-radius: 16px;
      padding: 20px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      right: 13px;
      top: 10px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 27px;
      cursor: pointer;
    }

    .modal-title {
      margin: 0 35px 5px 0;
      font-size: 20px;
    }

    .modal-league {
      color: #8490a0;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .modal-match {
      text-align: center;
      padding: 15px;
      background: #181f28;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .modal-teams {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .modal-time {
      margin-top: 7px;
      color: #7e8a9a;
      font-size: 12px;
    }

    .analysis-summary {
      display: grid;
      grid-template-columns: 1fr 50px 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .analysis-team {
      background: #181f28;
      border-radius: 10px;
      padding: 13px;
      text-align: center;
    }

    .analysis-team span {
      display: block;
      font-size: 12px;
      color: #9ca7b6;
      margin-bottom: 7px;
    }

    .analysis-team strong {
      font-size: 22px;
    }

    .analysis-vs {
      text-align: center;
      color: #697587;
      font-weight: 700;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .analysis-item {
      background: #181f28;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .analysis-item small {
      display: block;
      color: #7d8999;
      font-size: 10px;
      margin-bottom: 6px;
    }

    .analysis-item strong {
      font-size: 15px;
    }

    .analysis-note {
      margin-top: 13px;
      padding: 12px;
      border-radius: 9px;
      background: #171e27;
      color: #7f8b9b;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding-top: 15px;
      }

      .header h1 {
        font-size: 22px;
      }

      .calendar-day {
        min-height: 38px;
      }

      .teams {
        grid-template-columns: 1fr 50px 1fr;
      }

      .team {
        font-size: 13px;
      }

      .predicted-score {
        font-size: 21px;
      }

      .analysis-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1>🏀 Basketbol Analizi</h1>
    <p>Mackolik basketbol verileriyle maç analizi</p>
  </header>

  <!-- TARİH SEÇİCİ -->

  <div class="date-selector" id="dateSelector">

    <button
      type="button"
      class="date-button"
      id="dateButton"
    >
      <span class="date-left">
        <span class="calendar-icon">📅</span>
        <span class="date-text" id="dateButtonText">
          Tarih seç
        </span>
      </span>

      <span class="arrow">⌄</span>
    </button>

    <div class="calendar-panel">

      <div class="calendar-header">

        <button
          type="button"
          class="month-button"
          id="prevMonth"
        >
          ‹
        </button>

        <div
          class="month-title"
          id="calendarTitle"
        ></div>

        <button
          type="button"
          class="month-button"
          id="nextMonth"
        >
          ›
        </button>

      </div>

      <div class="weekdays">
        <div class="weekday">Pzt</div>
        <div class="weekday">Sal</div>
        <div class="weekday">Çar</div>
        <div class="weekday">Per</div>
        <div class="weekday">Cum</div>
        <div class="weekday">Cmt</div>
        <div class="weekday">Paz</div>
      </div>

      <div
        id="calendar"
        class="calendar"
      ></div>

    </div>

  </div>

  <!-- SEÇİLEN GÜN -->

  <div class="selected-header">
    <h2 id="selectedDate"></h2>
    <span id="matchCount">0 maç</span>
  </div>

  <!-- MAÇLAR -->

  <div id="matchesContainer"></div>

</div>


<!-- ANALİZ MODALI -->

<div
  class="modal"
  id="analysisModal"
>

  <div class="modal-box">

    <button
      type="button"
      class="modal-close"
      id="closeModal"
    >
      ×
    </button>

    <h2 class="modal-title">
      🏀 Basketbol Maç Analizi
    </h2>

    <div
      class="modal-league"
      id="modalLeague"
    ></div>

    <div class="modal-match">

      <div class="modal-teams">
        <span id="modalHome"></span>
        <span>—</span>
        <span id="modalAway"></span>
      </div>

      <div
        class="modal-time"
        id="modalTime"
      ></div>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>
  /*
   * Tarih seçicinin açılıp kapanması
   */

  document.addEventListener("DOMContentLoaded", () => {

    const selector = document.getElementById("dateSelector");
    const button = document.getElementById("dateButton");

    if (!selector || !button) {
      return;
    }

    button.addEventListener("click", (event) => {
      event.stopPropagation();
      selector.classList.toggle("open");
    });

    document.addEventListener("click", (event) => {

      if (!selector.contains(event.target)) {
        selector.classList.remove("open");
      }

    });

    /*
     * Ay butonları takvimi kapatmasın.
     */
    document
      .getElementById("prevMonth")
      ?.addEventListener("click", e => {
        e.stopPropagation();
      });

    document
      .getElementById("nextMonth")
      ?.addEventListener("click", e => {
        e.stopPropagation();
      });

    /*
     * basketbol.js tarih seçtiğinde takvimi kapat.
     */
    const oldRender =
      window.renderBasketballDate;

  });

</script>

<script src="basketbol.js"></script>

<script>
  /*
   * basketbol.js yüklendikten sonra tarih seçimine
   * tıklanınca paneli kapatabilmek için takvim alanını
   * dinliyoruz.
   */

  document.addEventListener("click", (event) => {

    const day = event.target.closest(".calendar-day");

    if (!day) {
      return;
    }

    const selector = document.getElementById("dateSelector");

    if (selector) {
      setTimeout(() => {
        selector.classList.remove("open");
      }, 50);
    }

  });
</script>

</body>
</html>
