<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNA Sonuçtan Oran & Otomatik Kupon Yapıcı</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f17;
      --bg-card: #151c28;
      --bg-hover: #1e2838;
      --border-color: #2a364f;
      --accent-green: #10b981;
      --accent-green-dark: #059669;
      --accent-gold: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dark: #111827;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: var(--bg-card);
      padding: 20px 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-green-dark));
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .brand-text span {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Controls Section */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      background: var(--bg-card);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-green);
    }

    .btn {
      background: var(--accent-green);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-green-dark);
    }

    .btn-gold {
      background: var(--accent-gold);
      color: var(--text-dark);
    }

    .btn-gold:hover {
      background: #d97706;
    }

    /* Layout Grid */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Status Bar */
    .status-bar {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    /* Market List */
    .sa-market {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .sa-market-title {
      background: rgba(255, 255, 255, 0.02);
      padding: 12px 16px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .sa-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1.2fr;
      padding: 12px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
      cursor: pointer;
    }

    .sa-row:hover {
      background: var(--bg-hover);
    }

    .sa-head {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(0,0,0,0.2);
      cursor: default;
    }

    .sa-odd { font-weight: 700; color: var(--accent-gold); }
    .sa-rate { font-weight: 700; color: var(--accent-green); }

    .sa-details {
      display: none;
      background: #0d121c;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .sa-details.open { display: block; }

    .sa-match {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg-card);
      border-radius: 6px;
      margin-top: 8px;
      font-size: 13px;
    }

    /* Coupon Slip Widget */
    .coupon-widget {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      position: sticky;
      top: 20px;
    }

    .coupon-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .coupon-items {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .coupon-item {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      position: relative;
    }

    .coupon-item-remove {
      position: absolute;
      top: 6px;
      right: 8px;
      color: #ef4444;
      cursor: pointer;
      font-size: 16px;
    }

    .coupon-summary {
      background: rgba(0,0,0,0.3);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .summary-row.total {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-green);
      border-top: 1px dashed var(--border-color);
      padding-top: 6px;
      margin-top: 6px;
    }

    .sa-empty {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .sa-empty-icon { font-size: 32px; margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-icon">DNA</div>
      <div class="brand-text">
        <h1>Mackolik DNA Otomatik Kupon</h1>
        <span>Sonuçtan Oran Analiz & Otomatik Kombine Engine</span>
      </div>
    </div>
    <button id="saRun" class="btn">Analizi Çalıştır</button>
  </header>

  <!-- Controls -->
  <div class="controls-grid">
    <div class="form-group">
      <label for="saResult">Hedef Sonuç</label>
      <select id="saResult" class="form-control">
        <option value="25_UST">2.5 Üst</option>
        <option value="15_UST">1.5 Üst</option>
        <option value="15_ALT">1.5 Alt</option>
        <option value="KG_VAR">KG Var</option>
        <option value="KG_YOK">KG Yok</option>
        <option value="MS1">MS1</option>
        <option value="MSX">MSX</option>
        <option value="MS2">MS2</option>
        <option value="IY15_UST">İY 1.5 Üst</option>
        <option value="IY_KG_VAR">İY KG Var</option>
      </select>
    </div>

    <div class="form-group">
      <label for="saDate">Analiz Tarihi</label>
      <input type="date" id="saDate" class="form-control">
    </div>

    <div class="form-group">
      <label for="couponStrategy">Kupon Stratejisi</label>
      <select id="couponStrategy" class="form-control">
        <option value="MAX_RATE">En Yüksek Başarı (%80+)</option>
        <option value="TARGET_ODDS">Hedef Toplam Oran (3.00 - 5.00)</option>
        <option value="BALANCED">Dengeli Karışık Kupon</option>
      </select>
    </div>

    <div class="form-group">
      <label for="maxMatchCount">Max Maç Sayısı</label>
      <input type="number" id="maxMatchCount" class="form-control" value="3" min="1" max="10">
    </div>

    <div class="form-group" style="justify-content: flex-end;">
      <button id="btnAutoGenerate" class="btn btn-gold" style="width: 100%;">⚡ Otomatik Kupon Yap</button>
    </div>
  </div>

  <div id="saStatus" class="status-bar">Sistem hazırlanıyor...</div>

  <!-- Layout -->
  <div class="app-layout">
    <!-- Main Content -->
    <div>
      <div id="saContent"></div>
    </div>

    <!-- Right Sidebar / Coupon Slip -->
    <div>
      <div class="coupon-widget">
        <div class="coupon-header">
          <h3>📋 Kupon Islak İmzası</h3>
          <span id="couponCountBadge" style="font-size: 12px; background: var(--border-color); padding: 2px 8px; border-radius: 12px;">0 Maç</span>
        </div>

        <div id="couponItems" class="coupon-items">
          <div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 13px;">
            Henüz maç seçilmedi. Otomatik Kupon Yap butonunu kullanabilir veya oranlara tıklayabilirsiniz.
          </div>
        </div>

        <div class="coupon-summary">
          <div class="summary-row">
            <span>Misli:</span>
            <input type="number" id="misliInput" value="100" min="10" style="width: 70px; background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; text-align: center; border-radius: 4px;"> ₺
          </div>
          <div class="summary-row">
            <span>Toplam Oran:</span>
            <strong id="totalOddsText">1.00</strong>
          </div>
          <div class="summary-row total">
            <span>Tahmini Kazanç:</span>
            <strong id="totalPayoutText">0.00 ₺</strong>
          </div>
        </div>

        <button id="btnCopyCoupon" class="btn" style="width: 100%;">Kuponu Metin Olarak Kopyala</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

const DATA_URL = "./data/matches.json";
const HISTORY_DAYS = 30;
const MIN_SAMPLE = 8;
const MIN_SUCCESS = 80;

const MARKETS = [
  { id: "iy15Alt", label: "İY 1.5 Alt", fields: ["iy15Alt"] },
  { id: "iy15Ust", label: "İY 1.5 Üst", fields: ["iy15Ust"] },
  { id: "iy1", label: "İY1", fields: ["iy1"] },
  { id: "iyX", label: "İYX", fields: ["iyX"] },
  { id: "iy2", label: "İY2", fields: ["iy2"] },
  { id: "kgVar", label: "KG Var", fields: ["kgVar"] },
  { id: "kgYok", label: "KG Yok", fields: ["kgYok"] },
  { id: "iyKgVar", label: "İY KG Var", fields: ["iyKGVar", "iyKgVar", "iykgVar"] },
  { id: "iyKgYok", label: "İY KG Yok", fields: ["iyKGYok", "iyKgYok", "iykgyok"] },
  { id: "ms15Alt", label: "1.5 Alt", fields: ["au15Alt"] },
  { id: "ms15Ust", label: "1.5 Üst", fields: ["au15Ust"] },
  { id: "ms25Ust", label: "2.5 Üst", fields: ["au25Ust"] },
  { id: "ms1", label: "MS1", fields: ["ms1"] },
  { id: "msX", label: "MSX", fields: ["msX"] },
  { id: "ms2", label: "MS2", fields: ["ms2"] }
];

const RESULTS = {
  MS1: { label: "MS1", type: "ft", test: s => s.home > s.away },
  MSX: { label: "MSX", type: "ft", test: s => s.home === s.away },
  MS2: { label: "MS2", type: "ft", test: s => s.away > s.home },
  IY1: { label: "İY1", type: "ht", test: s => s.home > s.away },
  IYX: { label: "İYX", type: "ht", test: s => s.home === s.away },
  IY2: { label: "İY2", type: "ht", test: s => s.away > s.home },
  KG_VAR: { label: "KG Var", type: "ft", test: s => s.home > 0 && s.away > 0 },
  KG_YOK: { label: "KG Yok", type: "ft", test: s => s.home === 0 || s.away === 0 },
  IY_KG_VAR: { label: "İY KG Var", type: "ht", test: s => s.home > 0 && s.away > 0 },
  IY_KG_YOK: { label: "İY KG Yok", type: "ht", test: s => s.home === 0 || s.away === 0 },
  IY15_ALT: { label: "İY 1.5 Alt", type: "ht", test: s => s.home + s.away <= 1 },
  IY15_UST: { label: "İY 1.5 Üst", type: "ht", test: s => s.home + s.away >= 2 },
  "15_ALT": { label: "1.5 Alt", type: "ft", test: s => s.home + s.away <= 1 },
  "15_UST": { label: "1.5 Üst", type: "ft", test: s => s.home + s.away >= 2 },
  "25_UST": { label: "2.5 Üst", type: "ft", test: s => s.home + s.away >= 2 }
};

let allMatches = [];
let currentAnalysisRows = [];
let currentCoupon = [];

function escapeHtml(value) {
  return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function normalizeOdd(value) {
  if (value === null || value === undefined || value === "") return null;
  const number = Number(String(value).trim().replace(",", "."));
  return Number.isFinite(number) && number > 0 ? number.toFixed(2) : null;
}

function parseDateKey(value) {
  if (!value) return null;
  const text = String(value).trim();
  let match = text.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);
  if (match) return [match[3], match[2].padStart(2, "0"), match[1].padStart(2, "0")].join("-");
  match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (match) return [match[1], match[2].padStart(2, "0"), match[3].padStart(2, "0")].join("-");
  return null;
}

function getDateKey(match) {
  const candidates = [match?.date, match?.matchDate, match?.gameDate, match?.tarih, match?.datetime];
  for (const value of candidates) {
    const date = parseDateKey(value);
    if (date) return date;
  }
  return null;
}

function dateToNumber(dateKey) {
  const parts = String(dateKey).split("-").map(Number);
  return parts.length === 3 ? Date.UTC(parts[0], parts[1] - 1, parts[2]) : NaN;
}

function addDays(dateKey, days) {
  const date = new Date(dateToNumber(dateKey));
  date.setUTCDate(date.getUTCDate() + days);
  return [date.getUTCFullYear(), String(date.getUTCMonth() + 1).padStart(2, "0"), String(date.getUTCDate()).padStart(2, "0")].join("-");
}

function todayKey() {
  const now = new Date();
  return [now.getFullYear(), String(now.getMonth() + 1).padStart(2, "0"), String(now.getDate()).padStart(2, "0")].join("-");
}

function formatDate(dateKey) {
  if (!dateKey) return "-";
  const parts = dateKey.split("-");
  return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : dateKey;
}

function getTeamName(match, side) {
  return side === "home" ? (match?.home ?? match?.homeTeam ?? "-") : (match?.away ?? match?.awayTeam ?? "-");
}

function getLeague(match) { return match?.league ?? match?.leagueName ?? "-"; }

function getTime(match) {
  const candidates = [match?.time, match?.matchTime, match?.startTime];
  for (const value of candidates) {
    if (!value) continue;
    const matchTime = String(value).trim().match(/(\d{1,2}):(\d{2})/);
    if (matchTime) return `${matchTime[1].padStart(2, "0")}:${matchTime[2]}`;
  }
  return "--:--";
}

function parseScore(value) {
  if (!value) return null;
  if (typeof value === "object" && !Array.isArray(value)) {
    const h = value.home ?? value.homeScore;
    const a = value.away ?? value.awayScore;
    return (h !== undefined && a !== undefined && h !== "" && a !== "") ? { home: Number(h), away: Number(a) } : null;
  }
  const match = String(value).trim().match(/^(\d+)\s*[-:]\s*(\d+)$/);
  return match ? { home: Number(match[1]), away: Number(match[2]) } : null;
}

function getScore(match, type) {
  const candidates = type === "ht" ? [match?.halfTimeScore, match?.htScore] : [match?.score, match?.ftScore];
  for (const value of candidates) {
    const score = parseScore(value);
    if (score) return score;
  }
  return null;
}

function isPlayed(match) { return getScore(match, "ft") !== null; }

function getOddsContainer(match) {
  const containers = [match?.openingOdds, match?.openOdds, match?.odds];
  for (const container of containers) {
    if (container && typeof container === "object" && !Array.isArray(container)) return container;
  }
  return null;
}

function getOdds(match, market) {
  const container = getOddsContainer(match);
  if (!container) return null;
  for (const field of market.fields) {
    if (Object.prototype.hasOwnProperty.call(container, field)) {
      const odd = normalizeOdd(container[field]);
      if (odd !== null) return odd;
    }
  }
  return null;
}

function getTargetResult(match, resultId) {
  const definition = RESULTS[resultId];
  if (!definition) return null;
  const score = getScore(match, definition.type);
  return score ? definition.test(score) : null;
}

async function loadData() {
  const response = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
  if (!response.ok) throw new Error(`Veri alınamadı: ${response.status}`);
  const json = await response.json();
  if (Array.isArray(json)) return json;
  if (json && Array.isArray(json.matches)) return json.matches;
  throw new Error("matches.json geçerli maç içermiyor.");
}

function buildFutureIndex(matches, targetDate) {
  const index = new Map();
  for (const match of matches) {
    if (getDateKey(match) !== targetDate || isPlayed(match)) continue;
    for (const market of MARKETS) {
      const odd = getOdds(match, market);
      if (!odd) continue;
      const key = `${market.id}|${odd}`;
      if (!index.has(key)) index.set(key, []);
      index.get(key).push(match);
    }
  }
  return index;
}

function runAnalysis(targetDate, resultId) {
  const startDate = addDays(targetDate, -HISTORY_DAYS);
  const history = allMatches.filter(match => {
    const date = getDateKey(match);
    return Boolean(date && date >= startDate && date < targetDate && isPlayed(match));
  });
  const futureIndex = buildFutureIndex(allMatches, targetDate);
  const groups = new Map();

  for (const match of history) {
    const result = getTargetResult(match, resultId);
    if (result === null) continue;
    for (const market of MARKETS) {
      const odd = getOdds(match, market);
      if (!odd) continue;
      const key = `${market.id}|${odd}`;
      if (!groups.has(key)) {
        groups.set(key, { marketId: market.id, marketLabel: market.label, odd, total: 0, success: 0 });
      }
      const group = groups.get(key);
      group.total++;
      if (result) group.success++;
    }
  }

  const rows = Array.from(groups.values()).filter(item => {
    if (item.total < MIN_SAMPLE || item.success <= 0) return false;
    const rate = (item.success / item.total) * 100;
    if (rate < MIN_SUCCESS) return false;
    return (futureIndex.get(`${item.marketId}|${item.odd}`) || []).length > 0;
  });

  for (const row of rows) {
    row.rate = (row.success / row.total) * 100;
    row.future = futureIndex.get(`${row.marketId}|${row.odd}`) || [];
  }

  rows.sort((a, b) => b.rate - a.rate || b.total - a.total);
  return { history, rows };
}

function renderAnalysis(resultId, targetDate, analysis) {
  const content = document.getElementById("saContent");
  const status = document.getElementById("saStatus");
  const result = RESULTS[resultId];

  currentAnalysisRows = analysis.rows;

  status.innerHTML = `<strong>${escapeHtml(result.label)}</strong> için <strong>${analysis.rows.length}</strong> uygun oran bulundu.`;

  if (!analysis.rows.length) {
    content.innerHTML = `<div class="sa-empty"><div class="sa-empty-icon">🔎</div>Uygun oran bulunamadı</div>`;
    return;
  }

  let html = "";
  analysis.rows.forEach((row, index) => {
    const rowId = `sa-row-${index}`;
    html += `
      <div class="sa-market">
        <div class="sa-row" data-row-id="${rowId}">
          <div>${escapeHtml(row.marketLabel)}</div>
          <div class="sa-odd">${escapeHtml(row.odd)}</div>
          <div>${row.total} Maç</div>
          <div class="sa-rate">%${row.rate.toFixed(1)}</div>
          <div>▶ ${row.future.length} Maç</div>
        </div>
        <div id="${rowId}" class="sa-details">
          ${row.future.map(m => `
            <div class="sa-match">
              <div><strong>${getTime(m)}</strong>${getTeamName(m, 'home')} - ${getTeamName(m, 'away')} (${getLeague(m)})</div>
              <button class="btn" style="padding:4px 8px; font-size:12px;" onclick="addToCoupon('${getTeamName(m, 'home')} - ${getTeamName(m, 'away')}', '${result.label}', '${row.odd}', '\%${row.rate.toFixed(0)}')">+ Ekle</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });

  content.innerHTML = html;
  bindRows();
}

function bindRows() {
  document.querySelectorAll("#saContent .sa-row[data-row-id]").forEach(row => {
    row.addEventListener("click", () => {
      const details = document.getElementById(row.dataset.rowId);
      if (details) details.classList.toggle("open");
    });
  });
}

/* Coupon Generator Logic */
function addToCoupon(matchTitle, prediction, odd, rate) {
  if (currentCoupon.some(item => item.matchTitle === matchTitle)) return;
  currentCoupon.push({ matchTitle, prediction, odd: parseFloat(odd), rate });
  updateCouponUI();
}

function removeFromCoupon(index) {
  currentCoupon.splice(index, 1);
  updateCouponUI();
}

function updateCouponUI() {
  const container = document.getElementById("couponItems");
  const badge = document.getElementById("couponCountBadge");
  const oddsText = document.getElementById("totalOddsText");
  const payoutText = document.getElementById("totalPayoutText");
  const misli = parseFloat(document.getElementById("misliInput").value) || 100;

  badge.textContent = `${currentCoupon.length} Maç`;

  if (currentCoupon.length === 0) {
    container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 13px;">Henüz maç seçilmedi.</div>`;
    oddsText.textContent = "1.00";
    payoutText.textContent = "0.00 ₺";
    return;
  }

  let totalOdds = 1;
  let html = "";

  currentCoupon.forEach((item, index) => {
    totalOdds *= item.odd;
    html += `
      <div class="coupon-item">
        <span class="coupon-item-remove" onclick="removeFromCoupon(${index})">✕</span>
        <div style="font-weight:600; font-size:13px;">${escapeHtml(item.matchTitle)}</div>
        <div style="font-size:12px; color:var(--accent-gold); font-weight:700;">Tahmin: ${escapeHtml(item.prediction)} @ ${item.odd.toFixed(2)}</div>
        <div style="font-size:11px; color:var(--accent-green);">Başarı Oranı: ${item.rate}</div>
      </div>
    `;
  });

  container.innerHTML = html;
  oddsText.textContent = totalOdds.toFixed(2);
  payoutText.textContent = (totalOdds * misli).toFixed(2) + " ₺";
}

function generateAutoCoupon() {
  if (!currentAnalysisRows.length) return;

  const maxCount = parseInt(document.getElementById("maxMatchCount").value) || 3;
  const targetResult = RESULTS[document.getElementById("saResult").value].label;

  currentCoupon = [];
  const addedMatches = new Set();

  for (const row of currentAnalysisRows) {
    for (const match of row.future) {
      const matchTitle = `${getTeamName(match, 'home')} - ${getTeamName(match, 'away')}`;
      if (!addedMatches.has(matchTitle)) {
        addedMatches.add(matchTitle);
        currentCoupon.push({
          matchTitle,
          prediction: targetResult,
          odd: parseFloat(row.odd),
          rate: `%${row.rate.toFixed(0)}`
        });
        if (currentCoupon.length >= maxCount) break;
      }
    }
    if (currentCoupon.length >= maxCount) break;
  }

  updateCouponUI();
}

async function executeAnalysis() {
  const resultId = document.getElementById("saResult").value;
  const targetDate = document.getElementById("saDate").value;
  const status = document.getElementById("saStatus");

  if (!targetDate) { status.textContent = "Lütfen tarih seçin."; return; }

  status.innerHTML = "⏳ Analiz yapılıyor...";
  try {
    const analysis = runAnalysis(targetDate, resultId);
    renderAnalysis(resultId, targetDate, analysis);
  } catch (e) {
    console.error(e);
    status.textContent = "Analiz sırasında hata oluştu.";
  }
}

document.getElementById("misliInput").addEventListener("input", updateCouponUI);
document.getElementById("btnAutoGenerate").addEventListener("click", generateAutoCoupon);
document.getElementById("btnCopyCoupon").addEventListener("click", () => {
  if (!currentCoupon.length) return;
  let text = "📋 DNA OTOMATİK KUPON\n\n";
  currentCoupon.forEach(c => {
    text += `⚽ ${c.matchTitle}\n🎯 Tahmin: ${c.prediction} @ ${c.odd.toFixed(2)} (Başarı: ${c.rate})\n\n`;
  });
  text += `Toplam Oran: ${document.getElementById("totalOddsText").textContent}\nTahmini Kazanç: ${document.getElementById("totalPayoutText").textContent}`;
  navigator.clipboard.writeText(text);
  alert("Kupon kopyalandı!");
});

async function init() {
  document.getElementById("saDate").value = todayKey();
  document.getElementById("saRun").addEventListener("click", executeAnalysis);
  
  try {
    allMatches = await loadData();
    document.getElementById("saStatus").innerHTML = `<strong>${allMatches.length}</strong> maç verisi yüklendi.`;
    executeAnalysis();
  } catch (e) {
    document.getElementById("saStatus").textContent = "Veriler yüklenemedi. data/matches.json kontrol edin.";
  }
}

init();
</script>
</body>
</html>
