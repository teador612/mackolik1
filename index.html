<!doctype html>
<html lang="tr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b1020">

<title>Maçkolik - Açılış Oran Analizi</title>

<link rel="stylesheet" href="styles.css?v=2">
</head>

<body>

<div class="app">

    <div class="header">

        <div class="title">
            ⚽ Maçkolik
        </div>

        <div class="subtitle">
            Açılış oranlarından geçmiş sonuç analizi
        </div>


        <div class="controls">

            <div class="calendar-wrapper">

                <button
                    id="calendarButton"
                    class="calendar-button"
                    type="button"
                >

                    <span class="calendar-icon">📅</span>

                    <span class="calendar-button-info">
                        <small>Tarih</small>
                        <strong id="selectedDateText">
                            Yükleniyor...
                        </strong>
                    </span>

                    <span class="calendar-arrow">
                        ⌄
                    </span>

                </button>


                <div
                    id="calendarPopup"
                    class="calendar-popup"
                    hidden
                >

                    <div class="calendar-header">

                        <button
                            id="prevMonth"
                            class="month-button"
                            type="button"
                        >
                            ‹
                        </button>

                        <strong id="calendarMonth">
                            —
                        </strong>

                        <button
                            id="nextMonth"
                            class="month-button"
                            type="button"
                        >
                            ›
                        </button>

                    </div>


                    <div class="calendar-weekdays">

                        <span>Pzt</span>
                        <span>Sal</span>
                        <span>Çar</span>
                        <span>Per</span>
                        <span>Cum</span>
                        <span>Cmt</span>
                        <span>Paz</span>

                    </div>


                    <div
                        id="calendarDays"
                        class="calendar-days"
                    ></div>


                    <button
                        id="todayButton"
                        class="today-button"
                        type="button"
                    >
                        Bugüne Git
                    </button>

                </div>

            </div>


            <button
                class="refresh"
                id="refreshButton"
                type="button"
            >
                🔄 Yenile
            </button>

        </div>

    </div>


    <div id="summary"></div>


    <div id="content">

        <div class="loading">
            Veriler yükleniyor...
        </div>

    </div>


    <div class="footer">
        Açılış oranı analizi · Son 60 gün · Minimum %70 başarı
    </div>

</div>


<script src="app.js?v=2"></script>

</body>
</html>
