<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Maçkolik - Oran Analiz</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#07101d;
    color:#f8fafc;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#172554,#0f172a);
    border:1px solid #263452;
    border-radius:18px;
    padding:22px;
    margin-bottom:15px;
}

.header h1{
    margin:0 0 7px;
    font-size:27px;
}

.header p{
    margin:0;
    color:#94a3b8;
}

/* FILTER */

.panel{
    background:#101b2d;
    border:1px solid #263452;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
}

.filter{
    display:grid;
    grid-template-columns:1fr 160px;
    gap:10px;
}

select,
button{
    height:48px;
    border-radius:10px;
    border:1px solid #334155;
    padding:0 14px;
    font-size:15px;
}

select{
    background:#07101d;
    color:white;
}

button{
    background:#2563eb;
    color:white;
    border:0;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.badge{
    background:#07101d;
    border:1px solid #263452;
    border-radius:9px;
    padding:9px 12px;
    color:#cbd5e1;
    font-size:13px;
}

/* STATUS */

.status{
    padding:12px;
    background:#101b2d;
    border:1px solid #263452;
    border-radius:10px;
    color:#94a3b8;
    margin-bottom:15px;
}

/* MATCH */

.match-card{
    background:#101b2d;
    border:1px solid #263452;
    border-radius:16px;
    margin-bottom:18px;
    overflow:hidden;
}

.match-header{
    padding:15px;
    background:#0d1728;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.match-info{
    color:#94a3b8;
    font-size:12px;
}

.teams{
    padding:18px 15px;
    display:grid;
    grid-template-columns:1fr 80px 1fr;
    align-items:center;
    text-align:center;
    gap:10px;
}

.team{
    font-size:17px;
    font-weight:bold;
}

.team.away{
    text-align:left;
}

.team.home{
    text-align:right;
}

.final-score{
    font-size:20px;
    font-weight:bold;
    color:#facc15;
}

/* ANALYSIS */

.analysis{
    padding:15px;
    border-top:1px solid #263452;
}

.analysis-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:12px;
}

.analysis-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.analysis-card{
    background:#07101d;
    border:1px solid #263452;
    border-radius:12px;
    padding:13px;
}

.analysis-card.no-data{
    opacity:.6;
}

.market{
    font-size:12px;
    color:#94a3b8;
    margin-bottom:5px;
}

.market-odd{
    font-size:20px;
    font-weight:bold;
    color:#60a5fa;
    margin-bottom:9px;
}

.sample{
    font-size:11px;
    color:#64748b;
    margin-bottom:8px;
}

.percent-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    padding:4px 0;
    border-bottom:1px solid #162235;
}

.percent-row:last-child{
    border-bottom:0;
}

.result-1{
    color:#4ade80;
}

.result-x{
    color:#facc15;
}

.result-2{
    color:#f87171;
}

.result-var{
    color:#4ade80;
}

.result-yok{
    color:#f87171;
}

.result-ust{
    color:#4ade80;
}

.result-alt{
    color:#f87171;
}

/* MATCH LIST */

.matches-count{
    font-size:15px;
    font-weight:bold;
    margin-bottom:12px;
}

.empty{
    text-align:center;
    padding:40px 10px;
    color:#64748b;
}

/* MOBILE */

@media(max-width:850px){

    .analysis-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .container{
        padding:9px;
    }

    .header h1{
        font-size:22px;
    }

    .filter{
        grid-template-columns:1fr;
    }

    .teams{
        grid-template-columns:1fr 65px 1fr;
    }

    .team{
        font-size:14px;
    }

    .analysis-grid{
        grid-template-columns:1fr 1fr;
    }

    .analysis-card{
        padding:10px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>⚽ Oran Geçmiş Analizi</h1>

        <p>
            Seçilen tarihteki maçların oranlarını geçmiş maçlarla karşılaştır
        </p>

    </div>


    <div class="panel">

        <div class="filter">

            <select id="dateSelect">
                <option value="">Tarihler yükleniyor...</option>
            </select>

            <button onclick="loadSelectedDate()">
                MAÇLARI GÖSTER
            </button>

        </div>


        <div class="info">

            <div class="badge">
                📅 <span id="selectedDate">-</span>
            </div>

            <div class="badge">
                ⚽ <span id="matchCount">0</span> maç
            </div>

            <div class="badge">
                📊 Geçmiş oran analizi aktif
            </div>

        </div>

    </div>


    <div id="status" class="status">
        Veriler yükleniyor...
    </div>


    <div id="matches">

        <div class="empty">
            Maçlar yükleniyor...
        </div>

    </div>

</div>


<script>

/* =====================================================
   AYARLAR
===================================================== */

const DATA_URL = "./data/matches.json";

/*
   0.01 tolerans demek:

   1.66 oranı için

   1.65
   1.66
   1.67

   değerleri de eşleşme kabul edilir.

   Tam eşleşme istersen:
   MATCH_TOLERANCE = 0
*/
const MATCH_TOLERANCE = 0.01;


/* =====================================================
   GLOBAL
===================================================== */

let matches = [];


/* =====================================================
   ELEMENTLER
===================================================== */

const dateSelect =
    document.getElementById("dateSelect");

const matchesDiv =
    document.getElementById("matches");

const statusDiv =
    document.getElementById("status");

const selectedDateDiv =
    document.getElementById("selectedDate");

const matchCountDiv =
    document.getElementById("matchCount");


/* =====================================================
   VERİ YÜKLE
===================================================== */

async function loadData(){

    try{

        statusDiv.innerHTML =
            "⏳ Veriler yükleniyor...";

        const response =
            await fetch(
                DATA_URL + "?v=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Veri dosyası okunamadı. HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(Array.isArray(data)){

            matches = data;

        }else if(
            data &&
            Array.isArray(data.matches)
        ){

            matches = data.matches;

        }else{

            throw new Error(
                "matches.json içinde matches dizisi bulunamadı."
            );

        }


        if(!matches.length){

            throw new Error(
                "Hiç maç bulunamadı."
            );

        }


        statusDiv.innerHTML =
            "✅ " +
            matches.length +
            " maç yüklendi. Geçmiş oran analizleri hazır.";


        createDateList();


    }catch(error){

        console.error(error);

        statusDiv.innerHTML =
            "❌ " + error.message;

        matchesDiv.innerHTML =
            `
            <div class="empty">
                Veri yüklenemedi.
            </div>
            `;

    }

}


/* =====================================================
   TARİHLERİ OLUŞTUR
===================================================== */

function createDateList(){

    const dates = [
        ...new Set(
            matches
                .map(m => m.date)
                .filter(Boolean)
        )
    ];


    dates.sort((a,b) => {

        const pa = a.split(".");
        const pb = b.split(".");

        const da =
            new Date(
                pa[2],
                pa[1]-1,
                pa[0]
            );

        const db =
            new Date(
                pb[2],
                pb[1]-1,
                pb[0]
            );

        return da-db;

    });


    dateSelect.innerHTML =
        '<option value="">Tarih seç</option>';


    dates.forEach(date => {

        const option =
            document.createElement("option");

        option.value = date;

        option.textContent = date;

        dateSelect.appendChild(option);

    });


    if(dates.length){

        /*
           En son tarihi otomatik seç
        */

        dateSelect.value =
            dates[dates.length-1];

        loadSelectedDate();

    }

}


/* =====================================================
   SEÇİLEN TARİH
===================================================== */

function loadSelectedDate(){

    const date =
        dateSelect.value;


    if(!date){

        matchesDiv.innerHTML =
            `
            <div class="empty">
                Lütfen tarih seçin.
            </div>
            `;

        return;

    }


    const selectedMatches =
        matches
            .filter(
                m => m.date === date
            )
            .sort(
                (a,b) =>
                    String(a.time || "")
                    .localeCompare(
                        String(b.time || "")
                    )
            );


    selectedDateDiv.textContent =
        date;

    matchCountDiv.textContent =
        selectedMatches.length;


    if(!selectedMatches.length){

        matchesDiv.innerHTML =
            `
            <div class="empty">
                Bu tarihte maç bulunamadı.
            </div>
            `;

        return;

    }


    matchesDiv.innerHTML =
        selectedMatches
            .map(
                match => createMatchCard(match)
            )
            .join("");

}


/* =====================================================
   MAÇ KARTI
===================================================== */

function createMatchCard(match){

    const score =
        getScore(match);

    const historical =
        getHistoricalMatches(match);


    return `

    <div class="match-card">

        <div class="match-header">

            <div>
                <strong>
                    ${escapeHtml(match.league || "Lig")}
                </strong>
            </div>

            <div class="match-info">

                ${escapeHtml(match.date || "")}

                &nbsp; • &nbsp;

                ${escapeHtml(match.time || "")}

            </div>

        </div>


        <div class="teams">

            <div class="team home">
                ${escapeHtml(match.home || "-")}
            </div>

            <div class="final-score">
                ${score}
            </div>

            <div class="team away">
                ${escapeHtml(match.away || "-")}
            </div>

        </div>


        <div class="analysis">

            <div class="analysis-title">
                📊 Bu maçın oranları geçmişte nasıl sonuçlandı?
            </div>


            <div class="analysis-grid">


                ${createMSCard(
                    match,
                    historical,
                    "ms1",
                    "MS1",
                    "1"
                )}


                ${createMSCard(
                    match,
                    historical,
                    "msX",
                    "MSX",
                    "X"
                )}


                ${createMSCard(
                    match,
                    historical,
                    "ms2",
                    "MS2",
                    "2"
                )}


                ${createKGCard(
                    match,
                    historical
                )}


                ${createOverCard(
                    match,
                    historical
                )}


                ${createMSCard(
                    match,
                    historical,
                    "iy1",
                    "İY1",
                    "1"
                )}


                ${createMSCard(
                    match,
                    historical,
                    "iyX",
                    "İYX",
                    "X"
                )}


                ${createMSCard(
                    match,
                    historical,
                    "iy2",
                    "İY2",
                    "2"
                )}

            </div>

        </div>

    </div>

    `;

}


/* =====================================================
   GEÇMİŞ MAÇLARI BUL
===================================================== */

function getHistoricalMatches(currentMatch){

    /*
       Sadece seçilen maçtan ÖNCEKİ maçları
       geçmiş olarak kabul ediyoruz.

       Böylece gelecekteki maçlar analize
       dahil edilmiyor.
    */

    const currentDate =
        parseDate(currentMatch.date);


    return matches.filter(match => {

        const date =
            parseDate(match.date);


        if(!date || !currentDate){
            return false;
        }


        if(date >= currentDate){
            return false;
        }


        if(!match.score){
            return false;
        }


        const home =
            Number(match.score.home);

        const away =
            Number(match.score.away);


        if(
            !Number.isFinite(home) ||
            !Number.isFinite(away)
        ){
            return false;
        }


        return true;

    });

}


/* =====================================================
   MS ANALİZ KARTI
===================================================== */

function createMSCard(
    match,
    historical,
    oddKey,
    title,
    selectedResult
){

    const currentOdd =
        getOdd(
            match,
            oddKey
        );


    if(currentOdd === null){

        return "";

    }


    const sameOdds =
        historical.filter(
            m =>
                oddsMatch(
                    getOdd(m,oddKey),
                    currentOdd
                )
        );


    if(!sameOdds.length){

        return `

        <div class="analysis-card no-data">

            <div class="market">
                ${title}
            </div>

            <div class="market-odd">
                ${formatOdd(currentOdd)}
            </div>

            <div class="sample">
                Geçmiş eşleşme: 0
            </div>

            <div class="percent-row">
                <span>Geçmiş veri yok</span>
                <span>-</span>
            </div>

        </div>

        `;

    }


    const counts = {
        "1":0,
        "X":0,
        "2":0
    };


    sameOdds.forEach(m => {

        const result =
            matchResult(m);


        if(
            result === "1" ||
            result === "X" ||
            result === "2"
        ){

            counts[result]++;

        }

    });


    const total =
        counts["1"] +
        counts["X"] +
        counts["2"];


    return `

    <div class="analysis-card">

        <div class="market">
            ${title}
        </div>

        <div class="market-odd">
            ${formatOdd(currentOdd)}
        </div>

        <div class="sample">
            ${sameOdds.length} geçmiş eşleşme
        </div>

        <div class="percent-row">
            <span class="result-1">
                1
            </span>

            <strong>
                ${percentage(counts["1"],total)}%
            </strong>
        </div>


        <div class="percent-row">
            <span class="result-x">
                X
            </span>

            <strong>
                ${percentage(counts["X"],total)}%
            </strong>
        </div>


        <div class="percent-row">
            <span class="result-2">
                2
            </span>

            <strong>
                ${percentage(counts["2"],total)}%
            </strong>
        </div>

    </div>

    `;

}


/* =====================================================
   KG ANALİZ
===================================================== */

function createKGCard(
    match,
    historical
){

    const currentOdd =
        getOdd(
            match,
            "kgVar"
        );


    if(currentOdd === null){

        return "";

    }


    const sameOdds =
        historical.filter(
            m =>
                oddsMatch(
                    getOdd(m,"kgVar"),
                    currentOdd
                )
        );


    if(!sameOdds.length){

        return noDataCard(
            "KG VAR",
            currentOdd
        );

    }


    let varCount = 0;
    let yokCount = 0;


    sameOdds.forEach(m => {

        const result =
            kgResult(m);


        if(result === "VAR"){
            varCount++;
        }

        if(result === "YOK"){
            yokCount++;
        }

    });


    const total =
        varCount + yokCount;


    return `

    <div class="analysis-card">

        <div class="market">
            KG VAR
        </div>

        <div class="market-odd">
            ${formatOdd(currentOdd)}
        </div>

        <div class="sample">
            ${sameOdds.length} geçmiş eşleşme
        </div>

        <div class="percent-row">
            <span class="result-var">
                VAR
            </span>

            <strong>
                ${percentage(varCount,total)}%
            </strong>
        </div>

        <div class="percent-row">
            <span class="result-yok">
                YOK
            </span>

            <strong>
                ${percentage(yokCount,total)}%
            </strong>
        </div>

    </div>

    `;

}


/* =====================================================
   2.5 ANALİZ
===================================================== */

function createOverCard(
    match,
    historical
){

    const currentOdd =
        getOdd(
            match,
            "au25Ust"
        );


    if(currentOdd === null){

        return "";

    }


    const sameOdds =
        historical.filter(
            m =>
                oddsMatch(
                    getOdd(m,"au25Ust"),
                    currentOdd
                )
        );


    if(!sameOdds.length){

        return noDataCard(
            "2.5 ÜST",
            currentOdd
        );

    }


    let ust = 0;
    let alt = 0;


    sameOdds.forEach(m => {

        const result =
            over25Result(m);


        if(result === "ÜST"){
            ust++;
        }

        if(result === "ALT"){
            alt++;
        }

    });


    const total =
        ust + alt;


    return `

    <div class="analysis-card">

        <div class="market">
            2.5 ÜST
        </div>

        <div class="market-odd">
            ${formatOdd(currentOdd)}
        </div>

        <div class="sample">
            ${sameOdds.length} geçmiş eşleşme
        </div>

        <div class="percent-row">
            <span class="result-ust">
                ÜST
            </span>

            <strong>
                ${percentage(ust,total)}%
            </strong>
        </div>

        <div class="percent-row">
            <span class="result-alt">
                ALT
            </span>

            <strong>
                ${percentage(alt,total)}%
            </strong>
        </div>

    </div>

    `;

}


/* =====================================================
   VERİ YOK KARTI
===================================================== */

function noDataCard(
    title,
    odd
){

    return `

    <div class="analysis-card no-data">

        <div class="market">
            ${title}
        </div>

        <div class="market-odd">
            ${formatOdd(odd)}
        </div>

        <div class="sample">
            Geçmiş eşleşme: 0
        </div>

        <div class="percent-row">
            <span>
                Yeterli geçmiş veri yok
            </span>

            <strong>-</strong>
        </div>

    </div>

    `;

}


/* =====================================================
   ORAN AL
===================================================== */

function getOdd(
    match,
    key
){

    if(
        !match ||
        !match.openingOdds
    ){
        return null;
    }


    const value =
        Number(
            match.openingOdds[key]
        );


    /*
       0 değerlerini oran olarak kabul etmiyoruz.
    */

    if(
        !Number.isFinite(value) ||
        value <= 0
    ){
        return null;
    }


    return value;

}


/* =====================================================
   ORAN EŞLEŞTİRME
===================================================== */

function oddsMatch(
    a,
    b
){

    if(a === null || b === null){
        return false;
    }


    return Math.abs(a-b)
        <= MATCH_TOLERANCE;

}


/* =====================================================
   MAÇ SONUCU
===================================================== */

function matchResult(match){

    if(!match.score){
        return null;
    }


    const home =
        Number(match.score.home);

    const away =
        Number(match.score.away);


    if(
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ){
        return null;
    }


    if(home > away){
        return "1";
    }

    if(home === away){
        return "X";
    }

    return "2";

}


/* =====================================================
   KG
===================================================== */

function kgResult(match){

    if(!match.score){
        return null;
    }


    const home =
        Number(match.score.home);

    const away =
        Number(match.score.away);


    if(
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ){
        return null;
    }


    return (
        home > 0 &&
        away > 0
    )
    ? "VAR"
    : "YOK";

}


/* =====================================================
   2.5
===================================================== */

function over25Result(match){

    if(!match.score){
        return null;
    }


    const home =
        Number(match.score.home);

    const away =
        Number(match.score.away);


    if(
        !Number.isFinite(home) ||
        !Number.isFinite(away)
    ){
        return null;
    }


    return home + away > 2.5
        ? "ÜST"
        : "ALT";

}


/* =====================================================
   SKOR
===================================================== */

function getScore(match){

    if(!match.score){
        return "-";
    }


    if(
        match.score.home === undefined ||
        match.score.away === undefined
    ){
        return "-";
    }


    return (
        match.score.home +
        " - " +
        match.score.away
    );

}


/* =====================================================
   TARİH
===================================================== */

function parseDate(date){

    if(!date){
        return null;
    }


    const parts =
        String(date).split(".");


    if(parts.length !== 3){
        return null;
    }


    return new Date(
        Number(parts[2]),
        Number(parts[1])-1,
        Number(parts[0])
    );

}


/* =====================================================
   YÜZDE
===================================================== */

function percentage(
    value,
    total
){

    if(!total){
        return "0.0";
    }


    return (
        value / total * 100
    ).toFixed(1);

}


/* =====================================================
   ORAN GÖSTER
===================================================== */

function formatOdd(value){

    return Number(value)
        .toFixed(2);

}


/* =====================================================
   HTML GÜVENLİK
===================================================== */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   BAŞLAT
===================================================== */

loadData();

</script>

</body>
</html>
