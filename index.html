<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maç Oran Analizi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">⚽</div>

        <div>
            <h1>Maç Oran Analizi</h1>
            <span>Son 60 gün geçmiş oran istatistikleri</span>
        </div>
    </div>

    <button id="refreshButton" class="refresh-btn">
        ↻ Yenile
    </button>
</header>


<main class="container">

    <section class="hero">

        <div>
            <div class="eyebrow">ORAN ANALİZ SİSTEMİ</div>

            <h2 id="pageTitle">
                Bugünün Maçları
            </h2>

            <p id="pageDescription">
                Geçmiş 60 gündeki birebir aynı oranların sonuçları analiz ediliyor.
            </p>
        </div>

    </section>


    <!-- TAKVİM -->

    <section class="calendar-section">

        <button id="calendarToggle" class="calendar-button">
            <span>📅</span>
            <span id="selectedDateText">Tarih seç</span>
            <span class="calendar-arrow">⌄</span>
        </button>


        <div id="calendarPopup" class="calendar-popup hidden">

            <div class="calendar-header">

                <button id="prevMonth" class="month-btn">
                    ‹
                </button>

                <strong id="calendarMonth">
                    -
                </strong>

                <button id="nextMonth" class="month-btn">
                    ›
                </button>

            </div>


            <div class="weekdays">

                <div>Pzt</div>
                <div>Sal</div>
                <div>Çar</div>
                <div>Per</div>
                <div>Cum</div>
                <div>Cmt</div>
                <div>Paz</div>

            </div>


            <div id="calendarDays" class="calendar-days"></div>

        </div>

    </section>


    <!-- FİLTRELER -->

    <section class="filters">

        <div class="filter-box">

            <label for="search">
                Maç / Takım
            </label>

            <input
                id="search"
                type="text"
                placeholder="Takım ara..."
            >

        </div>


        <div class="filter-box">

            <label for="leagueFilter">
                Lig
            </label>

            <select id="leagueFilter">

                <option value="">
                    Tüm Ligler
                </option>

            </select>

        </div>


        <label class="check-box">

            <input
                type="checkbox"
                id="unplayedOnly"
            >

            <span>
                Sadece oynanmamış
            </span>

        </label>

    </section>


    <!-- DURUM -->

    <section class="status-bar">

        <div id="message">
            Veriler yükleniyor...
        </div>

        <div id="updatedAt">
            -
        </div>

    </section>


    <!-- MAÇLAR -->

    <section id="content"></section>

</main>


<footer>
    Geçmiş analiz: son 60 gün · Birebir oran eşleşmesi
</footer>


<script src="app.js"></script>

</body>
</html>
