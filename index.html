<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oran Analiz Havuzu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #f8fafc;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        /* Navigasyon Bar */
        .navbar {
            background-color: #131c2e;
            border-bottom: 1px solid #1e2d4a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
        }

        .logo span {
            color: #22c55e;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .nav-link.active {
            color: #ffffff;
            background-color: #1e2d4a;
        }

        .container {
            max-width: 600px;
            margin: 12px auto;
            padding: 0 12px;
        }

        /* Üst İstatistik Sayaç Panelleri */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-card {
            background-color: #131c2e;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .stat-title {
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 4px;
            white-space: nowrap;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f8fafc;
        }

        /* Filtre Alanı */
        .filter-section {
            background-color: #131c2e;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .filter-group label {
            font-size: 0.75rem;
            color: #94a3b8;
            white-space: nowrap;
        }

        input[type="date"], select, input[type="number"] {
            background-color: #0b111e;
            color: #f8fafc;
            border: 1px solid #1e2d4a;
            padding: 6px 8px;
            border-radius: 6px;
            outline: none;
            font-size: 0.8rem;
            width: 100%;
        }

        input[type="date"]::-calendar-picker-indicator {
            filter: invert(1);
        }

        /* Görsel Tasarımdaki Maç Kartı Birebir Uyumlu */
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-item {
            background-color: #131c2e;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .match-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .plus-btn {
            background-color: transparent;
            border: 1px solid #1e2d4a;
            color: #94a3b8;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            cursor: pointer;
        }

        .match-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .match-meta {
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
        }

        .match-teams {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Sağ Taraf Yeşil Rozet Stili */
        .match-badge {
            background-color: #14532d;
            color: #4ade80;
            border: 1px solid #166534;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #64748b;
            background-color: #131c2e;
            border-radius: 8px;
            border: 1px solid #1e2d4a;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Oran<span>Analiz</span></a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active">Maçlar</a></li>
                <li><a href="skor.html" class="nav-link">Canlı Skor</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- İstatistik Panelleri -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Oynanmamış maç</div>
                <div class="stat-value" id="stat-unplayed">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Filtrelenen</div>
                <div class="stat-value" id="stat-filtered">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Analiz havuzu</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
        </div>

        <!-- Filtreleme Paneli -->
        <div class="filter-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="match-date">Tarih:</label>
                    <input type="date" id="match-date">
                </div>
                <div class="filter-group">
                    <label for="odd-type">Oran Türü:</label>
                    <select id="odd-type">
                        <option value="all">Tüm Oranlar</option>
                        <option value="ms1">MS 1</option>
                        <option value="msx">MS X</option>
                        <option value="ms2">MS 2</option>
                    </select>
                </div>
            </div>
            <div class="filter-row">
                <div class="filter-group">
                    <label for="min-odd">Min Oran:</label>
                    <input type="number" id="min-odd" placeholder="Örn: 1.50" step="0.05">
                </div>
                <div class="filter-group">
                    <label for="max-odd">Maks Oran:</label>
                    <input type="number" id="max-odd" placeholder="Örn: 3.00" step="0.05">
                </div>
            </div>
        </div>

        <!-- Maç Listesi -->
        <div class="match-list" id="matches-list">
            <div class="no-data">Veriler yükleniyor...</div>
        </div>
    </div>

    <script>
        let rawData = [];

        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('match-date');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;

            fetchData();

            // Filtreleme dinleyicileri
            document.getElementById('match-date').addEventListener('change', filterAndRender);
            document.getElementById('odd-type').addEventListener('change', filterAndRender);
            document.getElementById('min-odd').addEventListener('input', filterAndRender);
            document.getElementById('max-odd').addEventListener('input', filterAndRender);
        });

        async function fetchData() {
            try {
                const response = await fetch('data/matches.json');
                if (!response.ok) throw new Error('Ağ hatası');
                
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    rawData = data;
                } else if (data.matches && Array.isArray(data.matches)) {
                    rawData = data.matches;
                } else if (typeof data === 'object') {
                    rawData = Object.values(data).flat();
                }

                filterAndRender();
            } catch (error) {
                console.error('Veri yükleme hatası:', error);
                document.getElementById('matches-list').innerHTML = 
                    '<div class="no-data">Veriler yüklenirken bir sorun oluştu.</div>';
            }
        }

        function filterAndRender() {
            const selectedDate = document.getElementById('match-date').value;
            const oddType = document.getElementById('odd-type').value;
            const minOdd = parseFloat(document.getElementById('min-odd').value) || 0;
            const maxOdd = parseFloat(document.getElementById('max-odd').value) || 999;

            const [year, month, day] = selectedDate.split('-');
            const formattedTRDate = `${day}.${month}.${year}`;

            // 1. Tarihe göre filtrele
            let filtered = rawData.filter(m => {
                const matchDate = m.date || m.tarih || '';
                return matchDate === formattedTRDate || matchDate.includes(selectedDate);
            });

            // Üst İstatistikleri Güncelle
            document.getElementById('stat-total').innerText = rawData.length;
            const unplayed = filtered.filter(m => Number(m.status) === 4 || Number(m.status) === 0).length;
            document.getElementById('stat-unplayed').innerText = unplayed;

            // 2. Oran Filtreleme Yap
            if (oddType !== 'all' || minOdd > 0 || maxOdd < 999) {
                filtered = filtered.filter(m => {
                    const odds = m.odds || m.oranlar || {};
                    let targetOdd = 0;

                    if (oddType === 'ms1') targetOdd = parseFloat(odds.ms1 || odds['1']);
                    else if (oddType === 'msx') targetOdd = parseFloat(odds.msx || odds.ms0 || odds['X']);
                    else if (oddType === 'ms2') targetOdd = parseFloat(odds.ms2 || odds['2']);
                    else {
                        // Tüm oranlardan herhangi biri aralığa uyuyor mu
                        const o1 = parseFloat(odds.ms1 || odds['1']) || 0;
                        const ox = parseFloat(odds.msx || odds.ms0 || odds['X']) || 0;
                        const o2 = parseFloat(odds.ms2 || odds['2']) || 0;
                        return (o1 >= minOdd && o1 <= maxOdd) || 
                               (ox >= minOdd && ox <= maxOdd) || 
                               (o2 >= minOdd && o2 <= maxOdd);
                    }

                    return targetOdd >= minOdd && targetOdd <= maxOdd;
                });
            }

            document.getElementById('stat-filtered').innerText = filtered.length;

            const listContainer = document.getElementById('matches-list');

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="no-data">Kriterlere uygun maç bulunamadı.</div>`;
                return;
            }

            listContainer.innerHTML = filtered.map(m => {
                const home = m.home || m.homeTeam || 'Ev Sahibi';
                const away = m.away || m.awayTeam || 'Deplasman';
                const league = m.league || m.lig || 'LİG';
                const time = m.time || m.saat || '00:00';
                
                const odds = m.odds || m.oranlar || {};
                const ms1 = odds.ms1 || odds['1'] || '-';
                const msx = odds.msx || odds.ms0 || odds['X'] || '-';
                const ms2 = odds.ms2 || odds['2'] || '-';

                // Rozette gösterilecek baskın oran veya öneri
                let badgeText = `MS 1 %${ms1}`;
                if (ms1 !== '-') badgeText = `MS 1: ${ms1}`;
                else if (ms2 !== '-') badgeText = `MS 2: ${ms2}`;

                return `
                    <div class="match-item">
                        <div class="match-left">
                            <button class="plus-btn">+</button>
                            <div class="match-info">
                                <div class="match-meta">${time} · ${league}</div>
                                <div class="match-teams">${home} - ${away}</div>
                            </div>
                        </div>
                        <div class="match-badge">${badgeText}</div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
