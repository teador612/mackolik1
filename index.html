<script>
'use strict';

/* =========================================================
   AYARLAR
========================================================= */

const DATA_URL = './data/matches.json';

const MIN_SUCCESS = 70;
const MIN_SAMPLE = 5;

/* SADECE SON 30 GÜN */
const HISTORY_DAYS = 30;


/* =========================================================
   AÇILIŞ ORANLARI
========================================================= */

const SOURCES = [
  {key:'ms1',      name:'MS 1'},
  {key:'msX',      name:'MS X'},
  {key:'ms2',      name:'MS 2'},

  {key:'kgVar',    name:'KG Var'},
  {key:'kgYok',    name:'KG Yok'},

  {key:'au15Ust',  name:'1.5 Üst'},
  {key:'au15Alt',  name:'1.5 Alt'},

  {key:'au25Ust',  name:'2.5 Üst'},
  {key:'au25Alt',  name:'2.5 Alt'},

  {key:'au35Ust',  name:'3.5 Üst'},
  {key:'au35Alt',  name:'3.5 Alt'},

  {key:'iy15Ust',  name:'İY 1.5 Üst'},
  {key:'iy15Alt',  name:'İY 1.5 Alt'},

  {key:'iy1',      name:'İY 1'},
  {key:'iyX',      name:'İY X'},
  {key:'iy2',      name:'İY 2'}
];


/* =========================================================
   HEDEF SONUÇLAR
========================================================= */

const TARGETS = [
  {key:'ms1',       name:'MS 1'},
  {key:'msX',       name:'MS X'},
  {key:'ms2',       name:'MS 2'},

  {key:'kgVar',     name:'KG Var'},
  {key:'kgYok',     name:'KG Yok'},

  {key:'over15',    name:'1.5 Üst'},
  {key:'under15',   name:'1.5 Alt'},

  {key:'over25',    name:'2.5 Üst'},
  {key:'under25',   name:'2.5 Alt'},

  {key:'over35',    name:'3.5 Üst'},
  {key:'under35',   name:'3.5 Alt'},

  {key:'iyOver05',  name:'İY 0.5 Üst'},
  {key:'iyUnder05', name:'İY 0.5 Alt'},

  {key:'iyOver15',  name:'İY 1.5 Üst'},
  {key:'iyUnder15', name:'İY 1.5 Alt'},

  {key:'iy1',       name:'İY 1'},
  {key:'iyX',       name:'İY X'},
  {key:'iy2',       name:'İY 2'}
];


/* =========================================================
   STATE

   matchesByDate:
   Tarih bazlı erişim.

   oddsIndex:
   source + oran bazlı hızlı geçmiş araması.
========================================================= */

const state = {
  matches: [],
  matchesByDate: new Map(),
  oddsIndex: new Map(),

  selectedDate: '',

  analysisCache: new Map()
};


/* =========================================================
   YARDIMCILAR
========================================================= */

function $(id) {
  return document.getElementById(id);
}


function esc(value) {
  return String(value ?? '').replace(
    /[&<>"']/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[char])
  );
}


function num(value) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {
    return null;
  }

  const n = Number(
    String(value).replace(',', '.')
  );

  return Number.isFinite(n)
    ? n
    : null;
}


/* =========================================================
   TARİH
========================================================= */

function dateNumber(date) {

  if (!date) {
    return 0;
  }

  const p = String(date).split('.');

  if (p.length !== 3) {
    return 0;
  }

  return Number(
    p[2] +
    p[1].padStart(2, '0') +
    p[0].padStart(2, '0')
  );
}


function dateToTimestamp(date) {

  const p = String(date).split('.');

  if (p.length !== 3) {
    return 0;
  }

  return new Date(
    Number(p[2]),
    Number(p[1]) - 1,
    Number(p[0])
  ).getTime();
}


function timestampToDate(timestamp) {

  const d = new Date(timestamp);

  return [
    String(d.getDate()).padStart(2, '0'),
    String(d.getMonth() + 1).padStart(2, '0'),
    d.getFullYear()
  ].join('.');
}


function today() {

  const d = new Date();

  return [
    String(d.getDate()).padStart(2, '0'),
    String(d.getMonth() + 1).padStart(2, '0'),
    d.getFullYear()
  ].join('.');
}


/* =========================================================
   SON 30 GÜNÜN BAŞLANGICI

   Örnek:

   Maç: 01.10.2026

   Analiz:
   02.09.2026 - 30.09.2026

   Maçın kendi günü geçmişe dahil edilmez.
========================================================= */

function historyStart(date) {

  const ts = dateToTimestamp(date);

  if (!ts) {
    return 0;
  }

  return ts - (
    HISTORY_DAYS * 24 * 60 * 60 * 1000
  );
}


/* =========================================================
   ORAN
========================================================= */

function getOdd(match, key) {

  const value = num(
    match?.openingOdds?.[key]
  );

  if (
    value === null ||
    value <= 0
  ) {
    return null;
  }

  return value;
}


function sameOdd(a, b) {

  const x = num(a);
  const y = num(b);

  if (
    x === null ||
    y === null ||
    x <= 0 ||
    y <= 0
  ) {
    return false;
  }

  return x === y;
}


/* =========================================================
   SKOR
========================================================= */

function scoreOf(obj) {

  if (!obj) {
    return null;
  }

  const home = num(obj.home);
  const away = num(obj.away);

  if (
    home === null ||
    away === null ||
    home < 0 ||
    away < 0
  ) {
    return null;
  }

  return {
    home,
    away
  };
}


function getScore(match) {
  return scoreOf(match.score);
}


function getHalf(match) {
  return scoreOf(match.halfTimeScore);
}


/* =========================================================
   SONUÇ HESABI
========================================================= */

function result(match, key) {

  const score = getScore(match);
  const half = getHalf(match);

  switch (key) {

    case 'ms1':

      if (!score) return null;

      return score.home > score.away;


    case 'msX':

      if (!score) return null;

      return score.home === score.away;


    case 'ms2':

      if (!score) return null;

      return score.home < score.away;


    case 'kgVar':

      if (!score) return null;

      return (
        score.home > 0 &&
        score.away > 0
      );


    case 'kgYok':

      if (!score) return null;

      return (
        score.home === 0 ||
        score.away === 0
      );


    case 'over15':

      if (!score) return null;

      return (
        score.home + score.away >= 2
      );


    case 'under15':

      if (!score) return null;

      return (
        score.home + score.away <= 1
      );


    case 'over25':

      if (!score) return null;

      return (
        score.home + score.away >= 3
      );


    case 'under25':

      if (!score) return null;

      return (
        score.home + score.away <= 2
      );


    case 'over35':

      if (!score) return null;

      return (
        score.home + score.away >= 4
      );


    case 'under35':

      if (!score) return null;

      return (
        score.home + score.away <= 3
      );


    case 'iyOver05':

      if (!half) return null;

      return (
        half.home + half.away >= 1
      );


    case 'iyUnder05':

      if (!half) return null;

      return (
        half.home + half.away === 0
      );


    case 'iyOver15':

      if (!half) return null;

      return (
        half.home + half.away >= 2
      );


    case 'iyUnder15':

      if (!half) return null;

      return (
        half.home + half.away <= 1
      );


    case 'iy1':

      if (!half) return null;

      return half.home > half.away;


    case 'iyX':

      if (!half) return null;

      return half.home === half.away;


    case 'iy2':

      if (!half) return null;

      return half.home < half.away;


    default:

      return null;
  }
}


/* =========================================================
   HIZLI İNDEKS

   Artık her maçta:

   state.matches.filter(...)

   yapmıyoruz.

   Bunun yerine:

   source + oran

   anahtarına göre geçmiş maçlar
   önceden gruplanıyor.
========================================================= */

function buildIndex() {

  state.matchesByDate.clear();
  state.oddsIndex.clear();

  for (const match of state.matches) {

    if (!match || !match.date) {
      continue;
    }

    /* Tarih indeksi */

    if (!state.matchesByDate.has(match.date)) {
      state.matchesByDate.set(
        match.date,
        []
      );
    }

    state.matchesByDate
      .get(match.date)
      .push(match);


    /* Oran indeksi */

    for (const source of SOURCES) {

      const odd = getOdd(
        match,
        source.key
      );

      if (odd === null) {
        continue;
      }

      const key =
        source.key +
        '|' +
        odd.toFixed(2);

      if (!state.oddsIndex.has(key)) {

        state.oddsIndex.set(
          key,
          []
        );
      }

      state.oddsIndex
        .get(key)
        .push(match);
    }
  }

  /* Her listeyi tarihe göre sırala */

  for (const list of state.oddsIndex.values()) {

    list.sort(
      (a, b) =>
        dateNumber(a.date) -
        dateNumber(b.date)
    );
  }
}


/* =========================================================
   SON 30 GÜNLÜK GEÇMİŞİ GETİR
========================================================= */

function getHistory(matchDate, sourceKey, odd) {

  const key =
    sourceKey +
    '|' +
    Number(odd).toFixed(2);

  const list =
    state.oddsIndex.get(key) || [];

  const currentDate =
    dateNumber(matchDate);

  const startDate =
    dateToTimestamp(matchDate) -
    (
      HISTORY_DAYS *
      24 *
      60 *
      60 *
      1000
    );

  const startDateNumber =
    dateNumber(
      timestampToDate(startDate)
    );

  const resultList = [];

  for (const old of list) {

    const oldDate =
      dateNumber(old.date);

    /* Gelecek / aynı gün alınmaz */

    if (oldDate >= currentDate) {
      break;
    }

    /* 30 günden eskiyse atla */

    if (oldDate < startDateNumber) {
      continue;
    }

    resultList.push(old);
  }

  return resultList;
}


/* =========================================================
   ANALİZ
========================================================= */

function analyze(match) {

  const cacheKey =
    String(match.code || '') +
    '_' +
    String(match.date || '');

  if (
    state.analysisCache.has(cacheKey)
  ) {
    return state.analysisCache.get(
      cacheKey
    );
  }


  const list = [];


  for (const source of SOURCES) {

    const currentOdd =
      getOdd(
        match,
        source.key
      );

    if (currentOdd === null) {
      continue;
    }


    /* SADECE SON 30 GÜN */

    const same =
      getHistory(
        match.date,
        source.key,
        currentOdd
      );


    if (same.length < MIN_SAMPLE) {
      continue;
    }


    for (const target of TARGETS) {

      let success = 0;
      let total = 0;


      for (const old of same) {

        const r =
          result(
            old,
            target.key
          );

        if (r === null) {
          continue;
        }

        total++;

        if (r === true) {
          success++;
        }
      }


      if (total < MIN_SAMPLE) {
        continue;
      }


      const percent =
        (success / total) * 100;


      if (
        percent >= MIN_SUCCESS
      ) {

        list.push({

          source: source.name,

          sourceKey: source.key,

          target: target.name,

          targetKey: target.key,

          odd: currentOdd,

          success,

          total,

          percent
        });
      }
    }
  }


  list.sort((a, b) => {

    if (
      b.percent !== a.percent
    ) {
      return (
        b.percent -
        a.percent
      );
    }

    if (
      b.total !== a.total
    ) {
      return (
        b.total -
        a.total
      );
    }

    return (
      b.success -
      a.success
    );
  });


  const data = {

    list,

    best:
      list.length
        ? list[0]
        : null
  };


  state.analysisCache.set(
    cacheKey,
    data
  );


  return data;
}


/* =========================================================
   ÖNERİNİN DURUMU
========================================================= */

function statusOf(
  match,
  analysis
) {

  if (!analysis.best) {
    return 'pending';
  }

  const r =
    result(
      match,
      analysis.best.targetKey
    );

  if (r === true) {
    return 'success';
  }

  if (r === false) {
    return 'fail';
  }

  return 'pending';
}


/* =========================================================
   GÜN İSTATİSTİĞİ
========================================================= */

function dayStats(date) {

  let success = 0;
  let fail = 0;

  const matches =
    state.matchesByDate.get(
      date
    ) || [];


  for (const match of matches) {

    const analysis =
      analyze(match);

    if (!analysis.best) {
      continue;
    }

    const r =
      result(
        match,
        analysis.best.targetKey
      );


    if (r === true) {
      success++;
    }

    if (r === false) {
      fail++;
    }
  }


  const total =
    success + fail;


  return {

    success,

    fail,

    total,

    percent:
      total
        ? (
            success /
            total *
            100
          )
        : null
  };
}


/* =========================================================
   SON 30 GÜN GENEL İSTATİSTİĞİ
========================================================= */

function allStats() {

  let success = 0;
  let fail = 0;


  const now =
    dateNumber(today());


  const minDate =
    dateNumber(
      timestampToDate(
        Date.now() -
        (
          HISTORY_DAYS *
          24 *
          60 *
          60 *
          1000
        )
