<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Maçkolik - Açılış Oran Analizi</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#070d1b;
    color:#eef3ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
}

button,
select{
    font:inherit;
}

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:12px;
}

/* HEADER */

.header{
    padding:8px 4px 14px;
}

.header h1{
    margin:0;
    font-size:23px;
    font-weight:800;
}

.header p{
    margin:5px 0 0;
    color:#8d9bb4;
    font-size:13px;
}

/* CONTROLS */

.controls{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.controls select{
    flex:1;
    min-width:0;
    height:44px;
    border:1px solid #263955;
    border-radius:12px;
    background:#101b2e;
    color:#edf3ff;
    padding:0 12px;
    outline:none;
}

.controls button{
    height:44px;
    padding:0 16px;
    border:0;
    border-radius:12px;
    background:#1769e8;
    color:white;
    font-weight:800;
}

/* INFO */

.info{
    margin-bottom:12px;
    color:#8c9ab2;
    font-size:12px;
    line-height:1.55;
}

.info strong{
    color:#b9c7dd;
}

/* GÜNÜN BAŞARISI */

.today-success-box{
    background:#0c1728;
    border:1px solid #263b58;
    border-radius:16px;
    padding:14px;
    margin-bottom:12px;
    text-align:center;
}

.today-success-title{
    color:#8b9ab2;
    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;
}

.today-success-percent{
    color:#8ff04d;
    font-size:29px;
    font-weight:900;
    margin-top:3px;
}

.today-success-detail{
    color:#8c9bb2;
    font-size:12px;
    margin-top:2px;
}

/* MATCH CARD */

.match-card{
    background:#0c1424;
    border:1px solid #1d304b;
    border-radius:18px;
    margin-bottom:10px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
}

/* MATCH MAIN */

.match-main{
    min-height:108px;
    display:grid;
    grid-template-columns:92px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    padding:14px 14px 14px 10px;
}

/* PLUS */

.expand-btn{
    width:58px;
    height:58px;
    border-radius:16px;
    border:2px solid #294463;
    background:#111e32;
    color:#9eb4d1;
    font-size:32px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.15s;
}

.expand-btn.open{
    background:#176bea;
    border-color:#176bea;
    color:white;
}

/* MATCH INFO */

.match-info{
    min-width:0;
}

.match-meta{
    color:#8998b0;
    font-size:13px;
    margin-bottom:7px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.match-meta .time{
    color:#9baac1;
}

.match-teams{
    font-size:17px;
    font-weight:800;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.match-teams .dash{
    color:#667894;
    margin:0 4px;
}

.score{
    margin-top:6px;
    color:#00e7d3;
    font-size:15px;
    font-weight:900;
}

/* ANA ÖNERİ */

.main-prediction{
    min-width:135px;
    max-width:190px;
    text-align:center;
}

.prediction-empty{
    color:#61728d;
    font-size:11px;
}

.prediction-box{
    border:2px solid #3b8e13;
    background:#123b08;
    border-radius:12px;
    padding:8px 10px;
}

.prediction-label{
    color:#8eee4d;
    font-size:13px;
    font-weight:800;
    line-height:1.2;
}

.prediction-percent{
    color:#8ff04d;
    font-size:20px;
    font-weight:900;
    margin-top:2px;
}

/* DURUM */

.today-match-status{
    display:inline-block;
    margin-bottom:5px;
    padding:3px 7px;
    border-radius:7px;
    font-size:10px;
    font-weight:800;
}

.status-success{
    background:#123d0b;
    color:#8ff04d;
    border:1px solid #347c19;
}

.status-fail{
    background:#421016;
    color:#ff7885;
    border:1px solid #8c2734;
}

.status-pending{
    background:#392e08;
    color:#ffd45a;
    border:1px solid #6e5a15;
}

/* DETAY */

.match-details{
    display:none;
    border-top:1px solid #1b2c44;
    padding:12px;
    background:#091221;
}

.match-details.open{
    display:block;
}

.detail-description{
    color:#8d9bb3;
    font-size:12px;
    line-height:1.5;
    margin:0 2px 10px;
}

/* ÖNERİ */

.suggestion{
    background:#0c1728;
    border:1px solid #223753;
    border-radius:15px;
    padding:12px;
    margin-bottom:9px;
}

.suggestion:last-child{
    margin-bottom:0;
}

.suggestion-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
}

.suggestion-market{
    min-width:0;
    font-size:15px;
    font-weight:800;
    color:#edf3ff;
}

.suggestion-market span{
    color:#55e1d3;
    margin-left:5px;
}

.suggestion-sample{
    flex:none;
    color:#8190a8;
    font-size:12px;
}

.suggestion-result{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.result-box{
    min-width:150px;
    border:2px solid #56b918;
    background:#123c08;
    border-radius:13px;
    padding:9px 12px;
    text-align:center;
}

.result-name{
    color:#8ff04d;
    font-size:14px;
    font-weight:800;
}

.result-percent{
    color:#91f64f;
    font-size:25px;
    font-weight:900;
    line-height:1.05;
    margin-top:2px;
}

.result-count{
    color:#a2afc1;
    font-size:11px;
    margin-top:4px;
}

.all-results{
    flex:1;
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:5px;
}

.result-chip{
    border:1px solid #2b405e;
    background:#111d30;
    border-radius:9px;
    padding:6px 8px;
    font-size:11px;
    color:#b8c6da;
}

.result-chip strong{
    color:#7ee847;
    margin-left:3px;
}

.result-chip.result-success{
    border-color:#347c19;
    background:#102b0b;
}

.odds-source{
    color:#70819a;
    font-size:10px;
    margin-top:9px;
}

/* BOŞ */

.empty{
    border:1px solid #21344f;
    background:#0c1525;
    border-radius:16px;
    padding:25px 15px;
    text-align:center;
    color:#7f8da5;
    font-size:13px;
}

/* LOADING */

.loading{
    padding:30px;
    text-align:center;
    color:#8090aa;
}

/* MASAÜSTÜ */

@media(min-width:701px){

    .container{
        padding:20px;
    }

    .match-main{
        grid-template-columns:95px minmax(0,1fr) 175px;
        min-height:118px;
    }

    .match-teams{
        font-size:19px;
    }

    .prediction-box{
        padding:10px 14px;
    }
}

/* MOBİL */

@media(max-width:600px){

    .container{
        padding:8px;
    }

    .header h1{
        font-size:21px;
    }

    .match-main{
        grid-template-columns:54px minmax(0,1fr) auto;
        gap:8px;
        padding:11px 8px;
        min-height:100px;
    }

    .expand-btn{
        width:48px;
        height:48px;
        border-radius:14px;
        font-size:28px;
    }

    .match-teams{
        font-size:15px;
    }

    .match-meta{
        font-size:11px;
        margin-bottom:5px;
    }

    .main-prediction{
        min-width:108px;
        max-width:125px;
    }

    .prediction-box{
        padding:7px 5px;
        border-radius:10px;
    }

    .prediction-label{
        font-size:11px;
    }

    .prediction-percent{
        font-size:17px;
    }

    .suggestion{
        padding:10px;
    }

    .suggestion-head{
        align-items:flex-start;
    }

    .suggestion-market{
        font-size:13px;
    }

    .suggestion-result{
        display:block;
    }

    .result-box{
        width:100%;
        min-width:0;
    }

    .all-results{
        justify-content:flex-start;
        margin-top:8px;
    }
}

@media(max-width:390px){

    .match-main{
        grid-template-columns:48px minmax(0,1fr) 101px;
    }

    .expand-btn{
        width:44px;
        height:44px;
    }

    .match-teams{
        font-size:14px;
    }

    .main-prediction{
        min-width:101px;
        max-width:105px;
    }

    .prediction-label{
        font-size:10px;
    }

    .prediction-percent{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⚽ Maçkolik</h1>
        <p>Açılış oranlarından geçmiş sonuç analizi</p>
    </div>

    <div class="controls">

        <select id="dateSelect">
            <option value="">Veriler yükleniyor...</option>
        </select>

        <button id="showBtn">
            Göster
        </button>

    </div>

    <div class="info" id="info">
        Veriler yükleniyor...
    </div>

    <div id="todaySuccessBox"></div>

    <div id="matches">
        <div class="loading">
            Maçlar yükleniyor...
        </div>
    </div>

</div>

<script>

"use strict";

/* =========================================================
   AYARLAR
========================================================= */

const DATA_URL = "./data/matches.json";

/* Minimum başarı */
const MIN_SUCCESS = 70;

/* Minimum geçmiş maç */
const MIN_SAMPLE = 5;

/*
   TOLERANS YOK.

   3.30 sadece 3.30 ile eşleşir.
   3.31 ile eşleşmez.
*/
const ODDS_DECIMALS = 2;


/* =========================================================
   GLOBAL
========================================================= */

let allMatches = [];

let selectedDate = "";

const openCards = new Set();


/* =========================================================
   KAYNAK ORANLAR

   ÇŞ TAMAMEN KALDIRILDI.
========================================================= */

const SOURCE_MARKETS = [

    {
        key:"ms1",
        label:"MS1 / Ev Sahibi"
    },

    {
        key:"msX",
        label:"MS0 / Beraberlik"
    },

    {
        key:"ms2",
        label:"MS2 / Deplasman"
    },

    {
        key:"kgVar",
        label:"KG Var"
    },

    {
        key:"kgYok",
        label:"KG Yok"
    },

    {
        key:"au15Ust",
        label:"MS 1,5 Üst"
    },

    {
        key:"au15Alt",
        label:"MS 1,5 Alt"
    },

    {
        key:"au25Ust",
        label:"MS 2,5 Üst"
    },

    {
        key:"au25Alt",
        label:"MS 2,5 Alt"
    },

    {
        key:"au35Ust",
        label:"MS 3,5 Üst"
    },

    {
        key:"au35Alt",
        label:"MS 3,5 Alt"
    },

    {
        key:"iy15Ust",
        label:"İY 1,5 Üst"
    },

    {
        key:"iy15Alt",
        label:"İY 1,5 Alt"
    },

    {
        key:"iy1",
        label:"İY1"
    },

    {
        key:"iyX",
        label:"İYX"
    },

    {
        key:"iy2",
        label:"İY2"
    }

];


/* =========================================================
   HEDEF SONUÇLAR

   ÇŞ SONUÇLARI YOK.

   İY 0.5 ÜST / ALT BURADA.
========================================================= */

const TARGET_RESULTS = [

    {
        key:"ms1",
        label:"MS1"
    },

    {
        key:"msX",
        label:"MS0 / Beraberlik"
    },

    {
        key:"ms2",
        label:"MS2"
    },

    {
        key:"kgVar",
        label:"KG Var"
    },

    {
        key:"kgYok",
        label:"KG Yok"
    },

    {
        key:"over15",
        label:"MS 1,5 Üst"
    },

    {
        key:"under15",
        label:"MS 1,5 Alt"
    },

    {
        key:"over25",
        label:"MS 2,5 Üst"
    },

    {
        key:"under25",
        label:"MS 2,5 Alt"
    },

    {
        key:"over35",
        label:"MS 3,5 Üst"
    },

    {
        key:"under35",
        label:"MS 3,5 Alt"
    },

    {
        key:"iyOver05",
        label:"İY 0,5 Üst"
    },

    {
        key:"iyUnder05",
        label:"İY 0,5 Alt"
    },

    {
        key:"iyOver15",
        label:"İY 1,5 Üst"
    },

    {
        key:"iyUnder15",
        label:"İY 1,5 Alt"
    },

    {
        key:"iy1",
        label:"İY1"
    },

    {
        key:"iyX",
        label:"İYX"
    },

    {
        key:"iy2",
        label:"İY2"
    }

];


/* =========================================================
   VERİYİ YÜKLE
========================================================= */

async function loadData(){

    try{

        const response =
            await fetch(
                DATA_URL + "?v=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "matches.json okunamadı."
            );

        }

        const data =
            await response.json();


        if(
            data &&
            Array.isArray(data.matches)
        ){

            allMatches =
                data.matches;

        }
        else if(
            Array.isArray(data)
        ){

            allMatches =
                data;

        }
        else{

            throw new Error(
                "Maç verisi bulunamadı."
            );

        }


        /*
           Günün Maçları scriptinin
           kullandığı global veri.
        */

        window.DATA = allMatches;

        window.matches = allMatches;


        createDates();

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "matches"
        ).innerHTML = `
            <div class="empty">
                Veri yüklenemedi.<br><br>
                ${esc(error.message)}
            </div>
        `;

        document.getElementById(
            "info"
        ).textContent =
            "Veri yüklenemedi.";

    }

}


/* =========================================================
   TARİHLER
========================================================= */

function createDates(){

    const dates =
        [
            ...new Set(
                allMatches
                    .map(
                        m => m.date
                    )
                    .filter(Boolean)
            )
        ];


    dates.sort(sortDate);


    const select =
        document.getElementById(
            "dateSelect"
        );


    select.innerHTML = "";


    dates.forEach(
        date => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = date;

            option.textContent = date;

            select.appendChild(
                option
            );

        }
    );


    const today =
        todayTR();


    /*
       Bugün varsa bugün.
    */

    if(
        dates.includes(today)
    ){

        selectedDate =
            today;

    }
    else if(
        dates.length
    ){

        selectedDate =
            dates[
                dates.length - 1
            ];

    }


    select.value =
        selectedDate;


    showSelectedDate();

}


/* =========================================================
   BUGÜN
========================================================= */

function todayTR(){

    const now =
        new Date();


    const d =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const m =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const y =
        now.getFullYear();


    return `${d}.${m}.${y}`;

}


/* =========================================================
   TARİHİ GÖSTER
========================================================= */

function showSelectedDate(){

    selectedDate =
        document.getElementById(
            "dateSelect"
        ).value;


    const selected =
        allMatches
            .filter(
                m =>
                    m.date ===
                    selectedDate
            )
            .sort(
                (a,b) =>
                    String(
                        a.time || ""
                    ).localeCompare(
                        String(
                            b.time || ""
                        )
                    )
            );


    document.getElementById(
        "info"
    ).innerHTML = `
        <strong>${esc(selectedDate)}</strong>
        · ${selected.length} maç
        · minimum başarı %${MIN_SUCCESS}
        · minimum ${MIN_SAMPLE} geçmiş maç
        · açılış oranları
    `;


    renderDailySuccess(
        selected
    );


    if(!selected.length){

        document.getElementById(
            "matches"
        ).innerHTML = `
            <div class="empty">
                Bu tarihte maç bulunamadı.
            </div>
        `;

        return;

    }


    document.getElementById(
        "matches"
    ).innerHTML =
        selected
            .map(
                match =>
                    createMatch(
                        match
                    )
            )
            .join("");

}


/* =========================================================
   GÜNÜN MAÇLARI BAŞARI HESABI

   Yukarıdaki verdiğin script mantığı:

   - öneri var
   - skor var
   - önerinin sonucu hesaplanabiliyor
   - başarılı / başarısız
========================================================= */

function renderDailySuccess(
    list
){

    let total = 0;

    let success = 0;


    list.forEach(
        match => {

            const suggestions =
                analyzeMatch(
                    match
                );


            if(!suggestions.length){

                return;

            }


            const best =
                suggestions[0];


            const score =
                getValidScore(
                    match
                );


            /*
               Maç henüz sonuçlanmadıysa
               başarı hesabına dahil etme.
            */

            if(!score){

                return;

            }


            const result =
                checkPrediction(
                    match,
                    best.best.target.key
                );


            if(result === null){

                return;

            }


            total++;


            if(result === true){

                success++;

            }

        }
    );


    const percentage =
        total
            ? (success / total) * 100
            : 0;


    const box =
        document.getElementById(
            "todaySuccessBox"
        );


    box.innerHTML = `

        <div class="today-success-box">

            <div class="today-success-title">
                BUGÜNÜN GENEL BAŞARISI
            </div>

            <div class="today-success-percent">
                ${
                    total
                        ? "%" +
                          percentage.toFixed(1)
                        : "--"
                }
            </div>

            <div class="today-success-detail">

                ${
                    total
                        ? `${success} / ${total} öneri tuttu`
                        : "Henüz sonuçlanan öneri yok"
                }

            </div>

        </div>

    `;

}


/* =========================================================
   MAÇ KARTI
========================================================= */

function createMatch(
    match
){

    const suggestions =
        analyzeMatch(
            match
        );


    const best =
        suggestions.length
            ? suggestions[0]
            : null;


    const id =
        String(
            match.code ||
            match.id ||
            Math.random()
        );


    const expanded =
        openCards.has(id);


    const status =
        getMatchStatus(
            match,
            best
        );


    return `

        <div
            class="match-card"
            data-id="${esc(id)}"
        >

            <div class="match-main">

                <button
                    class="expand-btn ${expanded ? "open" : ""}"
                    onclick="toggleMatch('${esc(id)}')"
                    aria-label="Detay"
                >
                    ${expanded ? "−" : "+"}
                </button>


                <div class="match-info">

                    <div class="match-meta">

                        <span class="time">
                            ${esc(
                                match.time ||
                                "--:--"
                            )}
                        </span>

                        ·

                        ${esc(
                            match.league ||
                            "LİG"
                        )}

                    </div>


                    ${
                        status
                            ?
                            `
                            <div class="today-match-status ${status.className}">
                                ${status.icon}
                                ${status.text}
                            </div>
                            `
                            :
                            ""
                    }


                    <div class="match-teams">

                        ${esc(
                            match.home ||
                            "-"
                        )}

                        <span class="dash">
                            -
                        </span>

                        ${esc(
                            match.away ||
                            "-"
                        )}

                    </div>


                    ${
                        hasFinishedScore(
                            match
                        )
                        ?
                        `
                        <div class="score">

                            ${esc(
                                match.score.home
                            )}

                            -

                            ${esc(
                                match.score.away
                            )}

                        </div>
                        `
                        :
                        ""
                    }

                </div>


                <div class="main-prediction">

                    ${
                        best
                        ?
                        `
                        <div class="prediction-box">

                            <div class="prediction-label">

                                ${esc(
                                    best.best.target.label
                                )}

                            </div>

                            <div class="prediction-percent">

                                %${best.best.percent}

                            </div>

                        </div>
                        `
                        :
                        `
                        <div class="prediction-empty">

                            %70+ öneri yok

                        </div>
                        `
                    }

                </div>

            </div>


            <div
                id="detail-${esc(id)}"
                class="match-details ${expanded ? "open" : ""}"
            >

                ${
                    suggestions.length
                    ?
                    `

                    <div class="detail-description">

                        Her açılış oranı ayrı
                        değerlendirilir.
                        Aynı oranla oynanan
                        geçmiş maçların sonuçları
                        hesaplanır.

                        Yalnızca %${MIN_SUCCESS}
                        ve üzerindeki sonuçlar
                        gösterilir.

                    </div>


                    ${

                        suggestions
                            .map(
                                item =>
                                    createSuggestion(
                                        item,
                                        match
                                    )
                            )
                            .join("")

                    }

                    `
                    :
                    `

                    <div class="empty">

                        Bu maç için minimum
                        ${MIN_SAMPLE} örnek ve
                        %${MIN_SUCCESS} başarı
                        şartını karşılayan
                        öneri bulunamadı.

                    </div>

                    `
                }

            </div>

        </div>

    `;

}


/* =========================================================
   MAÇ DURUMU

   GÜNÜN MAÇLARI SCRIPTİ
========================================================= */

function getMatchStatus(
    match,
    best
){

    /*
       Öneri yok.
    */

    if(!best){

        return null;

    }


    /*
       Skor yoksa bekliyor.
    */

    const score =
        getValidScore(
            match
        );


    if(!score){

        return {
            className:"status-pending",
            icon:"🟡",
            text:"Bekliyor"
        };

    }


    const result =
        checkPrediction(
            match,
            best.best.target.key
        );


    if(result === true){

        return {
            className:"status-success",
            icon:"🟢",
            text:"Başarılı"
        };

    }


    if(result === false){

        return {
            className:"status-fail",
            icon:"🔴",
            text:"Başarısız"
        };

    }


    return {
        className:"status-pending",
        icon:"🟡",
        text:"Bekliyor"
    };

}


/* =========================================================
   TAHMİN SONUCU KONTROLÜ
========================================================= */

function checkPrediction(
    match,
    target
){

    return calculateTarget(
        match,
        target
    );

}


/* =========================================================
   MAÇI AÇ / KAPAT
========================================================= */

function toggleMatch(
    id
){

    if(
        openCards.has(id)
    ){

        openCards.delete(id);

    }
    else{

        openCards.add(id);

    }


    showSelectedDate();

}


/* =========================================================
   ÖNERİ KARTI
========================================================= */

function createSuggestion(
    item,
    currentMatch
){

    const topResults =
        item.results
            .slice(0,5);


    return `

        <div class="suggestion">

            <div class="suggestion-head">

                <div class="suggestion-market">

                    + ${esc(
                        item.source.label
                    )}

                    <span>

                        ${formatOdd(
                            item.odd
                        )}

                    </span>

                </div>


                <div class="suggestion-sample">

                    ${item.sample}
                    maç

                </div>

            </div>


            <div class="suggestion-result">

                <div class="result-box">

                    <div class="result-name">

                        ${esc(
                            item.best.target.label
                        )}

                    </div>

                    <div class="result-percent">

                        %${item.best.percent}

                    </div>

                    <div class="result-count">

                        ${item.best.hits}/${item.best.total}

                    </div>

                </div>


                <div class="all-results">

                    ${
                        topResults
                            .map(
                                result => {

                                    const currentResult =
                                        calculateTarget(
                                            currentMatch,
                                            result.target.key
                                        );

                                    const successClass =
                                        currentResult === true
                                            ? "result-success"
                                            : "";

                                    return `

                                        <div class="result-chip ${successClass}">

                                            ${esc(
                                                result.target.label
                                            )}

                                            <strong>
                                                %${result.percent}
                                            </strong>

                                        </div>

                                    `;

                                }
                            )
                            .join("")
                    }

                </div>

            </div>


            <div class="odds-source">

                Açılış oranı:
                ${formatOdd(item.odd)}

                · birebir oran eşleşmesi

            </div>

        </div>

    `;

}


/* =========================================================
   ANA ANALİZ
========================================================= */

function analyzeMatch(
    current
){

    const history =
        getHistory(
            current.date
        );


    if(!history.length){

        return [];

    }


    const sourceResults = [];


    /*
       BÜTÜN KAYNAK ORANLARINI TEST ET
    */

    for(
        const source
        of SOURCE_MARKETS
    ){

        const odd =
            getOdd(
                current,
                source.key
            );


        if(odd === null){

            continue;

        }


        /*
           TOLERANS YOK.

           Örneğin mevcut:

           3.30

           geçmişte sadece:

           3.30

           aranır.
        */

        const same =
            history.filter(
                oldMatch => {

                    const oldOdd =
                        getOdd(
                            oldMatch,
                            source.key
                        );


                    if(
                        oldOdd === null
                    ){

                        return false;

                    }


                    return oddsEqual(
                        oldOdd,
                        odd
                    );

                }
            );


        if(
            same.length <
            MIN_SAMPLE
        ){

            continue;

        }


        const results = [];


        /*
           HER HEDEF SONUCU HESAPLA
        */

        for(
            const target
            of TARGET_RESULTS
        ){

            let hits = 0;

            let total = 0;


            same.forEach(
                oldMatch => {

                    const result =
                        calculateTarget(
                            oldMatch,
                            target.key
                        );


                    /*
                       Örneğin eski maçta
                       ilk yarı skoru yoksa
                       İY sonucu sayılmaz.
                    */

                    if(
                        result === null
                    ){

                        return;

                    }


                    total++;


                    if(
                        result === true
                    ){

                        hits++;

                    }

                }
            );


            if(
                total <
                MIN_SAMPLE
            ){

                continue;

            }


            const pct =
                (
                    hits /
                    total
                ) *
                100;


            if(
                pct <
                MIN_SUCCESS
            ){

                continue;

            }


            results.push({

                target:target,

                hits:hits,

                total:total,

                percent:Number(
                    pct.toFixed(1)
                )

            });

        }


        if(
            !results.length
        ){

            continue;

        }


        /*
           En yüksek başarı
           önce.
        */

        results.sort(
            (a,b) =>
                b.percent -
                a.percent
                ||
                b.total -
                a.total
        );


        sourceResults.push({

            source:source,

            odd:odd,

            sample:same.length,

            results:results,

            best:results[0]

        });

    }


    /*
       BÜTÜN KAYNAKLAR ARASINDAN
       EN GÜÇLÜ ÖNERİYİ BUL.
    */

    sourceResults.sort(
        (a,b) =>
            b.best.percent -
            a.best.percent
            ||
            b.best.total -
            a.best.total
            ||
            b.sample -
            a.sample
    );


    return sourceResults;

}


/* =========================================================
   HEDEF SONUÇ HESAPLAMA
========================================================= */

function calculateTarget(
    match,
    target
){

    const score =
        getValidScore(
            match
        );


    /*
       MS1
    */

    if(
        target === "ms1"
    ){

        if(!score){

            return null;

        }

        return (
            score.home >
            score.away
        );

    }


    /*
       MS X
    */

    if(
        target === "msX"
    ){

        if(!score){

            return null;

        }

        return (
            score.home ===
            score.away
        );

    }


    /*
       MS2
    */

    if(
        target === "ms2"
    ){

        if(!score){

            return null;

        }

        return (
            score.home <
            score.away
        );

    }


    /*
       KG VAR
    */

    if(
        target === "kgVar"
    ){

        if(!score){

            return null;

        }

        return (
            score.home > 0 &&
            score.away > 0
        );

    }


    /*
       KG YOK
    */

    if(
        target === "kgYok"
    ){

        if(!score){

            return null;

        }

        return (
            score.home === 0 ||
            score.away === 0
        );

    }


    /*
       TOPLAM GOL
    */

    const totalGoals =
        score
            ? score.home + score.away
            : null;


    if(
        target === "over15"
    ){

        if(
            totalGoals === null
        ){

            return null;

        }

        return totalGoals >= 2;

    }


    if(
        target === "under15"
    ){

        if(
            totalGoals === null
        ){

            return null;

        }

        return totalGoals <= 1;

    }


    if(
        target === "over25"
    ){

        if(
            totalGoals === null
        ){

            return null;

        }

        return totalGoals >= 3;

    }


    if(
        target === "under25"
    ){

        if(
            totalGoals === null
        ){

            return null;

        }

        return totalGoals <= 2;

    }


    if(
        target === "over35"
    ){

        if(
            totalGoals === null
        ){

            return null;

        }

        return totalGoals >= 4;

    }


    if(
        target === "under35"
    ){

        if(
            totalGoals === null
        ){

            return null;

        }

        return totalGoals <= 3;

    }


    /*
       İLK YARI SKORU

       SADECE halfTimeScore
       kullanılır.
    */

    const half =
        getValidHalfScore(
            match
        );


    /*
       İY sonucu için
       ilk yarı skoru yoksa
       sonuç hesaplanmaz.
    */

    if(
        target === "iyOver05"
    ){

        if(!half){

            return null;

        }

        return (
            half.home +
            half.away >= 1
        );

    }


    if(
        target === "iyUnder05"
    ){

        if(!half){

            return null;

        }

        return (
            half.home +
            half.away === 0
        );

    }


    /*
       İY 1.5 ÜST / ALT
    */

    if(
        target === "iyOver15"
    ){

        if(!half){

            return null;

        }

        return (
            half.home +
            half.away >= 2
        );

    }


    if(
        target === "iyUnder15"
    ){

        if(!half){

            return null;

        }

        return (
            half.home +
            half.away <= 1
        );

    }


    /*
       İY1
    */

    if(
        target === "iy1"
    ){

        if(!half){

            return null;

        }

        return (
            half.home >
            half.away
        );

    }


    /*
       İYX
    */

    if(
        target === "iyX"
    ){

        if(!half){

            return null;

        }

        return (
            half.home ===
            half.away
        );

    }


    /*
       İY2
    */

    if(
        target === "iy2"
    ){

        if(!half){

            return null;

        }

        return (
            half.home <
            half.away
        );

    }


    return null;

}


/* =========================================================
   GEÇMİŞ MAÇLAR
========================================================= */

function getHistory(
    date
){

    const current =
        parseDate(
            date
        );


    if(!current){

        return [];

    }


    return allMatches.filter(
        match => {

            const matchDate =
                parseDate(
                    match.date
                );


            if(!matchDate){

                return false;

            }


            /*
               Bugün ve gelecek
               geçmiş analizine girmez.
            */

            if(
                matchDate >= current
            ){

                return false;

            }


            /*
               Geçerli tam skor
               şartı.
            */

            if(
                !getValidScore(
                    match
                )
            ){

                return false;

            }


            return true;

        }
    );

}


/* =========================================================
   GEÇERLİ TAM SKOR
========================================================= */

function getValidScore(
    match
){

    if(
        !match ||
        !match.score
    ){

        return null;

    }


    /*
       Mackolik'te oynanmamış maçların
       bazı kayıtlarında 0-0 bulunabilir.

       Bu yüzden status 0/1 ise
       skor geçerli kabul edilmez.
    */

    const status =
        String(
            match.status ??
            ""
        );


    if(
        status === "0" ||
        status === "1"
    ){

        return null;

    }


    const home =
        Number(
            match.score.home
        );

    const away =
        Number(
            match.score.away
        );


    if(
        !Number.isFinite(home) ||
        !Number.isFinite(away) ||
        home < 0 ||
        away < 0
    ){

        return null;

    }


    return {
        home:home,
        away:away
    };

}


/* =========================================================
   GEÇERLİ İLK YARI SKORU
========================================================= */

function getValidHalfScore(
    match
){

    if(
        !match ||
        !match.halfTimeScore
    ){

        return null;

    }


    const home =
        Number(
            match.halfTimeScore.home
        );

    const away =
        Number(
            match.halfTimeScore.away
        );


    if(
        !Number.isFinite(home) ||
        !Number.isFinite(away) ||
        home < 0 ||
        away < 0
    ){

        return null;

    }


    /*
       İlk yarı skorunun
       0-0 olması geçerli olabilir.

       Önemli olan maçın
       ilk yarı skorunun gerçekten
       bulunmasıdır.
    */

    return {
        home:home,
        away:away
    };

}


/* =========================================================
   BİTMİŞ SKOR
========================================================= */

function hasFinishedScore(
    match
){

    return !!getValidScore(
        match
    );

}


/* =========================================================
   ORAN AL
========================================================= */

function getOdd(
    match,
    key
){

    if(
        !match ||
        !match.openingOdds
    ){

        return null;

    }


    const value =
        Number(
            match.openingOdds[key]
        );


    if(
        !Number.isFinite(value) ||
        value <= 0
    ){

        return null;

    }


    return value;

}


/* =========================================================
   ORAN EŞİTLİĞİ

   TOLERANS YOK.

   3.3 = 3.30
   1.7 = 1.70

   Fakat:

   3.30 != 3.31
========================================================= */

function oddsEqual(
    a,
    b
){

    if(
        a === null ||
        b === null
    ){

        return false;

    }


    return (
        Number(a).toFixed(
            ODDS_DECIMALS
        )
        ===
        Number(b).toFixed(
            ODDS_DECIMALS
        )
    );

}


/* =========================================================
   ORAN GÖSTER
========================================================= */

function formatOdd(
    value
){

    if(
        value === null ||
        value === undefined ||
        Number(value) <= 0
    ){

        return "-";

    }


    return Number(value)
        .toFixed(2);

}


/* =========================================================
   TARİH
========================================================= */

function parseDate(
    date
){

    if(!date){

        return null;

    }


    const parts =
        String(date)
            .split(".");


    if(
        parts.length !== 3
    ){

        return null;

    }


    const day =
        Number(
            parts[0]
        );

    const month =
        Number(
            parts[1]
        ) - 1;

    const year =
        Number(
            parts[2]
        );


    const result =
        new Date(
            year,
            month,
            day
        );


    if(
        Number.isNaN(
            result.getTime()
        )
    ){

        return null;

    }


    return result;

}


/* =========================================================
   TARİH SIRALA
========================================================= */

function sortDate(
    a,
    b
){

    const da =
        parseDate(a);

    const db =
        parseDate(b);


    return da - db;

}


/* =========================================================
   HTML GÜVENLİK
========================================================= */

function esc(
    value
){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}
