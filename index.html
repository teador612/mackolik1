<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Maçkolik - Bugünün Maçları</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f5f8;
    color:#172033;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    background:#ffffff;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:6px 0 0;
    color:#7b8494;
    font-size:13px;
}


/* TARİH */

.date-box{
    background:#ffffff;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.date-row{
    display:flex;
    gap:10px;
}

select{
    flex:1;
    height:45px;
    border:1px solid #d9dee7;
    border-radius:9px;
    background:#fff;
    padding:0 12px;
    font-size:14px;
    color:#172033;
}

button{
    height:45px;
    padding:0 18px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}


/* BAŞLIK */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 2px 10px;
}

.section-title h2{
    margin:0;
    font-size:19px;
}

.section-count{
    color:#7b8494;
    font-size:13px;
}


/* MAÇ KARTI */

.match-card{
    background:white;
    border-radius:15px;
    margin-bottom:15px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.match-top{
    padding:11px 14px;
    background:#fafbfc;
    border-bottom:1px solid #edf0f4;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.league{
    font-size:12px;
    font-weight:bold;
    color:#4b5563;
}

.time{
    font-size:13px;
    font-weight:bold;
    color:#2563eb;
}


/* TAKIMLAR */

.teams{
    display:grid;
    grid-template-columns:1fr 90px 1fr;
    align-items:center;
    padding:18px 15px;
}

.team{
    font-size:16px;
    font-weight:bold;
}

.home{
    text-align:right;
}

.away{
    text-align:left;
}

.score{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#111827;
}


/* ORANLAR */

.odds{
    padding:0 14px 15px;
}

.odds-title{
    font-size:12px;
    color:#8a93a2;
    margin-bottom:8px;
}

.odds-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.odd-box{
    background:#f6f8fa;
    border:1px solid #e7ebf0;
    border-radius:8px;
    padding:7px 4px;
    text-align:center;
}

.odd-name{
    font-size:10px;
    color:#7b8494;
    margin-bottom:3px;
}

.odd-value{
    font-size:13px;
    font-weight:bold;
}


/* ANALİZ */

.analysis{
    border-top:1px solid #edf0f4;
    padding:14px;
}

.analysis-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:12px;
}

.analysis-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.analysis-card{
    border:1px solid #e5e9ef;
    border-radius:10px;
    overflow:hidden;
}

.analysis-head{
    padding:9px 10px;
    background:#f8fafc;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.analysis-name{
    font-size:12px;
    font-weight:bold;
}

.analysis-odd{
    font-size:13px;
    font-weight:bold;
    color:#2563eb;
}

.analysis-body{
    padding:9px 10px;
}

.matches{
    font-size:10px;
    color:#8a93a2;
    margin-bottom:7px;
}

.result-row{
    display:flex;
    justify-content:space-between;
    padding:4px 0;
    border-bottom:1px solid #f0f2f5;
    font-size:11px;
}

.result-row:last-child{
    border-bottom:0;
}

.result-label{
    font-weight:bold;
}

.green{
    color:#16a34a;
}

.yellow{
    color:#ca8a04;
}

.red{
    color:#dc2626;
}

.gray{
    color:#9ca3af;
}

.no-data{
    padding:12px 10px;
    color:#9ca3af;
    font-size:11px;
}


/* DURUM */

.status{
    background:white;
    border-radius:10px;
    padding:11px 13px;
    margin-bottom:15px;
    color:#6b7280;
    font-size:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}


/* MOBİL */

@media(max-width:700px){

    .container{
        padding:9px;
    }

    .date-row{
        flex-direction:column;
    }

    .date-row button{
        width:100%;
    }

    .teams{
        grid-template-columns:1fr 65px 1fr;
    }

    .team{
        font-size:14px;
    }

    .score{
        font-size:18px;
    }

    .odds-grid{
        grid-template-columns:repeat(5,1fr);
    }

    .analysis-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:430px){

    .analysis-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div class="container">


    <div class="header">

        <h1>⚽ Maçkolik</h1>

        <p>
            Bugünün maçları ve geçmiş oran istatistikleri
        </p>

    </div>


    <div class="date-box">

        <div class="date-row">

            <select id="dateSelect">
                <option value="">
                    Tarih yükleniyor...
                </option>
            </select>

            <button onclick="showSelectedDate()">
                Göster
            </button>

        </div>

    </div>


    <div id="status" class="status">
        Veriler yükleniyor...
    </div>


    <div class="section-title">

        <h2 id="title">
            Bugünün Maçları
        </h2>

        <div
            id="count"
            class="section-count"
        >
            0 maç
        </div>

    </div>


    <div id="matches">

        Yükleniyor...

    </div>


</div>


<script>


/* =====================================================
   VERİ DOSYASI
===================================================== */

const DATA_URL =
    "./data/matches.json";


/* =====================================================
   GLOBAL
===================================================== */

let allMatches = [];


/* =====================================================
   VERİ YÜKLE
===================================================== */

async function loadData(){

    try{

        document.getElementById("status").textContent =
            "Veriler yükleniyor...";


        const response =
            await fetch(
                DATA_URL +
                "?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Veri dosyası okunamadı."
            );

        }


        const data =
            await response.json();


        if(Array.isArray(data)){

            allMatches = data;

        }
        else if(
            data &&
            Array.isArray(data.matches)
        ){

            allMatches =
                data.matches;

        }
        else{

            throw new Error(
                "matches dizisi bulunamadı."
            );

        }


        document.getElementById("status").textContent =
            "✅ " +
            allMatches.length +
            " maç yüklendi.";


        createDates();


    }
    catch(error){

        console.error(error);


        document.getElementById("status").textContent =
            "❌ " +
            error.message;


        document.getElementById("matches").innerHTML =
            `
            <div class="status">
                Veri yüklenemedi.
            </div>
            `;

    }

}


/* =====================================================
   TARİHLER
===================================================== */

function createDates(){

    const dates =
        [
            ...new Set(
                allMatches
                    .map(
                        m => m.date
                    )
                    .filter(Boolean)
            )
        ];


    dates.sort(
        sortDate
    );


    const select =
        document.getElementById(
            "dateSelect"
        );


    select.innerHTML =
        `
        <option value="">
            Tarih seç
        </option>
        `;


    dates.forEach(
        date => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                date;


            option.textContent =
                date;


            select.appendChild(
                option
            );

        }
    );


    /*
       Son mevcut tarihi otomatik aç
    */

    if(dates.length){

        select.value =
            dates[dates.length-1];


        showSelectedDate();

    }

}


/* =====================================================
   TARİH GÖSTER
===================================================== */

function showSelectedDate(){

    const date =
        document.getElementById(
            "dateSelect"
        ).value;


    if(!date){

        document.getElementById(
            "matches"
        ).innerHTML =
            `
            <div class="status">
                Lütfen tarih seçin.
            </div>
            `;

        return;

    }


    const selected =
        allMatches
            .filter(
                m =>
                    m.date === date
            )
            .sort(
                (a,b) =>
                    String(a.time || "")
                    .localeCompare(
                        String(b.time || "")
                    )
            );


    document.getElementById(
        "title"
    ).textContent =
        date +
        " Maçları";


    document.getElementById(
        "count"
    ).textContent =
        selected.length +
        " maç";


    if(!selected.length){

        document.getElementById(
            "matches"
        ).innerHTML =
            `
            <div class="status">
                Bu tarihte maç bulunamadı.
            </div>
            `;

        return;

    }


    document.getElementById(
        "matches"
    ).innerHTML =
        selected
            .map(
                match =>
                    createMatch(
                        match
                    )
            )
            .join("");

}


/* =====================================================
   MAÇ KARTI
===================================================== */

function createMatch(match){

    const history =
        getHistory(
            match.date
        );


    return `

    <div class="match-card">


        <div class="match-top">

            <div class="league">

                ${esc(
                    match.league ||
                    "Lig"
                )}

            </div>


            <div class="time">

                ${esc(
                    match.time ||
                    "-"
                )}

            </div>

        </div>



        <div class="teams">

            <div class="team home">

                ${esc(
                    match.home ||
                    "-"
                )}

            </div>


            <div class="score">

                ${getScore(
                    match
                )}

            </div>


            <div class="team away">

                ${esc(
                    match.away ||
                    "-"
                )}

            </div>

        </div>



        ${createOdds(
            match
        )}



        <div class="analysis">

            <div class="analysis-title">

                📊 Geçmişte Aynı Oran Nasıl Sonuçlandı?

            </div>


            <div class="analysis-grid">


                ${analyzeMS(
                    match,
                    history,
                    "ms1",
                    "MS1"
                )}


                ${analyzeMS(
                    match,
                    history,
                    "msX",
                    "MSX"
                )}


                ${analyzeMS(
                    match,
                    history,
                    "ms2",
                    "MS2"
                )}


                ${analyzeKG(
                    match,
                    history
                )}


                ${analyze25(
                    match,
                    history
                )}


                ${analyzeMS(
                    match,
                    history,
                    "iy1",
                    "İY1"
                )}


                ${analyzeMS(
                    match,
                    history,
                    "iyX",
                    "İYX"
                )}


                ${analyzeMS(
                    match,
                    history,
                    "iy2",
                    "İY2"
                )}

            </div>

        </div>


    </div>

    `;

}


/* =====================================================
   MAÇIN ORANLARI
===================================================== */

function createOdds(match){

    const odds =
        match.openingOdds ||
        {};


    const list = [

        ["MS1","ms1"],
        ["MSX","msX"],
        ["MS2","ms2"],
        ["KG Var","kgVar"],
        ["2.5 Üst","au25Ust"]

    ];


    return `

    <div class="odds">

        <div class="odds-title">
            Açılış Oranları
        </div>


        <div class="odds-grid">

            ${
                list
                    .map(
                        item => `

                        <div class="odd-box">

                            <div class="odd-name">
                                ${item[0]}
                            </div>

                            <div class="odd-value">

                                ${formatOdd(
                                    odds[
                                        item[1]
                                    ]
                                )}

                            </div>

                        </div>

                        `
                    )
                    .join("")
            }

        </div>

    </div>

    `;

}


/* =====================================================
   MS1 / MSX / MS2 / İY
===================================================== */

function analyzeMS(
    current,
    history,
    key,
    title
){

    const currentOdd =
        getOdd(
            current,
            key
        );


    if(currentOdd === null){

        return "";

    }


    /*
       SADECE TAM EŞLEŞME

       Örneğin:

       1.66 = 1.66

       1.66 != 1.65

       1.66 != 1.67
    */

    const same =
        history.filter(
            m =>
                getOdd(
                    m,
                    key
                ) === currentOdd
        );


    if(!same.length){

        return noData(
            title,
            currentOdd
        );

    }


    let one = 0;
    let x = 0;
    let two = 0;


    same.forEach(
        m => {

            const result =
                resultMS(
                    m
                );


            if(result === "1"){
                one++;
            }

            if(result === "X"){
                x++;
            }

            if(result === "2"){
                two++;
            }

        }
    );


    const total =
        one +
        x +
        two;


    return `

    <div class="analysis-card">


        <div class="analysis-head">

            <div class="analysis-name">
                ${title}
            </div>

            <div class="analysis-odd">
                ${formatOdd(
                    currentOdd
                )}
            </div>

        </div>


        <div class="analysis-body">


            <div class="matches">

                ${same.length}
                birebir eşleşme

            </div>


            <div class="result-row">

                <span class="result-label green">
                    1
                </span>

                <strong>
                    ${percent(
                        one,
                        total
                    )}%
                </strong>

            </div>


            <div class="result-row">

                <span class="result-label yellow">
                    X
                </span>

                <strong>
                    ${percent(
                        x,
                        total
                    )}%
                </strong>

            </div>


            <div class="result-row">

                <span class="result-label red">
                    2
                </span>

                <strong>
                    ${percent(
                        two,
                        total
                    )}%
                </strong>

            </div>


        </div>

    </div>

    `;

}


/* =====================================================
   KG
===================================================== */

function analyzeKG(
    current,
    history
){

    const odd =
        getOdd(
            current,
            "kgVar"
        );


    if(odd === null){
        return "";
    }


    const same =
        history.filter(
            m =>
                getOdd(
                    m,
                    "kgVar"
                ) === odd
        );


    if(!same.length){

        return noData(
            "KG VAR",
            odd
        );

    }


    let varCount = 0;
    let yokCount = 0;


    same.forEach(
        m => {

            const result =
                resultKG(
                    m
                );


            if(result === "VAR"){
                varCount++;
            }

            if(result === "YOK"){
                yokCount++;
            }

        }
    );


    const total =
        varCount +
        yokCount;


    return `

    <div class="analysis-card">


        <div class="analysis-head">

            <div class="analysis-name">
                KG VAR
            </div>

            <div class="analysis-odd">
                ${formatOdd(
                    odd
                )}
            </div>

        </div>


        <div class="analysis-body">

            <div class="matches">

                ${same.length}
                birebir eşleşme

            </div>


            <div class="result-row">

                <span class="result-label green">
                    VAR
                </span>

                <strong>
                    ${percent(
                        varCount,
                        total
                    )}%
                </strong>

            </div>


            <div class="result-row">

                <span class="result-label red">
                    YOK
                </span>

                <strong>
                    ${percent(
                        yokCount,
                        total
                    )}%
                </strong>

            </div>

        </div>

    </div>

    `;

}


/* =====================================================
   2.5
===================================================== */

function analyze25(
    current,
    history
){

    const odd =
        getOdd(
            current,
            "au25Ust"
        );


    if(odd === null){
        return "";
    }


    const same =
        history.filter(
            m =>
                getOdd(
                    m,
                    "au25Ust"
                ) === odd
        );


    if(!same.length){

        return noData(
            "2.5 ÜST",
            odd
        );

    }


    let ust = 0;
    let alt = 0;


    same.forEach(
        m => {

            const result =
                result25(
                    m
                );


            if(result === "ÜST"){
                ust++;
            }

            if(result === "ALT"){
                alt++;
            }

        }
    );


    const total =
        ust +
        alt;


    return `

    <div class="analysis-card">


        <div class="analysis-head">

            <div class="analysis-name">
                2.5 ÜST
            </div>

            <div class="analysis-odd">
                ${formatOdd(
                    odd
                )}
            </div>

        </div>


        <div class="analysis-body">

            <div class="matches">

                ${same.length}
                birebir eşleşme

            </div>


            <div class="result-row">

                <span class="result-label green">
                    ÜST
                </span>

                <strong>
                    ${percent(
                        ust,
                        total
                    )}%
                </strong>

            </div>


            <div class="result-row">

                <span class="result-label red">
                    ALT
                </span>

                <strong>
                    ${percent(
                        alt,
                        total
                    )}%
                </strong>

            </div>

        </div>

    </div>

    `;

}


/* =====================================================
   GEÇMİŞ MAÇLAR
===================================================== */

function getHistory(
    currentDate
){

    const current =
        parseDate(
            currentDate
        );


    if(!current){
        return [];
    }


    return allMatches.filter(
        match => {

            const date =
                parseDate(
                    match.date
                );


            if(!date){
                return false;
            }


            /*
               SADECE GEÇMİŞ

               Aynı gün içindeki maçları
               geçmiş kabul etmiyoruz.
            */

            if(date >= current){
                return false;
            }


            if(!match.score){
                return false;
            }


            const h =
                Number(
                    match.score.home
                );

            const a =
                Number(
                    match.score.away
                );


            return (
                Number.isFinite(h) &&
                Number.isFinite(a)
            );

        }
    );

}


/* =====================================================
   MS SONUCU
===================================================== */

function resultMS(
    match
){

    if(!match.score){
        return null;
    }


    const h =
        Number(
            match.score.home
        );

    const a =
        Number(
            match.score.away
        );


    if(
        !Number.isFinite(h) ||
        !Number.isFinite(a)
    ){
        return null;
    }


    if(h > a){
        return "1";
    }


    if(h === a){
        return "X";
    }


    return "2";

}


/* =====================================================
   KG SONUCU
===================================================== */

function resultKG(
    match
){

    if(!match.score){
        return null;
    }


    const h =
        Number(
            match.score.home
        );

    const a =
        Number(
            match.score.away
        );


    if(
        !Number.isFinite(h) ||
        !Number.isFinite(a)
    ){
        return null;
    }


    return (
        h > 0 &&
        a > 0
    )
    ? "VAR"
    : "YOK";

}


/* =====================================================
   2.5 SONUCU
===================================================== */

function result25(
    match
){

    if(!match.score){
        return null;
    }


    const h =
        Number(
            match.score.home
        );

    const a =
        Number(
            match.score.away
        );


    if(
        !Number.isFinite(h) ||
        !Number.isFinite(a)
    ){
        return null;
    }


    return (
        h + a > 2.5
    )
    ? "ÜST"
    : "ALT";

}


/* =====================================================
   ORAN AL
===================================================== */

function getOdd(
    match,
    key
){

    if(
        !match ||
        !match.openingOdds
    ){

        return null;

    }


    const value =
        Number(
            match.openingOdds[key]
        );


    if(
        !Number.isFinite(value) ||
        value <= 0
    ){

        return null;

    }


    return value;

}


/* =====================================================
   ORAN FORMAT
===================================================== */

function formatOdd(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === "" ||
        Number(value) <= 0
    ){

        return "-";

    }


    return Number(value)
        .toFixed(2);

}


/* =====================================================
   YÜZDE
===================================================== */

function percent(
    value,
    total
){

    if(!total){
        return "0.0";
    }


    return (
        value /
        total *
        100
    ).toFixed(1);

}


/* =====================================================
   VERİ YOK
===================================================== */

function noData(
    title,
    odd
){

    return `

    <div class="analysis-card">


        <div class="analysis-head">

            <div class="analysis-name">
                ${title}
            </div>

            <div class="analysis-odd">
                ${formatOdd(
                    odd
                )}
            </div>

        </div>


        <div class="no-data">

            Geçmişte aynı oranla
            oynanmış maç bulunamadı.

        </div>


    </div>

    `;

}


/* =====================================================
   SKOR
===================================================== */

function getScore(
    match
){

    if(!match.score){
        return "-";
    }


    if(
        match.score.home === undefined ||
        match.score.away === undefined
    ){

        return "-";

    }


    return (
        match.score.home +
        " - " +
        match.score.away
    );

}


/* =====================================================
   TARİH SIRALA
===================================================== */

function sortDate(
    a,
    b
){

    const pa =
        a.split(".");

    const pb =
        b.split(".");


    const da =
        new Date(
            Number(pa[2]),
            Number(pa[1])-1,
            Number(pa[0])
        );


    const db =
        new Date(
            Number(pb[2]),
            Number(pb[1])-1,
            Number(pb[0])
        );


    return da - db;

}


/* =====================================================
   TARİH PARSE
===================================================== */

function parseDate(
    date
){

    if(!date){
        return null;
    }


    const p =
        String(date)
        .split(".");


    if(p.length !== 3){
        return null;
    }


    return new Date(
        Number(p[2]),
        Number(p[1])-1,
        Number(p[0])
    );

}


/* =====================================================
   HTML GÜVENLİK
===================================================== */

function esc(
    value
){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
