<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maçkolik - Tarih Maçları</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b1220;
 color:#f8fafc;
 font-family:Arial,sans-serif;
}
.container{
 max-width:1200px;
 margin:auto;
 padding:20px;
}
.header{
 background:linear-gradient(135deg,#172554,#0f172a);
 border:1px solid #263452;
 border-radius:18px;
 padding:24px;
 margin-bottom:18px;
}
.header h1{
 margin:0 0 8px;
 font-size:28px;
}
.header p{
 margin:0;
 color:#94a3b8;
}
.panel{
 background:#111b2e;
 border:1px solid #263452;
 border-radius:16px;
 padding:18px;
 margin-bottom:18px;
}
label{
 display:block;
 color:#94a3b8;
 font-size:13px;
 margin-bottom:8px;
}
.controls{
 display:grid;
 grid-template-columns:1fr auto;
 gap:10px;
}
input,select,button{
 width:100%;
 min-height:48px;
 border-radius:10px;
 border:1px solid #334155;
 padding:0 14px;
 font-size:15px;
}
input,select{
 background:#0b1220;
 color:white;
}
button{
 background:#2563eb;
 color:white;
 border:0;
 font-weight:bold;
 cursor:pointer;
}
button:hover{background:#1d4ed8}
.info{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:15px;
}
.badge{
 background:#0b1220;
 border:1px solid #263452;
 border-radius:10px;
 padding:10px 14px;
 color:#cbd5e1;
 font-size:13px;
}
.status{
 margin-bottom:15px;
 padding:12px;
 border-radius:10px;
 background:#0b1220;
 color:#94a3b8;
 font-size:13px;
}
.table-wrap{
 overflow-x:auto;
}
table{
 width:100%;
 border-collapse:collapse;
 min-width:850px;
}
th{
 background:#0b1220;
 color:#94a3b8;
 font-size:12px;
 text-align:left;
 padding:13px 10px;
}
td{
 padding:13px 10px;
 border-top:1px solid #1e293b;
 font-size:13px;
}
tr:hover td{
 background:#162238;
}
.team{
 font-weight:bold;
}
.score{
 font-weight:bold;
 color:#facc15;
}
.odds{
 color:#93c5fd;
}
.empty{
 text-align:center;
 padding:40px;
 color:#64748b;
}
@media(max-width:600px){
 .container{padding:10px}
 .header{padding:18px}
 .header h1{font-size:22px}
 .controls{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>⚽ Maçkolik</h1>
<p>Seçtiğin tarihteki maçları listele</p>
</div>

<div class="panel">

<label for="dateSelect">MAÇ TARİHİ</label>

<div class="controls">

<select id="dateSelect">
<option value="">Tarihler yükleniyor...</option>
</select>

<button id="showButton">
MAÇLARI GÖSTER
</button>

</div>

<div class="info">
<div class="badge">
📅 <span id="selectedDate">Tarih seçilmedi</span>
</div>

<div class="badge">
⚽ <span id="matchCount">0</span> maç
</div>
</div>

</div>

<div id="status" class="status">
Veriler yükleniyor...
</div>

<div class="panel">

<div class="table-wrap">

<table>

<thead>
<tr>
<th>SAAT</th>
<th>LİG</th>
<th>EV SAHİBİ</th>
<th>DEPLASMAN</th>
<th>İY</th>
<th>MS</th>
<th>MS1</th>
<th>MSX</th>
<th>MS2</th>
<th>KG</th>
<th>2.5</th>
</tr>
</thead>

<tbody id="matchTable">

<tr>
<td colspan="11" class="empty">
Maçlar yükleniyor...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<script>

const DATA_URL = "./data/matches.json";

let matches = [];

const dateSelect =
document.getElementById("dateSelect");

const showButton =
document.getElementById("showButton");

const matchTable =
document.getElementById("matchTable");

const status =
document.getElementById("status");

const selectedDate =
document.getElementById("selectedDate");

const matchCount =
document.getElementById("matchCount");


function getMatches(data){

    if(Array.isArray(data)){
        return data;
    }

    if(data && Array.isArray(data.matches)){
        return data.matches;
    }

    return [];
}


function formatDate(date){

    if(!date) return "";

    return String(date).trim();

}


function dateSort(a,b){

    const pa = a.split(".");
    const pb = b.split(".");

    if(pa.length !== 3 || pb.length !== 3){
        return a.localeCompare(b);
    }

    const da =
        new Date(
            Number(pa[2]),
            Number(pa[1])-1,
            Number(pa[0])
        );

    const db =
        new Date(
            Number(pb[2]),
            Number(pb[1])-1,
            Number(pb[0])
        );

    return da-db;

}


function score(value){

    if(!value) return "-";

    if(
        value.home === undefined ||
        value.away === undefined
    ){
        return "-";
    }

    return value.home+" - "+value.away;

}


function odd(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){
        return "-";
    }

    const n = Number(value);

    return Number.isFinite(n)
        ? n.toFixed(2)
        : "-";

}


function kgResult(match){

    const h = Number(match.score?.home);
    const a = Number(match.score?.away);

    if(!Number.isFinite(h) || !Number.isFinite(a)){
        return "-";
    }

    return h > 0 && a > 0
        ? "VAR"
        : "YOK";

}


function goalResult(match){

    const h = Number(match.score?.home);
    const a = Number(match.score?.away);

    if(!Number.isFinite(h) || !Number.isFinite(a)){
        return "-";
    }

    return h+a > 2.5
        ? "ÜST"
        : "ALT";

}


function loadDates(){

    const dates = [
        ...new Set(
            matches
            .map(m => formatDate(m.date))
            .filter(Boolean)
        )
    ];

    dates.sort(dateSort);

    dateSelect.innerHTML =
        '<option value="">Tarih seç</option>';

    dates.forEach(date => {

        const option =
        document.createElement("option");

        option.value = date;

        option.textContent = date;

        dateSelect.appendChild(option);

    });

    if(dates.length){

        dateSelect.value =
            dates[dates.length-1];

        showMatches(
            dates[dates.length-1]
        );

    }else{

        status.textContent =
            "Veri içinde tarih bulunamadı.";

    }

}


function showMatches(date){

    if(!date){

        matchTable.innerHTML =
        `
        <tr>
        <td colspan="11" class="empty">
        Lütfen bir tarih seçin.
        </td>
        </tr>
        `;

        selectedDate.textContent =
            "Tarih seçilmedi";

        matchCount.textContent = "0";

        return;

    }

    const selected =
        matches.filter(
            match =>
            formatDate(match.date) === date
        );

    selected.sort((a,b) =>
        String(a.time || "")
        .localeCompare(
            String(b.time || "")
        )
    );

    selectedDate.textContent = date;

    matchCount.textContent =
        selected.length;

    if(!selected.length){

        matchTable.innerHTML =
        `
        <tr>
        <td colspan="11" class="empty">
        Bu tarihte maç bulunamadı.
        </td>
        </tr>
        `;

        return;

    }

    matchTable.innerHTML =
        selected.map(match => {

            const odds =
                match.openingOdds || {};

            return `
            <tr>

                <td>
                    ${match.time || "-"}
                </td>

                <td>
                    ${match.league || "-"}
                </td>

                <td class="team">
                    ${match.home || "-"}
                </td>

                <td class="team">
                    ${match.away || "-"}
                </td>

                <td class="score">
                    ${score(match.halfTimeScore)}
                </td>

                <td class="score">
                    ${score(match.score)}
                </td>

                <td class="odds">
                    ${odd(odds.ms1)}
                </td>

                <td class="odds">
                    ${odd(odds.msX)}
                </td>

                <td class="odds">
                    ${odd(odds.ms2)}
                </td>

                <td>
                    ${kgResult(match)}
                </td>

                <td>
                    ${goalResult(match)}
                </td>

            </tr>
            `;

        }).join("");

}


async function loadData(){

    try{

        status.textContent =
            "Veriler yükleniyor...";

        const url =
            DATA_URL +
            "?v=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        matches =
            getMatches(data);

        if(!matches.length){

            throw new Error(
                "matches.json içinde maç bulunamadı."
            );

        }

        status.textContent =
            "✅ " +
            matches.length +
            " maç yüklendi.";

        loadDates();

    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Veri yüklenemedi: " +
            error.message;

        matchTable.innerHTML =
        `
        <tr>
        <td colspan="11" class="empty">
        ${error.message}
        </td>
        </tr>
        `;

    }

}


showButton.addEventListener(
    "click",
    function(){

        showMatches(
            dateSelect.value
        );

    }
);


dateSelect.addEventListener(
    "change",
    function(){

        if(this.value){

            showMatches(
                this.value
            );

        }

    }
);


loadData();

</script>

</body>
</html>
