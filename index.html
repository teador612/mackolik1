<div class="app">

</div>

<div class="stats">

<div class="stat day">

</div>

</div>

Ana Sayfa

<span class="nav-icon">🔄</span>
Yenile
</div>

</div>

<script>
'use strict';

const DATA_URL='./data/matches.json';

const MIN_SUCCESS=70;
const MIN_SAMPLE=5;


/* =========================================================
   KAYNAK ORANLAR
========================================================= */

const SOURCES=[
{key:'ms1',name:'MS 1'},
{key:'msX',name:'MS X'},
{key:'ms2',name:'MS 2'},
{key:'kgVar',name:'KG Var'},
{key:'kgYok',name:'KG Yok'},
{key:'au15Ust',name:'1.5 Üst'},
{key:'au15Alt',name:'1.5 Alt'},
{key:'au25Ust',name:'2.5 Üst'},
{key:'au25Alt',name:'2.5 Alt'},
{key:'au35Ust',name:'3.5 Üst'},
{key:'au35Alt',name:'3.5 Alt'},
{key:'iy15Ust',name:'İY 1.5 Üst'},
{key:'iy15Alt',name:'İY 1.5 Alt'},
{key:'iy1',name:'İY 1'},
{key:'iyX',name:'İY X'},
{key:'iy2',name:'İY 2'}
];


/* =========================================================
   SONUÇLAR
========================================================= */

const TARGETS=[
{key:'ms1',name:'MS 1'},
{key:'msX',name:'MS X'},
{key:'ms2',name:'MS 2'},
{key:'kgVar',name:'KG Var'},
{key:'kgYok',name:'KG Yok'},
{key:'over15',name:'1.5 Üst'},
{key:'under15',name:'1.5 Alt'},
{key:'over25',name:'2.5 Üst'},
{key:'under25',name:'2.5 Alt'},
{key:'over35',name:'3.5 Üst'},
{key:'under35',name:'3.5 Alt'},
{key:'iyOver05',name:'İY 0.5 Üst'},
{key:'iyUnder05',name:'İY 0.5 Alt'},
{key:'iyOver15',name:'İY 1.5 Üst'},
{key:'iyUnder15',name:'İY 1.5 Alt'},
{key:'iy1',name:'İY 1'},
{key:'iyX',name:'İY X'},
{key:'iy2',name:'İY 2'}
];


/* =========================================================
   STATE
========================================================= */

const state={
matches:[],
selectedDate:'',
index:new Map(),
cache:new Map()
};


/* =========================================================
   YARDIMCILAR
========================================================= */

function $(id){
return document.getElementById(id);
}

function esc(v){
return String(v??'').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function num(v){

if(v===null||v===undefined||v===''){
return null;
}

const n=Number(
String(v).replace(',','.')
);

return Number.isFinite(n)?n:null;
}

function dateNumber(v){

if(!v)return 0;

const p=String(v).split('.');

if(p.length!==3)return 0;

return Number(
p[2]+
p[1].padStart(2,'0')+
p[0].padStart(2,'0')
);
}

function today(){

const d=new Date();

return [
String(d.getDate()).padStart(2,'0'),
String(d.getMonth()+1).padStart(2,'0'),
d.getFullYear()
].join('.');
}

function getOdd(match,key){

const n=num(
match?.openingOdds?.[key]
);

return n!==null&&n>0?n:null;
}

function sameOdd(a,b){

const x=num(a);
const y=num(b);

return x!==null&&
y!==null&&
x>0&&
y>0&&
x===y;
}


/* =========================================================
   SKOR
========================================================= */

function scoreOf(v){

if(!v)return null;

const home=num(v.home);
const away=num(v.away);

if(home===null||away===null){
return null;
}

if(home<0||away<0){
return null;
}

return {home,away};
}

function getScore(m){
return scoreOf(m.score);
}

function getHalf(m){
return scoreOf(m.halfTimeScore);
}


/* =========================================================
   SONUÇ
========================================================= */

function result(m,key){

const s=getScore(m);
const h=getHalf(m);

switch(key){

case'ms1':
return s?s.home>s.away:null;

case'msX':
return s?s.home===s.away:null;

case'ms2':
return s?s.home<s.away:null;

case'kgVar':
return s?s.home>0&&s.away>0:null;

case'kgYok':
return s?s.home===0||s.away===0:null;

case'over15':
return s?s.home+s.away>=2:null;

case'under15':
return s?s.home+s.away<=1:null;

case'over25':
return s?s.home+s.away>=3:null;

case'under25':
return s?s.home+s.away<=2:null;

case'over35':
return s?s.home+s.away>=4:null;

case'under35':
return s?s.home+s.away<=3:null;

case'iyOver05':
return h?h.home+h.away>=1:null;

case'iyUnder05':
return h?h.home+h.away===0:null;

case'iyOver15':
return h?h.home+h.away>=2:null;

case'iyUnder15':
return h?h.home+h.away<=1:null;

case'iy1':
return h?h.home>h.away:null;

case'iyX':
return h?h.home===h.away:null;

case'iy2':
return h?h.home<h.away:null;

default:
return null;
}
}


/* =========================================================
   HIZLI İNDEKS
========================================================= */

function buildIndex(){

state.index.clear();

for(const match of state.matches){

const date=dateNumber(match.date);

if(!date)continue;

for(const source of SOURCES){

const odd=getOdd(match,source.key);

if(odd===null)continue;

const key=
source.key+'|'+odd;

if(!state.index.has(key)){
state.index.set(key,[]);
}

state.index.get(key).push({
date,
match
});

}
}

for(const list of state.index.values()){

list.sort(
(a,b)=>a.date-b.date
);

}
}


/* =========================================================
   GEÇMİŞ
========================================================= */

function getHistory(sourceKey,odd,date){

const list=
state.index.get(
sourceKey+'|'+odd
)||[];

const d=dateNumber(date);

return list.filter(
x=>x.date<d
);
}


/* =========================================================
   ANALİZ
========================================================= */

function analyze(match){

const cacheKey=
String(match.code||'')+
'|'+
String(match.date||'')+
'|'+
String(match.time||'');

if(state.cache.has(cacheKey)){
return state.cache.get(cacheKey);
}

const list=[];

for(const source of SOURCES){

const odd=getOdd(
match,
source.key
);

if(odd===null)continue;

const history=
getHistory(
source.key,
odd,
match.date
);

if(history.length<MIN_SAMPLE){
continue;
}

for(const target of TARGETS){

let success=0;
let total=0;

for(const item of history){

const r=
result(
item.match,
target.key
);

if(r===null)continue;

total++;

if(r===true){
success++;
}

}

if(total<MIN_SAMPLE)continue;

const percent=
success/total*100;

if(percent>=MIN_SUCCESS){

list.push({
source:source.name,
sourceKey:source.key,
target:target.name,
targetKey:target.key,
odd,
success,
total,
percent
});

}

}

}

list.sort((a,b)=>
b.percent-a.percent||
b.total-a.total||
b.success-a.success
);

const data={
list,
best:list[0]||null
};

state.cache.set(
cacheKey,
data
);

return data;
}


/* =========================================================
   MAÇ DURUMU
========================================================= */

function matchStatus(match,analysis){

if(!analysis.best){
return'pending';
}

const r=
result(
match,
analysis.best.targetKey
);

if(r===true)return'success';
if(r===false)return'fail';

return'pending';
}


/* =========================================================
   DETAY
========================================================= */

function renderDetails(list){

if(!list.length){

return`
<div class="empty">
Bu maç için %${MIN_SUCCESS}
üzerinde yeterli geçmiş veri bulunamadı.
</div>
`;
}

return list.map((x,i)=>`

<div class="suggestion">

<div class="suggestion-top">

<div>

<div class="suggestion-name">
${i+1}. ${esc(x.target)}
</div>

<div class="suggestion-source">
Kaynak: ${esc(x.source)}
 · Açılış: ${x.odd.toFixed(2)}
</div>

</div>

<div class="suggestion-percent">
%${x.percent.toFixed(1)}
</div>

</div>

<div class="sample">
${x.success}/${x.total} başarılı
</div>

</div>

`).join('');
}


/* =========================================================
   MAÇ KARTI
========================================================= */

function createCard(match){

const analysis=
analyze(match);

const best=
analysis.best;

const status=
matchStatus(match,analysis);

const card=
document.createElement('div');

card.className=
'match-card '+status;


let badge;

if(status==='success'){
badge=
'<span class="badge green">🟢 Başarılı</span>';
}else if(status==='fail'){
badge=
'<span class="badge red">🔴 Başarısız</span>';
}else{
badge=
'<span class="badge yellow">🟡 Bekliyor</span>';
}


const score=
getScore(match);

const half=
getHalf(match);


const ms=
score
?`${score.home}-${score.away}`
:'-';

const iy=
half
?`${half.home}-${half.away}`
:'-';


const prediction=
best
?`
<div class="prediction">

<div>

<div class="prediction-title">
En güçlü öneri
</div>

<div class="prediction-name">
${esc(best.target)}
</div>

</div>

<div class="prediction-percent">
%${best.percent.toFixed(1)}
</div>

</div>
`
:`
<div class="prediction">

<div>

<div class="prediction-title">
Öneri
</div>

<div class="prediction-name">
Yeterli veri yok
</div>

</div>

</div>
`;


card.innerHTML=`

<div class="match-main">

<div class="top">

<div class="meta">
${esc(match.league||'')}
 · ${esc(match.time||'')}
</div>

${badge}

</div>


<div class="teams">

<div class="team home">
${esc(match.home||'')}
</div>

<div class="time">
${esc(match.time||'')}
</div>

<div class="team away">
${esc(match.away||'')}
</div>

</div>


<div class="scores">

<span>
<b>MS:</b> ${ms}
</span>

<span>
<b>İY:</b> ${iy}
</span>

</div>


${prediction}


<button class="expand" type="button">
+
</button>

</div>


<div class="details">
${renderDetails(analysis.list)}
</div>
`;


const button=
card.querySelector('.expand');

button.addEventListener(
'click',
()=>{

card.classList.toggle('open');

button.textContent=
card.classList.contains('open')
?'−'
:'+';

}
);

return card;
}


/* =========================================================
   TARİHLER
========================================================= */

function setupDates(){

const select=
$('dateSelect');

const dates=[
...new Set(
state.matches
.map(m=>m.date)
.filter(Boolean)
)
].sort(
(a,b)=>dateNumber(b)-dateNumber(a)
);

select.innerHTML='';

const current=today();

const selected=
dates.includes(current)
?current
:(dates[0]||'');

for(const date of dates){

const option=
document.createElement('option');

option.value=date;
option.textContent=date;

if(date===selected){
option.selected=true;
}

select.appendChild(option);
}

state.selectedDate=selected;
}


/* =========================================================
   GÜNÜN İSTATİSTİĞİ
========================================================= */

function calculateDay(){

let success=0;
let total=0;

const list=
state.matches.filter(
m=>m.date===state.selectedDate
);

for(const match of list){

const analysis=
analyze(match);

if(!analysis.best)continue;

const r=
result(
match,
analysis.best.targetKey
);

if(r===null)continue;

total++;

if(r===true){
success++;
}

}

return{
success,
total,
percent:
total
?success/total*100
:null
};
}


function renderDayStats(){

const s=
calculateDay();

if(s.percent===null){

$('dayPercent').textContent='--';

$('dayDetail').textContent=
'Henüz sonuçlanan öneri yok';

return;
}

$('dayPercent').textContent=
'%'+s.percent.toFixed(1);

$('dayDetail').textContent=
`${s.success} başarılı / ${s.total} sonuçlanan`;
}


/* =========================================================
   MAÇLARI GÖSTER
========================================================= */

function render(){

state.selectedDate=
$('dateSelect').value;

const container=
$('matches');

container.innerHTML='';

const list=
state.matches
.filter(
m=>m.date===state.selectedDate
)
.sort(
(a,b)=>
String(a.time||'')
.localeCompare(
String(b.time||'')
)
);

$('info').textContent=
`${state.selectedDate} · ${list.length} maç`;

if(!list.length){

container.innerHTML=`
<div class="empty">
Bu tarihte maç bulunamadı.
</div>
`;

}else{

const fragment=
document.createDocumentFragment();

for(const match of list){

fragment.appendChild(
createCard(match)
);

}

container.appendChild(
fragment
);
}

renderDayStats();
}


/* =========================================================
   TÜM GEÇMİŞ
========================================================= */

function calculateAll(){

let success=0;
let total=0;

const todayNo=
dateNumber(today());

for(const match of state.matches){

if(dateNumber(match.date)>=todayNo){
continue;
}

const analysis=
analyze(match);

if(!analysis.best)continue;

const r=
result(
match,
analysis.best.targetKey
);

if(r===null)continue;

total++;

if(r===true){
success++;
}

}

return{
success,
total,
percent:
total
?success/total*100
:null
};
}


function renderAllStats(){

setTimeout(()=>{

const s=
calculateAll();

if(s.percent===null){

$('allPercent').textContent='--';

$('allDetail').textContent=
'Henüz sonuçlanan öneri yok';

return;
}

$('allPercent').textContent=
'%'+s.percent.toFixed(1);

$('allDetail').textContent=
`${s.success} başarılı / ${s.total} sonuçlanan`;

},100);
}


/* =========================================================
   VERİ YÜKLE
========================================================= */

async function load(){

try{

$('info').textContent=
'Veriler yükleniyor...';


const response=
await fetch(
DATA_URL+'?v='+Date.now(),
{
cache:'no-store'
}
);


if(!response.ok){

throw new Error(
'HTTP '+response.status
);
}


const data=
await response.json();


if(
!data||
!Array.isArray(data.matches)
){

throw new Error(
'matches.json içinde matches bulunamadı.'
);
}


state.matches=
data.matches;


if(!state.matches.length){

throw new Error(
'Maç listesi boş.'
);
}


/*
  İndeksi sadece bir kez oluştur.
*/

buildIndex();


state.cache.clear();


/*
  Önce tarihi hazırla.
*/

setupDates();


/*
  Önce ekranı göster.
*/

render();


/*
  Genel istatistiği sonradan hesapla.
*/

renderAllStats();


}catch(error){

console.error(error);

$('info').textContent=
'Veri yüklenemedi';

$('matches').innerHTML=`

<div class="empty">

<strong>Veri yüklenemedi.</strong>

<br><br>

${esc(error.message)}

</div>

`;
}
}


/* =========================================================
   EVENTS
========================================================= */

$('dateSelect').addEventListener(
'change',
render
);

$('showBtn').addEventListener(
'click',
render
);


/* =========================================================
   BAŞLAT
========================================================= */

load();

</script>

</body>
</html>
