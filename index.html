<script>
(function () {
    'use strict';

    /* =========================================================
       GÜNÜN MAÇLARI
       🟢 Başarılı
       🔴 Başarısız
       🟡 Henüz oynanmamış
       ========================================================= */

    const MIN_SAMPLE = 5;

    let matches = [];

    /* ---------------------------------------------------------
       YARDIMCI
       --------------------------------------------------------- */

    function esc(v) {
        return String(v ?? '')
            .replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
    }

    function getData() {
        if (Array.isArray(window.DATA)) return window.DATA;

        if (window.DATA && Array.isArray(window.DATA.matches)) {
            return window.DATA.matches;
        }

        if (Array.isArray(window.matches)) {
            return window.matches;
        }

        if (window.state && Array.isArray(window.state.matches)) {
            return window.state.matches;
        }

        return [];
    }

    function getToday() {
        const d = new Date();

        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();

        return `${day}.${month}.${year}`;
    }

    function getScore(match) {

        const s =
            match.score ||
            match.result ||
            null;

        if (!s) return null;

        const home = Number(s.home);
        const away = Number(s.away);

        if (!Number.isFinite(home) ||
            !Number.isFinite(away)) {
            return null;
        }

        /*
         * Maçın henüz başlamadığı durumlarda
         * 0-0 değerini sonuç kabul etmiyoruz.
         */

        if (
            match.status === 0 ||
            match.status === '0' ||
            match.status === 1 ||
            match.status === '1'
        ) {
            return null;
        }

        return {
            home,
            away
        };
    }

    function getHTScore(match) {

        const s =
            match.halfTimeScore ||
            match.htScore ||
            match.firstHalfScore;

        if (!s) return null;

        const home = Number(s.home);
        const away = Number(s.away);

        if (!Number.isFinite(home) ||
            !Number.isFinite(away)) {
            return null;
        }

        return {
            home,
            away
        };
    }

    /* ---------------------------------------------------------
       ÖNERİYİ BUL
       --------------------------------------------------------- */

    function getSuggestion(match) {

        return (
            match.best ||
            match.bestSuggestion ||
            match.suggestion ||
            match.recommendation ||
            match.prediction ||
            match.tip ||
            match.bestResult ||
            null
        );
    }

    function getSuggestionLabel(suggestion) {

        if (!suggestion) return '';

        if (typeof suggestion === 'string') {
            return suggestion;
        }

        return (
            suggestion.label ||
            suggestion.name ||
            suggestion.type ||
            suggestion.key ||
            suggestion.market ||
            suggestion.target?.label ||
            ''
        );
    }

    /* ---------------------------------------------------------
       ÖNERİNİN DOĞRU OLUP OLMADIĞI
       --------------------------------------------------------- */

    function checkSuggestion(match, suggestion) {

        const score = getScore(match);

        if (!score || !suggestion) {
            return null;
        }

        const ht = getHTScore(match);

        let type = getSuggestionLabel(suggestion)
            .toLowerCase()
            .trim();

        const h = score.home;
        const a = score.away;
        const total = h + a;

        /* MS 1 */

        if (
            type === 'ms1' ||
            type === 'ms 1' ||
            type === '1' ||
            type.includes('ms1')
        ) {
            return h > a;
        }

        /* MS X */

        if (
            type === 'msx' ||
            type === 'ms x' ||
            type === 'ms0' ||
            type === 'ms 0' ||
            type === 'x' ||
            type.includes('msx')
        ) {
            return h === a;
        }

        /* MS 2 */

        if (
            type === 'ms2' ||
            type === 'ms 2' ||
            type === '2' ||
            type.includes('ms2')
        ) {
            return h < a;
        }

        /* KG VAR */

        if (
            type.includes('kg var') ||
            type.includes('kgvar') ||
            type.includes('kg+')
        ) {
            return h > 0 && a > 0;
        }

        /* KG YOK */

        if (
            type.includes('kg yok') ||
            type.includes('kgyok') ||
            type.includes('kg-')
        ) {
            return h === 0 || a === 0;
        }

        /* 2.5 ÜST */

        if (
            type.includes('2,5 üst') ||
            type.includes('2.5 üst') ||
            type.includes('over25')
        ) {
            return total >= 3;
        }

        /* 2.5 ALT */

        if (
            type.includes('2,5 alt') ||
            type.includes('2.5 alt') ||
            type.includes('under25')
        ) {
            return total <= 2;
        }

        /* İY 0.5 ÜST */

        if (
            type.includes('iy 0,5 üst') ||
            type.includes('iy 0.5 üst') ||
            type.includes('iyover05')
        ) {
            if (!ht) return null;

            return ht.home + ht.away >= 1;
        }

        /* İY 1.5 ÜST */

        if (
            type.includes('iy 1,5 üst') ||
            type.includes('iy 1.5 üst') ||
            type.includes('iyover15')
        ) {
            if (!ht) return null;

            return ht.home + ht.away >= 2;
        }

        return null;
    }

    /* ---------------------------------------------------------
       KART DURUMU
       --------------------------------------------------------- */

    function getMatchStatus(match) {

        const suggestion = getSuggestion(match);
        const score = getScore(match);

        /*
         * Henüz öneri yoksa veya maç başlamadıysa sarı.
         */

        if (!suggestion || !score) {
            return {
                className: 'match-pending',
                icon: '🟡',
                text: 'Bekliyor'
            };
        }

        const result =
            checkSuggestion(match, suggestion);

        if (result === true) {
            return {
                className: 'match-success',
                icon: '🟢',
                text: 'Başarılı'
            };
        }

        if (result === false) {
            return {
                className: 'match-fail',
                icon: '🔴',
                text: 'Başarısız'
            };
        }

        return {
            className: 'match-pending',
            icon: '🟡',
            text: 'Bekliyor'
        };
    }

    /* ---------------------------------------------------------
       GÜNLÜK TOPLAM BAŞARI
       --------------------------------------------------------- */

    function calculateDailySuccess(list) {

        let total = 0;
        let success = 0;

        list.forEach(match => {

            const suggestion = getSuggestion(match);
            const score = getScore(match);

            if (!suggestion || !score) return;

            const result =
                checkSuggestion(match, suggestion);

            if (result === null) return;

            total++;

            if (result === true) {
                success++;
            }
        });

        const percentage =
            total
                ? (success / total) * 100
                : 0;

        return {
            total,
            success,
            percentage
        };
    }

    /* ---------------------------------------------------------
       CSS
       --------------------------------------------------------- */

    function addStyles() {

        if (document.getElementById('gununMaclariStyles')) {
            return;
        }

        const style = document.createElement('style');

        style.id = 'gununMaclariStyles';

        style.textContent = `

        .today-success-box {
            width: 100%;
            box-sizing: border-box;
            margin: 12px 0 15px;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            background: #111827;
            color: white;
            box-shadow: 0 5px 16px rgba(0,0,0,.12);
        }

        .today-success-title {
            font-size: 12px;
            font-weight: 700;
            opacity: .75;
            letter-spacing: .5px;
        }

        .today-success-percent {
            font-size: 34px;
            font-weight: 900;
            margin-top: 4px;
        }

        .today-success-detail {
            font-size: 13px;
            opacity: .75;
            margin-top: 3px;
        }

        .today-match-card {
            position: relative;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 9px;
            border-left: 5px solid;
            transition: .2s;
        }

        .today-match-card.match-success {
            background: #ecfdf5;
            border-left-color: #16a34a;
        }

        .today-match-card.match-fail {
            background: #fef2f2;
            border-left-color: #dc2626;
        }

        .today-match-card.match-pending {
            background: #fffbeb;
            border-left-color: #eab308;
        }

        .today-match-status {
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .match-success .today-match-status {
            color: #15803d;
        }

        .match-fail .today-match-status {
            color: #b91c1c;
        }

        .match-pending .today-match-status {
            color: #a16207;
        }

        .today-match-teams {
            font-weight: 800;
            font-size: 14px;
        }

        .today-match-score {
            margin-top: 5px;
            font-size: 13px;
            font-weight: 700;
        }

        .today-match-suggestion {
            margin-top: 7px;
            display: inline-block;
            padding: 5px 9px;
            border-radius: 8px;
            background: rgba(0,0,0,.06);
            font-size: 12px;
            font-weight: 800;
        }

        `;

        document.head.appendChild(style);
    }

    /* ---------------------------------------------------------
       GÜNÜN MAÇLARINI GÖSTER
       --------------------------------------------------------- */

    function renderToday() {

        matches = getData();

        if (!matches.length) {
            return;
        }

        const today = getToday();

        const todayMatches = matches.filter(m => {

            return (
                m.date === today ||
                m.matchDate === today
            );
        });

        const success =
            calculateDailySuccess(todayMatches);

        /*
         * Mevcut Günün Maçları konteynerini bul.
         */

        let container =
            document.getElementById('todayMatches') ||
            document.getElementById('todayList') ||
            document.querySelector('.today-matches');

        if (!container) {
            return;
        }

        /*
         * Günlük başarı kutusu
         */

        let successBox =
            document.getElementById('todaySuccessBox');

        if (!successBox) {

            successBox =
                document.createElement('div');

            successBox.id =
                'todaySuccessBox';

            container.parentNode.insertBefore(
                successBox,
                container
            );
        }

        successBox.className =
            'today-success-box';

        successBox.innerHTML = `

            <div class="today-success-title">
                BUGÜNÜN GENEL BAŞARISI
            </div>

            <div class="today-success-percent">
                ${
                    success.total
                        ? '%' + success.percentage.toFixed(1)
                        : '--'
                }
            </div>

            <div class="today-success-detail">
                ${
                    success.total
                        ? `${success.success} / ${success.total} öneri tuttu`
                        : 'Henüz sonuçlanan öneri yok'
                }
            </div>

        `;

        /*
         * Kartları renklendir.
         *
         * Mevcut kartların HTML'ini bozmayız.
         * Sadece durum class'ı ekleriz.
         */

        const cards =
            container.querySelectorAll(
                '[data-match-id], .match-card, .today-card'
            );

        cards.forEach(card => {

            const id =
                card.dataset.matchId ||
                card.dataset.id;

            if (!id) return;

            const match =
                todayMatches.find(m =>
                    String(
                        m.code ||
                        m.id ||
                        m.matchId
                    ) === String(id)
                );

            if (!match) return;

            card.classList.remove(
                'match-success',
                'match-fail',
                'match-pending'
            );

            const status =
                getMatchStatus(match);

            card.classList.add(
                status.className
            );

            /*
             * Kartın içine durum etiketi ekle.
             */

            let statusEl =
                card.querySelector('.today-match-status');

            if (!statusEl) {

                statusEl =
                    document.createElement('div');

                statusEl.className =
                    'today-match-status';

                card.prepend(statusEl);
            }

            statusEl.textContent =
                `${status.icon} ${status.text}`;
        });
    }

    /* ---------------------------------------------------------
       BAŞLAT
       --------------------------------------------------------- */

    function start() {

        addStyles();

        renderToday();

        /*
         * Skorlar değişebileceği için tekrar kontrol.
         */

        setTimeout(renderToday, 1000);
        setTimeout(renderToday, 3000);
        setTimeout(renderToday, 7000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener(
            'DOMContentLoaded',
            start
        );
    } else {
        start();
    }

})();
</script>
