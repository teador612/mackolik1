<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açılış Oran Analizi - Canlı Excel</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b1020">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0b1020;
            color: #e8ecf7;
            font: 15px system-ui, -apple-system, sans-serif;
        }
        .wrap {
            max-width: 1250px;
            margin: auto;
            padding: 24px 18px 60px;
        }
        .hero h1 { margin: 0 0 6px; }
        .muted { color: #9ba6bf; }
        .panel, .card {
            background: #0d1422;
            border: 1px solid #1d2a3d;
            border-radius: 8px;
            padding: 18px;
            margin: 14px 0;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin: 18px 0;
            overflow-x: auto;
        }
        .btn, .tab {
            border: 1px solid #33405f;
            border-radius: 10px;
            background: #18223a;
            color: #e8ecf7;
            padding: 11px 15px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn, .tab.active {
            background: #1d6ef2;
            border-color: #1d6ef2;
        }
        .notice {
            background: #17233e;
            border-left: 3px solid #3d8bfd;
            border-radius: 8px;
            padding: 11px;
            color: #c9d1e5;
            line-height: 1.5;
        }
        @media(max-width: 520px) {
            .wrap { padding-left: 10px; padding-right: 10px; }
            .tabs { display: flex; gap: 6px; }
            .tab { padding: 9px 10px; font-size: 12px; }
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <h1>Açılış Oran Analizi</h1>
            <p class="muted">Excel’i doğrudan seçerek güncelle. Veriler tarayıcıda işlenir.</p>
        </div>

        <!-- bugun.js "Bugünün maçları" butonunu bu sekmelerin en başına otomatik ekler -->
        <div class="tabs">
            <button class="tab" data-tab="filterTab" onclick="showTab('filterTab')">Oran filtreleme</button>
            <button class="tab" data-tab="futureTab" onclick="showTab('futureTab')">Oynanmamış maçlar</button>
            <button class="tab" data-tab="couponTab" onclick="showTab('couponTab')">İdeal kupon</button>
            <button class="tab" data-tab="matchTab" onclick="showTab('matchTab')">Maça özel tahmin</button>
        </div>

        <!-- bugun.js kendi arayüz alanını bu bölümün üstüne enjekte eder -->
        <section id="filterTab" hidden>
            <div class="panel">
                <h2>Geçmiş oran filtresi</h2>
                <div class="notice">Seçilen oranların tümü aynı maçta birebir aranır.</div>
            </div>
        </section>

        <section id="futureTab" hidden></section>
        <section id="couponTab" hidden></section>
        <section id="matchTab" hidden></section>
    </div>

    <!-- Veri Dosyaları ve Yardımcı Kütüphaneler -->
    <script src="data.js"></script>
    <script src="closing-data.js"></script>

    <!-- Sekme Kontrolü -->
    <script>
        function showTab(id) {
            document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === id));
            document.querySelectorAll('section').forEach(x => x.hidden = (x.id !== id));
        }

        function initTelegram() {
            let tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready();
            tg.expand();
        }
        initTelegram();
    </script>

    <!-- Bugünün Maçları Modülü (Analiz ve Canlı Skor Entegrasyonu) -->
    <script src="bugun.js"></script>

    <!-- Service Worker -->
    <script>
        if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
        }
    </script>
</body>
</html>
