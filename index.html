<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <title>Maçkolik Oran Analiz</title>

    <link
        rel="stylesheet"
        href="styles.css?v=1"
    >
</head>

<body>

<div class="app">

    <!-- =====================================================
         BAŞLIK
    ====================================================== -->

    <header class="header">

        <div>
            <h1 class="title">
                Maçkolik Oran Analiz
            </h1>

            <div class="subtitle">
                Geçmiş oranlara göre istatistiksel analiz
            </div>
        </div>

        <button
            id="refreshButton"
            class="refresh"
            type="button"
        >
            🔄 Yenile
        </button>

    </header>


    <!-- =====================================================
         TAKVİM
    ====================================================== -->

    <section class="calendar-wrapper">

        <button
            id="calendarButton"
            class="calendar-button"
            type="button"
        >

            <span class="calendar-icon">
                📅
            </span>

            <span class="calendar-button-info">

                <small>
                    Tarih
                </small>

                <strong id="selectedDateText">
                    Yükleniyor...
                </strong>

            </span>

            <span class="calendar-arrow">
                ⌄
            </span>

        </button>


        <div
            id="calendarPopup"
            class="calendar-popup"
            hidden
        >

            <div class="calendar-header">

                <button
                    id="prevMonth"
                    class="month-button"
                    type="button"
                >
                    ‹
                </button>

                <strong id="calendarMonth">
                    —
                </strong>

                <button
                    id="nextMonth"
                    class="month-button"
                    type="button"
                >
                    ›
                </button>

            </div>


            <div class="calendar-weekdays">

                <span>Pzt</span>
                <span>Sal</span>
                <span>Çar</span>
                <span>Per</span>
                <span>Cum</span>
                <span>Cmt</span>
                <span>Paz</span>

            </div>


            <div
                id="calendarDays"
                class="calendar-days"
            ></div>


            <button
                id="todayButton"
                class="today-button"
                type="button"
            >
                Bugüne Git
            </button>

        </div>

    </section>


    <!-- =====================================================
         ÖZET
    ====================================================== -->

    <section
        id="summary"
        class="summary"
    ></section>


    <!-- =====================================================
         MAÇLAR
    ====================================================== -->

    <main
        id="content"
        class="content"
    >

        <div class="loading">
            Maç verileri yükleniyor...
        </div>

    </main>


    <!-- =====================================================
         ALT BİLGİ
    ====================================================== -->

    <footer class="footer">

        Geçmiş maç verileri üzerinden
        istatistiksel oran analizi

    </footer>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script src="app.js?v=1"></script>

</body>
</html>
