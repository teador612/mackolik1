<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maçkolik - Oran Analiz</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white">

<div class="max-w-7xl mx-auto p-4">

<h1 class="text-2xl font-bold text-center mb-4">
Maçkolik Oran Analiz
</h1>

<div id="message"
class="bg-slate-800 p-3 rounded mb-3 text-center">
Veriler yükleniyor...
</div>

<div id="updatedAt"
class="text-center text-xs text-slate-400 mb-4"></div>

<div class="bg-slate-800 p-4 rounded-xl mb-4">

<div class="grid grid-cols-1 md:grid-cols-4 gap-3">

<input
id="search"
type="text"
placeholder="Takım ara..."
class="bg-slate-900 border border-slate-700 rounded p-3">

<select
id="dateFilter"
class="bg-slate-900 border border-slate-700 rounded p-3">
<option value="">Tüm tarihler</option>
</select>

<select
id="leagueFilter"
class="bg-slate-900 border border-slate-700 rounded p-3">
<option value="">Tüm ligler</option>
</select>

<label class="flex items-center gap-2 p-3">
<input id="unplayedOnly" type="checkbox">
Oynanmamış maçlar
</label>

</div>
</div>

<div class="bg-slate-800 rounded-xl overflow-hidden">

<div class="overflow-x-auto">

<table class="w-full text-sm">

<thead class="bg-slate-900">

<tr>
<th class="p-3">Tarih</th>
<th class="p-3">Saat</th>
<th class="p-3">Lig</th>
<th class="p-3">Kod</th>
<th class="p-3">Ev</th>
<th class="p-3">Deplasman</th>
<th class="p-3">İY</th>
<th class="p-3">MS</th>
<th class="p-3">MS1</th>
<th class="p-3">MSX</th>
<th class="p-3">MS2</th>
<th class="p-3">KG Var</th>
<th class="p-3">KG Yok</th>
<th class="p-3">2.5 Alt</th>
<th class="p-3">2.5 Üst</th>
</tr>

</thead>

<tbody id="matches">

<tr>
<td colspan="15"
class="p-8 text-center">
Veriler yükleniyor...
</td>
</tr>

</tbody>

</table>

</div>
</div>

</div>

<script>

const state={
matches:[],
filters:{
search:"",
date:"",
league:"",
unplayed:false
}
};

const $=id=>document.getElementById(id);

const esc=value=>
String(value??"").replace(
/[&<>"']/g,
char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[char])
);

function odd(value){

if(value===null||
value===undefined||
value===""){
return "—";
}

const n=Number(value);

return Number.isFinite(n)
?n.toFixed(2)
:"—";

}

function score(value){

if(!value){
return "—";
}

if(
value.home===null||
value.home===undefined||
value.away===null||
value.away===undefined
){
return "—";
}

return `${value.home} - ${value.away}`;

}

function sortKey(match){

const parts=
String(match.date??"").split(".");

const day=parts[0]??"";
const month=parts[1]??"";
const year=parts[2]??"";

return `${year}-${month}-${day} ${match.time??""}`;

}

function filteredMatches(){

const q=
state.filters.search
.toLocaleLowerCase("tr-TR");

return state.matches
.filter(match=>{

const text=
`${match.home??""} ${match.away??""} ${match.code??""}`
.toLocaleLowerCase("tr-TR");

const searchOK=
!q||text.includes(q);

const dateOK=
!state.filters.date||
match.date===state.filters.date;

const leagueOK=
!state.filters.league||
match.league===state.filters.league;

const unplayedOK=
!state.filters.unplayed||
(
(match.score?.home===null||
match.score?.home===undefined||
match.score?.home==="")&&
(match.score?.away===null||
match.score?.away===undefined||
match.score?.away==="")
);

return(
searchOK&&
dateOK&&
leagueOK&&
unplayedOK
);

})
.sort(
(a,b)=>
sortKey(a).localeCompare(
sortKey(b)
)
);

}

function render(){

const rows=
filteredMatches();

$("message").textContent=
`${rows.length} maç gösteriliyor.`;

$("matches").innerHTML=
rows.map(match=>{

const o=
match.openingOdds||{};

return `
<tr class="border-t border-slate-800 hover:bg-slate-800">

<td class="p-3">${esc(match.date)}</td>

<td class="p-3">${esc(match.time||"—")}</td>

<td class="p-3">${esc(match.league)}</td>

<td class="p-3">${esc(match.code)}</td>

<td class="p-3 font-semibold">
${esc(match.home)}
</td>

<td class="p-3 font-semibold">
${esc(match.away)}
</td>

<td class="p-3">
${esc(score(match.halfTimeScore))}
</td>

<td class="p-3 font-bold text-yellow-400">
${esc(score(match.score))}
</td>

<td class="p-3">${odd(o.ms1)}</td>

<td class="p-3">${odd(o.msX)}</td>

<td class="p-3">${odd(o.ms2)}</td>

<td class="p-3">${odd(o.kgVar)}</td>

<td class="p-3">${odd(o.kgYok)}</td>

<td class="p-3">${odd(o.au25Alt)}</td>

<td class="p-3">${odd(o.au25Ust)}</td>

</tr>
`;

}).join("");

}

function fillFilters(){

const dates=[
...new Set(
state.matches
.map(m=>m.date)
.filter(Boolean)
)
].sort();

const leagues=[
...new Set(
state.matches
.map(m=>m.league)
.filter(Boolean)
)
].sort(
(a,b)=>
a.localeCompare(b,"tr")
);

$("dateFilter").innerHTML=
'<option value="">Tüm tarihler</option>'+
dates.map(
v=>
`<option value="${esc(v)}">${esc(v)}</option>`
).join("");

$("leagueFilter").innerHTML=
'<option value="">Tüm ligler</option>'+
leagues.map(
v=>
`<option value="${esc(v)}">${esc(v)}</option>`
).join("");

}

$("search").addEventListener(
"input",
event=>{
state.filters.search=
event.target.value;
render();
}
);

$("dateFilter").addEventListener(
"change",
event=>{
state.filters.date=
event.target.value;
render();
}
);

$("leagueFilter").addEventListener(
"change",
event=>{
state.filters.league=
event.target.value;
render();
}
);

$("unplayedOnly").addEventListener(
"change",
event=>{
state.filters.unplayed=
event.target.checked;
render();
}
);

async function loadData(){

try{

$("message").textContent=
"Veriler yükleniyor...";

const url=
new URL(
"./data/matches.json",
window.location.href
);

url.searchParams.set(
"_",
Date.now()
);

console.log(
"VERİ ADRESİ:",
url.href
);

const response=
await fetch(
url.href,
{
method:"GET",
cache:"no-store"
}
);

console.log(
"HTTP:",
response.status
);

if(!response.ok){

throw new Error(
`HTTP ${response.status} ${response.statusText}`
);

}

const text=
await response.text();

console.log(
"GELEN VERİ:",
text.substring(0,300)
);

let data;

try{

data=
JSON.parse(text);

}catch(e){

throw new Error(
"JSON okunamadı. Gelen cevap JSON değil."
);

}

if(!data){

throw new Error(
"JSON boş."
);

}

if(Array.isArray(data)){

state.matches=data;

}else if(
Array.isArray(data.matches)
){

state.matches=
data.matches;

}else{

throw new Error(
"JSON içinde matches bulunamadı."
);

}

$("updatedAt").textContent=
data.updatedAt
?
`Son güncelleme: ${new Date(data.updatedAt).toLocaleString("tr-TR")}`
:
"Veri güncelleme zamanı bulunamadı.";

fillFilters();

render();

console.log(
"BAŞARILI:",
state.matches.length,
"maç"
);

}catch(error){

console.error(
"VERİ HATASI:",
error
);

$("message").innerHTML=
`
<span class="text-red-400">
Veri yüklenemedi: ${esc(error.message)}
</span>
`;

$("updatedAt").textContent=
"Veri bağlantısı başarısız.";

$("matches").innerHTML=
`
<tr>
<td colspan="15"
class="p-8 text-center text-red-400">
${esc(error.message)}
</td>
</tr>
`;

}

}

loadData();

</script>

</body>
</html>
