<html lang="tr">
<head>

<title>Maçkolik - Açılış Oran Analizi</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:#07111f;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#10243b 0,#07111f 45%,#050b13 100%);
  color:#e8eef7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:13px;
  min-height:100vh;
  padding-bottom:80px;
}

button,
select{
  font:inherit;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:10px;
}

/* HEADER */

.header{
  text-align:center;
  padding:10px 5px 8px;
}

.header h1{
  margin:0;
  font-size:20px;
  font-weight:800;
}

.header p{
  margin:4px 0 0;
  color:#91a1b6;
  font-size:11px;
}

/* CONTROLS */

.controls{
  display:flex;
  gap:7px;
  margin:8px 0;
}

.controls select,
.controls button{
  min-height:38px;
  border:1px solid #24364c;
  border-radius:9px;
  background:#0d1a2a;
  color:#fff;
  padding:0 10px;
}

.controls select{
  flex:1;
  min-width:0;
}

.controls button{
  background:#1677ff;
  border-color:#1677ff;
  font-weight:700;
}

/* STATISTICS */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin:8px 0 10px;
}

.stat-box{
  background:rgba(13,26,42,.94);
  border:1px solid #24364c;
  border-radius:11px;
  padding:10px;
  text-align:center;
}

.stat-title{
  color:#94a6bb;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
}

.stat-percent{
  margin-top:3px;
  font-size:23px;
  line-height:1.1;
  font-weight:900;
}

.stat-detail{
  margin-top:3px;
  color:#8495aa;
  font-size:10px;
}

.stat-day .stat-percent{
  color:#42e477;
}

.stat-all .stat-percent{
  color:#54a7ff;
}

.section-title{
  font-size:12px;
  font-weight:800;
  color:#b8c5d6;
  margin:10px 2px 6px;
}

.info{
  color:#7f91a8;
  font-size:10px;
  margin:4px 2px 8px;
}

/* MATCH CARD */

.match-card{
  position:relative;
  margin:7px 0;
  border:1px solid #26384e;
  border-left:4px solid #344a63;
  border-radius:11px;
  background:rgba(11,23,37,.96);
  overflow:hidden;
  transition:.15s;
}

.match-card.match-success{
  border-color:#168b43;
  border-left-color:#27d866;
  background:linear-gradient(90deg,rgba(20,91,48,.30),rgba(11,23,37,.97));
}

.match-card.match-fail{
  border-color:#9b3038;
  border-left-color:#ff4d5b;
  background:linear-gradient(90deg,rgba(110,25,35,.30),rgba(11,23,37,.97));
}

.match-card.match-pending{
  border-color:#9a741e;
  border-left-color:#ffd33d;
  background:linear-gradient(90deg,rgba(112,83,17,.27),rgba(11,23,37,.97));
}

.match-main{
  padding:9px;
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-bottom:6px;
}

.match-meta{
  color:#75879c;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status-badge{
  flex:none;
  padding:3px 7px;
  border-radius:20px;
  font-size:9px;
  font-weight:800;
}

.status-success{
  color:#79ff9d;
  background:rgba(31,190,86,.16);
  border:1px solid rgba(31,190,86,.4);
}

.status-fail{
  color:#ff858e;
  background:rgba(235,55,69,.16);
  border:1px solid rgba(235,55,69,.4);
}

.status-pending{
  color:#ffe17b;
  background:rgba(234,178,36,.14);
  border:1px solid rgba(234,178,36,.4);
}

/* TEAMS */

.match-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}

.team{
  min-width:0;
}

.team.home{
  text-align:right;
}

.team.away{
  text-align:left;
}

.team-name{
  font-size:12px;
  line-height:1.2;
  font-weight:800;
  overflow-wrap:anywhere;
}

.score{
  min-width:45px;
  text-align:center;
  color:#9aaabd;
  font-size:10px;
  line-height:1.4;
}

/* SCORE LABELS */

.scores{
  margin-top:5px;
  display:flex;
  justify-content:center;
  gap:12px;
  color:#8495a9;
  font-size:9px;
}

.scores strong{
  color:#c7d2df;
}

/* PREDICTION */

.main-prediction{
  margin-top:7px;
}

.prediction-box{
  border:1px solid #315d42;
  background:rgba(25,90,47,.16);
  border-radius:8px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.prediction-label{
  color:#8ea0b5;
  font-size:9px;
}

.prediction-result{
  font-size:12px;
  font-weight:900;
  color:#fff;
}

.prediction-percent{
  color:#53e87d;
  font-size:14px;
  font-weight:900;
}

/* EXPAND */

.expand-row{
  display:flex;
  justify-content:center;
  margin-top:6px;
}

.expand-btn{
  width:30px;
  height:25px;
  padding:0;
  border-radius:7px;
  border:1px solid #31455d;
  background:#101f31;
  color:#a9bbcf;
  font-weight:900;
  cursor:pointer;
}

.match-details{
  display:none;
  border-top:1px solid #223449;
  padding:7px;
  background:rgba(5,13,23,.42);
}

.match-card.open .match-details{
  display:block;
}

.suggestion{
  border:1px solid #263a50;
  border-radius:8px;
  padding:7px;
  margin:5px 0;
  background:#0c1928;
}

.suggestion-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.suggestion-market{
  color:#8da0b6;
  font-size:9px;
}

.suggestion-result{
  color:#fff;
  font-size:11px;
  font-weight:800;
}

.suggestion-percent{
  color:#5fe987;
  font-size:12px;
  font-weight:900;
}

.suggestion-sample{
  color:#74879d;
  font-size:8px;
  margin-top:3px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:30px 10px;
  color:#788ba2;
  font-size:11px;
}

/* BOTTOM APP NAV */

.bottom-nav{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  height:58px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(5,12,21,.96);
  border-top:1px solid #203248;
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:center;
}

.bottom-nav-inner{
  width:100%;
  max-width:900px;
  display:flex;
  align-items:center;
  justify-content:space-around;
}

.nav-item{
  color:#71849a;
  font-size:9px;
  text-align:center;
  padding:5px 18px;
  cursor:pointer;
}

.nav-item.active{
  color:#4aa2ff;
}

.nav-icon{
  display:block;
  font-size:18px;
  line-height:20px;
}

/* INSTALL */

.install-btn{
  display:none;
  width:100%;
  margin:7px 0;
  padding:9px;
  border:1px solid #245d94;
  border-radius:9px;
  background:#0e3152;
  color:#9dceff;
  font-weight:800;
}

/* MOBILE */

@media(max-width:600px){
  .app{
    padding:7px;
  }

  .header h1{
    font-size:17px;
  }

  .header p{
    font-size:9px;
  }

  .controls select,
  .controls button{
    min-height:35px;
    font-size:11px;
  }

  .stats{
    gap:5px;
  }

  .stat-box{
    padding:8px 5px;
  }

  .stat-percent{
    font-size:20px;
  }

  .team-name{
    font-size:11px;
  }

  .prediction-result{
    font-size:11px;
  }

  .match-main{
    padding:8px;
  }

  .match-meta{
    font-size:8px;
  }

  .bottom-nav{
    height:56px;
  }
}
</style>

<body>

<div class="app">

  <header class="header">
    <h1>⚽ Maçkolik</h1>
    <p>Açılış oranlarından geçmiş sonuç analizi</p>
  </header>

  <button id="installBtn" class="install-btn">
    📲 Uygulamayı Ana Ekrana Ekle
  </button>

  <div class="controls">
    <select id="dateSelect"></select>
    <button id="showBtn">Göster</button>
  </div>

  <div class="stats">

    <div class="stat-box stat-day">
      <div class="stat-title">Günün Maçları Başarı Oranı</div>
      <div id="dayPercent" class="stat-percent">--</div>
      <div id="dayDetail" class="stat-detail">
        Henüz sonuçlanan öneri yok
      </div>
    </div>

    <div class="stat-box stat-all">
      <div class="stat-title">Tüm Geçmiş Başarı Oranı</div>
      <div id="allPercent" class="stat-percent">--</div>
      <div id="allDetail" class="stat-detail">
        Hesaplanıyor...
      </div>
    </div>

  </div>

  <div id="info" class="info"></div>

  <div class="section-title">
    📅 Maçlar ve Öneriler
  </div>

  <main id="matches"></main>

</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">

    <div class="nav-item active" id="navHome">
      <span class="nav-icon">🏠</span>
      Ana Sayfa
    </div>

    <div class="nav-item" id="navRefresh">
      <span class="nav-icon">🔄</span>
      Yenile
    </div>

  </div>
</nav>

<script>
'use strict';

/* =========================================================
   AYARLAR
========================================================= */

const DATA_URL = './data/matches.json';

const MIN_SUCCESS = 70;
const MIN_SAMPLE = 5;
const ODDS_DECIMALS = 2;

/*
  DİKKAT:
  CS / ÇŞ tamamen kaldırıldı.
*/

const SOURCE_MARKETS = [
  ['ms1','MS 1'],
  ['msX','MS X'],
  ['ms2','MS 2'],

  ['kgVar','KG Var'],
  ['kgYok','KG Yok'],

  ['au15Ust','2.5 Alt/Üst kaynağı'],
  ['au15Alt','2.5 Alt/Üst kaynağı'],

  ['au25Ust','2.5 Üst'],
  ['au25Alt','2.5 Alt'],

  ['au35Ust','3.5 Üst'],
  ['au35Alt','3.5 Alt'],

  ['iy15Ust','İY 1.5 Üst'],
  ['iy15Alt','İY 1.5 Alt'],

  ['iy1','İY 1'],
  ['iyX','İY X'],
  ['iy2','İY 2']
];

const TARGET_RESULTS = [
  ['ms1','MS 1'],
  ['msX','MS X'],
  ['ms2','MS 2'],

  ['kgVar','KG Var'],
  ['kgYok','KG Yok'],

  ['over15','2.5 Üst'],
  ['under15','2.5 Alt'],

  ['over25','2.5 Üst'],
  ['under25','2.5 Alt'],

  ['over35','3.5 Üst'],
  ['under35','3.5 Alt'],

  ['iyOver05','İY 0.5 Üst'],
  ['iyUnder05','İY 0.5 Alt'],

  ['iyOver15','İY 1.5 Üst'],
  ['iyUnder15','İY 1.5 Alt'],

  ['iy1','İY 1'],
  ['iyX','İY X'],
  ['iy2','İY 2']
];

/* =========================================================
   STATE
========================================================= */

const state = {
  matches: [],
  selectedDate: '',
  analysisCache: new Map()
};

const $ = id => document.getElementById(id);

/* =========================================================
   YARDIMCILAR
========================================================= */

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function numberValue(value){
  if(value === null || value === undefined || value === '') {
    return null;
  }

  const n = Number(
    String(value)
      .replace(',', '.')
      .trim()
  );

  return Number.isFinite(n) ? n : null;
}

function odd(match,key){
  return numberValue(match?.openingOdds?.[key]);
}

/*
  TOLERANS YOK.

  3.30 ile 3.3 aynı sayısal orandır.
  Fakat 3.30 ile 3.31 eşleşmez.
*/

function oddsEqual(a,b){
  const x = numberValue(a);
  const y = numberValue(b);

  if(x === null || y === null){
    return false;
  }

  return Number(x.toFixed(ODDS_DECIMALS)) ===
         Number(y.toFixed(ODDS_DECIMALS));
}

function dateToNumber(date){
  if(!date) return 0;

  const p = String(date).split('.');

  if(p.length !== 3) return 0;

  return Number(
    `${p[2]}${p[1].padStart(2,'0')}${p[0].padStart(2,'0')}`
  );
}

function todayTR(){
  const d = new Date();

  return [
    String(d.getDate()).padStart(2,'0'),
    String(d.getMonth()+1).padStart(2,'0'),
    d.getFullYear()
  ].join('.');
}

/* =========================================================
   SKOR
========================================================= */

function validScoreObject(obj){
  if(!obj) return null;

  const h = numberValue(obj.home);
  const a = numberValue(obj.away);

  if(h === null || a === null) return null;
  if(h < 0 || a < 0) return null;

  return {
    home:h,
    away:a
  };
}

function getValidScore(match){

  const score = validScoreObject(match?.score);

  if(!score) return null;

  /*
    Bazı eski kayıtlarda maç başlamadan önce 0-0 gelebiliyor.
    Açıkça başlamamış status değerlerinde bunu skor kabul etmiyoruz.
  */

  const status = String(match?.status ?? '').toLowerCase();

  if(
    score.home === 0 &&
    score.away === 0 &&
    (
      status === '0' ||
      status === '1' ||
      status === 'not_started' ||
      status === 'notstarted'
    )
  ){
    return null;
  }

  return score;
}

function getValidHalfScore(match){
  return validScoreObject(match?.halfTimeScore);
}

/* =========================================================
   TARGET HESAPLAMA
========================================================= */

function calculateTarget(match,key){

  const score = getValidScore(match);
  const half = getValidHalfScore(match);

  switch(key){

    case 'ms1':
      if(!score) return null;
      return score.home > score.away;

    case 'msX':
      if(!score) return null;
      return score.home === score.away;

    case 'ms2':
      if(!score) return null;
      return score.home < score.away;

    case 'kgVar':
      if(!score) return null;
      return score.home > 0 && score.away > 0;

    case 'kgYok':
      if(!score) return null;
      return score.home === 0 || score.away === 0;

    case 'over15':
      if(!score) return null;
      return score.home + score.away >= 2;

    case 'under15':
      if(!score) return null;
      return score.home + score.away <= 1;

    case 'over25':
      if(!score) return null;
      return score.home + score.away >= 3;

    case 'under25':
      if(!score) return null;
      return score.home + score.away <= 2;

    case 'over35':
      if(!score) return null;
      return score.home + score.away >= 4;

    case 'under35':
      if(!score) return null;
      return score.home + score.away <= 3;

    /*
      İY 0.5 ÜST:
      En az 1 ilk yarı golü.

      İY 0.5 ALT:
      İlk yarı 0-0.
    */

    case 'iyOver05':
      if(!half) return null;
      return half.home + half.away >= 1;

    case 'iyUnder05':
      if(!half) return null;
      return half.home + half.away === 0;

    case 'iyOver15':
      if(!half) return null;
      return half.home + half.away >= 2;

    case 'iyUnder15':
      if(!half) return null;
      return half.home + half.away <= 1;

    case 'iy1':
      if(!half) return null;
      return half.home > half.away;

    case 'iyX':
      if(!half) return null;
      return half.home === half.away;

    case 'iy2':
      if(!half) return null;
      return half.home < half.away;

    default:
      return null;
  }
}

/* =========================================================
   GEÇMİŞ
========================================================= */

function getHistory(date){
  const current = dateToNumber(date);

  return state.matches.filter(m => {
    return dateToNumber(m.date) < current;
  });
}

/* =========================================================
   MAÇ ANALİZİ
========================================================= */

function analyzeMatch(current){

  const cacheKey = String(current.code || '') + '|' + current.date;

  if(state.analysisCache.has(cacheKey)){
    return state.analysisCache.get(cacheKey);
  }

  const history = getHistory(current.date);

  const suggestions = [];

  for(const [sourceKey,sourceLabel] of SOURCE_MARKETS){

    const currentOdd = odd(current,sourceKey);

    if(currentOdd === null){
      continue;
    }

    const sameOddMatches = history.filter(m => {
      return oddsEqual(
        odd(m,sourceKey),
        currentOdd
      );
    });

    if(sameOddMatches.length < MIN_SAMPLE){
      continue;
    }

    for(const [targetKey,targetLabel] of TARGET_RESULTS){

      let success = 0;
      let evaluated = 0;

      for(const oldMatch of sameOddMatches){

        const result = calculateTarget(
          oldMatch,
          targetKey
        );

        if(result === null){
          continue;
        }

        evaluated++;

        if(result === true){
          success++;
        }
      }

      if(evaluated < MIN_SAMPLE){
        continue;
      }

      const percent =
        (success / evaluated) * 100;

      if(percent >= MIN_SUCCESS){

        suggestions.push({
          sourceKey,
          sourceLabel,
          target:{
            key:targetKey,
            label:targetLabel
          },
          odd:currentOdd,
          success,
          total:evaluated,
          percent
        });

      }

    }
  }

  suggestions.sort((a,b) => {

    if(b.percent !== a.percent){
      return b.percent - a.percent;
    }

    if(b.total !== a.total){
      return b.total - a.total;
    }

    return b.success - a.success;
  });

  const result = {
    suggestions,
    best:suggestions[0] || null
  };

  state.analysisCache.set(cacheKey,result);

  return result;
}

/* =========================================================
   ÖNERİ DURUMU
========================================================= */

function getRecommendationStatus(match,analysis){

  if(!analysis?.best){
    return 'pending';
  }

  const result = calculateTarget(
    match,
    analysis.best.target.key
  );

  if(result === true){
    return 'success';
  }

  if(result === false){
    return 'fail';
  }

  return 'pending';
}

/* =========================================================
   GÜNÜN BAŞARI ORANI
========================================================= */

function calculateDayStats(date){

  let success = 0;
  let fail = 0;

  const dayMatches = state.matches.filter(
    m => m.date === date
  );

  for(const match of dayMatches){

    const analysis = analyzeMatch(match);

    if(!analysis.best){
      continue;
    }

    const result = calculateTarget(
      match,
      analysis.best.target.key
    );

    if(result === true){
      success++;
    }
    else if(result === false){
      fail++;
    }
  }

  const total = success + fail;

  return {
    success,
    fail,
    total,
    percent: total
      ? (success / total) * 100
      : null
  };
}

/* =========================================================
   TÜM GEÇMİŞ BAŞARI ORANI
========================================================= */

function calculateAllStats(){

  let success = 0;
  let fail = 0;

  /*
    Her tarih için o tarihteki maçın,
    o tarihten ÖNCEKİ verilerle oluşturulan
    ana önerisini değerlendiriyoruz.
  */

  for(const match of state.matches){

    const analysis = analyzeMatch(match);

    if(!analysis.best){
      continue;
    }

    const result = calculateTarget(
      match,
      analysis.best.target.key
    );

    if(result === true){
      success++;
    }
    else if(result === false){
      fail++;
    }
  }

  const total = success + fail;

  return {
    success,
    fail,
    total,
    percent: total
      ? (success / total) * 100
      : null
  };
}

/* =========================================================
   İSTATİSTİKLERİ GÖSTER
========================================================= */

function renderDayStats(){

  const stats = calculateDayStats(
    state.selectedDate
  );

  if(stats.percent === null){

    $('dayPercent').textContent = '--';

    $('dayDetail').textContent =
      'Henüz sonuçlanan öneri yok';

  }else{

    $('dayPercent').textContent =
      stats.percent.toFixed(1) + '%';

    $('dayDetail').textContent =
      `${stats.success} başarılı / ${stats.total} sonuçlanan öneri`;
  }
}

function renderAllStats(){

  $('allPercent').textContent = '...';

  /*
    Büyük veri setinde tarayıcıyı kilitlememek için
    hesaplamayı bir sonraki event loop'a bırakıyoruz.
  */

  setTimeout(() => {

    const stats = calculateAllStats();

    if(stats.percent === null){

      $('allPercent').textContent = '--';

      $('allDetail').textContent =
        'Henüz değerlendirilebilir öneri yok';

    }else{

      $('allPercent').textContent =
        stats.percent.toFixed(1) + '%';

      $('allDetail').textContent =
        `${stats.success} başarılı / ${stats.total} sonuçlanan öneri`;
    }

  },20);
}

/* =========================================================
   ÖNERİLERİ RENDER
========================================================= */

function renderSuggestions(suggestions){

  if(!suggestions.length){

    return `
      <div class="empty">
        Bu maç için %${MIN_SUCCESS} ve üzeri
        yeterli geçmiş veri bulunamadı.
      </div>
    `;
  }

  return suggestions.map((s,index) => {

    return `
      <div class="suggestion">

        <div class="suggestion-head">

          <div>
            <div class="suggestion-market">
              ${index + 1}. ${esc(s.sourceLabel)}
              · Açılış ${s.odd.toFixed(2)}
            </div>

            <div class="suggestion-result">
              ${esc(s.target.label)}
            </div>
          </div>

          <div class="suggestion-percent">
            %${s.percent.toFixed(1)}
          </div>

        </div>

        <div class="suggestion-sample">
          ${s.success}/${s.total} başarılı
        </div>

      </div>
    `;

  }).join('');
}

/* =========================================================
   MAÇ KARTI
========================================================= */

function createMatch(match){

  const analysis = analyzeMatch(match);

  const best = analysis.best;

  const status =
    getRecommendationStatus(
      match,
      analysis
    );

  const card =
    document.createElement('article');

  card.className =
    `match-card match-${status}`;

  let statusText = '';

  if(status === 'success'){
    statusText = '🟢 Başarılı';
  }
  else if(status === 'fail'){
    statusText = '🔴 Başarısız';
  }
  else{
    statusText = '🟡 Bekliyor';
  }

  const score =
    getValidScore(match);

  const half =
    getValidHalfScore(match);

  const fullScore =
    score
      ? `${score.home}-${score.away}`
      : '-';

  const halfScore =
    half
      ? `${half.home}-${half.away}`
      : '-';

  const bestHtml = best
    ? `
      <div class="prediction-box">

        <div>
          <div class="prediction-label">
            En güçlü öneri
          </div>

          <div class="prediction-result">
            ${esc(best.target.label)}
          </div>
        </div>

        <div class="prediction-percent">
          %${best.percent.toFixed(1)}
        </div>

      </div>
    `
    : `
      <div class="prediction-box">
        <div>
          <div class="prediction-label">
            Öneri
          </div>

          <div class="prediction-result">
            Yeterli veri yok
          </div>
        </div>
      </div>
    `;

  card.innerHTML = `

    <div class="match-main">

      <div class="match-top">

        <div class="match-meta">
          ${esc(match.league || 'Lig')}
          · ${esc(match.time || '')}
        </div>

        <div class="
          status-badge
          ${
            status === 'success'
              ? 'status-success'
              : status === 'fail'
                ? 'status-fail'
                : 'status-pending'
          }
        ">
          ${statusText}
        </div>

      </div>

      <div class="match-teams">

        <div class="team home">
          <div class="team-name">
            ${esc(match.home)}
          </div>
        </div>

        <div class="score">
          ${esc(match.time || '')}
        </div>

        <div class="team away">
          <div class="team-name">
            ${esc(match.away)}
          </div>
        </div>

      </div>

      <div class="scores">

        <span>
          <strong>MS Skor:</strong>
          ${fullScore}
        </span>

        <span>
          <strong>İY Skor:</strong>
          ${halfScore}
        </span>

      </div>

      <div class="main-prediction">
        ${bestHtml}
      </div>

      <div class="expand-row">
        <button class="expand-btn" type="button">
          +
        </button>
      </div>

    </div>

    <div class="match-details">
      ${renderSuggestions(analysis.suggestions)}
    </div>

  `;

  const btn =
    card.querySelector('.expand-btn');

  btn.addEventListener('click',() => {

    card.classList.toggle('open');

    btn.textContent =
      card.classList.contains('open')
        ? '−'
        : '+';

  });

  return card;
}

/* =========================================================
   TARİH SEÇİMİ
========================================================= */

function populateDates(){

  const select =
    $('dateSelect');

  const dates = [
    ...new Set(
      state.matches
        .map(m => m.date)
        .filter(Boolean)
    )
  ];

  dates.sort(
    (a,b) => dateToNumber(b) - dateToNumber(a)
  );

  select.innerHTML = '';

  const today =
    todayTR();

  let selected =
    dates.includes(today)
      ? today
      : dates[0] || '';

  dates.forEach(date => {

    const option =
      document.createElement('option');

    option.value = date;
    option.textContent = date;

    if(date === selected){
      option.selected = true;
    }

    select.appendChild(option);

  });

  state.selectedDate = selected;
}

/* =========================================================
   SEÇİLEN TARİHİ GÖSTER
========================================================= */

function showSelectedDate(){

  state.selectedDate =
    $('dateSelect').value;

  const container =
    $('matches');

  container.innerHTML = '';

  const matches =
    state.matches
      .filter(m =>
        m.date === state.selectedDate
      )
      .sort((a,b) =>
        String(a.time || '')
          .localeCompare(
            String(b.time || '')
          )
      );

  $('info').textContent =
    `${state.selectedDate} · ${matches.length} maç`;

  if(!matches.length){

    container.innerHTML = `
      <div class="empty">
        Bu tarihte maç bulunamadı.
      </div>
    `;

  }else{

    const fragment =
      document.createDocumentFragment();

    matches.forEach(match => {
      fragment.appendChild(
        createMatch(match)
      );
    });

    container.appendChild(fragment);
  }

  renderDayStats();
}

/* =========================================================
   VERİYİ YÜKLE
========================================================= */

async function loadData(){

  $('info').textContent =
    'Veriler yükleniyor...';

  try{

    const response =
      await fetch(
        DATA_URL + '?v=' + Date.now(),
        {
          cache:'no-store'
        }
      );

    if(!response.ok){
      throw new Error(
        'HTTP ' + response.status
      );
    }

    const data =
      await response.json();

    state.matches =
      Array.isArray(data)
        ? data
        : Array.isArray(data.matches)
          ? data.matches
          : [];

    state.analysisCache.clear();

    if(!state.matches.length){
      throw new Error(
        'Maç verisi bulunamadı'
      );
    }

    populateDates();
    showSelectedDate();

    renderAllStats();

  }catch(error){

    console.error(error);

    $('info').textContent =
      'Veri yüklenemedi.';

    $('matches').innerHTML = `
      <div class="empty">
        Veri yüklenemedi.<br>
        <small>${esc(error.message)}</small>
      </div>
    `;
  }
}

/* =========================================================
   BUTONLAR
========================================================= */

$('showBtn').addEventListener(
  'click',
  showSelectedDate
);

$('dateSelect').addEventListener(
  'change',
  showSelectedDate
);

$('navHome').addEventListener(
  'click',
  () => window.scrollTo({
    top:0,
    behavior:'smooth'
  })
);

$('navRefresh').addEventListener(
  'click',
  () => location.reload()
);

/* =========================================================
   PWA INSTALL
========================================================= */

let deferredPrompt = null;

window.addEventListener(
  'beforeinstallprompt',
  event => {

    event.preventDefault();

    deferredPrompt = event;

    $('installBtn').style.display =
      'block';
  }
);

$('installBtn').addEventListener(
  'click',
  async () => {

    if(!deferredPrompt){
      return;
    }

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt = null;

    $('installBtn').style.display =
      'none';
  }
);

/* =========================================================
   SERVICE WORKER
========================================================= */

if('serviceWorker' in navigator){

  window.addEventListener(
    'load',
    () => {

      navigator.serviceWorker
        .register('./sw.js')
        .catch(error =>
          console.log(
            'Service Worker:',
            error
          )
        );

    }
  );
}

/* =========================================================
   BAŞLAT
========================================================= */

loadData();

</script>
