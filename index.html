<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
 margin:0;
 padding:0;
 background:#060d16;

body{

.app{

header{

.meta{

.badge{

.bottom{

 display:flex;
 justify-content:center;
 z-index:20;
}

 width:100%;

.nav-icon{

<body>

<div class="app">

<header>
 <h1>⚽ Maçkolik</h1>
 <p>Açılış oranlarından geçmiş sonuç analizi</p>
</header>

<div class="controls">
 <select id="dateSelect"></select>
 <button id="showBtn">Göster</button>
</div>

<div class="stats">

 <div class="stat day">
  <div class="stat-title">Günün Başarı Oranı</div>
  <div id="dayPercent" class="stat-value">--</div>
  <div id="dayDetail" class="stat-detail">Hesaplanıyor...</div>
 </div>

 <div class="stat all">
  <div class="stat-title">Tüm Geçmiş</div>
  <div id="allPercent" class="stat-value">--</div>
  <div id="allDetail" class="stat-detail">Hesaplanıyor...</div>
 </div>

</div>

<div id="info"></div>

<div id="matches"></div>

</div>

<div class="bottom">
 <div class="bottom-inner">

  <div class="nav active" onclick="window.scrollTo({top:0,behavior:'smooth'})">
   <span class="nav-icon">🏠</span>
   Ana Sayfa
  </div>

  <div class="nav" onclick="location.reload()">
   <span class="nav-icon">🔄</span>
   Yenile
  </div>

 </div>
</div>

<script>
'use strict';

const DATA_URL='./data/matches.json';

const MIN_SUCCESS=70;
const MIN_SAMPLE=5;

/* =========================================================
   ANALİZDE KULLANILACAK AÇILIŞ ORANLARI

   ÇŞ YOK.
   0 olan oranlar YOK SAYILIR.
========================================================= */

const SOURCES=[
 {key:'ms1',name:'MS 1'},
 {key:'msX',name:'MS X'},
 {key:'ms2',name:'MS 2'},

 {key:'kgVar',name:'KG Var'},
 {key:'kgYok',name:'KG Yok'},

 {key:'au15Ust',name:'1.5 Üst'},
 {key:'au15Alt',name:'1.5 Alt'},

 {key:'au25Ust',name:'2.5 Üst'},
 {key:'au25Alt',name:'2.5 Alt'},

 {key:'au35Ust',name:'3.5 Üst'},
 {key:'au35Alt',name:'3.5 Alt'},

 {key:'iy15Ust',name:'İY 1.5 Üst'},
 {key:'iy15Alt',name:'İY 1.5 Alt'},

 {key:'iy1',name:'İY 1'},
 {key:'iyX',name:'İY X'},
 {key:'iy2',name:'İY 2'}
];

/* =========================================================
   HEDEF SONUÇLAR
========================================================= */

const TARGETS=[
 {key:'ms1',name:'MS 1'},
 {key:'msX',name:'MS X'},
 {key:'ms2',name:'MS 2'},

 {key:'kgVar',name:'KG Var'},
 {key:'kgYok',name:'KG Yok'},

 {key:'over15',name:'1.5 Üst'},
 {key:'under15',name:'1.5 Alt'},

 {key:'over25',name:'2.5 Üst'},
 {key:'under25',name:'2.5 Alt'},

 {key:'over35',name:'3.5 Üst'},
 {key:'under35',name:'3.5 Alt'},

 {key:'iyOver05',name:'İY 0.5 Üst'},
 {key:'iyUnder05',name:'İY 0.5 Alt'},

 {key:'iyOver15',name:'İY 1.5 Üst'},
 {key:'iyUnder15',name:'İY 1.5 Alt'},

 {key:'iy1',name:'İY 1'},
 {key:'iyX',name:'İY X'},
 {key:'iy2',name:'İY 2'}
];

const state={
 matches:[],
 selectedDate:'',
 cache:new Map()
};

/* =========================================================
   YARDIMCILAR
========================================================= */

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function num(v){
 if(v===null||v===undefined||v==='') return null;

 const n=Number(String(v).replace(',','.'));

 return Number.isFinite(n)?n:null;
}

/*
  TAM EŞLEŞME.
  Tolerans yok.

  3.3 = 3.30 kabul edilir.
  3.30 ile 3.31 eşleşmez.
*/

function sameOdd(a,b){

 const x=num(a);
 const y=num(b);

 if(x===null||y===null) return false;
 if(x<=0||y<=0) return false;

 return x===y;
}

function dateNumber(d){

 if(!d) return 0;

 const p=d.split('.');

 if(p.length!==3) return 0;

 return Number(
  p[2]+
  p[1].padStart(2,'0')+
  p[0].padStart(2,'0')
 );
}

function today(){

 const d=new Date();

 return [
  String(d.getDate()).padStart(2,'0'),
  String(d.getMonth()+1).padStart(2,'0'),
  d.getFullYear()
 ].join('.');
}

function getOdd(match,key){

 const value=num(
  match?.openingOdds?.[key]
 );

 if(value===null||value<=0) return null;

 return value;
}

/* =========================================================
   SKOR
========================================================= */

function scoreOf(obj){

 if(!obj) return null;

 const h=num(obj.home);
 const a=num(obj.away);

 if(h===null||a===null) return null;
 if(h<0||a<0) return null;

 return {home:h,away:a};
}

function getScore(match){
 return scoreOf(match.score);
}

function getHalf(match){
 return scoreOf(match.halfTimeScore);
}

/* =========================================================
   SONUÇ HESABI
========================================================= */

function result(match,key){

 const s=getScore(match);
 const h=getHalf(match);

 switch(key){

  case 'ms1':
   if(!s)return null;
   return s.home>s.away;

  case 'msX':
   if(!s)return null;
   return s.home===s.away;

  case 'ms2':
   if(!s)return null;
   return s.home<s.away;

  case 'kgVar':
   if(!s)return null;
   return s.home>0&&s.away>0;

  case 'kgYok':
   if(!s)return null;
   return s.home===0||s.away===0;

  case 'over15':
   if(!s)return null;
   return s.home+s.away>=2;

  case 'under15':
   if(!s)return null;
   return s.home+s.away<=1;

  case 'over25':
   if(!s)return null;
   return s.home+s.away>=3;

  case 'under25':
   if(!s)return null;
   return s.home+s.away<=2;

  case 'over35':
   if(!s)return null;
   return s.home+s.away>=4;

  case 'under35':
   if(!s)return null;
   return s.home+s.away<=3;

  /* İY 0.5 */

  case 'iyOver05':
   if(!h)return null;
   return h.home+h.away>=1;

  case 'iyUnder05':
   if(!h)return null;
   return h.home+h.away===0;

  /* İY 1.5 */

  case 'iyOver15':
   if(!h)return null;
   return h.home+h.away>=2;

  case 'iyUnder15':
   if(!h)return null;
   return h.home+h.away<=1;

  case 'iy1':
   if(!h)return null;
   return h.home>h.away;

  case 'iyX':
   if(!h)return null;
   return h.home===h.away;

  case 'iy2':
   if(!h)return null;
   return h.home<h.away;

  default:
   return null;
 }
}

/* =========================================================
   GEÇMİŞ MAÇLAR

   Örneğin 30.09 maçı için sadece
   30.09'dan ÖNCEKİ maçlar kullanılır.
========================================================= */

function historyFor(date){

 const d=dateNumber(date);

 return state.matches.filter(m=>
  dateNumber(m.date)<d
 );
}

/* =========================================================
   ANALİZ
========================================================= */

function analyze(match){

 const cacheKey=String(match.code||'')+'_'+match.date;

 if(state.cache.has(cacheKey)){
  return state.cache.get(cacheKey);
 }

 const history=historyFor(match.date);

 const list=[];

 for(const source of SOURCES){

  const currentOdd=getOdd(
   match,
   source.key
  );

  if(currentOdd===null) continue;

  const same=history.filter(old=>{

   const oldOdd=getOdd(
    old,
    source.key
   );

   return sameOdd(
    currentOdd,
    oldOdd
   );

  });

  if(same.length<MIN_SAMPLE) continue;

  for(const target of TARGETS){

   let success=0;
   let total=0;

   for(const old of same){

    const r=result(
     old,
     target.key
    );

    if(r===null) continue;

    total++;

    if(r===true){
     success++;
    }

   }

   if(total<MIN_SAMPLE) continue;

   const percent=
    success/total*100;

   if(percent>=MIN_SUCCESS){

    list.push({
     source:source.name,
     sourceKey:source.key,
     target:target.name,
     targetKey:target.key,
     odd:currentOdd,
     success,
     total,
     percent
    });

   }

  }

 }

 list.sort((a,b)=>{

  if(b.percent!==a.percent)
   return b.percent-a.percent;

  if(b.total!==a.total)
   return b.total-a.total;

  return b.success-a.success;
 });

 const data={
  list,
  best:list[0]||null
 };

 state.cache.set(cacheKey,data);

 return data;
}

/* =========================================================
   ÖNERİNİN GERÇEK MAÇ SONUCUNA GÖRE DURUMU
========================================================= */

function statusOf(match,analysis){

 if(!analysis.best){
  return 'pending';
 }

 const r=result(
  match,
  analysis.best.targetKey
 );

 if(r===true) return 'success';
 if(r===false) return 'fail';

 return 'pending';
}

/* =========================================================
   GÜNÜN İSTATİSTİĞİ
========================================================= */

function dayStats(date){

 let success=0;
 let fail=0;

 const matches=state.matches.filter(
  m=>m.date===date
 );

 for(const match of matches){

  const analysis=analyze(match);

  if(!analysis.best) continue;

  const r=result(
   match,
   analysis.best.targetKey
  );

  if(r===true) success++;
  if(r===false) fail++;

 }

 const total=success+fail;

 return {
  success,
  fail,
  total,
  percent:total
   ? success/total*100
   :null
 };
}

/* =========================================================
   TÜM GEÇMİŞ
========================================================= */

function allStats(){

 let success=0;
 let fail=0;

 /*
   Sadece geçmişteki maçlar.
   Gelecekteki maçlar genel başarı oranına
   dahil edilmez.
 */

 const todayNumber=dateNumber(today());

 for(const match of state.matches){

  if(dateNumber(match.date)>=todayNumber){
   continue;
  }

  const analysis=analyze(match);

  if(!analysis.best) continue;

  const r=result(
   match,
   analysis.best.targetKey
  );

  if(r===true) success++;
  if(r===false) fail++;

 }

 const total=success+fail;

 return {
  success,
  fail,
  total,
  percent:total
   ? success/total*100
   :null
 };
}

/* =========================================================
   İSTATİSTİK GÖSTER
========================================================= */

function renderDayStats(){

 const s=dayStats(
  state.selectedDate
 );

 if(s.percent===null){

  $('dayPercent').textContent='--';

  $('dayDetail').textContent=
   'Henüz sonuçlanan öneri yok';

 }else{

  $('dayPercent').textContent=
   '%'+s.percent.toFixed(1);

  $('dayDetail').textContent=
   `${s.success} başarılı / ${s.total} sonuçlanan`;
 }
}

function renderAllStats(){

 $('allPercent').textContent='...';

 setTimeout(()=>{

  const s=allStats();

  if(s.percent===null){

   $('allPercent').textContent='--';

   $('allDetail').textContent=
    'Henüz sonuçlanan öneri yok';

  }else{

   $('allPercent').textContent=
    '%'+s.percent.toFixed(1);

   $('allDetail').textContent=
    `${s.success} başarılı / ${s.total} sonuçlanan`;
  }

 },20);
}

/* =========================================================
   DETAY ÖNERİLERİ
========================================================= */

function details(list){

 if(!list.length){

  return `
   <div class="empty">
    Bu maç için %${MIN_SUCCESS}
    üzerinde yeterli geçmiş veri bulunamadı.
   </div>
  `;
 }

 return list.map((x,i)=>`

  <div class="suggestion">

   <div class="suggestion-top">

    <div>

     <div class="suggestion-name">
      ${i+1}. ${esc(x.target)}
     </div>

     <div class="suggestion-source">
      Kaynak: ${esc(x.source)}
      · Açılış: ${x.odd.toFixed(2)}
     </div>

    </div>

    <div class="suggestion-percent">
     %${x.percent.toFixed(1)}
    </div>

   </div>

   <div class="sample">
    ${x.success}/${x.total} başarılı
   </div>

  </div>

 `).join('');
}

/* =========================================================
   MAÇ KARTI
========================================================= */

function card(match){

 const analysis=analyze(match);
 const best=analysis.best;

 const status=
  statusOf(match,analysis);

 const el=
  document.createElement('div');

 el.className=
  'match-card '+status;

 let badge='';

 if(status==='success'){
  badge='<span class="badge green">🟢 Başarılı</span>';
 }

 else if(status==='fail'){
  badge='<span class="badge red">🔴 Başarısız</span>';
 }

 else{
  badge='<span class="badge yellow">🟡 Bekliyor</span>';
 }

 const s=getScore(match);
 const h=getHalf(match);

 const ms=s
  ? `${s.home}-${s.away}`
  : '-';

 const iy=h
  ? `${h.home}-${h.away}`
  : '-';

 let prediction='';

 if(best){

  prediction=`

   <div class="prediction">

    <div>

     <div class="prediction-title">
      En güçlü öneri
     </div>

     <div class="prediction-name">
      ${esc(best.target)}
     </div>

    </div>

    <div class="prediction-percent">
     %${best.percent.toFixed(1)}
    </div>

   </div>

  `;

 }else{

  prediction=`

   <div class="prediction">

    <div>

     <div class="prediction-title">
      Öneri
     </div>

     <div class="prediction-name">
      Yeterli veri yok
     </div>

    </div>

   </div>

  `;
 }

 el.innerHTML=`

  <div class="match-main">

   <div class="top">

    <div class="meta">
     ${esc(match.league||'')}
     · ${esc(match.time||'')}
    </div>

    ${badge}

   </div>

   <div class="teams">

    <div class="team home">
     ${esc(match.home||'')}
    </div>

    <div class="time">
     ${esc(match.time||'')}
    </div>

    <div class="team away">
     ${esc(match.away||'')}
    </div>

   </div>

   <div class="scores">

    <span>
     <b>MS Skor:</b> ${ms}
    </span>

    <span>
     <b>İY Skor:</b> ${iy}
    </span>

   </div>

   ${prediction}

   <button class="expand" type="button">
    +
   </button>

  </div>

  <div class="details">
   ${details(analysis.list)}
  </div>

 `;

 const btn=
  el.querySelector('.expand');

 btn.addEventListener('click',()=>{

  el.classList.toggle('open');

  btn.textContent=
   el.classList.contains('open')
    ? '−'
    : '+';

 });

 return el;
}

/* =========================================================
   TARİHLER
========================================================= */

function dates(){

 const set=
  new Set(
   state.matches
    .map(x=>x.date)
    .filter(Boolean)
  );

 return [...set].sort(
  (a,b)=>dateNumber(b)-dateNumber(a)
 );
}

function setupDates(){

 const select=
  $('dateSelect');

 const list=dates();

 select.innerHTML='';

 const t=today();

 let selected=
  list.includes(t)
   ? t
   : list[0]||'';

 for(const d of list){

  const option=
   document.createElement('option');

  option.value=d;
  option.textContent=d;

  if(d===selected){
   option.selected=true;
  }

  select.appendChild(option);
 }

 state.selectedDate=selected;
}

/* =========================================================
   MAÇLARI GÖSTER
========================================================= */

function render(){

 state.selectedDate=
  $('dateSelect').value;

 const container=
  $('matches');

 container.innerHTML='';

 const list=
  state.matches
   .filter(m=>
    m.date===state.selectedDate
   )
   .sort((a,b)=>
    String(a.time||'')
     .localeCompare(
      String(b.time||'')
     )
   );

 $('info').textContent=
  `${state.selectedDate} · ${list.length} maç`;

 if(!list.length){

  container.innerHTML=`
   <div class="empty">
    Bu tarihte maç bulunamadı.
   </div>
  `;

 }else{

  const frag=
   document.createDocumentFragment();

  for(const match of list){
   frag.appendChild(
    card(match)
   );
  }

  container.appendChild(frag);
 }

 renderDayStats();
}

/* =========================================================
   VERİYİ YÜKLE
========================================================= */

async function load(){

 $('info').textContent=
  'Veriler yükleniyor...';

 try{

  const response=
   await fetch(
    DATA_URL+'?v='+Date.now(),
    {
     cache:'no-store'
    }
   );

  if(!response.ok){
   throw new Error(
    'Veri alınamadı: HTTP '+response.status
   );
  }

  const data=
   await response.json();

  /*
    Güncel JSON:
    {
      source,
      week,
      updatedAt,
      matches:[]
    }
  */

  if(!data ||
     !Array.isArray(data.matches)){

   throw new Error(
    'matches.json içinde matches dizisi bulunamadı.'
   );
  }

  state.matches=
   data.matches;

  state.cache.clear();

  if(!state.matches.length){

   throw new Error(
    'Maç listesi boş.'
   );
  }

  setupDates();

  render();

  renderAllStats();

 }catch(error){

  console.error(error);

  $('info').textContent=
   'Veri yüklenemedi';

  $('matches').innerHTML=`

   <div class="empty">

    <strong>Veri yüklenemedi.</strong>

    <br><br>

    ${esc(error.message)}

   </div>

  `;
 }
}

/* =========================================================
   EVENTLER
========================================================= */

$('showBtn').addEventListener(
 'click',
 render
);

$('dateSelect').addEventListener(
 'change',
 render
);

/* =========================================================
   BAŞLAT
========================================================= */

load();

</script>

</body>
</html>
