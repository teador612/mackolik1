<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#17130f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Basketbol">
  <link rel="manifest" href="manifest.json">
  <title>Basketbol Tahmin</title>

  <style>
    :root {
      color-scheme: dark;
      --court: #17130f;
      --panel: #211a14;
      --panel-light: #2c2118;
      --panel-deep: #19140f;
      --line: #493326;
      --orange: #f28b35;
      --orange-light: #ffb565;
      --text: #f7eee4;
      --muted: #ad9b89;
      --green: #59dda0;
      --red: #ff7b81;
      --yellow: #ffd166;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--court);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      font-size: 13px;
    }

    body {
      background-image:
        radial-gradient(ellipse at 50% -15%, #60381c 0, transparent 48%),
        linear-gradient(180deg, #21170f 0%, #17130f 42%, #120f0c 100%);
    }

    button, input, select { font: inherit; }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      padding: 15px;
      border: 1px solid #654126;
      border-radius: 14px;
      background: linear-gradient(135deg, #3a2618, #211811 72%);
      box-shadow: 0 7px 24px #0003;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: "🏀";
      position: absolute;
      right: 95px;
      top: -16px;
      font-size: 83px;
      opacity: .09;
      transform: rotate(-18deg);
      pointer-events: none;
    }

    .title {
      position: relative;
      z-index: 1;
      color: #fff7ed;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.5px;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      margin-top: 5px;
      color: #d3a77f;
      font-size: 10px;
    }

    .mackolik-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 9px 11px;
      border: 1px solid #765137;
      border-radius: 8px;
      background: #2b2018;
      color: #f6ddc4;
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 12px;
    }

    .summary-card {
      position: relative;
      overflow: hidden;
      padding: 12px 5px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: linear-gradient(145deg, #2c2118, #201812);
    }

    .summary-card:first-child {
      border-color: #8a542d;
      background: linear-gradient(145deg, #503019, #2b1c12);
    }

    .summary-value {
      color: #fff7ec;
      font-size: 19px;
      font-weight: 900;
    }

    .summary-card:first-child .summary-value {
      color: var(--orange-light);
    }

    .summary-label {
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 13px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #201811;
    }

    .filter { min-width: 0; }

    .filter label {
      display: block;
      margin: 0 0 6px 2px;
      color: #c8a98e;
      font-size: 10px;
      font-weight: 800;
    }

    .filter input, .filter select {
      width: 100%;
      min-height: 39px;
      padding: 8px;
      border: 1px solid #59402e;
      border-radius: 8px;
      background: #17120e;
      color: var(--text);
      outline: none;
    }

    .filter input:focus, .filter select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 2px #f28b3520;
    }

    input[type="date"] { color-scheme: dark; }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 12px 2px 8px;
      color: var(--muted);
      font-size: 10px;
    }

    .status-count {
      padding: 5px 9px;
      border: 1px solid #63432b;
      border-radius: 20px;
      background: #2a1e14;
      color: var(--orange-light);
      font-weight: 800;
    }

    .matches {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-card {
      overflow: hidden;
      border: 1px solid #493326;
      border-radius: 12px;
      background: linear-gradient(135deg, #271e17, #1e1813);
      box-shadow: 0 3px 9px #0002;
      transition: border-color .15s, transform .15s;
    }

    .match-card:hover {
      border-color: #95623a;
    }

    .match-card.pending-card {
      border-color: #80632c;
      background: linear-gradient(135deg, #332716, #241c13);
    }

    .match-card.pending-card:hover {
      border-color: #c0913c;
    }

    .match-head {
      width: 100%;
      min-height: 70px;
      padding: 10px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .match-time {
      text-align: center;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .match-time strong {
      display: block;
      margin-bottom: 4px;
      color: var(--orange-light);
      font-size: 11px;
    }

    .teams { min-width: 0; }

    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      line-height: 1.6;
    }

    .team-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f5eade;
      font-size: 12px;
      font-weight: 750;
    }

    .score {
      flex: 0 0 auto;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .score.empty { color: #796957; }

    .prediction-box {
      min-width: 108px;
      text-align: right;
    }

    .prediction-market {
      color: #b7a28e;
      font-size: 9px;
      margin-bottom: 5px;
    }

    .prediction {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 82px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .prediction.success {
      background: #163b2a;
      color: var(--green);
      border: 1px solid #285d40;
    }

    .prediction.fail {
      background: #421f21;
      color: var(--red);
      border: 1px solid #6b3034;
    }

    .prediction.push {
      background: #382b1b;
      color: #e6b66c;
      border: 1px solid #69502e;
    }

    .prediction.pending {
      background: #4b3816;
      color: var(--yellow);
      border: 1px solid #85672a;
    }

    .prediction-1x2 {
      margin-top: 5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 5px;
      background: #33271d;
      color: #d8c2ac;
      font-size: 9px;
      font-weight: 800;
    }

    .prediction-1x2 strong {
      color: #fff4e6;
      font-size: 10px;
    }

    .prediction-1x2.pending-1x2 {
      background: #4b3816;
      color: var(--yellow);
    }

    .prediction-1x2.pending-1x2 strong {
      color: var(--yellow);
    }

    .expand-icon {
      display: inline-block;
      margin-left: 3px;
      color: #b18a65;
      font-size: 11px;
      transition: transform .15s ease;
    }

    .match-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .details {
      display: none;
      padding: 0 10px 12px;
      border-top: 1px solid #493326;
      background: #1a140f;
    }

    .match-card.pending-card .details {
      background: #20190f;
      border-top-color: #5d4826;
    }

    .match-card.open .details { display: block; }

    .detail-title, .period-title {
      margin: 12px 0 7px;
      color: var(--orange-light);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .detail-top {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin: 9px 0;
    }

    .detail-box, .x2-card, .period-card {
      min-width: 0;
      padding: 9px 5px;
      border: 1px solid #493326;
      border-radius: 8px;
      background: #271e17;
      text-align: center;
    }

    .detail-label, .x2-name, .period-name {
      color: #b19a83;
      font-size: 9px;
      margin-bottom: 5px;
    }

    .detail-value {
      color: #fff1e2;
      font-size: 12px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .x2-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 7px;
    }

    .x2-value {
      color: #fff;
      font-size: 15px;
      font-weight: 900;
    }

    .x2-percent {
      margin-top: 4px;
      color: #b19a83;
      font-size: 9px;
      font-weight: 700;
    }

    .x2-predicted {
      border-color: #9a673a;
      background: #3a2819;
    }

    .x2-predicted .x2-value { color: var(--orange-light); }

    .period-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
    }

    .period-line {
      color: #fff0e0;
      font-size: 11px;
      font-weight: 900;
    }

    .period-prediction {
      margin-top: 4px;
      color: #d0ad89;
      font-size: 9px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .empty, .loading {
      padding: 27px 14px;
      border: 1px dashed #62452f;
      border-radius: 12px;
      background: #201811;
      text-align: center;
      color: #b8a28c;
      font-size: 11px;
      line-height: 1.7;
    }

    .error {
      padding: 14px;
      border: 1px solid #78383a;
      border-radius: 10px;
      background: #351b1b;
      color: #ff9c9f;
      font-size: 11px;
    }

    @media (max-width: 560px) {
      .container { padding: 9px; }
      .header { padding: 12px; }
      .title { font-size: 18px; }
      .summary { gap: 5px; }
      .summary-card { padding: 9px 3px; }
      .summary-value { font-size: 16px; }
      .summary-label { font-size: 8px; }
      .filters { padding: 9px; gap: 7px; }
      .match-head {
        grid-template-columns: 40px minmax(0, 1fr) auto;
        gap: 6px;
        padding: 8px 7px;
      }
      .team-name { font-size: 10px; }
      .score { font-size: 12px; }
      .prediction-box { min-width: 91px; }
      .prediction { min-width: 70px; font-size: 9px; }
      .detail-top, .x2-grid { gap: 5px; }
    }

    @media (max-width: 360px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .filters { grid-template-columns: 1fr; }
      .filter:first-child { grid-column: auto; }
      .period-grid { grid-template-columns: repeat(3, 1fr); }
      .header::after { right: 65px; }
    }
  </style>
</head>

<body>
<div class="container">
  <div class="header">
    <div>
      <div class="title">🏀 Basketbol Tahmin</div>
      <div class="subtitle">MAÇ TOPLAM ALT / ÜST · 1X2 · PERİYOT ANALİZİ</div>
    </div>
    <a href="https://teador612.github.io/mackolik1/" class="mackolik-btn">⚽ Mackolik</a>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-value" id="successRate">-</div>
      <div class="summary-label">Başarı</div>
    </div>
    <div class="summary-card">
      <div class="summary-value" id="successful">-</div>
      <div class="summary-label">Başarılı</div>
    </div>
    <div class="summary-card">
      <div class="summary-value" id="failed">-</div>
      <div class="summary-label">Başarısız</div>
    </div>
    <div class="summary-card">
      <div class="summary-value" id="completed">-</div>
      <div class="summary-label">Biten</div>
    </div>
  </div>

  <div class="filters">
    <div class="filter">
      <label for="dateFilter">📅 Tarih</label>
      <input type="date" id="dateFilter">
    </div>
    <div class="filter">
      <label for="leagueFilter">🏆 Lig</label>
      <select id="leagueFilter">
        <option value="all">Tüm ligler</option>
        <option value="NBA">NBA</option>
      </select>
    </div>
    <div class="filter">
      <label for="statusFilter">📊 Durum</label>
      <select id="statusFilter">
        <option value="all">Tümü</option>
        <option value="pending">Oynanmamış</option>
        <option value="success">Başarılı</option>
        <option value="failed">Başarısız</option>
        <option value="push">Push</option>
      </select>
    </div>
  </div>

  <div class="status-line">
    <span id="dateTitle">Maçlar</span>
    <span class="status-count" id="matchCount">0 maç</span>
  </div>

  <div id="content">
    <div class="loading">🏀 Veriler yükleniyor...</div>
  </div>
</div>

<script>
"use strict";

const CACHE_KEY = "?v=" + Date.now();
let predictions = [];

const dateFilter = document.getElementById("dateFilter");
const leagueFilter = document.getElementById("leagueFilter");
const statusFilter = document.getElementById("statusFilter");
const content = document.getElementById("content");
const matchCount = document.getElementById("matchCount");
const dateTitle = document.getElementById("dateTitle");

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function number(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function normalizeDate(value) {
  if (!value) return "";
  const text = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;

  const match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!match) return "";

  return match[1] + "-" + match[2] + "-" + match[3];
}

function todayString() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
}

function formatDate(date) {
  if (!date) return "-";
  const parts = date.split("-");
  if (parts.length !== 3) return date;
  return parts[2] + "." + parts[1] + "." + parts[0];
}

function hasRealScore(p) {
  const home = number(p.homeScore);
  const away = number(p.awayScore);
  return home !== null && away !== null;
}

function isFinished(p) {
  if (p.isFinished === true || p.played === true) return true;

  const values = [p.status, p.matchStatus, p.gameStatus, p.state]
    .filter(v => v !== null && v !== undefined)
    .map(v => String(v).trim().toLowerCase());

  const words = [
    "finished", "completed", "final", "ended", "ft",
    "full_time", "full time", "bitmiş", "bitmis",
    "tamamlandı", "tamamlandi"
  ];

  return values.some(v => words.includes(v));
}

function isStarted(p) {
  if (p.isUnstarted === true) return false;

  const values = [p.status, p.matchStatus, p.gameStatus, p.state]
    .filter(v => v !== null && v !== undefined)
    .map(v => String(v).trim().toLowerCase());

  const pending = [
    "not_started", "not started", "scheduled", "upcoming",
    "pending", "pre-match", "prematch", "bekliyor",
    "başlamadı", "baslamadi", "oynanmadı", "oynanmadi"
  ];

  if (values.some(v => pending.includes(v))) return false;

  const started = [
    "live", "in_progress", "in progress", "started",
    "playing", "ongoing", "finished", "completed",
    "final", "ended", "ft", "full_time", "full time"
  ];

  if (values.some(v => started.includes(v))) return true;
  if (p.isLive === true || isFinished(p)) return true;
  if (hasRealScore(p)) return true;

  return false;
}

function getStatus(p) {
  if (!isFinished(p)) return "pending";
  if (p.result === "successful" || p.success === true) return "success";
  if (p.result === "failed" || p.success === false) return "failed";
  if (p.result === "push" || p.result === "Push") return "push";
  return "pending";
}

function statusText(status) {
  if (status === "success") return "✓ Başarılı";
  if (status === "failed") return "✕ Başarısız";
  if (status === "push") return "＝ Push";
  return "Bekliyor";
}

function predictionClass(prediction, status) {
  if (status === "pending") return "pending";
  if (status === "success") return "success";
  if (status === "failed") return "fail";
  if (status === "push") return "push";
  return "pending";
}

function predictionText(p) {
  const prediction = String(p.prediction ?? "").trim();
  const line = number(p.line) ?? number(p.barem);

  if (!prediction) return "Tahmin yok";
  if (line === null) return prediction;

  return prediction + " " + line.toFixed(2);
}

function get1X2(p) {
  const prediction = String(p.prediction1X2 ?? "").trim();
  if (!prediction) return null;

  return {
    prediction,
    confidence: number(p.confidence1X2),
    home: number(p.homeWinProbability),
    draw: number(p.drawProbability),
    away: number(p.awayWinProbability),
    actual: String(p.actualResult1X2 ?? "").trim(),
    success: p.success1X2
  };
}

function oneXTwoBadge(p) {
  const data = get1X2(p);
  if (!data) return "";

  const status = getStatus(p);
  let resultText = data.prediction;

  if (status === "success") resultText = "✓ " + data.prediction;
  if (status === "failed") resultText = "✕ " + data.prediction;

  const pendingClass = status === "pending" ? "pending-1x2" : "";

  return `
    <div class="prediction-1x2 ${pendingClass}">
      1X2 <strong>${escapeHtml(resultText)}</strong>
    </div>`;
}

function getPeriodData(p, key) {
  const data = p[key];
  return data && typeof data === "object" ? data : null;
}

function periodCard(title, p, key) {
  const data = getPeriodData(p, key);
  if (!data) return "";

  const line = number(data.line) ?? number(data.barem);
  const prediction = String(data.prediction ?? data.result ?? "");

  return `
    <div class="period-card">
      <div class="period-name">${escapeHtml(title)}</div>
      <div class="period-line">${line !== null ? line.toFixed(2) : "-"}</div>
      <div class="period-prediction">${prediction ? escapeHtml(prediction) : "-"}</div>
    </div>`;
}

function buildPeriodSection(p) {
  const cards = [];

  if (number(p.line) !== null || number(p.barem) !== null) {
    const mainLine = number(p.line) ?? number(p.barem);
    cards.push(`
      <div class="period-card">
        <div class="period-name">Maç</div>
        <div class="period-line">${mainLine.toFixed(2)}</div>
        <div class="period-prediction">${escapeHtml(p.prediction ?? "-")}</div>
      </div>`);
  }

  const firstHalf = p.firstHalfTotal ?? p.firstHalf ?? null;

  if (firstHalf && typeof firstHalf === "object") {
    const line = number(firstHalf.line) ?? number(firstHalf.barem);
    cards.push(`
      <div class="period-card">
        <div class="period-name">İY</div>
        <div class="period-line">${line !== null ? line.toFixed(2) : "-"}</div>
        <div class="period-prediction">${escapeHtml(firstHalf.prediction ?? firstHalf.result ?? "-")}</div>
      </div>`);
  }

  for (const key of ["q1", "q2", "q3", "q4"]) {
    const card = periodCard(key.toUpperCase(), p, key);
    if (card) cards.push(card);
  }

  if (!cards.length) return "";

  return `
    <div class="period-title">Periyot tahminleri</div>
    <div class="period-grid">${cards.join("")}</div>`;
}

function buildDetails(p) {
  const expected = number(p.expectedTotal);
  const homeExpected = number(p.expectedHome);
  const awayExpected = number(p.expectedAway);
  const confidence = number(p.confidence);
  const sampleHome = number(p.homeSample);
  const sampleAway = number(p.awaySample);
  const x2 = get1X2(p);

  return `
    <div class="details">
      <div class="detail-top">
        <div class="detail-box">
          <div class="detail-label">Maç baremi</div>
          <div class="detail-value">${number(p.line) !== null ? number(p.line).toFixed(2) : number(p.barem) !== null ? number(p.barem).toFixed(2) : "-"}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">Beklenen toplam</div>
          <div class="detail-value">${expected !== null ? expected.toFixed(2) : "-"}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">Güven</div>
          <div class="detail-value">${confidence !== null ? "%" + Math.round(confidence) : "-"}</div>
        </div>
      </div>

      <div class="detail-top">
        <div class="detail-box">
          <div class="detail-label">Ev beklenen</div>
          <div class="detail-value">${homeExpected !== null ? homeExpected.toFixed(2) : "-"}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">Deplasman beklenen</div>
          <div class="detail-value">${awayExpected !== null ? awayExpected.toFixed(2) : "-"}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">Örneklem</div>
          <div class="detail-value">${sampleHome !== null ? sampleHome : "-"} / ${sampleAway !== null ? sampleAway : "-"}</div>
        </div>
      </div>

      ${x2 ? `
        <div class="detail-title">1X2 Tahmini</div>
        <div class="x2-grid">
          <div class="x2-card ${x2.prediction === "1" ? "x2-predicted" : ""}">
            <div class="x2-name">1 · Ev sahibi</div>
            <div class="x2-value">${x2.home !== null ? "%" + x2.home.toFixed(1) : "-"}</div>
          </div>
          <div class="x2-card ${x2.prediction === "X" ? "x2-predicted" : ""}">
            <div class="x2-name">X · Beraberlik</div>
            <div class="x2-value">${x2.draw !== null ? "%" + x2.draw.toFixed(1) : "-"}</div>
          </div>
          <div class="x2-card ${x2.prediction === "2" ? "x2-predicted" : ""}">
            <div class="x2-name">2 · Deplasman</div>
            <div class="x2-value">${x2.away !== null ? "%" + x2.away.toFixed(1) : "-"}</div>
          </div>
        </div>
        <div class="detail-top">
          <div class="detail-box">
            <div class="detail-label">1X2 Tahmini</div>
            <div class="detail-value">${escapeHtml(x2.prediction)}</div>
          </div>
          <div class="detail-box">
            <div class="detail-label">1X2 Güven</div>
            <div class="detail-value">${x2.confidence !== null ? "%" + x2.confidence.toFixed(1) : "-"}</div>
          </div>
          <div class="detail-box">
            <div class="detail-label">Sonuç</div>
            <div class="detail-value">${x2.actual ? escapeHtml(x2.actual) : "-"}</div>
          </div>
        </div>` : ""}

      ${buildPeriodSection(p)}
    </div>`;
}

function createMatchCard(p) {
  const status = getStatus(p);
  const home = p.home ?? p.homeTeam ?? "-";
  const away = p.away ?? p.awayTeam ?? "-";
  const homeScore = number(p.homeScore);
  const awayScore = number(p.awayScore);
  const hasScore = homeScore !== null && awayScore !== null;
  const predictionLabel = predictionText(p);
  const predictionClassName = predictionClass(p.prediction, status);
  const x2 = get1X2(p);
  const time = p.time ?? "";
  const league = p.league ?? "";

  const card = document.createElement("div");
  card.className = "match-card";

  if (status === "pending") card.classList.add("pending-card");

  card.innerHTML = `
    <div class="match-head" role="button" tabindex="0" aria-expanded="false">
      <div class="match-time">
        <strong>${time ? escapeHtml(time) : "🏀"}</strong>
        <span>${escapeHtml(league)}</span>
      </div>

      <div class="teams">
        <div class="team-row">
          <span class="team-name">${escapeHtml(home)}</span>
          <span class="score ${hasScore ? "" : "empty"}">${hasScore ? homeScore : "-"}</span>
        </div>
        <div class="team-row">
          <span class="team-name">${escapeHtml(away)}</span>
          <span class="score ${hasScore ? "" : "empty"}">${hasScore ? awayScore : "-"}</span>
        </div>
      </div>

      <div class="prediction-box">
        <div class="prediction-market">${escapeHtml(statusText(status))}</div>
        <div class="prediction ${predictionClassName}">${escapeHtml(predictionLabel)}</div>
        ${x2 ? oneXTwoBadge(p) : ""}
        <span class="expand-icon">▼</span>
      </div>
    </div>
    ${buildDetails(p)}`;

  const head = card.querySelector(".match-head");

  function toggle() {
    const open = card.classList.toggle("open");
    head.setAttribute("aria-expanded", open ? "true" : "false");
  }

  head.addEventListener("click", toggle);

  head.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      toggle();
    }
  });

  return card;
}

function filterPredictions() {
  const date = dateFilter.value;
  const league = leagueFilter.value;
  const status = statusFilter.value;

  return predictions.filter(p => {
    const pDate = normalizeDate(p.date ?? p.utcDate);

    if (date && pDate !== date) return false;

    if (
      league !== "all" &&
      String(p.league ?? "").toLowerCase() !== league.toLowerCase()
    ) return false;

    if (status !== "all" && getStatus(p) !== status) return false;

    return true;
  });
}

function updateSummary() {
  let completed = 0;
  let successful = 0;
  let failed = 0;

  for (const p of predictions) {
    const status = getStatus(p);

    if (status === "success") {
      completed++;
      successful++;
    } else if (status === "failed") {
      completed++;
      failed++;
    } else if (status === "push") {
      completed++;
    }
  }

  const denominator = successful + failed;
  const rate = denominator > 0 ? successful / denominator * 100 : 0;

  document.getElementById("successRate").textContent = "%" + rate.toFixed(1);
  document.getElementById("successful").textContent = successful;
  document.getElementById("failed").textContent = failed;
  document.getElementById("completed").textContent = completed;
}

function setDefaultDate() {
  const dates = [...new Set(
    predictions.map(p => normalizeDate(p.date ?? p.utcDate)).filter(Boolean)
  )].sort();

  if (!dates.length) return;

  const today = todayString();
  dateFilter.value = dates.includes(today) ? today : dates[dates.length - 1];
}

function render() {
  updateSummary();

  const filtered = filterPredictions();
  content.innerHTML = "";
  matchCount.textContent = filtered.length + " maç";

  dateTitle.textContent = dateFilter.value
    ? formatDate(dateFilter.value)
    : "Maçlar";

  if (!filtered.length) {
    content.innerHTML = '<div class="empty">🏀 Bu filtrelere uygun maç bulunamadı.</div>';
    return;
  }

  const list = document.createElement("div");
  list.className = "matches";

  for (const prediction of filtered) {
    list.appendChild(createMatchCard(prediction));
  }

  content.appendChild(list);
}

async function loadData() {
  try {
    content.innerHTML = '<div class="loading">🏀 Veriler yükleniyor...</div>';

    const response = await fetch("predictions.json" + CACHE_KEY, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("predictions.json alınamadı.");
    }

    const data = await response.json();

    let rawPredictions = [];
    if (Array.isArray(data)) {
      rawPredictions = data;
    } else {
      rawPredictions = Array.isArray(data.predictions) ? data.predictions : [];
    }

    // EuroLeague ve EuroCup maçlarını tamamen sistemden temizle
    predictions = rawPredictions.filter(p => {
      const leagueName = String(p.league ?? "").trim().toLowerCase();
      return leagueName !== "euroleague" && leagueName !== "eurocup";
    });

    if (!predictions.length) {
      content.innerHTML = '<div class="empty">Tahmin verisi bulunamadı.</div>';
      return;
    }

    setDefaultDate();
    render();
  } catch (error) {
    console.error(error);
    content.innerHTML = `
      <div class="error">
        Veriler yüklenirken hata oluştu:
        ${escapeHtml(error.message)}
      </div>`;
  }
}

dateFilter.addEventListener("change", render);
leagueFilter.addEventListener("change", render);
statusFilter.addEventListener("change", render);

loadData();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(error => {
      console.error("Service Worker kaydedilemedi:", error);
    });
  });
}
</script>
